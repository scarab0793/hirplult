name: Update Hírpult news (UK daytime)
on:
  schedule:
    # Hourly candidate ticks; the UK-local gate below selects actual runs.
    - cron: '0 5-20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_news.py'
      - '.github/workflows/update-news.yml'
      - 'scripts/enrich_news.py'
      - 'scripts/backfill_news.py'
permissions:
  contents: write
concurrency:
  group: hirpult-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check UK-local update window
        id: schedule_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import datetime as dt
          import os
          from zoneinfo import ZoneInfo
          local = dt.datetime.now(ZoneInfo("Europe/London"))
          hour = local.hour
          weekday = local.weekday() < 5
          allowed = (6 <= hour <= 20 and hour % 2 == 0) if weekday else (6 <= hour <= 18 and (hour - 6) % 3 == 0)
          should_run = os.environ["EVENT_NAME"] != "schedule" or allowed
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"run={str(should_run).lower()}\n")
          print(f"UK local time: {local.isoformat()}, run: {should_run}")
          PY
      - name: Collect recent RSS headlines
        if: steps.schedule_gate.outputs.run == 'true'
        run: python scripts/fetch_news.py
      - name: Optional AI editorial enrichment (max 3 reports)
        if: steps.schedule_gate.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HIRPULT_AI_MAX_ARTICLES: '3'
        run: python scripts/enrich_news.py
      - name: Backfill historical stories (max 2 per run)
        if: steps.schedule_gate.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HIRPULT_BACKFILL_BATCH: '2'
        run: python scripts/backfill_news.py
      - name: Commit data changes
        if: steps.schedule_gate.outputs.run == 'true'
        run: |
          git add data/news.json data/editorial.json data/news-history.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Hírpult RSS headlines"
          # Rebase onto latest main so concurrent website edits do not reject the update.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict; stopping without overwriting remote changes"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another commit; retrying ($attempt/5)"
            sleep 3
          done
          echo "Unable to push news update after retries"
          exit 1
