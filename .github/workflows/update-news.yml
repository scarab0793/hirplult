name: Update Hírpult news (3x daily)
on:
  schedule:
    - cron: '10 5,11,17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_news.py'
      - '.github/workflows/update-news.yml'
permissions:
  contents: write
concurrency:
  group: hirpult-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect recent RSS headlines
        run: python scripts/fetch_news.py
      - name: Commit data changes
        run: |
          git add data/news.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Hírpult RSS headlines"
          # Rebase onto latest main so concurrent website edits do not reject the update.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict; stopping without overwriting remote changes"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another commit; retrying ($attempt/5)"
            sleep 3
          done
          echo "Unable to push news update after retries"
          exit 1
