name: Update Hírpult news (UK daytime)
on:
  schedule:
    # Hourly candidate ticks. The gate below turns them into about four runs a day,
    # at least 3.5 hours apart, between 07:00 and 20:59 UK time, so a delayed tick is not lost.
    - cron: '17 5-20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_news.py'
      - 'scripts/enrich_news.py'
      - 'scripts/backfill_news.py'
      - 'scripts/hp_ai.py'
      - '.github/workflows/update-news.yml'
permissions:
  contents: write
concurrency:
  group: hirpult-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check update window
        id: schedule_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo
          now = dt.datetime.now(dt.timezone.utc)
          local = now.astimezone(ZoneInfo("Europe/London"))
          should_run = True
          if os.environ["EVENT_NAME"] == "schedule":
              should_run = 7 <= local.hour <= 20
              path = Path("data/news.json")
              if should_run and path.exists():
                  try:
                      last = dt.datetime.fromisoformat(json.loads(path.read_text(encoding="utf-8"))["updated_at"])
                      should_run = now - last >= dt.timedelta(hours=3, minutes=30)
                  except (ValueError, KeyError, OSError):
                      pass
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"run={str(should_run).lower()}\n")
          print(f"UK local time: {local.isoformat()}, run: {should_run}")
          PY
      - name: Collect recent RSS headlines
        if: steps.schedule_gate.outputs.run == 'true'
        run: python scripts/fetch_news.py
      - name: Write articles with Claude (max 6 per run)
        if: steps.schedule_gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Only needed if the API key is not tied to one workspace (repository variable, optional).
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          # Optional repository variable to switch model; empty means claude-haiku-5-5.
          HIRPULT_AI_MODEL: ${{ vars.HIRPULT_AI_MODEL }}
          HIRPULT_AI_MAX_ARTICLES: '6'
        run: python scripts/enrich_news.py
      - name: Lengthen catalog stories (paused, set the batch above 0 to enable)
        if: steps.schedule_gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          HIRPULT_AI_MODEL: ${{ vars.HIRPULT_AI_MODEL }}
          HIRPULT_BACKFILL_BATCH: '0'
        run: python scripts/backfill_news.py
      - name: Commit data changes
        if: steps.schedule_gate.outputs.run == 'true'
        env:
          # A test run started from another branch commits to that branch only, never to the live main.
          BRANCH: ${{ github.ref_name }}
        run: |
          git add data/news.json data/editorial.json data/news-history.json data/ai-state.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Hírpult RSS headlines"
          # Rebase onto the latest branch tip so concurrent website edits do not reject the update.
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              git rebase --abort || true
              echo "Rebase conflict; stopping without overwriting remote changes"
              exit 1
            fi
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push raced with another commit; retrying ($attempt/5)"
            sleep 3
          done
          echo "Unable to push news update after retries"
          exit 1
