name: Update 24.hu news
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hirpult-24hu
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch 24.hu RSS
        run: python scripts/fetch_24hu.py
      - name: Commit only changed data
        run: |
          git add data/24hu.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update 24.hu RSS headlines"
          git push
