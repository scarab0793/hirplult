name: Update Hirpult World (international edition)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hirpult-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued run must start from the branch tip, not from the commit that was current when it was queued.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect international RSS headlines
        run: python scripts/world_fetch.py
      - name: Write English articles with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          HIRPULT_AI_MODEL: ${{ vars.HIRPULT_AI_MODEL }}
          HIRPULT_AI_EFFORT: ${{ vars.HIRPULT_AI_EFFORT }}
          HIRPULT_WORLD_MAX: '12'
        run: python scripts/world_write.py
      - name: Translate the articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          HIRPULT_AI_MODEL: ${{ vars.HIRPULT_AI_MODEL }}
          HIRPULT_AI_EFFORT: ${{ vars.HIRPULT_AI_EFFORT }}
          WORLD_LANGS: ${{ vars.WORLD_LANGS }}
          HIRPULT_WORLD_MAX_TRANSLATIONS: '160'
        run: python scripts/world_translate.py
      - name: Commit data changes
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add data/world
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Hirpult World articles"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              git rebase --abort || true
              echo "Rebase conflict; stopping without overwriting remote changes"
              exit 1
            fi
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push raced with another commit; retrying ($attempt/5)"
            sleep 3
          done
          echo "Unable to push after retries"
          exit 1
