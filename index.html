tkosszolgálat törte fel Kushner iPhone-ját, milliárdos számlák is felmerültek a Közel-Keleten", "s": "Matthew Cole Princes and Thieves című könyvének részletei szerint a Trump-vő milliárdokat érintő háttéralkukban lehetett érintett, ezt ő tagadja.", "p": ["A HVG a Vanity Fair közölte részletek alapján számol be Matthew Cole Princes and Thieves című könyvéről. Eszerint a holland hírszerzés 2018-ban feltörte Jared Kushner iPhone X-ét, de csak részleges hozzáférést szerzett, a kijelzőn megjelenő tartalmat látta.", "A hollandok 2017-ben tudták meg, hogy orosz hírszerzés is feltörte a telefont, miután egy az Egyesült Királyságban letartóztatott orosz hacker a börtön elkerüléséért együttműködést vállalt.", "A könyv szerint Mohamed bin Zájed (az Emírségek vezetője) és Mohamed bin Szalmán kezdetben 10 milliárd dolláros megállapodást keresett Kushnerrel Trump politikai céljainak támogatására, ez nem valósult meg. Legalább 2 milliárd dollárt helyeztek el legalább két Kushner számára elérhető számlán.", "Az egyik számlán 750 millió dollár volt az Emírségek legnagyobb bankjánál, amelynek elnöke bin Zájed testvére volt. A másik számlát Netanjahu állítólag az izraeli jegybanknál kínálta, kormányzati számlának álcázva, a pénzt később ciprusi számlákra helyezték át.", "Kushner tagadja a történet valóságtartalmát, azt is, hogy tudott volna ilyen számlákról, és hogy szabálysértést követett volna el."], "cav": "A leírás egy könyv kiadott részletein alapul, tényeit függetlenül nem ellenőriztük. Kushner mindent tagad.", "src": [["HVG – Kushner kavarásai a Közel-Keleten", "https://hvg.hu/gazdasag/20261023_hercegek-es-tolvajok-kushner-kavarasai-a-kozel-keleten"]], "op": "A könyvrészlet súlyos állításokat tartalmaz, amelyeket Kushner tagad, ezért érdemes a független megerősítésig fenntartással kezelni. A történet azért érdekes, mert megmutatja, hogyan keveredik a családi kapcsolat és az üzlet a nagypolitikában."}, {"id": "starshield-ukrajna", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/a7e4d6ca-cb71-4eca-8843-e370713f8487.jpg", "imgs": "HVG", "r": "Külföld", "c": "Ukrajna", "st": "Jelentett", "time": "okt. 23.", "t": "Trump szerint Musk visszaadta Ukrajna Starshield-hozzáférését, Kijev szerint a korlátozások maradtak", "s": "A CNN forrása szerint Trump hívta Muskot, az ukrán tisztviselők péntek reggel azt mondták, a korlátozás továbbra is él.", "p": ["Október 22-én Donald Trump azt állította, hogy Elon Musk visszaállította Ukrajna hozzáférését a Starshieldhez, a Starlink katonai változatához. A CNN egy forrása szerint Trump az előző napokban felhívta Muskot, hogy kérje a teljes hozzáférés visszaállítását, miután az ukrán tisztviselők hibákról számoltak be.", "Trump szerint mindegy, hogy ő vagy más telefonált, a lényeg az, hogy Musk visszaállította a hozzáférést.", "Az ukrán tisztviselők péntek reggel úgy nyilatkoztak, a korlátozások érvényben maradtak. Volodimir Zelenszkij tanácsadója, Szerhij Beszkresztnov szerint nem oldották fel őket, az egyes esetekben gyorsabb Starlink-sebességet a SpaceX algoritmusa vagy sajátos használati körülmények okozhatják.", "A korlátozás több mint egy hete akadályozza a gyors katonai drónok használatát, nehezíti az elfogó drónok bevetését az orosz támadások ellen, és több frontszakaszon zavarja az ukrán műveleteket. A védelmi minisztérium forrása szerint a 161 km/h feletti sebességgel mozgó katonai eszközök továbbra is elveszítik a jelet.", "A HVG október 17-én azt írta, hogy Musk kérte a korlátozást, Trump pedig jóváhagyta."], "cav": "A két fél állítása ellentmond egymásnak, függetlenül nem tudtuk ellenőrizni, hogy a korlátozás mikortól és milyen mértékben van érvényben.", "op": "Ha egy magánember kapcsolója dönthet egy háború kimeneteléről, az nem a szövetségi rendszer, hanem a kiszolgáltatottság képe. Európának egyszer már le kell vonnia a tanulságot.", "src": [["HVG – Starshield és Ukrajna", "https://hvg.hu/vilag/20261023_starshield-ukrajna-trump"]]}, {"id": "hebron-loveldozes-lezaras", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/52bcaf0c-a912-44ea-a7ef-97c8a964b7d6.jpg", "cred": "Fotó: AFP / Hazem Bader", "imgs": "HVG", "r": "Külföld", "c": "Közel-Kelet", "st": "Jelentett", "time": "okt. 23.", "t": "Lövöldözés Hebron közelében: Netanjahu teljes ciszjordániai lezárást rendelt el", "s": "A Times of Israel szerint legalább öten megsebesültek, a két támadót izraeli katonák lelőtték.", "p": ["Benjamin Netanjahu izraeli miniszterelnök a Times of Israel jelentése szerint péntek reggeli lövöldözés után teljes ciszjordániai lezárásra való felkészülést rendelt el. A támadás a Jehuda-csomópontnál, Hebrontól délkeletre történt.", "Legalább öt ember megsérült, közülük kettő életveszélyesen, három könnyebben vagy közepesen súlyosan. A két menekülni próbáló támadót izraeli katonák lelőtték.", "A katonák ellenőrzőpontokat állítottak fel, több települést azonnali katonai zár alá helyeztek. Netanjahu a védelmi miniszterrel és a hadsereg vezetőivel tartott rendkívüli egyeztetés után azt mondta, a műveleteket fokozzák, a letartóztatási hullámot kiterjesztik, a Hamász harcosait és azokat is üldözik, akik elküldik őket.", "A Times of Israel szerint a Ciszjordánia és Gáza lezárása várhatóan hétfőn és kedden is érvényben marad az izraeli parlamenti választások miatt."], "cav": "A tudósítás a Times of Israelre támaszkodik, a támadók kilétét és szervezeti kötődését független forrásból nem erősítettük meg.", "src": [["HVG – Hebron, Ciszjordánia, lezárás", "https://hvg.hu/vilag/20261023_izrael-ciszjordania-hebron-lovoldozes-benjamin-netanjahu-lezaras"]], "op": "Egy lövöldözés után elrendelt teljes lezárás a civil lakosságot is sújtja, és a feszültséget növeli. A támadók kilétéről és motivációjáról független információra még várni kell."}, {"id": "fekete-tenger-tanker-dron", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/102c4cc9-6a61-4165-96ea-82f126f12b45.jpg", "imgs": "HVG", "r": "Külföld", "c": "Ukrajna", "st": "Jelentett", "time": "okt. 23.", "t": "Dróntámadás a Fekete-tengeren: elsüllyedt egy tanker, hárman eltűntek", "s": "A Khoryv nevű hajót Constanța partjaitól 13 mérföldre érte találat, kilenc embert mentettek ki.", "p": ["Október 23-án drón csapott a Comore-szigeteki zászló alatt hajózó Khoryv tankerre Constanța partjaitól mintegy 13 mérföldre. A 120 méteres hajó Törökországból tartott a romániai Sulina felé, a fedélzete kigyulladt, majd elsüllyedt.", "Az első segélyhívást helyi idő szerint 10 óra körül adták le. A román egységek kilenc matrózt mentettek ki, egy holttestet találtak, három ember eltűnt. A legénységből tíz ukrán, három azerbajdzsáni volt. A rossz idő és a gyenge látási viszonyok miatt helikopteres mentés nem volt lehetséges.", "A Digi24 szerint a háború kezdete óta 11 kereskedelmi hajót ért drónos támadás a Fekete-tenger partjainál, hetet Románia, négyet Bulgária mellett, legalább 31 tengerész halt meg vagy tűnt el. A támadások többsége 12 mérföldnél messzebb, a kizárólagos gazdasági övezetben történt.", "Nicușor Dan román elnök Oroszországot tette felelőssé a konfliktus eszkalálásáért. Radu Oprea védelmi miniszter szerint a hadsereg hatásköre csak a szuverén területre terjed ki, a parti őrség hajói pedig nem képesek drónokat elhárítani."], "cav": "A cikk a támadás elkövetőjét nem nevezi meg egyértelműen, az elnöki állásfoglalást a román elnök tolmácsolásában közöljük.", "src": [["HVG – dróntámadás a Fekete-tengeren", "https://hvg.hu/vilag/20261023_drontamadas-fekete-tenger-halottak-elsullyedt-hajo"]], "op": "A kilenc kimentett ember megkönnyebbülés, a három eltűnt aggodalom. A Fekete-tengeri hajózás biztonsága nem csak a régió, hanem az európai kereskedelem közös érdeke."}, {"id": "volvo-veszteseg", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/90db3b47-1576-4405-b5fc-56a90c2866cc.jpg", "imgs": "HVG", "r": "Gazdaság", "c": "Autóipar", "st": "Megerősített", "time": "okt. 23.", "t": "Árfolyamzuhanás a Volvónál: 3,7 milliárd koronás veszteség, újabb 2500 állás megszűnik", "s": "A Geely-tulajdonú gyártó részvénye egy nap alatt közel harminc százalékot esett.", "p": ["A Volvo Cars a harmadik negyedévben 3,7 milliárd svéd korona működési veszteséget könyvelt el, szemben az egy évvel korábbi 5,8 milliárd koronás nyereséggel. Az elemzők 724 milliós veszteséget vártak.", "A cég az elektromos autók ingadozó keresletét, a vámokat és a kínai árverseny erősödését nevezte meg okként. További 2500 állást szüntet meg, mintegy 2000-et Svédországban, 500-at külföldön, a korábban bejelentett 3000 fős létszámcsökkentésen felül. A leépítés 2027 közepéig megvalósul.", "A már futó 23 milliárd koronás megtakarítási program újabb 5 milliárd koronával bővül. A Volvo részvénye pénteken közel 30 százalékot esett, az év során több mint kétharmadát elvesztette értékének.", "Hakan Samuelsson vezérigazgató rendkívül csalódást keltőnek nevezte a negyedévet, és nem zárta ki újabb költségcsökkentéseket. A cég Kínában és az Egyesült Államokban a profitabilitást előbbre helyezi a piaci részesedésnél. A többségi tulajdonos a kínai Geely."], "cav": "", "src": [["HVG – hatalmas veszteséget produkált a Volvo (Reuters)", "https://hvg.hu/cegauto/20261023_hatalmas-veszteseget-produkalt-a-volvo"]], "op": "A közel harmincszázalékos árfolyamesés és az újabb 2500 állás megszűnése az autóipar átalakulásának keserű oldalát mutatja. Az európai ipar számára ez figyelmeztetés, hogy a váltás nem lesz fájdalommentes."}, {"id": "iphone-duo-magyarorszag", "img": "https://img.hvg.hu/Img/27315920-08f2-479a-bc05-0514a7db57d5/eb9f2379-0e7b-4623-9970-32604c96e776.jpg", "cred": "iPhone Duo és iPhone 18 Pro Max. Fotó: László Ferenc", "imgs": "HVG", "r": "Kultúra", "c": "Technológia", "st": "Megerősített", "time": "okt. 23.", "t": "Itt az első hajtogatható iPhone: 900 ezertől 1,5 millió forintig, nyolcszoros túljegyzéssel", "s": "Az iPhone Duo péntektől kapható Magyarországon, a HVG első benyomása vegyes.", "p": ["Október 23-án kezdődött az Apple első hajtogatható telefonjának, az iPhone Duónak a magyarországi értékesítése. A legolcsóbb változat 900 ezer, a legdrágább 1,5 millió forint. A budapesti Andrássy úti Apple-bolt vezetője szerint az előrendelések a készlet nyolc-tízszeresét tették ki, az érkezett darabszámot nem közölte.", "A boltban péntek délutántól vehető át a telefon, a házhoz szállítás hétfőtől indul. A 256 és 512 gigabájtos modellek a legkelendőbbek, az Apple magyar honlapja januárvégi szállítást jelez.", "A belső kijelző 7,6 hüvelykes, a külső 5,4. Matt, kevés a tükröződés, de kisebb a kontraszt. A hajtás alig látszik. Zárt állapotban viszonylag kompakt, de nehéz és vaskos, a Samsung Galaxy Z Fold8 könnyebb és vékonyabb.", "Face ID helyett az oldalsó gombban van az Touch ID. A 4 megapixeles belső selfi kamera gyenge, a főkamera elmarad az iPhone 18 Pro-tól, és nincs kézi vezérlés, nincs zoomobjektív. Sok alkalmazás nincs optimalizálva a nagy kijelzőre, az USB-C Apple Pencil csak egy későbbi frissítéssel működik majd."], "cav": "Első benyomások alapján készült kéziszemlét közlünk, a szerző teljes tesztet ígér.", "src": [["HVG – iPhone Duo kézbe vettük", "https://hvg.hu/tudomany/20261023_apple-iphone-duo-szetnyithato-telefon-handson-velemeny"]], "op": "Egy 900 ezer forintos telefon nyolcszoros túljegyzése azt mutatja, hogy a vásárlók egy része a technológiát nézi, nem az árat. A tesztek majd megmutatják, megéri-e a prémium árat."}, {"id": "median-1956-unnepek", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/484dca5d-f624-44b8-b955-f28a5169a61c.jpg", "imgs": "HVG", "r": "Közélet", "c": "Közvélemény", "st": "Megerősített", "time": "okt. 22.", "t": "Medián: a magyarok szerint október 23. a legkevésbé népszerű nemzeti ünnep", "s": "A 70. évforduló előtti HVG-felmérésben augusztus 20. végzett az élen.", "p": ["A Medián a HVG megbízásából, a forradalom 70. évfordulója előtt vizsgálta a nemzeti ünnepek megítélését. A beszámolót Nagy Réka és Hann Endre jegyzi.", "A válaszadók szerint a három ünnep közül október 23. a legkevésbé népszerű, a harmadik helyen végzett. Hogy melyik a legfontosabb, arra a megkérdezettek 30 százaléka augusztus 20-át, 21 százaléka március 15-ét, 13 százaléka október 23-át mondta. Közel egyharmaduk mindhárom ünnepet egyformán fontosnak tartja.", "Október 23. megítélése hasonló minden társadalmi csoportban. A Tisza-szavazók az államalapítás és az 1848-as forradalom ünnepét nagyjából egyformán értékelik, a Fidesz-szavazók egyértelműen augusztus 20-át kedvelik a legjobban.", "A többség fontosnak tartja a 70. évforduló méltó megünneplését, és abban is egyetért, hogy a nemzeti ünnepek a pártpolitikai viták terepévé váltak."], "cav": "A cikk nem közli a minta nagyságát és a hibahatárt, a méltó megemlékezést fontosnak tartók arányát sem.", "op": "A szám nem a forradalom, hanem az ünnep kisajátítása ellen szól. Ha az emlékezés a pártok közötti pengeváltássá válik, nem csoda, hogy az emberek nem érzik magukénak.", "src": [["HVG – Medián: nemzeti ünnepek", "https://hvg.hu/360/20261022_hvg-median-1956-forradalom-nemzeti-unnepek-kozvelemenykutatas"]]}, {"id": "hegyvidek-feloszlatas", "img": "https://img.hvg.hu/Img/27315920-08f2-479a-bc05-0514a7db57d5/b3122ac4-e1b4-4f45-b904-230e5cb699c7.jpg", "cred": "Visi Piroska, a feloszlatást célzó javaslat benyújtója a csütörtöki ülésen. Fotó: HVG / Fazekas István", "imgs": "HVG", "r": "Belpolitika", "c": "Önkormányzat", "st": "Megerősített", "time": "okt. 22.", "t": "Hegyvidéken a Fidesz és a Kutyapárt közösen verte le a testület feloszlatását", "s": "Öt igen és tizenegy nem szavazat mellett a XII. kerületi képviselő-testület nem oszlatja fel magát.", "p": ["A XII. kerületi képviselő-testület elutasította saját feloszlatását. Öt képviselő szavazott igennel, tizenegyen nemmel, Élő Norbert tartózkodott. A feloszlatáshoz a tizennyolc tagú testületben tíz szavazat kellett volna.", "Az indítványt Visi Piroska polgári képviselő nyújtotta be egy héttel korábban azzal, hogy a hivatal és a testület működésképtelen, mert számos javaslat többség híján elbukik. Mellette szavazott a Momentum két képviselője, Vadász Gábor és Novák István, valamint Kocsis Borbála és Surányi Judit, a Kutyapárt volt képviselői.", "Nemmel voksolt a Kutyapárt és a Fidesz–KDNP. Fonti Krisztina, a Fidesz frakcióvezetője azt mondta, nem vesznek részt a Tisza és a Kutyapárt „kutyakomédiájában”.", "Élő Norbert korábban azt mondta, támogatja a feloszlatást, ha a polgármester nem ad valódi garanciákat. Az ülésen a döntés novemberre halasztását javasolta, hogy a polgármester koalíciót alakíthasson, de csak a polgármester támogatta.", "Kovács Gergely polgármester, aki nagyjából két év alatt elvesztette kényelmes többségét, bízik abban, hogy a képviselők a jövőben meg tudnak egyezni. Vadász Gábor szerint a polgármester a falhoz szorította az ellenzéket, a kimenetelt nem bánja."], "cav": "A cikk a szavazás eredményét és a nyilatkozatokat közli, a mögötte álló politikai alkukat nem.", "op": "A kerületi működésképtelenség a választók számára nem szimbolikus kérdés, a gyalogátkelők és a közterek állapotán múlik. A ritka egység, amelyben a Fidesz és a Kutyapárt egyetért, a beavatottaknak sem sok jót mutat.", "src": [["HVG – XII. kerület közgyűlés, feloszlatás", "https://hvg.hu/itthon/20261022_12-kerulet-kozgyules-feloszlatas-leszavazas-kovacs-gergely-visi-piroska-vita"]]}, {"id": "kuria-felujitas", "img": "https://img.hvg.hu/Img/27315920-08f2-479a-bc05-0514a7db57d5/0383dd12-9cec-4a78-8e4e-054a47505d6a.jpg", "cred": "Az Igazságügyi Palota a Kossuth téren a Parlamenttel szemben áll. Fotó: HVG / Cabrera Martin", "imgs": "HVG", "r": "Közélet", "c": "Igazságszolgáltatás", "st": "Megerősített", "time": "okt. 20.", "t": "41,5 milliárdból újult meg a Kúria épülete, miközben a vidéki bíróságok omladoznak", "s": "A Kossuth téri palota 2027 első negyedévére készül el, a bíróságok 215 ingatlanának idén 2,4 milliárd jut felújításra.", "p": ["A Kúria Kossuth téri épületének felújítása 41,5 milliárd forintba került. A sajtóbejárást Vitézy Dávid miniszter vezette. A teljes felújítás 2027 első negyedévére készül el, a belső munkák körülbelül 90 százalékban kész.", "Visszatért a 10 tonnás carrarai márvány Justitia-szobor, Strobl Alajos alkotása, amelyet az 1950-es években a Károlyi-kertben hagytak a szabad ég alatt. A kisebb alakokat újrafaragták. Felújították a Ferenc József-emléktáblát és a koronás címert is.", "A Hauszmann Alajos tervezte épület 130 éve nyílt meg bíróságként, a Néprajzi Múzeum 2022-ben költözött ki a Ligetbe. A lényeges új elem egy bírói klub a padláson, amelyet Magyar Péter miniszterelnök májusban bírált. A Kúria cáfolta, hogy dohányzószoba vagy elnöki lakosztály készülne.", "A tárgyalótermek száma 13-ról 12-re csökken. Az épületben 384 munkahely van 269 dolgozónak, 93 bírónak, 15 főtanácsadónak és 7 vezetőnek. Országosan a bíróságok 215 ingatlanára idén 2,4 milliárd forint jut felújításra, a Kúria költségvetésének töredéke. A MABIE bírói egyesület leromlott állapotú bírósági épületeket is nyilvánosságra hozott."], "cav": "A felújítás nagy része a korábbi kormány idején indult, a cikk nem részletezi, ki hozta a döntéseket.", "op": "Hiába szép a visszaállított márványszobor, ha a vidéki bíróságon beázik a plafon. Az igazságszolgáltatás méltósága nem a Kossuth téren, hanem a kistelepülési tárgyalótermekben dől el.", "src": [["HVG – Kúria megújult épülete", "https://hvg.hu/kultura/20261020_justitia-visszatert-bejartuk-a-kuria-megujult-epuletet-es-leesett-az-allunk"]]}, {"id": "gki-konjunkturaindex-oktober", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/f82a44c9-c9dd-43f6-8466-af99637748b5.jpg", "imgs": "HVG", "r": "Gazdaság", "c": "Konjunktúra", "st": "Megerősített", "time": "okt. 22.", "t": "GKI: stagnál a gazdasági hangulat, romlott a fogyasztói bizalom", "s": "A konjunktúraindex októberben -7,1 maradt, a fogyasztói bizalom -3,8-ról -6,1-re esett.", "p": ["A GKI konjunktúraindexe októberben -7,1 volt, ugyanannyi, mint szeptemberben. Júliusban -3,5-tel négy és fél éves csúcsot ért el. Utoljára 2022 februárjában volt nulla felett, 2022 augusztusa és 2026 áprilisa között -10 és -22 között mozgott.", "A fogyasztói bizalom -3,8-ról -6,1-re esett, júliusban +1,6 volt, ami az 1996-os kezdet óta csak a tizennegyedik nulla feletti érték. Egy évvel korábban -25,5 volt. A fogyasztók 12 hónapos várakozása 6 ponttal romlott szeptemberhez képest.", "A vállalati bizalom -8,3-ról -7,4-re javult, ez a nyár óta a második legjobb érték 2024 nyara óta. A cégek 14 százaléka tervez létszámleépítést a következő három hónapban, 7 százalék bővítést. Az építőipar a legpesszimistább.", "A cégek a gazdasági kiszámíthatóság érezhető romlásáról számoltak be."], "cav": "A cikk nem közöl pontos számot a kiszámíthatóság romlására.", "src": [["HVG – GKI konjunktúraindex", "https://hvg.hu/gazdasag/20261022_gki-konjunktura-index-gazdasag-varakozasok-optimizmus"]], "op": "A stagnáló hangulat és a romló fogyasztói bizalom óvatosságra int: az új kormányt a gazdasági várakozásoknál is a tettei fogják mérni. A -7,1 pont még mindig jobb, mint az áprilisig látott -10 és -22 közötti sáv."}, {"id": "nato-bank-dsrb", "r": "Gazdaság", "c": "Védelem", "st": "Megerősített", "time": "okt. 21.", "t": "Itt a „NATO-bank”: nem csatlakozott Magyarország, és nem is biztos, hogy szüksége lenne rá", "s": "A kanadai székhelyű védelmi bank magántőkét vonna be a fegyverkezésbe, a G7-ek még nem léptek be.", "p": ["Magyarországon bemutatták a kanadai kötődésű Defence, Security and Resilience Bankot (DSRB), amely a védelmi ágazatot finanszírozza magántőke és partnerek bevonásával. Intézményileg független a NATO-tól, „NATO-bankként” emlegetik.", "Alacsony kamatú hiteleket tervez kormányoknak, minden méretű védelmi cégnek és védelmi projekteknek, és csökkentené a védelmi cégekkel dolgozó bankok és befektetők kockázatát, főleg a kisebb beszállítóknál.", "A hágai csúcs a védelmi kiadásokra 2035-ig a GDP 5 százalékát tűzte ki célul, ebből 3,5 a szűkebb katonai célokra. Az ankarai csúcson a NATO cselekvési felhívást indított a bankok felé. A bank indulását a Deutsche Bank és az ING támogatta.", "Csatlakozott Albánia, Belgium, Görögország, Kanada, Lettország, Luxemburg, Románia, Törökország és Ukrajna, Magyarország nem. Nicholas Sarvari, a Magyar–Kanadai Kereskedelmi Kamara vezetője szerint a nyugati védelmi ipar nincs felkészülve az újrafegyverkezésre.", "Magyarország az uniós SAFE-hitelből 16,2 milliárd euró helyett 5,4 milliárd euróra csökkentette igényét. A cikk szerint a védelmi kiadások ebben a ciklusban várhatóan 2 százalék körül maradnak, így a bankra talán nincs is szükség. A G7-országok hiánya megkérdőjelezi az AAA-minősítés elérését."], "cav": "", "src": [["HVG – NATO-bank", "https://hvg.hu/gazdasag/20261021_nato-bank-dsrb-vedelmi-finanszirozas-kanada-hadiipar-hitel-penzintezet"]], "op": "A „NATO-bank” ötlete a fegyverkezés magánfinanszírozását ígéri, de nem minden pénzügyi eszköz való a védelmi kiadások fedezésére. Hogy Magyarország nem csatlakozott, nem feltétlenül hiba: előbb a konstrukció kockázatait érdemes megérteni."}, {"id": "ner-ipolysagi-kolostor", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/65ad08d6-34f0-43db-8445-386bb3b4857b.jpg", "imgs": "HVG", "r": "Közélet", "c": "Kultúra", "st": "Jelentett", "time": "okt. 23.", "t": "Mátyás király korabeli kolostort vett a NER Szlovákiában: 774 millió ment a felújításra, korrupciót nem találtak", "s": "A KEOMA alapítvány az ipolysági premontrei kolostort szerezte meg, a HVG szerint a projekt ígéretes, de a 40 ingatlanvásárlást felül kell vizsgálni.", "p": ["A KEOMA (Közép-európai Épített Örökség Megőrző Alapítvány), a volt kekva mintegy 40 ingatlannal, megvásárolta az ipolysági premontrei kolostort. A HVG Hamvay Péter cikke a szlovákiai önkormányzati választások előtt jelent meg.", "A kolostor a tatárjárás után épült, Mátyás király alatt formálták át, a 15. században Thuróczy János itt írta a Chronica Hungarorumot. Orosz Örs Sine Metu Egyesülete 2020-ban 1000 eurós foglalót fizetett, az egyház telke 95 ezer euróba került, a KEOMA 99 ezer euróért vette meg. A többletet falkutatási tanulmányra költötték.", "A magyar állam az ingatlanokért 219 ezer eurót fizetett, ehhez 61 ezer euró a parkolótelkekért és 19 ezer euró egy önkormányzati telekért. 2023 decemberében a kormány közel 774 millió forintot különített el, a cím 776-ot említ.", "Az első szakasz kivitelezését a Pesti Építő Zrt. nyerte el 445,97 millió forint nettóért. A Pontibus-számlán 328 millió forint van, ezt a kormányváltás után befagyasztották.", "Az újságírók korrupciót nem találtak, értékes épületnek és ígéretes projektnek nevezték. Az Építési és Beruházási Minisztériumnak felül kell vizsgálnia a 40 vásárlás jogszerűségét, nyolc-tíz ingatlan örökségvédelmi vagy turisztikai értékű."], "cav": "A cím 776 millió forintot említ, a szöveg közel 774-et, mi az utóbbit vettük át. A korrupció hiányára vonatkozó megállapítás a HVG újságíróié.", "op": "Ritka eset, hogy a NER-es külhoni ingatlanvásárlás mögött nem tűnik fel kézzelfogható visszaélés. Az értékelés attól még nem lehet felmentés: azt, hogy mi miért épp ide ment, nyilvános ellenőrzésnek kell eldöntenie, nem a jóindulatnak.", "src": [["HVG – ipolysági kolostor", "https://hvg.hu/kultura/20261023_szlovakiaban-egy-matyas-kiraly-korabeli-kolostor-is-vett-a-ner-es-776-milliot-adott-a-felujitasra-megneztuk-mire-ment-el-a-penz-es-erdemes-e-folytatni"]]}, {"id": "furcht-pal-bizottsag", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/0ba0b5da-4f8a-4526-a214-5c44064599b5.jpg", "imgs": "HVG", "r": "Belpolitika", "c": "Igazságszolgáltatás", "st": "Jelentett", "time": "okt. 22.", "t": "Fürcht Pál: „Utasítást kaptunk, hogy ősszel be kell fejezni a nyomozást”", "s": "A Központi Nyomozó Főügyészség volt vezetője politikailag befolyásolt utasításról beszélt a jogérvényesítési visszaélések bizottsága előtt.", "p": ["Fürcht Pál, a Központi Nyomozó Főügyészség korábbi vezetője szerdán az Országgyűlés jogérvényesítési visszaéléseket vizsgáló bizottsága előtt tett vallomást. Elismerte, hogy politikailag befolyásolt utasítást kapott felettesétől. Címadó idézete: „Utasítást kaptunk: ősszel be kell fejezni ezt a nyomozást.”", "Azt mondta, Varga Judit egykori igazságügyi miniszter nem tudott visszaélésekről. A sajtónak nem nyilatkozott, és többszöri kérdésre sem nevezett meg konkrét személyeket.", "A bizottság zárt ülésen újra meghallgatja. Ehhez előbb kérelmet kell benyújtani a titokgazdához a korlátozott adatok feloldására. A cikk a Schadl–Völner-üggyel jelölt."], "cav": "A vallomás tartalmát csak a nyilvános részből ismerjük, az utasítást adó személyt Fürcht nem nevezte meg.", "op": "Ha igaz, hogy a nyomozás határidejét nem a bizonyítékok, hanem egy felettes utasítása szabta, az az ügyészség függetlenségének kérdését nem általában, hanem névvel és dátummal veti fel. A zárt ülésen derülhet ki, kinek.", "src": [["HVG – Fürcht Pál a bizottság előtt", "https://hvg.hu/itthon/20261022_furcht-pal-vegrehajtas-varga-judit-toroczkai-laszlo-video"]]}, {"id": "jozsefvaros-rendorkapitany-egyezseg", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/bac9ba99-7e56-459b-b3ef-98adf110d12d.jpg", "imgs": "HVG", "r": "Közélet", "c": "Közbiztonság", "st": "Megerősített", "time": "okt. 22.", "t": "József körút: a testület csak együttműködési megállapodással hagyta jóvá az új rendőrkapitányt", "s": "Paál Péter György ezredes kinevezését a VIII. kerület a párkapcsolati erőszak elleni fellépéshez kötötte.", "p": ["A VIII. kerületi képviselő-testület egyhangúlag támogatta Paál Péter György ezredest új kerületi rendőrkapitányként, de csak azzal a feltétellel, hogy együttműködési megállapodást kötnek az erőszak megelőzéséről.", "Paál korábbi pályafutásán az V. kerületben, az ő idejében meghalt egy japán nő, aki hiába kért rendőri segítséget. A nő 2025 elején égett budapesti lakásában holtan találtak rá, a rendőrség eleinte balesetnek minősítette. Többször feljelentette volt férjét, akit azóta az ügyészség gyilkossággal és a lakás felgyújtásával vádolt meg.", "Pikó András polgármester szerint Paált megkérték, tisztázza korábbi felmentésének körülményeit. A polgármester nem kapott megerősített információt arról, hogy a japán nő ügyének kezelése volt-e az ok.", "A határozatlan idejű megállapodás a kerületet, a BRFK-t és a Józsefvárosi Közbiztonsági Alapítványt (JKK) köti. Képzést és tájékoztató anyagokat a rendőröknek, a Patent Egyesület protokolljának bevezetését kockázatfelméréssel és esetmegbeszélésekkel, két áldozatvédelmi kapcsolattartót, féléves statisztikát és az Óvóhely áldozatsegítő szolgálatot tartalmazza.", "Juharos Róbert fideszes képviselő szerint a drogkérdésnek előrébb kellene lennie, Udvarhelyi Tessza alpolgármester ezt „vérlázítónak” nevezte."], "cav": "A kinevezés előzményeinél a cikk nem közöl megerősített okot, ezt nem állítjuk.", "op": "Ritka, hogy egy önkormányzat a rendőri kinevezést konkrét vállalásokhoz köti. A párkapcsolati erőszak ellen a protokoll többet ér az ünnepi beszédeknél, de a mérce az lesz, hogy a féléves statisztika valóban megjelenik-e.", "src": [["HVG – Józsefváros és a rendőrkapitány", "https://hvg.hu/itthon/20261022_jozsefvaros-brfk-kapcsolati-eroszak-paal-peter-gyorgy"]]}, {"id": "oltatlan-katonak", "img": "https://img.hvg.hu/Img/27315920-08f2-479a-bc05-0514a7db57d5/ff800dd1-de6f-4da5-90ef-a7cb13634a60.jpg", "cred": "Pálóczi Zoltán volt százados. Fotó: HVG / Cabrera Martin", "imgs": "HVG", "r": "Közélet", "c": "Honvédség", "st": "Jelentett", "time": "okt. 20.", "t": "Kétszáz kirúgott katona vár igazságra: az oltatlanokat a honvédség szerződésen kívül tette", "s": "A mintegy 1200 érintett közül sokan visszatérhetnének, de rehabilitációt és kártérítést akarnak.", "p": ["A HVG szerint 2021–2022-ben mintegy 1200 katonát érintett a Covid-védőoltás megtagadása miatti intézkedés. Egy részük most visszatérhet, de a többség teljes rehabilitációt kér. Kádár András Kristóf, a Magyar Helsinki Bizottság társelnöke szerint az érintettek érdemben nem nyertek pert, az Emberi Jogok Európai Bírósága pedig nem vette fel az ügyet.", "2020 novemberétől a katonákat nem lehetett egyoldalúan elbocsátani, 2021 végétől viszont kötelező volt a Covid-oltás a közszféra dolgozóinak, katonáknak is. 2022 januárjától az oltatlan katonákat egyéves fizetés nélküli szabadságra küldték, sokan másodállást sem vállalhattak.", "Források szerint az 1200 érintett mintegy fele elbocsátható lett volna közös megegyezéssel. A mintegy 600, szabadságra küldött katona közül alig több mint 300 oltatta be magát és tért vissza. 2022 decemberében, a veszélyhelyzet vége előtt egy nappal megszüntették a jogviszonyukat.", "Pálóczi Zoltán, 43 éves volt százados, az érintettek valamivel több mint 200 fős csoportját képviseli. 2024-ben Böröndi Gábor vezérkari főnök szigorú feltételekkel engedélyezte a visszatérést, kevesen éltek vele. Ruszin-Szendi Romulusz védelmi miniszter idén nyáron jelentette be, hogy visszatérhetnek, ő volt a vezérkari főnök, amikor eltávolították őket.", "A katonák kártérítést kérnek az egy fizetetlen évért és a 2022-ben kifizetett hat hónapos fegyverpénzért, valamint méltányos visszavételt. Novák Előd (Mi Hazánk) rehabilitációs határozati javaslatot nyújtott be, a honvédelmi bizottság szeptemberben tárgyalta, de elakadt. Október 5-én Baráth Ernő helyettes államtitkár azt mondta nekik, forduljanak bírósághoz."], "cav": "A legtöbb szám ismeretlen forrásra vagy becslésre hivatkozik. A Helsinki Bizottság és az érintett csoport szempontjait közöljük, a minisztérium részletes álláspontját a cikk nem.", "op": "A járvány idején hozott intézkedés vitatható is lehetett, de a jogállam mércéje az, hogy utólag is számot lehet-e adni róla. Az, hogy a döntésben részt vevő vezető ma a minisztériumot vezeti, a vita tárgya, nem eldöntött tény.", "src": [["HVG – katonák és vakcinák", "https://hvg.hu/360/20261020_hvg-katonak-es-vakcinak-covidutohatasok-honvedsegi-humanpolitika-honvedseg-ruszin-szendi-helsinki-bizottsag-oltatlan-katonak-rehabilitacio"]]}, {"id": "ukran-gazexport", "img": "https://assets.telex.hu/images/20261015/1792097897-temp-vikmsg0f0pvd9dlejoa_hero-full:xl.jpg", "cred": "Illusztráció: a Földgázszállító Zrt. kompresszorállomása Csanádpalotán. Fotó: Rosta Tibor / MTI / MTVA", "imgs": "Telex", "r": "Külföld", "c": "Energia", "st": "Jelentett", "time": "okt. 24.", "t": "Ukrajna gázexportőrré vált, miközben Orbán korábban leállította a gáztranzitot", "s": "Kijev korlátozott exportengedélyeket adott magántermelőknek, szeptemberben a magyar gázimport 13 százaléka ukrán volt.", "p": ["Az ukrán kormány az orosz invázió 2022-es kezdete óta először hagyott jóvá korlátozott gázexport-engedélyeket magántermelők számára, így a felesleg egy része a magasabb árú európai piacokra kerül. A Telex G7 szerint szeptemberben a magyar gázimport 13 százalékát ukrán gáz adta, pedig orosz gáz már nem érkezik Ukrajnán át.", "Ukrajna korábban évi 17–20 milliárd köbméter gázt termelt, a fogyasztás 2025-re mintegy 21 milliárd köbméterre esett vissza. Az ipari gázfelhasználás 2026 első felében 41 százalékkal volt alacsonyabb, mint 2021-ben, ez hagyott felesleget. A magántermelők 2026 májusában több mint 330 millió köbméter gázt termeltek, a teljes kitermelés tavaly 17 milliárd köbméter alá esett.", "Az ukrán tárolók októberben körülbelül 11 milliárd köbméter gázt tartottak, ez a kapacitás nagyjából 37 százaléka és Európa mintegy 78 milliárd köbméteres készletének több mint 14 százaléka. Az ukrán árak a nyár eleje óta nagyjából 30 százalékkal a holland TTF-referencia alatt vannak.", "2026 márciusában Orbán Viktor bejelentette, hogy leállítja a gáztranzitot Ukrajna felé a Barátság kőolajvezeték lassú javítása miatt, április után érdemi gázáramlás nem volt Magyarországról Ukrajnába. Az OSW elemzőműhely szerint az orosz támadások ideiglenesen akár felére is csökkenthették az ukrán kitermelést, a behozatal ezért a tárolók feltöltéséhez továbbra is fontos."], "cav": "A cikk a kormányzati és elemzői adatokat idézi, a magyar importarány havi adat, nem éves.", "op": "A Fidesz 2026-os kampányának nagy része az ukránellenes hangulatkeltésre épült. Közben az ukrán gáz a magyar fogyasztók egy részét látja el, és olcsóbb, mint a holland benchmark. Ezt érdemes a kampányszlogenekkel együtt olvasni.", "src": [["Telex G7 – Ukrajna gázexportőr lett", "https://telex.hu/g7/vilag/2026/10/24/orosz-tamadasok-ukran-foldgazexport-kitermeles-fogyasztas-javitasok"]]}, {"id": "jorgensen-lakhatas-energia", "img": "https://assets.4cdn.hu/kraken/8PHysorfBfURzwYqs-lg.png", "imgs": "444", "r": "Külföld", "c": "Európai Unió", "st": "Megerősített", "time": "okt. 24.", "t": "Uniós biztos: Európa lakhatási válsága vészhelyzet, a téli energiaárak kemények lesznek", "s": "Dan Jørgensen budapesti látogatásán a 444-nek és a HVG-nek is interjút adott az orosz gázról, a Paks II-ről és a rövid távú lakáskiadásról.", "p": ["Dan Jørgensen, az Európai Bizottság energiaügyi és lakhatási biztosa Budapesten Kapitány Istvánnal és Vitézy Dáviddal találkozott, majd a 444-nek és a HVG-nek is interjút adott.", "A 444-nek azt mondta, a lakhatási válság Európában vészhelyzetté vált, és a döntéshozók, ő maga is, korábban nem vették elég komolyan. Átlagos télen mintegy 50 millió európai küzd a fűtésszámlák kifizetésével. Az állami támogatási szabályokat módosították, hogy a tagállamok jobban támogathassák a megfizethető lakhatást és az új építéseket, a Bizottság a rövid távú lakáskiadás korlátozását is vizsgálja.", "A tél nehéz lesz, mert Európa energiaimport-függő. Rövid távon a hőszivattyúkat javasolja a gáz- és olajkazánok kiváltására. Ha minden tagállam csökkentené a villamosenergia-adókat, a számlák körülbelül 14 százalékkal mérséklődhetnének. Az orosz energia 2027-es betiltása békekötés esetén is marad.", "A HVG-nek azt mondta, az orosz gáz szállítása legkésőbb 2027 novemberéig teljesen megszűnik. Az előző magyar kormány nem akart együttműködni a kivezetésben, az új együttműködik, a Bizottság közvetítést kínál a szomszédos országokkal és alternatív szállítókkal. Magyarország 2026 első nyolc hónapjában 1,71 milliárd eurót költött orosz gázra, ez az EU-ban a legtöbb (Bulgária 987 millió, Görögország 850 millió).", "A HVG szerint a Paks II folytatását Rosatom nélkül mérlegeli Magyarország, a kis moduláris reaktorok a 2030-as évek elejére várhatók. Jørgensen szerint a gáz- és áramárat külön kellene kezelni, hosszú távú szerződésekkel és különbözeti szerződésekkel, nem piaci beavatkozással. Tavaly 89 gigawattnyi új megújuló kapacitás épült az EU-ban.", "Az amerikai kapcsolatokról azt mondta, az USA nem ellenség, de Trump vámjai és energiapolitikai döntései sérthetik a szabad kereskedelmet."], "cav": "Két interjú tartalmát vontuk össze. A Paks II-ről szóló mondat a HVG szerinti magyar mérlegelésre vonatkozik, a magyar kormány hivatalos álláspontját nem ellenőriztük.", "op": "Hat hónapja még az volt a kérdés, hogy a magyar kormány hajlandó-e egyáltalán egyeztetni Brüsszellel az orosz gázról. Most egy uniós biztos nyilvánosan dicséri az együttműködést. Ez a változás az energiabiztonság szempontjából is többet ér a szlogeneknél.", "src": [["444 – Uniós biztos interjú", "https://444.hu/2026/10/24/unios-biztos-a-444-nek-fennall-a-veszely-hogy-az-europai-fiataloknak-mar-nem-lesz-jobb-elete-mint-a-szuleiknek"], ["HVG – Dan Jørgensen interjú", "https://hvg.hu/gazdasag/20261023_dan-jorgensen-energiaugyi-es-lakhatasi-biztos-europai-bizottsag-interju-aramar-megujulok-nuklearis-enerfia-smr-orosz-gaz-kivezetese"]]}, {"id": "macron-trappes-lovoldozes", "img": "https://assets.telex.hu/images/20261023/1792789818-temp-lqepake1si0gdiligll_facebook.jpg", "imgs": "Telex", "r": "Külföld", "c": "Franciaország", "st": "Megerősített", "time": "okt. 23.", "t": "Macron rasszista terrortámadásnak nevezte a Párizs melletti lövöldözést, egy ember meghalt", "s": "A támadó Trappes-ban és La Verrière-ben lőtt, benzinkútnál, egészségházban és játszótéren is; a gyanúsítottat elfogták.", "p": ["A BBC-re hivatkozó Telex szerint Emmanuel Macron francia elnök „rasszista terrortámadásnak” nevezte a Párizs környéki lövöldözést. Egy ember meghalt, öten megsebesültek, közülük hárman, köztük egy 12 éves kislány, súlyos állapotban vannak.", "A támadó pénteken reggel autóból lőtt Trappes-ban, majd a közeli La Verrière-ben. Ali Rabeh, Trappes polgármestere szerint válogatás nélkül lőtt, többek között egy benzinkútnál, egy egészségházban és egy játszótéren. A rendőrség a 39 éves gyanúsítottat az N10-es autópályán, La Verrière-ben fogta el, egy rokonát is őrizetbe vették.", "A terrorelhárítási ügyészség (PNAT) szerint a gyilkosság terrorszervezethez köthetőnek tűnik, a nyomozás a fegyvertartásra és terrorcsoporttal való összeesküvésre is kiterjed. A rendőrség szerint a támadó régebbi, sorozatlövésre is képes félautomata puskát használt.", "A gyanúsított négy korábbi elítélését automatikusan törölték a nyilvántartásból. A rendőrség ismerte, de a titkosszolgálatok nem követték, és nem szerepelt az országos veszélyeztetettségi listán. A motívumot nem erősítették meg."], "cav": "A „rasszista terrortámadás” minősítés Macrontól származik, a motívumot hivatalosan nem erősítették meg. Az Index hasonló eseményről ír Yvelines megyéből, ezt egy eseményként kezeljük.", "src": [["Telex – Trappes-i fegyveres támadás", "https://telex.hu/kulfold/2026/10/23/franciaorszag-trappes-fegyveres-tamadas"]], "op": "Ilyenkor a gyász és az együttérzés az első. A „rasszista terrortámadás” minősítés Macrontól származik, a hivatalos motívum megállapítása a hatóságok dolga marad."}, {"id": "matolcsy-vagyonnyilatkozat", "img": "https://assets.telex.hu/images/20261023/1792784991-temp-rke2eqi84bkrckfcngi_facebook.jpg", "imgs": "Telex", "r": "Gazdaság", "c": "MNB-ügy", "w": "MNB-ügy", "st": "Jelentett", "time": "okt. 23.", "t": "Matolcsy vagyonnyilatkozatából két év alatt több mint 200 millió forint „tűnt el”", "s": "A volt jegybankelnök megtakarítása a 2023-as 250 millióról 2025 márciusára 18,7 millióra csökkent.", "p": ["A Telex szerint Matolcsy György, aki 2013 és 2025 között vezette az MNB-t, a bíróság péntek délután egy hónapra elrendelte letartóztatását. Védője megerősítette, hogy az összes megtakarítását felajánlotta óvadékként, a Telex információi szerint ez 30 millió forint volt, ezt a bíróság elutasította.", "A vagyonnyilatkozatok szerint 2022-ben nem volt megtakarítása. 2023-ban körülbelül 250 millió forint volt, ebből 118 millió állampapírban, 100 millió megtakarítási betétben, 19,6 millió bankszámlán, és két balatoni ingatlant is bevallott. 2024-ben a megtakarítás 120 millió forint volt, az ingatlanok már nem szerepeltek. 2025 márciusában a megtakarítás 18,7 millió forint volt, ingatlan nélkül.", "A Telex számítása szerint két év alatt több mint 200 millió forintot veszített. Jegybankelnökként bruttó havi fizetése körülbelül 7 millió forint volt. Az MNB-től való távozása óta megtakarítása a Telex becslése szerint 11–12 millió forinttal nőhetett.", "Kapcsolódó ügy, hogy 2025. február 28-án a PADME alapítványhoz kötődő vagyonkezelő részvényeit magántőkealapba helyezték át. Az ügyletet Varga Mihály hivatalba lépése után napokkal visszafordították, áprilisban feljelentés született."], "cav": "A „eltűnt” kifejezés a Telex címéből ered. A cikk nem állítja, hogy ez a pénz bűncselekményből származott vagy elsikkasztották, ezt a nyomozás dönti el.", "op": "A vagyonnyilatkozat hiányzó összegei kérdést vetnek fel, de nem ítéletet. A bizonyítékokat a bíróságnak kell mérlegelnie, nem a címeknek.", "src": [["Telex – Matolcsy vagyonnyilatkozatai", "https://telex.hu/gazdasag/2026/10/23/matolcsy-gyorgy-volt-jegybankelnok-mnb-vagyonnyilatkozatok-2023-2025-200-millio-forint-megtakaras-eltunt"], ["444 – a bíróság elutasította az óvadékot", "https://444.hu/2026/10/23/matolcsy-gyorgy-az-osszes-megtakaritasat-30-millio-forintot-ajanlott-fel-ovadekkent-de-a-birosag-elutasitotta"]]}, {"id": "telex-stab-megtamadas", "img": "https://assets.telex.hu/images/20261023/1792774044-temp-2fi3d010qp9b7hldnai_facebook.jpg", "imgs": "Telex", "r": "Belpolitika", "c": "Fidesz", "st": "Jelentett", "time": "okt. 23.", "t": "Megtámadták a Telex operatőrét a Fidesz zászlómenetén, eltört a szemüvege", "s": "Egy nő kikapta a kamerát és megütötte Bakos Barnát, a Bem téren pedig a riportert, Simor Dánielt fenyegették.", "p": ["A Telex beszámolója szerint október 23-án 11 óra körül Bakos Barna operatőr a Fidesz-szimpatizánsok zászlómenetét filmezte a Műegyetem közelében. Egy körülbelül 40 éves nő felszólította, hogy ne forgasson. Mivel a férfi vágóképeket vett fel, a nő agresszívebben közeledett, kikapta a kamerát és megütötte őt. A kamera az arcát találta el, és eltört a szemüvege.", "Egy másik résztvevő elhúzta a nőt, egy rendőr megérkezett, felvette az adatokat és sértettként kihallgatta az operatőrt.", "A Bem téren, miközben Bóka János fideszes frakcióvezető beszélt, három ellentüntető Fidesz-ellenes jelszavakat skandált, a szimpatizánsok rájuk rontottak, a rendőrök és Kindlovits Máté választották szét a csoportokat. Ezután Simor Dániel Telex-riportert kiabálták le és fenyegették meg, a rendőrök arra kérték, hogy ne menjen vissza a tömegbe.", "A cikk szerint mindkét esetben rendőri intézkedés történt."], "cav": "A beszámoló a Telex saját munkatársainak elmondásán alapul. A Fidesz vagy a rendezők álláspontját a cikk nem közli.", "op": "A sajtószabadságnak nem a politikai ünnepeken, kamerával a kézben kell megmérettetnie magát. Az újságíró bántalmazása nem „kényes helyzet”, hanem bűncselekmény, bármelyik oldal rendezvényén történik.", "src": [["Telex – megtámadták a Telex stábját", "https://telex.hu/belfold/2026/10/23/fidesz-bem-ter-megemlekezes-rendorseg-intezkedes-ujsagiro-telex"]]}, {"id": "szaraz-istvan-level", "img": "https://assets.telex.hu/images/20261023/1792761472-temp-m5g669n7brmabdeijoj_facebook.jpg", "imgs": "Telex", "r": "Gazdaság", "c": "MNB-ügy", "w": "MNB-ügy", "st": "Jelentett", "time": "okt. 23.", "t": "Száraz István: semmi köze nincs az MNB-ügyhöz, a Quartz-részesedést 2024-ben átadta", "s": "Matolcsy Ádám volt üzlettársa levélben tagadta, hogy részt vett volna a 2025. február 28-i ügyletben.", "p": ["Száraz István, a Quartz-cégek egykori társtulajdonosa és Matolcsy Ádám közeli üzlettársa levelet küldött a Telexnek a 2025. februári MNB-ügyről. Azt állítja, nem vett részt az Optima Befektetési Zrt. alapítványi vagyonával kapcsolatos február 28-i értékpapír-cserében, nem adott rá utasítást, és a sajtóból értesült róla.", "Szerinte 2024. május 30. óta nincs tulajdonosi befolyása a Quartzban és önálló képviseleti joga, mert ekkor átadta tulajdonosi pozícióját. Az átadást csak 2025 augusztusában jegyezték be, mert az eljáró ügyvéd nem nyújtotta be a cégbírósági változásokat, ez keltheti az utasításadás látszatát. A cégnyilvántartási adatok szerint 2025 augusztusától 9,9 százalékos közvetett részesedése volt a Quartzban.", "Azt mondja, csak egy 2025 nyári tervet segített előkészíteni az Optimával az alapítványi vagyon védelmére és a veszteségek korlátozására. Matolcsy Ádámmal utoljára 2025 közepén beszélt, azóta csak ügyvédek vagy munkatársak útján érintkeztek.", "Száraz nincs a gyanúsítottak között. Október 21-én az ügyészség őrizetbe vette Matolcsy Györgyöt, Matolcsy Ádámra és Stofa Györgyre nemzetközi elfogatóparancsot adtak ki."], "cav": "Az állításokat Száraz leveléből közöljük, a Telex nem ellenőrizte függetlenül.", "src": [["Telex – Száraz István reagál", "https://telex.hu/gazdasag/2026/10/23/szaraz-istvan-matolcsy-adam-mnb-ugy-quartz-befektetesi-alapkezelo"], ["HVG – Matolcsy Ádám egykori üzlettársa megszólalt", "https://hvg.hu/gazdasag/20261023_megszolalt-matolcsy-adam-egykori-uzlettarsa-szaraz-istvan"]], "op": "Száraz István tagadása és a hozzá tartozó levél állítás, nem bizonyíték. A nyomozó hatóságok és a bíróság dolga lesz eldönteni, hogy a Quartz-részesedés 2024-es átadása valóban megszakította-e a kapcsolatot az ügylettel."}, {"id": "optima-reszvenykolcson", "img": "https://assets.4cdn.hu/kraken/8JwJYMaG9R2CUyHQs-lg.jpeg", "imgs": "444", "r": "Gazdaság", "c": "MNB-ügy", "w": "MNB-ügy", "st": "Jelentett", "time": "okt. 22.", "t": "Péntek délutáni „kölcsön” Matolcsy utolsó munkanapján: így próbálták kimenteni az Optima-részvényeket", "s": "A 444 szerint az ügyészség különösen nagy értékre elkövetett gazdasági csalással gyanúsítja a volt jegybankelnököt.", "p": ["A 444 cikke szerint a Központi Nyomozó Főügyészség szerdán gyanúsítottként hallgatta ki és őrizetbe vette Matolcsy Györgyöt, és kezdeményezte letartóztatását különösen nagy kárt okozó gazdasági csalás gyanúja miatt.", "Őrizetbe vették Valkó Mihály volt vezérigazgatót és Sándor Tamást, a Matolcsy család régi ügyvédjét. Matolcsy Ádámra és Stofa György volt vezérigazgatóra nemzetközi elfogatóparancs van érvényben.", "A célpont az MNB-alapítványokhoz kötődő Optima Befektetési Alapkezelő Zrt. volt. A cikk szerint az Optima-részvényeket 60 hónapra kölcsönadták volna olyan szerződéssel, amely aláíráskor a tulajdonjogot a kölcsönvevőre ruházta volna.", "Az átruházást február 27-én, pénteken délután kísérelték meg, Matolcsy utolsó tényleges munkanapján. Hivatalosan március 3-ig maradt hivatalában. A 444 már 2025 áprilisában beszámolt a tervről: ötéves kölcsönnel a tulajdon a Száraz Istvánhoz köthető magántőkealaphoz került volna."], "cav": "A cikk fizetős, csak a nyilvános bevezetője, a metaadatai és a kapcsolódó ajánlók alapján tudtuk összefoglalni, ezért a részletes cégszerkezetet nem közöljük.", "op": "A gyanú súlyos, de a gyanú nem bizonyítás. A tisztességes követelmény ugyanaz Matolcsyra, mint bárki másra: a bizonyítékok számítanak, nem a politikai hangulat.", "src": [["444 – az Optima-ügy háttere", "https://444.hu/2026/10/22/optima-befektetesi-matolcsy-adam-matolcsy-gyorgy-kolcson-kolcsonszerzodes-ceghalo-knyf-padme-pallas-athene-alapitvanyok-mnb"]]}, {"id": "sztalin-szobor-csizma-ter", "img": "https://assets.4cdn.hu/kraken/8PIWuzIUnbt01U8vrs.png", "cred": "Városháza park. Fotó: Német Szilvi/444", "imgs": "444", "r": "Közélet", "c": "Emlékezet", "st": "Megerősített", "time": "okt. 23.", "t": "Fényvetítéses „ledöntött” Sztálin-szobor a Városháza parkban: Csizma téren emlékezett a főváros", "s": "A rekonstrukció aranyszínű gyantaszobra a vetített alakok előtt dőlt el, a közönség kordonok mögött maradt.", "p": ["Október 23-án este a főváros fényvetítéses felidézést rendezett az 1956-os Sztálin-szobor ledöntéséről a Városháza parkban, amelyet erre az alkalomra „Csizma térnek” neveztek el. Az esemény egy erre az alkalomra épített, aranyszínű gyanta Sztálin-szoborral zajlott, a vetített alakok döntötték le, a közönség kordonok mögött maradt.", "Az eredeti 16 méteres bronzszobor a mai Ötvenhatosok terén, korábbi Felvonulási téren állt. 1951-ben állították fel, részben Habsburg-kori szobrok beolvasztott bronzából öntötték. A forradalmárok, köztük diákok és gyári munkások, 1956. október 23-án 21 óra 37 perckor döntötték le, a csizma a talapzaton maradt.", "Karácsony Gergely főpolgármester beszédet mondott. A mintegy húszperces vetítésen a szobor megingott, egyszer magától is eldőlt. A tervezett 22 órai közönségakcióban nem bontották el a kordonokat, a végső döntést a vetített alakok és a csizmában elrejtett gép végezte.", "A cikk nem közli, meddig marad a másolat a parkban."], "cav": "A 444 cikke szerzői hangnemben, kritikusan írt az eseményről, a tényeket tudósításként vettük át.", "op": "Egy kényelmesen visszapattanó, többször „ledönthető” Sztálin-szobor kétségtelenül mulatságos, de a forradalom nem látványosság volt. Az emlékezés akkor hiteles, ha nem szórakoztat, hanem megállít.", "src": [["444 – ledönthető Sztálin-szobor", "https://444.hu/2026/10/23/vegtelenszer-ledontheto-visszapattanos-sztalin-szoborral-tette-atelhetove-a-fovaros-a-nepfelseget"]]}, {"id": "legio-hungaria-corvin", "img": "https://assets.4cdn.hu/kraken/8PINAYTXTyGRWGLWs.jpeg", "cred": "Fotó: Bankó Gábor/444", "imgs": "444", "r": "Közélet", "c": "Szélsőjobb", "st": "Jelentett", "time": "okt. 23.", "t": "Fáklyás menet a Corvin közben: a Légió Hungária fekete ruhában, katonás rendben vonult", "s": "A menet a Mi Hazánk rendezvénye után két órával indult, a résztvevők LMBTQ-, kommunista és uniós zászlón is átlépkedtek.", "p": ["A 444 beszámolója szerint a szélsőjobboldali Légió Hungária október 23-án fáklyás menetet tartott a Körúttól a Corvin közig, nagyjából két órával a Mi Hazánk rendezvénye után. A résztvevők zömmel feketébe öltözve, katonás rendben vonultak, és átgyalogoltak egy LMBTQ-zászlón, egy kommunista zászlón és egy uniós zászlón.", "A Corvin mozi lépcsőjén tartották a megemlékezést az 1956-os forradalomról. A jelszavak között uniós-ellenesek is voltak, a csoport Pongrátz Andrást köszöntötte, aki nagyjából két héttel korábban halt meg, és 1956-ban részt vett egy Sztálin-szobor lerombolásában.", "Az egyik beszéd az LMBTQ-t, a feminizmust és az antifasizmust „métely”-nek nevezte, amely belülről rothasztja a nemzet kultúráját. A 444 szerint a csoport esztétikája és gesztusai a nácizmust idézték."], "cav": "A tudósítás a 444 szerzőjének értékelését is tartalmazza (a nácizmusra való utalás), ezt nem állítjuk tényként.", "op": "A szólásszabadság nagy érték, de a gyűlölet nem szabadságharc. Az, hogy 1956-ra hivatkozva olyan szóhasználat hangzik el, amely az ellenfeleit „métely”-nek nevezi, azt mutatja, hogy a forradalom örökségét nem lehet megkérdezés nélkül kisajátítani.", "src": [["444 – a Légió Hungária megemlékezése", "https://444.hu/2026/10/23/akinek-a-mi-hazank-nem-eleg-nacionalista-az-a-legio-hungaria-masirozos-karlengetos-megemlekezesevel-vigasztalodhatott"]]}, {"id": "kover-bengali-tigris", "img": "https://assets.4cdn.hu/kraken/8PIF9ANYnY1FKSAxs-lg.png", "imgs": "444", "r": "Belpolitika", "c": "Fidesz", "st": "Jelentett", "time": "okt. 23.", "t": "Kövér László: „Ünnepeljen velük jó néhány éhes bengáli tigris”", "s": "A volt házelnök a Hír TV-nek elmondta, miért nem ünnepel a Fidesz a Tiszával, és von der Leyen beszédét furcsának nevezte.", "p": ["Kövér László volt házelnök a Hír TV-nek azt mondta, nehéz bemutatható választ adni arra, miért nem ünnepel a Fidesz a Tiszával: „Ünnepeljen velük jó néhány éhes bengáli tigris.” A közös ünneplés ötletét tipikus kommunista provokációnak nevezte, és szerinte a két oldalnak semmi közös nincs a demokráciában, a jogállamban vagy 1956-ban.", "Azt mondta, a Nyugat mindig a nemzet „árulóit” használja a saját céljaira, és a nyugati beavatkozás sosem szolgálja Magyarország érdekeit. Elégedetlen azzal, ahogyan a saját oldala a 2006-os események felelőseit felelősségre vonta.", "Von der Leyen parlamenti beszédét, amely szerint a magyar demokrácia újjászületett, furcsának nevezte Brüsszel szabadságértelmezése miatt. A Fidesz feladata szerinte az újrarendeződés és a nemzeti oldal cselekvőképességének visszaszerzése.", "Viccelődve megjegyezte, hogy a Fidesz mindig olyan diktatúrát épített, amelyből rosszul jött ki, ezért meg kellene próbálnia mást, „amiből mindig mi jöttünk ki rosszul”."], "cav": "A cikk a 444 összefoglalója Kövér Hír TV-nek adott nyilatkozatáról, a teljes interjút nem láttuk.", "op": "A volt házelnök viccesnek szánt mondata is elárulja, mit gondol a Fidesz a rendszerről, amelyet évekig épített. A „diktatúra” és az „éhes tigris” szó ilyen közelsége nem véletlen, és nem is vicc.", "src": [["444 – Kövér a bengáli tigrisről", "https://444.hu/2026/10/23/kover-azzal-viccelodott-hogy-megprobalhatna-mar-olyan-diktaturat-epiteni-a-fidesz-amibol-jol-jon-ki"]]}, {"id": "ader-bem-rakpart", "img": "https://assets.4cdn.hu/kraken/8PI2V8TrmVkW12Wh2s.jpeg", "cred": "Áder János beszédet mond a Fidesz ünnepi megemlékezésén október 23-án. Fotó: Bankó Gábor/444", "imgs": "444", "r": "Belpolitika", "c": "Fidesz", "st": "Jelentett", "time": "okt. 23.", "t": "A Fidesz első ellenzéki október 23-a: hosszú Áder-előadás, fáradt tömeg, Orbán nélkül", "s": "A 444 szerint a Bem rakparti rendezvény látogatottsága a vártnál nagyobb volt, de a beszédek kevésbé voltak lelkesítők.", "p": ["A Fidesz a Bem rakparton tartotta október 23-i megemlékezését, ellenzékiként először, és Orbán Viktor nélkül, aki a hírek szerint Párizsban volt. A szerző szerint a részvétel nagyobb volt a vártnál, a tömeg szétszórtan állt, az eseményt három kivetítőn közvetítették.", "Áder János volt köztársasági elnök hosszú előadást tartott az 1950-es évek történetéről, a cikk szerint sok hallgató elfáradt, a színfalak mögött valaki rosszul lett. Bóka János frakcióvezető Illyés Gyulát idézve hosszú küzdelemre szólított fel, ami a szerző szerint kevésbé volt tüzes a vártnál.", "Dulakodás tört ki Tisza-aktivistákkal, mintegy 50 rendőr avatkozott közbe. Schmidt Mária bírálta az újraindult Népszabadságot, és azt mondta: „El akarják hazudni nemzeti forradalmunkat.” Az esemény Orbán hiányáról szóló dallal zárult, és rövid ideig az ő nevét skandálták."], "cav": "A tudósítás a 444 szerzőjének benyomásait is tartalmazza (például a „fáradt” tömeg), ezeket nem tekintjük mérhető ténynek.", "op": "Egy ellenzéki Fidesznek van mit tanulnia: a Bem rakparton látszott, hogy a mozgósítás Orbán nélkül nehezebb, és a mondandó nehezebben marad hiteles, ha a vezér távol van az ünnepen.", "src": [["444 – életjelet mutatott volna a Fidesz", "https://444.hu/2026/10/23/eletjelet-mutatott-volna-a-fidesz-de-akkor-jott-ader-janos"]]}, {"id": "toroczkai-corvin-koz", "img": "https://assets.4cdn.hu/kraken/8PIG20mkg1VYWGLWs.jpeg", "cred": "Toroczkai László a Corvin közben. Fotó: Bankó Gábor/444", "imgs": "444", "r": "Belpolitika", "c": "Mi Hazánk", "st": "Jelentett", "time": "okt. 23.", "t": "Toroczkai a Corvin közben: Zelenszkijt és Magyar Pétert is diktátornak nevezte, „ellenállási köröket” hirdetett", "s": "A Mi Hazánk elnöke több mint ezer ember előtt beszélt, és egy társasjátékra hivatkozva nemzeti ellenállást hirdetett.", "p": ["A 444 beszámolója szerint Toroczkai László, a Mi Hazánk elnöke október 23-án a Corvin közben több mint ezer ember előtt beszélt a párt megemlékezésén.", "Azt mondta, Volodimir Zelenszkij, ahogy Magyar Péter, teljes diktatúrát épít. Bírálta Ursula von der Leyent, azt állítva, hogy a gyermekvédelmi törvény módosítása elvette a külföldről finanszírozott szervezetekkel szembeni védelmet.", "Az Emberség Erejével Alapítvány által egy újpesti iskolába vitt társasjátékra hivatkozva „Ellenállási Köröket” hirdetett a helyi civilekkel. Novák Előd kifogásolta, hogy Baka András beszélt a parlamenti megemlékezésen, a tatai per miatt. Toroczkai megkérdőjelezte, hogy Krasznahorkai László magyar-e, állami kitüntetése ellenére. Tóth Máté Brüsszelt a Szovjetunióhoz hasonlította: „1100 éve nem változik semmi.”"], "cav": "Az állítások a beszélők szavai, nem ellenőrzött tények. A 444 cím szerzői hangnemű („magyarométer”), ezt nem vettük át.", "op": "Aki egy irodalmi Nobel-díjast megkérdőjelez, egy társasjáték miatt „nemzeti ellenállást” hirdet, az nem a magyarságot, hanem a saját követőinek félelmét kezeli. A nemzeti ünnep másról szólna.", "src": [["444 – Toroczkai a Corvin közben", "https://444.hu/2026/10/23/felporgette-a-magyarometert-a-corvin-kozben-a-mi-hazank-elnoke-majd-nemzeti-ellenallast-hirdetett-egy-tarsasjatek-miatt"]]}, {"id": "magyar-peter-okosz", "img": "https://kep.cdn.index.hu/1/0/7219/72190/721900/72190047_5320601_30da92d3813bd62e14b83eb04b29e782_wm.jpg", "imgs": "Index", "r": "Gazdaság", "c": "Kereskedelem", "st": "Jelentett", "time": "okt. 23.", "t": "Magyar Péter a kereskedők érdekvédőinek: „Ok, akkor majd kiírom a facebookra”", "s": "Az OKSZ vezetője csalódott, hogy a kormány nem egyeztetett a kiskereskedelmi különadóról.", "p": ["Magyar Péter miniszterelnök október 23-án a HVG Facebook-posztja alatt, amely az OKSZ-szal készített interjúról szólt, azt írta: „Ok, akkor majd kiírom a facebookra”, nevető-síró emojival.", "Balázs Ildikó, az Országos Kereskedelmi Szövetség (OKSZ) új vezérigazgatója azt mondta, a kormány nem egyeztetett az érdekvédelmi szervezetekkel a kiskereskedelmi különadóról, ami „némi csalódás”. Azt szeretné, hogy a cégek a Magyar Közlönyben való megjelenés előtt értesüljenek az új szabályokról.", "Az OKSZ 1990-ben alakult független szövetség, tagjainak éves árbevétele meghaladja az 5000 milliárd forintot. Tagjai a kiskereskedelmi forgalom körülbelül egyharmadát és a napi fogyasztási cikkek forgalmának közel felét adják, köztük a SPAR, a Tesco, a Lidl, az Auchan és az Aldi.", "A Tisza választási programja bírálta az előző kormány formális egyeztetéseit, és érdemi egyeztetést ígért az érintettekkel az adóváltozásokról."], "cav": "A miniszterelnök komment egy kontextus nélküli kommentár, a pontos értelmezése vitatható. A kormány hivatalos álláspontját a cikk nem közli.", "op": "A kormányváltás egyik ígérete az érdemi egyeztetés volt. Egy Facebook-komment nem helyettesíti, és a tisztességes válasz az lenne, hogy a kereskedők a rendelet előtt hallanak a szabályokról, nem utána.", "src": [["Index – Magyar Péter és az érdekvédők", "https://index.hu/belfold/2026/10/23/magyar-peter-egyeztetes-erdekvedok-facebook-uzenet/"]]}, {"id": "trump-putyin-zelenszkij-dizel", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/a7e4d6ca-cb71-4eca-8843-e370713f8487.jpg", "imgs": "HVG", "r": "Külföld", "c": "Egyesült Államok", "st": "Jelentett", "time": "okt. 23.", "t": "Szankciók felfüggesztése, orosz dízel Amerikának: áldozatot hozat Trump Ukrajnával a félidős választás előtt?", "s": "Az HVG360 elemzője szerint Trump a kapitulációra kényszerítheti Kijevet, hogy javítson a republikánusok esélyein.", "p": ["Németh András a HVG360-ban azt írja, Trump hajlandó lehet nyomást gyakorolni Ukrajnára a kapitulációért, hogy javítsa a republikánusok esélyeit a november 3-i félidős választáson.", "Egy brüsszeli sajtótájékoztatón Zelenszkij mosolyogva nem erősítette meg a Sky News kérdésére, hogy Trump bűnbaknak használja-e őt az iráni háborúért és az emelkedő dízelárakért. A cikk szerint a terem ezt igenként értette.", "Pár órával később Trump végrehajtói rendelettel felfüggesztette a vasárnapra esedékes szankciók többségét, részletes indoklás nélkül. Egy hónappal korábban kétpárti törvényt írt alá, amely 30 napot adott neki, hogy 100 százalékos vámot vessen ki Oroszország öt legnagyobb olaj- és gázvásárlójára, valamint az orosz bankokra és az árnyékflotta üzemeltetőire.", "Októberi elején Trump megállapodott Putyinnal, hogy Oroszország novemberben 500 ezer tonna, decemberben 1 millió, majd további 3 millió tonna dízelt szállít. Az USA napi 600 ezer tonna dízelt használ. A dízelár februárhoz képest nagyjából megduplázódott, főleg az iráni háború miatt."], "cav": "Véleményelemzésről van szó, az elemző következtetése nem bizonyított tény. A szankciófelfüggesztés részleteit a cikk nem közli.", "op": "Ha az amerikai benzinkutak ára fontosabb a szövetségeseknél, az nem világpolitika, hanem választási számítás. Európának be kell látnia, hogy Ukrajna támogatása nem külső szívesség, hanem saját biztonsági ügye.", "src": [["HVG360 – Trump, Putyin, Zelenszkij, dízel", "https://hvg.hu/360/20261023_hvg-trump-putyin-zelenszkij-orosz-ukran-haboru-olaj-dizel"], ["Telex – az első orosz dízelszállítmány az USA-ba", "https://telex.hu/gazdasag/2026/10/23/vlagyimir-putyin-donald-trump-dizel"]]}, {"id": "midterm-demokratak-eselyek", "img": "https://assets.telex.hu/images/20261016/1792136468-temp-0ub1g1out6do4amoelg_cikktorzs:xl.jpg", "cred": "Donald Trump és Ken Paxton egy kampánygyűlésen a texasi San Antonióban 2026. október 7-én. Fotó: Win McNamee / Getty Images / AFP", "imgs": "Telex", "r": "Külföld", "c": "Egyesült Államok", "st": "Jelentett", "time": "okt. 23.", "t": "Félidős választás: Nate Silver modellje szerint a demokraták 95 százalékos eséllyel nyerik a Házat", "s": "A Szenátus megszerzésére 75,7 százalék az esély, a republikánusok a kőkemény államokban is szorulnak.", "p": ["A Telex összefoglalója szerint a demokraták Nate Silver modellje szerint 95,1 százalékos eséllyel szerzik meg a Képviselőházat, és 75,7 százalékos eséllyel a Szenátust a november 3-i félidős választáson.", "A republikánusok 53 szenátusi helyet birtokolnak a százból, a demokratáknak nettó négy hely nyereségre van szükségük, miközben a sajátjaikat meg kell tartaniuk. A Trump alacsony népszerűsége, a népszerűtlen iráni háború, az üzemanyag- és inflációs nyomás és a vámok húzzák vissza a republikánusokat.", "Texasban James Talarico (D) 2–6 ponttal vezet Ken Paxton (R) előtt (Silver: 70 százalék a demokratáknak). Kansasban a republikánusok legalább 10 millió dollárt csoportosítottak át, Silver 51,1 százalékot ad a demokratáknak. Alaszkában Dan Sullivan hét ponttal marad el Mary Peltolától (62,8 százalék D).", "Észak-Karolinában a republikánusok visszavonták a költést (95,7 százalék D), Georgiában Jon Ossoff jól vezet (96,7 százalék D), Ohióban Sharon Brown kissé vezet Jon Husted előtt (72,6 százalék D), Michiganben Abdul el-Sayed néhány ponttal vezet Mike Rogers előtt (79,8 százalék D)."], "cav": "Valószínűségi modell, nem előrejelzés. A felmérések és a modell hibahatára nagy lehet, az eredmény bármelyik irányba eltérhet.", "src": [["Telex – republikánusok a félidős választás előtt", "https://telex.hu/kulfold/2026/10/23/midterm-felidos-valasztasok-egyesult-allamok-szenatus-fontos-allamok"]], "op": "A 95 százalékos esély nem jóslat: Nate Silver modellje a mostani felmérésekre épül, a valóság pedig a szavazatszámlálásnál derül ki. A demokratáknak ez jó hír, de a mozgósítás nélkül a legjobb modell is kevés."}, {"id": "james-bond-casting", "img": "https://assets.telex.hu/images/20261023/1792790183-temp-ecedplt9tta26jhoknf_facebook.jpg", "imgs": "Telex", "r": "Kultúra", "c": "Film", "st": "Jelentett", "time": "okt. 23.", "t": "Szűkült a lista: Callum Turner, Jack Lowden és Josh O'Connor is az új James Bond-próbán", "s": "A BBC és az amerikai lapok szerint a hétvégén Londonban tartják a kamerapróbákat.", "p": ["A BBC jelentése szerint Callum Turner, Jack Lowden és Josh O'Connor az utolsó körös kamerapróbák jelöltjei között vannak a következő James Bond szerepére. A Deadline szerint a próbákat eredetileg október elejére tervezték, de ütemezési okokból elhalasztották, és legalább négy színészt hívtak meg, ez megerősítetlen.", "A Variety szerint Turner és Lowden esélyes Daniel Craig utódjára. A Hollywood Reporter szerint a próbákat a hétvégén Londonban tartják, az utolsó fordulóban három-öt színész szerepel. Jacob Elordit állítólag nem hívták meg.", "A próbák a kaszkadőrmunkát, a kamera előtti jelenlétet és a szövegmondást értékelik. Az Amazon MGM Stúdió májusban jelentette be a casting indulását. Amy Pascal producer szerint az év végéig dönthetnek, Steven Knight forgatókönyvíró szeptemberben elkészült az első vázlattal. A következő film a hírek szerint 2028-ban érkezik, Denis Villeneuve rendezésében."], "cav": "A jelöltek névsora több, nem hivatalos forrás alapján készült. A stúdió nem erősítette meg.", "src": [["Telex After – James Bond casting", "https://telex.hu/after/2026/10/23/uj-james-bond-foszerep-casting-callum-turner-jack-lowden-es-josh-o-connor-proba"]], "op": "Az új Bond kiválasztása mindig nagy találgatás tárgya, és a három név mind jó színész. A lényeg: a szerepre való illeszkedés döntsön, ne a hírnév."}, {"id": "duna-rekord-alacsony", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/40b0b02e-fa18-488b-b0cd-dbce6f92f2f1.jpg", "imgs": "HVG", "r": "Közélet", "c": "Környezet", "st": "Megerősített", "time": "okt. 23.", "t": "Nem csak a klímaváltozás miatt a rekordalacsony Duna: már az 1970-es évek beavatkozásai is növelték a kockázatot", "s": "A HVG360 szerint október 8-án újabb történelmi mélypont volt, Nagymaroson –102 centiméter.", "p": ["A HVG360 Szabó Gábor jegyezte írása szerint a klímaváltozás és az aszály magyarázza a Duna jelenlegi történelmi mélypontját, de az 1970-es évekbeli beavatkozások már korábban növelték az alacsony vízállás kockázatát.", "Október 8-án a Duna újabb történelmi mélypontot ért el. A kisvízszint nagyjából két méterrel alacsonyabb, mint 100–150 évvel ezelőtt. Nagymaroson –102 centimétert mértek, a folyó közepén korábban nem látott zátonyok bukkannak fel.", "A hajósok fő veszélye száz évvel ezelőtt Pest fölött a víz alatti fatuskók voltak. Jókai 1872-es Az arany ember című regényében a Szent Borbála hajó Dunaalmásnál süllyed el."], "cav": "A rendelkezésre álló kivonat nem pontosítja, melyik 1970-es évekbeli beavatkozásokra utal a szerző.", "src": [["HVG360 – rekordalacsony dunai vízállás", "https://hvg.hu/360/20261023_hvg-klimavaltozas-aszaly-duna-vizszint"]], "op": "Az, hogy a klímaváltozás mellett az emberi beavatkozások is hozzájárultak a Duna mélypontjához, azt üzeni: a megoldás nem csak a klímavédelem, hanem a vízgazdálkodás átgondolása is."}, {"id": "moszkva-nagykovetseg-1956", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/6f90079b-e789-4b08-8c56-821d2137a726.jpg", "imgs": "HVG", "r": "Külföld", "c": "Oroszország", "st": "Megerősített", "time": "okt. 23.", "t": "A moszkvai magyar nagykövetség: „1956-ban Európát választottuk”", "s": "Gergics Gábor ügyvivő az ünnepi fogadáson az európai identitásról beszélt, Rácz András elismerően írt róla.", "p": ["A moszkvai Magyar Nagykövetség ünnepi fogadást tartott az 1956-os forradalom és szabadságharc 70. évfordulóján, és Facebook-posztban számolt be róla.", "Gergics Gábor ügyvivő szerint a magyarok 1956-ban Európát választották. Azt mondta, a magyaroknak mindig is európai identitásuk volt, szívük, gondolataik és álmaik is európaiak. A nagykövetség szerint az 1956-os hősök megmutatták a világnak, hogy a bátorság megváltoztathatja a történelem menetét, utat nyitottak a mai szabad, független, demokratikus Magyarországnak, és szabadságharcra ösztönöztek más közép-európai népeket.", "Rácz András orosz-szakértő, a Külügyi és Külgazdasági Intézet vezérigazgató-helyettese dicsérte Gergicset és csapatát: „Így kell egyszerre elegánsnak és határozottnak lenni.”"], "cav": "A beszámoló a nagykövetség Facebook-posztjára támaszkodik, a rendezvényről független tudósítás nincs.", "op": "Hat hónappal ezelőtt egy moszkvai magyar követség ilyen szavakkal nem szólalt volna meg. Ez nem sértő gesztus, hanem a külpolitikai irányváltás kézzelfogható jele.", "src": [["HVG – 1956-os megemlékezés Moszkvában", "https://hvg.hu/vilag/20261023_magyarorszag-moszkvai-nagykovetsege-1956-evfordulo-megemlekezes-fogadas-respect"]]}, {"id": "mnb-ingatlanok-vesztesegek", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/10fe4eb5-fc84-499e-a27d-4dbf4d503dcc.jpg", "imgs": "HVG", "r": "Gazdaság", "c": "MNB-ügy", "w": "MNB-ügy", "st": "Jelentett", "time": "okt. 22.", "t": "MNB-ingatlanok: két év alatt több mint 70 milliárdos értékvesztés, 27 milliárdot próbálnak visszaszerezni", "s": "A Budai Vár, a Krisztina körút és a balatonakarattyai oktatási központ is a leltárban szerepel.", "p": ["A HVG ingatlan-összeállítása szerint a Magyar Nemzeti Bank környékéhez kötődő ingatlanok között szerepel a Postapalota felügyeleti központja, a balatonakarattyai oktatási és üdülőközpont, a Krisztina körúti egykori Telekom-székház (a Tőzsdepalota), az Úri utca 21. a Budai Várban (Bölcs Vár) és a Szentháromság tér 7. (Pallas Athéné konferenciaközpont).", "Az MNB székházának felújítását a cikk túlárazottnak állítja. Az épületet nem az MNB-Ingatlan Kft. birtokolja, de a cég kezelte a munkákat. Az MNB-Ingatlan Kft. az elmúlt két évben több mint 70 milliárd forint értékvesztést könyvelt el. Az MNB 27 milliárd forintot próbál visszaszerezni Matolcsy Ádám egyik barátjától.", "Három ingatlan jelenleg értékesítési pályázaton van, a hírek szerint még nincs vevő rájuk."], "cav": "A cikk egyedi árakat nem közöl. A túlárazásra vonatkozó állítás a HVG megállapítása, független vizsgálat nem erősítette meg.", "src": [["HVG – az MNB ingatlanjai képekben", "https://hvg.hu/ingatlan/20261022_mnb-ingatlanok-galeria"]], "op": "Hetven milliárd forint értékvesztés két év alatt egy ingatlanportfólión nagy szám, és a hozzá tartozó látványos épületek jól illusztrálják a jegybanki alapítványok költekezési kultúráját. Egy független vizsgálat fogja eldönteni, mi volt túlárazás és mi piaci mozgás."}, {"id": "brody-ezek-ugyanazok", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/432fa1cc-e2d9-40f2-b24a-e6d723c45ed2.jpg", "imgs": "HVG", "r": "Kultúra", "c": "Zene", "st": "Megerősített", "time": "okt. 23.", "t": "Bródy János átírta az „Ezek ugyanazok”-at: az elmúlt 16 évről énekelnek", "s": "A Vitáris Ivánnal közös klip a HVG-n jelent meg először, az április 10-i Rendszerbontó koncert képeivel.", "p": ["Bródy János az „Ezek ugyanazok” című dalt a NER-korszak elején írta, 2026. október 23-ára kicsit átírta a szöveget úgy, hogy az elmúlt 16 évet írja le. Az eredeti dal 2011-ben jelent meg az Illés szekerén című albumon, csak néhány sort kellett múlt időbe tenni.", "A dal apa és fia párbeszéde. Az átírt refrénben a fiú sora azt mondja az apának, hogy ő már megmondta, a két oldal ugyanaz.", "Bródy és Vitáris Iván 2026. április 10-én lépett fel együtt a Rendszerbontó koncerten, hat hónappal később a Hősök terén találkoztak újra. A dalban Vitáris Iván énekel Kirschner Péter producer által válogatott együttessel. A klipet Farkas Péter Gábor rendezte és vágta, az április 10-i fellépés felvételeit is tartalmazza, Mentler Krisztina producerrel. A HVG közölte elsőként."], "cav": "", "src": [["HVG – Bródy János és a dal új szövege", "https://hvg.hu/kultura/20261023_s-hogy-vegul-rajuk-dolt-a-haz-es-s-mar-nem-volt-tobb-hitel-mast-vadoltak-azzal-amit-ok-kovettek-el-az-elmult-16-evet-eneklik-meg-brody-janosek"]], "op": "Bródy János dalának átírása azt mutatja, hogy egy jó protestdal az idővel is megáll: elég múlt időbe tenni néhány sort. Az, hogy a klip a Rendszerbontó koncert képeivel jelent meg, szimbolikus lezárás is."}];

const COUNTY=[{"id": "m-sasto", "r": "Megyei", "m": "Heves", "c": "Aszály", "w": "", "st": "Jelentett", "time": "aug. 12.", "t": "Kiszáradás szélén a Sástó: a Mátra legmagasabban fekvő tavából alig maradt víz", "s": "Az Index szerint a vízutánpótlás nélküli tó medrének nagy részén csak vékony vízréteg maradt.", "p": ["Az Index augusztus 12-i cikke szerint a Mátrafüred és Mátraháza között, Gyöngyös közelében fekvő Sástó – amelyet a lap Magyarország legmagasabban fekvő tavának nevez – az aszály miatt kiszáradás szélére került. A tavat néhány ér és forrás táplálja, külön vízutánpótlása nincs, így csapadékra és talajvízre van utalva. Normál időjárás mellett az átlagos vízmélység 96 centiméter körüli, most a meder nagy részén csak vékony vízréteg maradt, a partközeli részek kiszáradtak.", "A cikk emlékeztet: a tó mesterséges, az 1953-ban lecsapolt, közel két hektáros mocsaras területen alakult ki Varga Ferenc akkori tanácselnök rendelete alapján. A 2022-es nyári aszály idején a táplálóerek és források mind kiapadtak, az Index szerint idén hasonló folyamat zajlik. A helyszíni fotókat a Heol.hu készítette augusztus elején.", "Az országos helyzetről a cikk azt írja, hogy Gajdos László, az élő környezetért felelős miniszter július végén rendkívüli készültséget rendelt el, a Vízügyi Igazgatóság pedig az ország 74 százalékán rendkívüli védekezési fokozatban dolgozik."], "cav": "Név szerint idézett szakértő nincs a cikkben, a tó jövőjéről szóló „szakmai vélemények” forrása nincs megnevezve. A bevezető „félig kiszáradt” tóról ír, a szöveg kiszáradás szélére és „alig maradt vízre” utal, pontos vízszintet nem közöl.", "op": "", "src": [["Index: Drasztikus a helyzet a Mátrában", "https://index.hu/belfold/2026/08/12/sasto-kiszaradas-matra-aszaly-vizszint/"]], "img": "https://kep.cdn.index.hu/1/0/7095/70956/709561/70956147_5233325_003b9fe02a5b448a9aa940aed1cc686b_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/08/12/sasto-kiszaradas-matra-aszaly-vizszint/"}, {"id": "m-szfv-tuz", "r": "Megyei", "m": "Fejér", "c": "Tűz", "w": "", "st": "Megerősített", "time": "aug. 5.", "t": "Tarlótűz Székesfehérvár határában: 61 embert telepítettek ki, 150 hektár égett", "s": "A szóvivő szerint 70 tűzoltó dolgozott a helyszínen, három hétvégi ház leégett.", "p": ["A HVG beszámolója szerint augusztus 5-én a nagy szél miatt gyorsan terjedő tarlótűz keletkezett Székesfehérvár nyugati határában, amely a közeli hétvégi házas övezetet is érintette. A Fejér Vármegyei Katasztrófavédelmi Igazgatóság helyettes szóvivője szerint negyven ingatlanból 61 embert telepítettek ki, a közeli művelődési házban kaphattak segítséget. A helyszínen mintegy 70 tűzoltó dolgozott, a legfrissebb adat szerint 150 hektáron égett a tűz.", "A Kőrösi utca 35. alól 50, az Izabella utcából 11 embert menekítettek ki a rendőrök. Az Izabella utcában három hétvégi ház leégett, egy személyautó kigyulladt, szalmabálák és melléképületek is lángra kaptak. Drónok figyelték a terjedést. A vizet a városgondnokság, a honvédség, a Videoton Holding Zrt. és mezőgazdasági tartálykocsik szállították, a hivatásos tűzoltók mellett önkéntesek, a FER létesítményi tűzoltói és a Fejér Medic egyesület is dolgoztak.", "Cser-Palkovics András polgármester Facebook-bejegyzése szerint a tüzet sikerült körülhatárolni és a helyzet stabil; öt beavatkozási helyszínből négyen utómunkák zajlottak, egy helyen még nyílt láng égett."], "cav": "A szóvivő gyors terjedésről, a polgármester stabil helyzetről beszélt – ez valószínűleg eltérő időpontú tájékoztatásokat tükröz. A bevezető „több” leégett házat említ, a konkrét adat három hétvégi ház.", "op": "", "src": [["HVG: Már 61 embert telepítettek ki a székesfehérvári tűz miatt", "https://hvg.hu/itthon/20260805_szekesfehervar-tuz-kitelepites"]], "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/1bf1d407-93d9-41a5-9b7e-dce37fd6fbf7.jpg", "imgs": "HVG", "imgl": "https://hvg.hu/itthon/20260805_szekesfehervar-tuz-kitelepites"}, {"id": "m-hajmasker", "r": "Megyei", "m": "Veszprém", "c": "Tűz", "w": "", "st": "Megerősített", "time": "aug. 12.", "t": "Avartűz a vasút mellett: lezárták a 8-as főutat, a vonatok csak Székesfehérvárig és Veszprémig jártak", "s": "A tűz Hajmáskér és Öskü között égett, négy város tűzoltói oltották.", "p": ["Az Index az MTI nyomán közölte, hogy augusztus 12-én a Veszprém Vármegyei Katasztrófavédelmi Igazgatóság szerint avartűz égett a vasúti sínek mentén Hajmáskér és Öskü között, nehezen megközelíthető, bozóttal és aljnövényzettel borított terepen. A tüzet a veszprémi, a pápai, a siófoki és a pannonhalmai tűzoltók oltották.", "A rendőrség tájékoztatása szerint Hajmáskér és Pétfürdő között lezárták a 8-as főutat, a kerülő útvonal Királyszentistván, Vilonya és Berhida felé vezetett. A Mávinform közlése szerint Budapestről Veszprém, Szombathely és Zalaegerszeg felé a vonatok csak Székesfehérvárig közlekedtek, az ellenkező irányból csak Veszprémig. Székesfehérvár és Veszprém között pótlóbuszok jártak, ezek egy–másfél óra alatt tették meg a távot, és nem érintették Ösküt és Hajmáskért."], "cav": "A cikk egy helyen azt írja, nem járnak a vonatok a veszprémi fővonalon, a részletek viszont részleges forgalmat írnak le. A helyszínt a cím „Hajmáskérnél”, a szöveg „Hajmáskér és Öskü között” jelöli; a metaleírás bozóttüzet, a cím és a szöveg avartüzet említ.", "op": "", "src": [["Index: Avartűz tombol Hajmáskérnél, áll a vasút és a 8-as főút", "https://index.hu/belfold/2026/08/12/avartuz-8-as-fout-lezaras-veszprem/"]], "img": "https://kep.cdn.index.hu/1/0/6314/63146/631463/63146397_4669637_6900345027921c9cdcfd1aa1ed43fb80_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/08/12/avartuz-8-as-fout-lezaras-veszprem/"}, {"id": "m-catl-nikkel", "r": "Megyei", "m": "Hajdú-Bihar", "c": "Ipar, környezet", "w": "", "st": "Jelentett", "time": "aug. 26.", "t": "Leállították a debreceni CATL három üzemét: kilenc dolgozónál találtak megemelkedett nikkelszintet", "s": "A minisztérium szerint a cég nem biztosított megfelelő védőeszközöket, a munkavégzést a hiányosságok megszüntetéséig megtiltották.", "p": ["Az Index szerint a hatóság felfüggesztette a munkavégzést a debreceni CATL akkumulátorgyár három üzemében, miután kilenc dolgozó szervezetében emelkedett nikkelszintet mutattak ki; az esetet a cég jelezte. A nehézfémet a vállalat biológiai expozíciós monitoringvizsgálata azonosította (a Debreciner értesülése szerint). A minisztérium szerint a munkavédelmi ellenőrzésen kiderült, hogy a cég nem biztosított megfelelően védőeszközöket, ezért a hiányosságok megszüntetéséig megtiltották a munkavégzést.", "A Mikepércsi Anyák a Környezetért Egyesület (MIAKÖ) hozta először nyilvánosságra az ügyet; szerintük a terhelést egy még nem működő cellagyárban történt „katódporkiömlés” okozhatta, a nikkel- és kobaltterhelés pedig elérte a határérték négyszeresét. Tompa Enikő, a Tisza országgyűlési képviselője szerint bírságeljárás folyik. A debreceni polgármesteri hivatal közölte, hogy a sajtóból értesült az esetről, és nincs hatásköre. Tárkányi Zsolt államtitkár augusztus 24-én azt jelentette be, hogy a kormányhivatal hulladékgazdálkodási szabálytalanságok miatt 10 millió forint bírságot szabott ki a CATL-re."], "cav": "A „katódporkiömlés” mint ok a MIAKÖ állítása, hivatalosan nem megerősített. A 10 milliós bírság hulladékgazdálkodási ügyhöz kötődik, nem a nikkelterheléshez. A minisztérium első közleménye szerint a cellagyártó üzem használatbavételi kérelmét elutasították, később pontosítottak: az első ütemre engedélyt adtak, a másodikat a hibás vázrajz miatt utasították el.", "op": "A legtöbb, ami ebből a cikkből biztosan kiderül: a dolgozók védelme itt nem a kötelező minimum szintjén működött, és a hatóság most lépett. Hogy a kiömlés-állítás igaz-e, a vizsgálat dönti el, addig nem érdemes se elfogadni, se elvetni.", "src": [["Index: Leállították a debreceni CATL három üzemét, kilenc dolgozónál fokozott nikkelterhelést mutattak ki", "https://index.hu/belfold/2026/08/26/debreceni-catl-akkumulatorgyar-vizsgalat-nikkelmergezes-kobalt-dolgozok-munka-felfuggesztes/"]], "img": "https://kep.cdn.index.hu/1/0/7123/71239/712395/71239517_5253477_0fabef511e752f5b6482537277c04625_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/08/26/debreceni-catl-akkumulatorgyar-vizsgalat-nikkelmergezes-kobalt-dolgozok-munka-felfuggesztes/"}, {"id": "m-szeged-alpinista", "r": "Megyei", "m": "Csongrád-Csanád", "c": "Baleset", "w": "", "st": "Megerősített", "time": "szept. 1.", "t": "Lezuhant a szegedi kormányhivatal tetejéről egy ipari alpinista, meghalt", "s": "A rendőrség szerint tisztázatlan, miért zuhant le a férfi; munkabalesetet vizsgálnak.", "p": ["Az Index szerint szeptember 1-jén, délben egy ipari alpinista lezuhant a Csongrád-Csanád Vármegyei Kormányhivatal szegedi, Rákóczi téri főépületének tetejéről. Az épület melletti étterem tetejére esett, és ott meghalt. Az Index a Telex értesülésére hivatkozva azt írja, hogy a férfi legalább 15 métert zuhant, és fejsérülés okozhatta a halálát. A helyszíni felvételeken az épületről lelógó kötelek látszottak.", "A rendőrség a foglalkoztatás körében elkövetett veszélyeztetés vétsége miatt indított nyomozást, szakértőket vont be, és közölte, hogy a férfi „tisztázatlan okból” zuhant le. A kormányhivatal közleménye szerint az üvegfelületek tisztításával megbízott vállalkozó egyik munkavállalója szenvedett halálos munkabalesetet; a vizsgálatot a hivatal munkavédelmi főosztálya végzi, részleteket annak lezárása után ígérnek."], "cav": "A 15 méteres esésmagasság csak „hír szerint” szerepel, hivatalos megerősítés nincs. A baleset okát sem a rendőrség, sem a kormányhivatal nem közölte, a vállalkozó nevét a cikk nem nevezi meg.", "op": "", "src": [["Index: Lezuhant a szegedi kormányhivatal tetejéről, meghalt egy ipari alpinista", "https://index.hu/belfold/2026/09/01/baleset-ipari-alpinista-halaleset-szeged-meghalt/"]], "img": "https://kep.cdn.index.hu/1/0/7136/71364/713645/71364587_5262463_e21a8d9ddf463727f368e73394
