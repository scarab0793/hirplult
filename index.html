<style>
/* Layout: wire-service terminal. Left rail of sections with counts, main column is a day-grouped stream: mono timestamp gutter + headline + summary. Focus threads as two cards above the stream. */
:root{--bg:#f6f7f9;--panel:#ffffff;--ink:#12151c;--muted:#5d6472;--line:#dfe2e8;--accent:#1f4fe0;--accent-ink:#ffffff;--ok:#1d7a4a;--warn:#a15c00;
--c-bel:#1f4fe0;--c-gaz:#0e7c7b;--c-kul:#a8326d;--c-kozel:#7a5a00;--c-sport:#2f7d2f;--c-kult:#7b3fc4;--soft:#eef1f7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1117;--panel:#161a22;--ink:#e8ebf1;--muted:#9aa3b2;--line:#272d38;--accent:#7ea2ff;--accent-ink:#0e1117;--ok:#5fcf98;--warn:#e6b55a;
--c-bel:#7ea2ff;--c-gaz:#4fd1cf;--c-kul:#ff8cc0;--c-kozel:#e6c15a;--c-sport:#7fd67f;--c-kult:#bf97ff;--soft:#1c212b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1117;--panel:#161a22;--ink:#e8ebf1;--muted:#9aa3b2;--line:#272d38;--accent:#7ea2ff;--accent-ink:#0e1117;--ok:#5fcf98;--warn:#e6b55a;
--c-bel:#7ea2ff;--c-gaz:#4fd1cf;--c-kul:#ff8cc0;--c-kozel:#e6c15a;--c-sport:#7fd67f;--c-kult:#bf97ff;--soft:#1c212b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Literata",Georgia,serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:1180px;margin:0 auto}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 0 16px;border-bottom:1px solid var(--line)}
.logo{font:800 30px/1 "Archivo",Arial,sans-serif;letter-spacing:-.02em;margin:0}
.tagline{display:inline-block;margin-left:14px;font:500 13px/1 "JetBrains Mono",monospace;letter-spacing:0;color:var(--muted);vertical-align:middle}
.logo a{color:inherit;text-decoration:none}.logo i{font-style:normal;color:var(--accent)}
.live{font:500 12px/1.3 "JetBrains Mono",monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.note{margin:14px 0 0;font-size:14px;color:var(--muted);max-width:75ch}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:36px;padding-top:22px;padding-bottom:48px}
.rail{position:sticky;top:12px;align-self:start;display:flex;flex-direction:column;gap:2px}
.rail h2{font:500 11px/1 "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 8px}
.sec{display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;border-left:3px solid transparent;padding:8px 10px;text-align:left;cursor:pointer;font:600 15px/1.2 "Archivo",sans-serif;border-radius:0 6px 6px 0}
.sec .n{font:400 12px "JetBrains Mono",monospace;color:var(--muted)}
.sec:hover{background:var(--soft)}
.sec[aria-pressed="true"]{background:var(--soft);border-left-color:var(--accent)}
.main{min-width:0}
.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font:400 15px "Archivo",sans-serif;margin-bottom:16px}
.threads{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:8px}
.thread{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer}
.thread[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.thread b{display:block;font:500 11px/1 "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:6px}
.thread span{display:block;font:700 15px/1.25 "Archivo",sans-serif}
.thread small{display:block;color:var(--muted);font:400 12px "JetBrains Mono",monospace;margin-top:6px}
.day{position:sticky;top:0;background:var(--bg);z-index:2;font:500 12px/1 "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:22px 0 10px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:128px minmax(0,1fr);gap:20px;padding:20px 0;border-bottom:1px solid var(--line)}
.gut{font:400 12px/1.5 "JetBrains Mono",monospace;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;font:500 11px/1.2 "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--tc)}
.tag::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--tc)}
[data-r="Belpolitika"]{--tc:var(--c-bel)}[data-r="Gazdaság"]{--tc:var(--c-gaz)}[data-r="Külföld"]{--tc:var(--c-kul)}[data-r="Közélet"]{--tc:var(--c-kozel)}[data-r="Sport"]{--tc:var(--c-sport)}[data-r="Kultúra"]{--tc:var(--c-kult)}
.sub{display:block;margin-top:6px}
.st{display:block;margin-top:6px;font-weight:500}.st.c{color:var(--ok)}.st.u{color:var(--warn)}
.row h3{font:700 22px/1.2 "Archivo",sans-serif;margin:0 0 6px;text-wrap:balance;letter-spacing:-.01em}
.row.lead h3{font-size:clamp(28px,4vw,38px);font-weight:800;line-height:1.1}
.row p{margin:0 0 8px;color:var(--ink)}
.row a.t{color:inherit;text-decoration:none}.row a.t:hover{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.more{font:600 14px "Archivo",sans-serif;color:var(--accent);text-decoration:none}
.empty{padding:40px 0;color:var(--muted)}
.full{max-width:700px;margin:0 auto;padding:28px 0 20px}
.back{background:none;border:0;padding:0;margin-bottom:18px;color:var(--accent);font:600 15px "Archivo",sans-serif;cursor:pointer}
.full .tag{margin-right:10px}.full .mm{font:400 12px "JetBrains Mono",monospace;color:var(--muted)}
.full h2{font:800 clamp(32px,6vw,48px)/1.08 "Archivo",sans-serif;letter-spacing:-.02em;margin:12px 0 14px;text-wrap:balance}
.full .lede{font-size:20px;line-height:1.5;font-weight:600;margin:0 0 20px}
.full p{margin:0 0 16px}
.th{float:right;width:132px;height:88px;object-fit:cover;border-radius:6px;margin:2px 0 8px 16px;background:var(--soft)}
@media(max-width:560px){.th{width:92px;height:68px;margin-left:12px}}
.row>div:last-child{display:flow-root}
.ph{margin:18px 0 22px}.ph img{display:block;width:100%;max-height:420px;object-fit:cover;border-radius:8px;background:var(--soft)}.ph figcaption{font-size:12px;color:var(--muted);margin-top:6px}.ph figcaption a{color:inherit}
.cav{background:var(--soft);border-radius:8px;padding:12px 16px;margin:22px 0;font-size:15px}
.op{background:transparent;border-left:3px solid var(--accent);border-radius:0}
.op b{color:var(--accent)!important}
.cav b{display:block;font:500 11px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--warn);margin-bottom:4px}
.srcs{border-top:1px solid var(--line);padding-top:14px;margin-top:22px;font-size:15px}
.srcs b{font:500 11px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.srcs ul{margin:8px 0 0;padding-left:18px}.srcs a{color:var(--accent)}
footer{padding:0 0 40px;color:var(--muted);font-size:14px}
@media(max-width:860px){
 .shell{grid-template-columns:1fr;gap:16px}
 .rail{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
 .rail h2{display:none}
 .sec{border:1px solid var(--line);border-radius:99px;white-space:nowrap;padding:6px 12px}
 .sec[aria-pressed="true"]{border-color:var(--accent)}
 .row{grid-template-columns:1fr;gap:6px}
 .gut{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}.sub,.st{margin-top:0}
}

.views{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px}
.vt{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:7px 16px;cursor:pointer;font:600 14px "Archivo",sans-serif}
.vt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wxh{font:800 26px/1.2 "Archivo",sans-serif;margin:22px 0 6px}
.wxn{font-size:14px;color:var(--muted);margin:0 0 16px;max-width:75ch}
.wxg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding-bottom:40px}
.wxc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.wxc b{font:700 16px "Archivo",sans-serif}
.wxc .wt{font:800 36px/1.1 "Archivo",sans-serif}
.wxc small{color:var(--muted);font:400 12px/1.4 "JetBrains Mono",monospace}

/* Three-column responsive news cards */
#list .news-credit{order:2;display:block;padding:5px 14px 0;font:11px/1.35 Arial,sans-serif;color:var(--muted)}
#list .news-credit a{color:inherit;text-decoration:underline}
#list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}
#list>.day,#list>.empty{grid-column:1/-1}
#list>.day{margin:14px 0 0}
#list>.row{display:flex;flex-direction:column;min-width:0;padding:0 0 15px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;gap:0}
#list>.row .gut{order:2;padding:11px 14px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#list>.row .gut .sub,#list>.row .gut .st{margin:0}
#list>.row>div:last-child{display:contents}
#list>.row .news-image{order:1;width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--soft)}
#list>.row h3{order:3;font-size:18px;line-height:1.3;padding:9px 14px 0;margin:0}
#list>.row.lead h3{font-size:18px}
#list>.row p{order:4;font-size:14px;line-height:1.55;margin:8px 14px 12px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
#list>.row .more{order:5;margin:auto 14px 0;font-size:13px}
@media(max-width:950px){#list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:590px){#list{grid-template-columns:minmax(0,1fr)}}
</style>

<script>
const EDITORIAL_SOURCES=[{name:"24.hu",url:"https://24.hu/",sections:["Belpolitika","Gazdaság","Külföld","Közélet","Kultúra","Sport"],status:"engedélyezett forrás; automatikus import még nincs"}];
const cats=["Mind","Belpolitika","Gazdaság","Külföld","Közélet","Sport","Kultúra"];
const items=[{"w": "", "st": "Megerősített", "time": "okt. 30.", "cav": "A Portfolio cikke szerint a fogyasztás lassulásában szerepet játszhat a választás előtti költekezés elhalása; ezt a cikk feltevésként közli, nem mért adatként. Az ágazatonkénti pontos KSH-számokat a forrásaink nem közölték.", "img": "https://assets.4cdn.hu/kraken/8JF7nwH6uDJumOWGs-lg.jpeg", "imgs": "444", "imgl": "https://444.hu/2026/10/30/komoly-csalodast-okozott-elemzok-a-friss-gdp-adatrol", "cred": "Fotó: Kristóf Balázs / 444", "id": "gdp-3-negyedev-csalodas", "r": "Gazdaság", "c": "Makrogazdaság", "t": "Alig mozdult a magyar gazdaság: negyedéves alapon 0,1 százalék a GDP, az elemzők csalódtak", "s": "A KSH szerint a GDP a harmadik negyedévben éves alapon 1,5, negyedéves alapon 0,1 százalékkal nőtt, mindkettő elmarad a várakozástól. Az elemzők főleg az aszály sújtotta mezőgazdaságot okolják.", "p": ["A KSH gyorstájékoztatója szerint a magyar GDP a harmadik negyedévben 1,5 százalékkal nőtt egy évvel korábbihoz képest, az előző negyedévhez viszonyítva viszont csak 0,1 százalékkal. A Portfolio által megkérdezett elemzők átlagosan 1,7 százalékos éves és 0,3 százalékos negyedéves bővülést vártak. A növekedést az ipar húzta, a szolgáltatások is támogatták, a mezőgazdaságot viszont a nyári aszály jelentősen visszavetette.", "Virovácz Péter, az ING vezető elemzője komoly csalódásnak nevezte az adatot, az ING mégis megtartotta az idei 1,9 százalékos előrejelzését, ami a negyedik negyedévben erős gyorsulást igényel. Németh Dávid (K&H) 1,7 százalékos idei növekedést vár, a jövő évi előrejelzését pedig 2,4-ről 2,2 százalékra csökkentette. Nyeste Orsolya (Erste) szerint az aszály miatti agrárvisszaesés komoly hatással lehetett, a negyedik negyedévben az év végi uniós források gyorsíthatnak, de a globális kockázatok miatt óvatos."], "op": "Az új kormány első GDP-adata nem jó hír, de nem is katasztrófa: a lassulás jó része az aszályra írható, amiért senki sem tehet. Ettől még nehéz lesz úgy költségvetést tartani, hogy a növekedés a terv alatt marad. A kormánynak minél előbb meg kellene mutatnia, mitől gyorsulhat a gazdaság, nem csak azt, miből spórol.", "src": [["444: „Komoly csalódást okozott” – elemzők a friss GDP-adatról", "https://444.hu/2026/10/30/komoly-csalodast-okozott-elemzok-a-friss-gdp-adatrol"], ["Portfolio: Itt a friss adat: kiszáradt a magyar gazdaság idén nyáron!", "https://www.portfolio.hu/gazdasag/20261030/itt-a-friss-adat-kiszaradt-a-magyar-gazdasag-iden-nyaron-873008"], ["Portfolio: Tisza-kormány: megjött az új kormány első GDP-adata", "https://www.portfolio.hu/gazdasag/20261030/tisza-kormany-megjott-az-uj-kormany-elso-gdp-adata-de-valoszinuleg-nem-orulnek-neki-873016"]]}, {"w": "", "st": "Megerősített", "time": "okt. 30.", "cav": "A Portfolio cikke Magyarország korábbi helyezéseiről ellentmondó adatokat közöl, ezért ezeket nem használtuk. A rangsor ~15 ország előzetes adatán alapul, az Eurostat szerint módosulhat.", "img": "https://pcdn.hu/articles/images-xl/e/u/r/europa-terkep-ejjel-europa-fold-ur-muhold-urkutatas-kornyezetvedelem-klimavaltozas-fe-803336.jpg", "imgs": "Portfolio", "imgl": "https://www.portfolio.hu/gazdasag/20261030/itt-a-friss-europai-gdp-rangsor-magyarorszag-lejjebb-csuszott-873110", "cred": "Illusztráció: Getty Images", "id": "eurostat-gdp-rangsor-francia-zsugorodas", "r": "Gazdaság", "c": "Európa", "t": "Magyarország a 10., illetve 12. az EU-s GDP-rangsorban, Franciaország gazdasága közben zsugorodott", "s": "Az Eurostat előzetes adatai szerint az eurózóna negyedéves növekedése 0,4 százalék volt, Franciaországé mínusz 0,1. Magyarország éves alapon a 10., negyedéves alapon a 12. helyen áll az előzetes rangsorban.", "p": ["Az Eurostat előzetes harmadik negyedéves adatai szerint az eurózóna gazdasága negyedéves alapon 0,4 százalékkal nőtt, az elemzők 0,2 százalékot vártak, az éves növekedés 1,3 százalékra gyorsult. Az EU egészében a negyedéves bővülés 0,5, az éves 1,5 százalék. Németország éves növekedése 1,2 százalék, ez 2022 óta a legjobb adata, Spanyolországé 2,7 százalék, Olaszország gazdasága negyedéves alapon nem nőtt.", "Franciaország GDP-je a Bloomberg és a Portfolio szerint 0,1 százalékkal csökkent, a beruházások visszaesése és az export 1,7 százalékos zuhanása miatt. A fogyasztói bizalom 13 éves mélyponton van, a kormány 0,5 százalékra mérsékelte az éves növekedési előrejelzését.", "Magyarország az előzetes rangsorban éves alapon 10. 1,5 százalékkal (ez megegyezik az uniós átlaggal), negyedéves alapon 12. A Portfolio hangsúlyozza, hogy a teljes, 27 országos rangsorban a magyar helyezés várhatóan rosszabb lesz."], "op": "Kellemetlen, de tanulságos összehasonlítás: miközben a hazai gazdaság alig mozdul, Európa nagy része meglepően jól tartja magát. Az EU-átlag szinten maradni nem szégyen, de aki felzárkózást ígér, annak többre van szüksége ennél. A francia példa pedig arra jó, hogy ne legyünk elégedettek, mert van, akinél rosszabb.", "src": [["Portfolio: Itt a friss európai GDP-rangsor – Magyarország lejjebb csúszott", "https://www.portfolio.hu/gazdasag/20261030/itt-a-friss-europai-gdp-rangsor-magyarorszag-lejjebb-csuszott-873110"], ["Portfolio: Kellemetlen meglepetés: zsugorodott a francia gazdaság", "https://www.portfolio.hu/gazdasag/20261030/kellemetlen-meglepetes-zsugorodott-a-francia-gazdasag-873004"]]}, {"w": "", "st": "Megerősített", "time": "okt. 30.", "cav": "Az ítélet nem jogerős, a bűnügyi felügyelet elleni fellebbezésről még nem született döntés. A forrásaink a vádlottak és az ügyészség álláspontját az Index és a Telex hivatkozása alapján közlik.", "img": "https://kep.cdn.index.hu/1/0/7231/72317/723179/72317953_5329555_ce15d511c934520b6d58c013fe1acfcb_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/10/30/boldog-istvan-fidesz-kepviselo-korrupcio-bortonbuntetes-nyomkoveto-havasi-bertalan/", "cred": "Boldog István, 2026. október 30. Fotó: Balogh Zoltán / MTI", "id": "boldog-istvan-nyomkovetes-bunugyi-felugyelet", "r": "Belpolitika", "c": "Igazságszolgáltatás", "t": "Öt év börtön járna Boldog Istvánnak, de egyelőre nyomkövetővel marad szabadlábon", "s": "A Fővárosi Törvényszék nem jogerősen öt év letöltendő börtönre ítélte a volt fideszes képviselőt vesztegetésért. Az ügyészség letartóztatást kért, a bíróság bűnügyi felügyeletet rendelt el nyomkövetővel.", "p": ["A Fővárosi Törvényszék nem jogerősen öt év letöltendő szabadságvesztésre ítélte Boldog István volt fideszes országgyűlési képviselőt pályázatokkal kapcsolatos vesztegetési ügyben, öt évre eltiltotta a közügyektől, és 6,6 millió forint vagyonelkobzást rendelt el. Az ügyészség Boldog és közvetlen munkatársa, Fehér Petra letartóztatását indítványozta szökésveszélyre hivatkozva, a bíróság viszont bűnügyi felügyeletet rendelt el a másodfokú eljárás végéig.", "Boldog István Kétpót, Fehér Petra Mákot csak külön engedéllyel hagyhatja el, tartózkodásukat nyomkövetővel ellenőrzik. Mindketten fellebbeztek a kényszerintézkedés ellen. Az ügyészség súlyosítást kér, a vádlottak közül Boldog felmentést vagy enyhítést, Fehér teljes felmentést kér, ezért az ítélet nem jogerős.", "A Fidesz szerint Boldog István nem politikai fogoly, és az eljárás még a párt kormányzása alatt indult. Ugyanakkor a párt Hankó Balázs, Varga-Bajusz Veronika, Seszták Miklós és Bús Balázs ügyében politikai foglyokról beszél."], "op": "Az a legérdekesebb ebben, hogy az eljárás még a Fidesz-kormány idején indult, és mégis „politikai üldözésnek” hívják, ha egykori saját embereikről van szó. Elvi szinten a tisztességes eljárás mindenkit megillet, de az ítéletig vagy a jogerőig az „áldozatpózt” nem helyettesíti az érveket. A bíróság döntése a nyomkövetőről arányosnak tűnik.", "src": [["Index: Elrendelték a bűnügyi felügyeletet, nyomkövetőt kap Boldog István", "https://index.hu/belfold/2026/10/30/boldog-istvan-fidesz-kepviselo-korrupcio-bortonbuntetes-nyomkoveto-havasi-bertalan/"]]}, {"w": "", "st": "Megerősített", "time": "okt. 30.", "cav": "A letartóztatott nevét a hatóság nem közölte. A 12,6 milliárdos összeg a 444 összesítése, nem hatósági közlés, és a gyanúsítás nem bizonyított bűnösséget jelent.", "img": "https://assets.4cdn.hu/kraken/89v6g7BXUwQCchPos-lg.jpeg", "imgs": "444", "imgl": "https://444.hu/2026/10/30/ujabb-letartoztatas-tortent-a-sesztak-ugyben", "cred": "Seszták Miklós, 2025. február. Fotó: Németh Dániel / 444", "id": "sesztak-penzfuto-letartoztatas", "r": "Belpolitika", "c": "Korrupció", "t": "Letartóztatták Seszták Miklós állítólagos pénzfutárát is", "s": "A bíróság harminc napra letartóztatta a volt miniszter bizalmasát, akit az NVVH azzal gyanúsít, hogy korrupciós pénzeket vett át és szállított.", "p": ["A Budai Központi Kerületi Bíróság nyomozási bírója letartóztatta Seszták Miklós KDNP-s képviselő, volt nemzeti fejlesztési miniszter bizalmasát. A Nemzeti Vagyonvisszaszerzési és Vagyonvédelmi Hivatal (NVVH) közleménye szerint a gyanú szerint pénzfutárként vett át és szállított korrupciós pénzeket. A bíróság harminc napra rendelte el a letartóztatást a szökés, elrejtőzés és a bizonyítás veszélyeztetésének különös indoka miatt, a férfi nevét nem közölték.", "A gyanú szerint bűnsegédként vett részt hivatali vesztegetés elfogadásában. Seszták Miklóst szeptember 28-án vették őrizetbe, a letartóztatását október 28-án három hónapra, január 30-ig meghosszabbították. A 444 összesítése szerint 12,6 milliárd forint kenőpénz zsebre rakásával gyanúsítják."], "op": "Egy pénzfutár letartóztatása azért érdekes, mert a korrupciós ügyek legtöbbször a futárokon és bizalmasokon múlnak, nem a nagy nevek aláírásán. Fontos, hogy a nyomozás ne álljon meg a láncolat közepén. A vélelem azonban addig is áll: gyanú, nem ítélet.", "src": [["444: Letartóztatták Seszták Miklós pénzfutárát", "https://444.hu/2026/10/30/ujabb-letartoztatas-tortent-a-sesztak-ugyben"]]}, {"w": "", "st": "Megerősített", "time": "okt. 30.", "cav": "A menekültügyi bírság eltörléséről a KT szerint még nem született döntés, ezért a 135 milliárdos megtakarítás bizonytalan.", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/c4d2ed85-ec15-4c74-831c-4219a71d4d30.jpg", "imgs": "HVG", "imgl": "https://hvg.hu/gazdasag/20261030_koltsegvetes-2027-tanacs-tervek-budzse", "cred": "", "id": "koltsegvetesi-tanacs-2027-velemeny", "r": "Gazdaság", "c": "Költségvetés", "t": "A Költségvetési Tanács nem kifogásolja a 2027-es büdzsét, de szigort és szerencsét emleget", "s": "A testület szerint a 4,9 százalékos hiánycél megalapozott, de csak szigorú végrehajtással tartható, és több bevételi és kiadási tétel kockázatos.", "p": ["A Költségvetési Tanács (KT) 45 oldalas véleménye szerint a 2027-es költségvetési tervezetnek nincsenek alapvető kifogásai. A 4,9 százalékos hiánycélt „összességében megalapozottnak” tartja, de szigorú végrehajtási kontrollt kér: a minisztériumok és intézmények működési kiadásait 10, a felhalmozási kiadásait 20 százalékkal kellene csökkenteni. A GDP-növekedési előrejelzést (2026-ra 1,7, 2027-re 2,4 százalék) reális kiindulópontnak nevezte, de a világgazdasági környezet romlása miatt nagyobb a lemaradás kockázata.", "Kockázatosnak ítélte többek között az autópálya-koncessziós díjak tervezett csökkentését (a gyorsforgalmi utak rendelkezésre állási díja 171 milliárd forint lenne, 215 milliárddal kevesebb az ideinél), a menekültügyi bírság elmaradására számító 135 milliárdos megtakarítást, a kiskereskedelmi különadó bírósági kockázatát, a vagyonadó kiszabásának tapasztalathiányát és a babaváró 212 milliárdos előirányzatát. A KT-nak az új szabályok szerint már nincs vétójoga a költségvetés felett.", "A testület üdvözölte, hogy a költségvetést ősszel nyújtják be és az év vége előtt fogadják el."], "op": "Mérsékelten jó hír, hogy a Költségvetési Tanács nem söpri le az asztalról a tervezetet, miközben a hiányzó pontokat nevén nevezi. A legnagyobb kérdés az, hogy a 10 és 20 százalékos kiadáscsökkentés tényleg megvalósul-e, vagy csak a papíron szép. A szigor csak akkor hiteles, ha nem a legkiszolgáltatottabbakon csattan.", "src": [["HVG: Szigorra és szerencsére is szükség lesz a 2027-es költségvetés számainak tartásához", "https://hvg.hu/gazdasag/20261030_koltsegvetes-2027-tanacs-tervek-budzse"]]}, {"w": "", "st": "Megerősített", "time": "okt. 30.", "cav": "A cikk a viták egy részét az ülés közben, szemelvényesen idézi; a szavazás végeredményét a Telex cikke még nem tartalmazta.", "img": "https://assets.telex.hu/images/20261029/1793312128-temp-fjai18jv174p0cdejpf_facebook.jpg", "imgs": "Telex", "imgl": "https://telex.hu/belfold/2026/10/30/fovarosi-kozgyules-oktober-30-karacsony-gergely-regionalis-bkk-parkolas", "cred": "", "id": "fovarosi-kozgyules-regionalis-bkk-parkolas", "r": "Közélet", "c": "Főváros", "t": "Fideszes támadás és kerületi felháborodás a Fővárosi Közgyűlésen: regionális BKK és központosított parkolás", "s": "Karácsony Gergely szerint történelmi jelentőségű a regionális BKK, amelyben az állam 50 százalékos tulajdonos lenne. A fideszes képviselők a költségeket, a kerületek polgármesterei a parkolás központosítását kifogásolták.", "p": ["A Fővárosi Közgyűlés pénteki ülésén Karácsony Gergely előterjesztette a BKK regionális közlekedésszervezővé alakítását. Az októberi főváros–kormány megállapodás szerint a tőkeemelés után az állam 50 százalékos tulajdonos lenne, a cég finanszírozását közösen állnák. Karácsony szerint a megállapodás 70 milliárd forint többletet jelent a fővárosnak, a 2027-es költségvetés viszont még messze van a kielégítőtől. Papp Tibor (Fidesz) szerint a költségek nem tiszták, Kiss Ambrus főigazgató szerint tőkeemelésről, nem eladásról van szó.", "A megállapodás szerint a parkolás központosított lenne: a bevételt a főváros szedné a kerületek helyett, és kizárólag útfelújításra fordítaná. Több polgármester felháborodott, mert szerintük Karácsony a hátuk mögött döntött. Baranyi Krisztina, Ferencváros polgármestere azt javasolta, hogy a főváros csak a saját tulajdonú parkolóhelyeket vegye kezelésbe.", "Az ülés elején Karácsony levetette a napirendről a Fidesz előterjesztését az FKT-ülések előkészítéséről. A vita során azt mondta Lehoczki Ádám fideszes képviselőnek: „nyerje meg a főpolgármester-választást”. A következő FKT-ülés november 12-én lesz."], "op": "Karácsonynak abban igaza lehet, hogy a regionális közlekedésszervezés régi, jogos cél. A tárgyalásmód viszont, amelyben a kerületek a sajtóból értesülnek a parkolás átvételéről, rossz előjel. Aki közös rendszert akar, annak a polgármesterekkel is közösen kell kialkudnia a részleteket, nem utólag tájékoztatnia őket.", "src": [["Telex: Karácsony: Képviselő úr, nyerje meg a főpolgármester-választást, és bármikor hozzászólhat!", "https://telex.hu/belfold/2026/10/30/fovarosi-kozgyules-oktober-30-karacsony-gergely-regionalis-bkk-parkolas"], ["Index: A Fővárosi Közgyűlés ülése – Percről percre", "https://index.hu/belfold/2026/10/30/fovaros-budapest-fovarosi-kozgyules-fovarosi-kozfejlesztesek-tanacsa-bkk-parkolas-keruletek-karacsony-gergely/"]]}, {"w": "", "st": "Megerősített", "time": "okt. 30.", "cav": "A kérdőív nem reprezentatív felmérés, a 72 százalék a kitöltők aránya. A 214 km/h-s átlag a miniszter tesztadata, részleteit a forrás nem közli.", "img": "https://kep.cdn.index.hu/1/0/7226/72261/722614/72261441_5325625_7f22d6ad34d2cec9eefa11a5981c7bda_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/10/30/vitezy-david-gyorshajtas-auto-autopalya-atlagsebesseg-meres-magyar-kozut/", "cred": "Vitézy Dávid, 2026. október 1. Fotó: Papajcsik Péter / Index", "id": "vitezy-atlagsebesseg-meres-72-szazalek", "r": "Közélet", "c": "Közlekedés", "t": "Vitézy: a kérdőív válaszadóinak 72 százaléka támogatja az átlagsebesség-mérést", "s": "A közlekedési miniszter szerint több mint 300 ezren töltötték ki a közlekedésbiztonsági kérdőívet. Döntés még nincs, a tárca a teszt és a konzultáció alapján dolgozik a jogszabály-módosítási javaslaton.", "p": ["Vitézy Dávid közlekedési és beruházási miniszter a Facebook-oldalán számolt be arról, hogy a közlekedésbiztonsági kérdőívet több mint 300 ezren töltötték ki, a válaszadók 72 százaléka támogatja a szakaszos sebességmérés bevezetését.", "A Magyar Közút a meglévő rendszámleolvasó kamerákkal tesztelte a rendszert az M6-os autópályán, bírságot senki nem kapott. A miniszter szerint egyes autósok kilométereken át átlagosan 214 km/h-val haladtak, ezt „életveszélyes száguldásnak” nevezte.", "Az átlagsebesség-mérés bevezetéséről még nincs döntés, a minisztérium a teszt és a társadalmi konzultáció eredményei alapján készíti a törvénymódosítási javaslatot."], "op": "Aki kilométereken át 214-gyel megy, azon a szakaszos mérés valóban segítene, és a kitöltők többsége is ezt gondolja. Azt viszont nem szabad összekeverni, hogy a kérdőív jól mutatja a hangulatot, a szabályozásnak pedig adatvédelmi és jogi tisztaságra is szüksége van. A kamerák adatkezelését érdemes előre rendezni.", "src": [["Index: Vitézy Dávid: A válaszadók 72 százaléka támogatja az átlagsebesség-mérés bevezetését", "https://index.hu/belfold/2026/10/30/vitezy-david-gyorshajtas-auto-autopalya-atlagsebesseg-meres-magyar-kozut/"]]}, {"w": "", "st": "Megerősített", "time": "okt. 30.", "cav": "A HVG szerint az export szenvedhette meg a kiesést, a pontos hatásról nincs adat. A közlemény a Mol saját közlésén alapul.", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/c43f3a90-db58-4a47-8f5b-8e6858b93d4d.jpg", "imgs": "HVG", "imgl": "https://hvg.hu/kkv/20261030_dunai-olajfinomito-helyreallitas-av-3-teljes-kapacitas-termeles-szazhalombatta", "cred": "Fotó: MOL", "id": "dunai-finomito-av3-ujraindult", "r": "Gazdaság", "c": "Energia", "t": "Egy év és 18 milliárd után újraindult a Dunai Finomító kiégett üzeme", "s": "A Mol közleménye szerint az AV-3 desztilláló egy évvel a tűzeset után ismét teljes kapacitáson termel; a javítás 18 milliárd forintba került.", "p": ["A Mol Dunai Finomítójának AV-3 desztillálóüzeme pénteken újraindult, majdnem pontosan egy évvel az után, hogy egy tűzeset miatt 2025. október 20-án le kellett állítani. A helyreállítás 18 milliárd forintba került, a munkák zömét szeptemberben fejezték be, az újraindítás fokozatos volt.", "Az üzem 3,8 millió tonnás kapacitásával a finomító desztillációs kapacitásának közel 47 százalékát adja. A munkák között szerepelt 27 új szivattyú, 8 kilométernyi csővezeték cseréje és 100 kilométernyi villamos kábel behúzása. Hernádi Zsolt, a Mol elnök-vezérigazgatója szerint rendkívüli teljesítmény, hogy a kiesés alatt is biztosították a hazai üzemanyag-ellátást."], "op": "Egy ilyen kiesés után az ellátás zavartalansága valóban teljesítmény, de ez annak is köszönhető, hogy Százhalombattán van más üzem is. Az energiabiztonság nem arról szól, hogy egy évig ügyesen kerülgetjük a hiányt. A tanulság az, hogy egyetlen finomítóra építeni kockázat.", "src": [["HVG: Vállalkozás: 18 milliárdba került a helyreállítás, de ismét teljes kapacitáson termel a Dunai Finomító", "https://hvg.hu/kkv/20261030_dunai-olajfinomito-helyreallitas-av-3-teljes-kapacitas-termeles-szazhalombatta"]]}, {"w": "", "st": "Jelentett", "time": "okt. 30.", "cav": "A szünetről szóló hír a WSJ névtelen értesülésén alapul, hivatalos megerősítést nem találtunk. A kárt és az érintett finomító szerepét orosz hivatalos és független orosz források mondják.", "img": "https://assets.4cdn.hu/kraken/8PT1FhHQEDYotVV4s-lg.jpeg", "imgs": "444", "imgl": "https://444.hu/2026/10/30/pentek-reggel-meg-megtamadtak-egy-orosz-olajfinomitot", "cred": "", "id": "novokujbisevszk-finomito-tamadas-szunet", "r": "Külföld", "c": "Ukrajna", "t": "Drón csapott egy orosz finomítóra, miközben a WSJ szerint Kijev Trump nyomására szüneteltetné a csapásokat", "s": "Pénteken reggel megtámadták a novokujbisevszki finomítót. A Wall Street Journal értesülése szerint Ukrajna a november 3-i amerikai félidős választásokig szüneteltetheti a hasonló támadásokat.", "p": ["Pénteken kora reggel drón csapott le a Szamarai terület Novokujbisevszk városának olajfinomítójára. Vjacseszlav Fedoriscsev kormányzó szerint kijevi drónok támadtak, áldozat nem volt. Az orosz védelmi minisztérium szerint az éjszaka 1043 ukrán drónt lőttek le Szamara és 18 másik régió felett. Az Astra szerint a finomító égett, ez repülőgép-üzemanyagot gyárt az orosz hadsereg számára.", "Ukrajna nem vállalta a támadást, a Fire Point hadiipari cég Telegramon trollkodó formában utalt arra, hogy ők voltak. A Wall Street Journal egy nappal korábban arról írt, hogy Kijev Donald Trump nyomására beleegyezett a finomítók elleni csapások szüneteltetésébe, nem hivatalos formában, a november 3-i amerikai választásokig."], "op": "Ha a WSJ értesülése igaz, Washington a hazai választás ritmusához igazítja az ukrán védekezést, ami cinikus. Közben a Kreml az ukrán energetikai infrastruktúrát továbbra is bombázza, tehát a szünet egyoldalú engedmény lenne. Az orosz agresszió nem ér véget attól, hogy valakinek a benzinárak számítanak.", "src": [["444: Péntek reggel még megtámadtak egy orosz olajfinomítót", "https://444.hu/2026/10/30/pentek-reggel-meg-megtamadtak-egy-orosz-olajfinomitot"]]}, {"w": "", "st": "Jelentett", "time": "okt. 30.", "cav": "Az észak-koreai szál feltevés, a 444 szerint konkrét bizonyíték nincs. A számok a Binance, a TRM Labs és a cikkben hivatkozott The Guardian és NYT beszámolóin alapulnak.", "img": "https://assets.4cdn.hu/kraken/7yURl1jtWvzxwmews-lg.jpeg", "imgs": "444", "imgl": "https://444.hu/2026/10/30/a-rezsimnek-dolgozo-eszak-koreai-hackerek-lophattak-el-a-binace-ugyfeleinek-dollarmilliardjait", "cred": "Fotó: STR / NurPhoto via AFP", "id": "binance-rekord-kriptolopas", "r": "Külföld", "c": "Technológia", "t": "Észak-koreai hackereket gyanítanak a Binance-támadás mögött, a rekord kriptolopásban 6,3 milliárd dollár tűnt el", "s": "A cég szerint 3 milliárd dollárt megtaláltak és befagyasztottak, az ügyfelek kárát megtérítik. A felelősség egyelőre nem bizonyított.", "p": ["A 444 szerint lényegében minden forrás észak-koreai hackereket gyanít a Binance rendszerébe történt betörés mögött, bizonyíték azonban még nincs. Több iparági elemző a TraderTraitor csoportot vádolja. Az ellopott összeg 6,3 milliárd dollár, amiből a Binance szerint 3 milliárdot találtak meg és fagyasztottak be. A TRM Labs szerint 2,4 milliárd dollár nyomon követése már nem lehetséges.", "A cég vezérigazgatója szerint mindenki kárát teljes egészében megtérítik, ami kriptoeszközöknél nem törvényi kötelezettség. A Binance hétfőtől ígéri a számlák újbóli használatát. Ez a legnagyobb ismert kriptolopás, az előző rekord egy dubai tőzsde elleni 1,5 milliárdos támadás volt. A bitcoin ára 80 ezer dollár körül van, a hír óta nagyjából 3 ezer dollárral esett."], "op": "A kripto hívei szeretik úgy beállítani, hogy nincs szükség közvetítőre, de ha egy tőzsde hibáján ennyi ügyfélpénz ég el, akkor mégis a bizalom a legkritikusabb eszköz. Az, hogy a cég önként megtérít, tiszteletre méltó, de egy szabályozott bank esetében ez törvényi kötelezettség volna.", "src": [["444: A rezsimnek dolgozó észak-koreai hackerek lophatták el a Binance ügyfeleinek dollármilliárdjait", "https://444.hu/2026/10/30/a-rezsimnek-dolgozo-eszak-koreai-hackerek-lophattak-el-a-binace-ugyfeleinek-dollarmilliardjait"]]}, {"w": "", "st": "Megerősített", "time": "okt. 30.", "cav": "A 444 nem közli, melyik téma melyik napra esik; a lista a cikk szerint nem teljes.", "img": "https://assets.4cdn.hu/kraken/8OVUXlMiG3aEWGLWs-lg.jpeg", "imgs": "444", "imgl": "https://444.hu/2026/10/30/jovo-heten-negynapos-parlamenti-ulessel-orvendezteti-meg-a-nagyerdemut-a-tisza", "cred": "", "id": "parlament-jovo-heti-negynapos-ules", "r": "Belpolitika", "c": "Parlament", "t": "Négynapos parlamenti ülés jön: lex Kubatov, vagyonadó, december 24. és Fejes Péter megválasztása", "s": "A 444 összeállítása szerint a jövő heti ülésen a vagyonadó, a december 24-i munkaszüneti nap és a legfőbb ügyész megválasztása is napirenden van.", "p": ["A parlament jövő héten négy napon át ülésezik, a hétfői és keddi ülés Magyar Péter rövid felszólalásával indul. A 444 szerint a napirenden szerepel többek között a zártkörű tőkealapok ügye, a december 24-i munkaszüneti nap, a vagyonadó és az úgynevezett lex Kubatov.", "Szavaznak a balkáni katonai békefenntartó műveletről, a Felzárkóztatási Források Visszaéléseit Feltáró Vizsgálóbizottság felállításáról, a Független Közmédia Testület új tagjairól, a legfőbb ügyész, Fejes Péter megválasztásáról és eskütételéről, valamint a magyar–amerikai polgári atomenergia-megállapodásról. A cikk szerint a lista nem teljes, a következő ülés november 9-én lesz."], "op": "Sűrű hét lesz, és a lista jó része olyan kérdés, amelyből látszik, mennyire komolyan gondolja az új többség az intézmények újjáépítését. A közmédia és a legfőbb ügyész személye különösen fontos próba. A gyors törvényalkotásnál azonban a minőség és a vita sem maradhat el.", "src": [["444: Jövő héten négynapos parlamenti üléssel örvendezteti meg a nagyérdeműt a Tisza", "https://444.hu/2026/10/30/jovo-heten-negynapos-parlamenti-ulessel-orvendezteti-meg-a-nagyerdemut-a-tisza"]]}, {"w": "", "st": "Megerősített", "time": "okt. 30.", "cav": "A forrás szerint a konkrét megállapodásokról nem esett szó, így azokat nem tudjuk.", "img": "https://kep.cdn.index.hu/1/0/7231/72315/723151/72315137_5329367_7fe3d4a8a49c9538788455feb41acbfe_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/10/30/egyiptom-magyarorszag-baka-andras-abdel-fattah-esz-szisz-koztarsasagi-elnok-talalkozo/", "cred": "", "id": "esz-szisi-budapest-baka-andras", "r": "Külföld", "c": "Diplomácia", "t": "Egyiptom államfője Budapesten: Baka András szerint stabilak a kapcsolatok", "s": "Abdel-Fattáh esz-Szíszi negyedik magyarországi látogatásán a Sándor-palotában tárgyalt Baka András köztársasági elnökkel, majd Magyar Péterrel is találkozik.", "p": ["Baka András köztársasági elnök pénteken fogadta a Sándor-palotában egyiptomi kollégáját, Abdel-Fattáh esz-Szíszit. Az államfők szerint a magyar–egyiptomi kapcsolatok stabilak. A két ország között 2023 óta stratégiai partnerségi megállapodás áll fenn, 2028-ban lesz a diplomáciai kapcsolatok százéves évfordulója.", "Baka a közel-keleti helyzetet, a gázai konfliktust, a terrorizmus elleni küzdelmet és az illegális migrációt említette. Esz-Szíszi a palesztin kérdésben nyújtott magyar támogatást köszönte meg, és azt mondta, hogy a humanitárius segítség eljuttatását és az újjáépítés mielőbbi megkezdését szeretné elérni. Meghívta Bakát Egyiptomba, és aznap Magyar Péter miniszterelnökkel is találkozik."], "op": "Protokollos látogatás, de az üzenet fontos: az új magyar vezetés is folytatja a kapcsolatot egy olyan szereplővel, aki a térség stabilitásához kulcsfontosságú. A nehezebb kérdés az lesz, mit kezdenek az ilyen kapcsolatokkal az emberi jogok és a migráció terén. Ebből a találkozóból még nem derül ki.", "src": [["Index: A magyar és az egyiptomi elnök szerint is stabilak a magyar–egyiptomi kapcsolatok", "https://index.hu/belfold/2026/10/30/egyiptom-magyarorszag-baka-andras-abdel-fattah-esz-szisz-koztarsasagi-elnok-talalkozo/"]]}, {"w": "", "st": "Megerősített", "time": "okt. 30.", "cav": "A műsor a Nemzeti Sport összeállítása, a cikk nem jelzi, hogy az időpontok helyiek-e. A birkózók nemzetiségét nem közli.", "img": "https://cdn.nemzetisport.hu/2026/10/Jfdc-mSvajmHVEh9i0gUm-VXsIg_SFaaJTE0XQDAAAo/fill/1200/675/no/1/aHR0cHM6Ly9jbXNjZG4uYXBwLmNvbnRlbnQucHJpdmF0ZS9jb250ZW50LzkyMmZlMTRmOWYwODRmMGQ5NmNhNTgzY2Y2NWE5ZjYx.webp", "imgs": "Nemzeti Sport", "imgl": "https://www.nemzetisport.hu/minden-mas-foci/2026/10/penteki-sportmusor-topligas-merkozesek-birkozo-vilagbajnoksag-es-jegkorongcsatak", "cred": "", "id": "penteki-sportmuszor-fehervar-bolzano-futsal", "r": "Sport", "c": "Műsor", "t": "Pénteki sportműsor: Fehérvár–Bolzano jégkorong, birkózó-vb és Újpest a futsal BL-selejtezőben", "s": "A Nemzeti Sport szerint a Hydro Fehérvár AV19 este a Bolzanót fogadja, az Újpest futsalcsapata pedig a BL-selejtező utolsó fordulójában búcsúzik.", "p": ["A Nemzeti Sport összeállítása szerint a Hydro Fehérvár AV19 pénteken 19.15-kor a Bolzanóval játszik az osztrák jégkorongligában, a találkozót a Nemzeti Sportrádió élőben közvetíti. Az Erste Ligában a DVTK Jegesmedvék, az Újpesti TE, a Debreceni EAC és a Budapest Jégkorong Akadémia is pályára lép.", "A futsal BL-selejtező elitkörében az Újpest FC 13.00-kor a bosnyák Bubamara Cazint fogadja a gliwicei csoport utolsó fordulójában, a cikk szerint ezzel búcsúzik a sorozattól. Az asztanai birkózó-világbajnokságon szabadfogású és női súlycsoportok döntői várhatók, az M4 Sport közvetíti. Autósport-rajongók a Mexikóvárosi Nagydíj szabadedzéseit követhetik 19.30-tól és 23.00-tól."], "op": "A magyar sport nagy része ma is a kisebb termekben, a közvetítés nélküli meccseken zajlik, ezért jólesik, hogy a műsorban ott a futsal és az Erste Liga is. Az Újpest búcsúja a BL-selejtezőtől persze nem szívmelengető, de a részvétel is előrelépés a semminél.", "src": [["Nemzeti Sport: Pénteki sportműsor", "https://www.nemzetisport.hu/minden-mas-foci/2026/10/penteki-sportmusor-topligas-merkozesek-birkozo-vilagbajnoksag-es-jegkorongcsatak"]]}, {"id": "fejes-peter-legfobb-ugyesz-jelolt", "r": "Belpolitika", "c": "Igazságszolgáltatás", "w": "", "st": "Jelentett", "time": "okt. 29.", "t": "Fejes Péter, az új legfőbbügyész-jelölt: drasztikus személyi és szervezeti változások kellenek", "s": "A köztársasági elnök második jelöltje a legfőbb ügyészi posztra azonnali és határozott személyzeti lépéseket sürget, és elnézést kérne a közvéleménytől a nem hozott döntések miatt. A parlament jövő kedden szavazhat a személyéről.", "p": ["Fejes Péter, aki negyven évet töltött az ügyészségen, a Válasz Online-nak adott interjúban beszélt arról, mit tenne, ha megválasztanák. A HVG beszámolója szerint három követelményt nevezett meg: szakszerűség, időszerűség és politikai semlegesség. Szerinte a döntéseket akkor kell meghozni, amikor az információk rendelkezésre állnak, és konkrét ügyekben utólag vizsgálnák, időben és helyesen döntöttek-e, szükség esetén fegyelmi eljárással.", "Azonnali, drasztikus személyzeti és szervezeti intézkedéseket tart szükségesnek, ezek egy része törvénymódosítást is igényelne. Karcsúsítaná a Legfőbb Ügyészség hivatalát, és újragondolná a Központi Nyomozó Főügyészség helyzetét. Neveket nem mondott, listája szerinte nincs. Új bizonyíték esetén régi ügyeket is újra lehetne nyitni, a költségvetési gazdasági bűncselekményeknél és a hűtlen kezelésnél pedig az elévülési idő akár tíz év is lehet.", "Fejes az ügyészség elnézéskéréssel tartozónak nevezte a közvélemény felé az igazságérzetet sértő és a meg nem hozott döntésekért. Úgy látja, a vezető nélküli csúcs árt a szervezetnek, és szerinte ma is érvényesül a törvény előtti egyenlőség. Előző jelöltjét, Szathmáry Zoltánt a Tisza-többség nagyjából két hete utasította el, mert testvére gyanúsított az aranykonvoj-ügyben. Ha a parlament nem támogatja, az nem lenne személyes kudarc számára."], "cav": "Az interjút a Válasz Online közölte, a Fejes-nyilatkozatok a HVG összefoglalójából valók, az eredeti interjút nem olvastuk. A szavazás időpontját a HVG „jövő keddre” teszi, a Portfolio is kedden várja a döntést.", "op": "Jó, hogy végre elhangzik az, amit sok választó évek óta vár: az ügyészség számon kérhető, és nem a politikai széljárás dönt. A szavak azonban olcsók, a próba az lesz, hány régi, elhúzódó ügy kerül ténylegesen elő, és kik veszítik el a posztjukat. Az elnézéskérés a közvélemény felé tisztességes gesztus, de önmagában még semmit nem old meg.", "src": [["HVG: Új legfőbbügyész-jelölt: Azonnali, drasztikus személyzeti és szervezeti intézkedésekre van szükség", "https://hvg.hu/itthon/20261029_legobb-ugyesz-jelolt-kozvelemeny-igazsagerzet-megkovet-fejes-peter"]], "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/986cefa9-db12-480c-81e5-8f16faa5b08a.jpg", "imgs": "HVG", "imgl": "https://hvg.hu/itthon/20261029_legobb-ugyesz-jelolt-kozvelemeny-igazsagerzet-megkovet-fejes-peter", "cred": ""}, {"id": "sesztak-nyomkovetokutya-9-milliard", "r": "Belpolitika", "c": "Korrupció", "w": "", "st": "Jelentett", "time": "okt. 29.", "t": "Nyomkövető kutya jelzett Seszták Miklós házában, ügyvédje tagadja a kilencmilliárdos készpénzt", "s": "A Volánbusz-ügy gyanúsítottjának, Seszták Miklósnak a letartóztatását három hónappal meghosszabbították. Egy tanú szerint 2018-ban kilencmilliárd forintról volt szó, az ügyvéd szerint viszont nem volt ekkora összeg a széfben.", "p": ["A Budai Központi Kerületi Bíróság a Nemzeti Vagyonvisszaszerzési és Vagyonvédelmi Hivatal (NVVH) indítványára szerdán, október 28-án három hónappal meghosszabbította a KDNP-s képviselő, volt nemzetifejlesztési miniszter fogva tartását. A Fővárosi Törvényszék indoklása szerint a bizonyítás zavarásának veszélyét részben egy 2018-as tanúvallomás és egy nyomkövető kutya jelzése támasztja alá. A kutya október 15-én jelzett Seszták kisvárdai házában, ahol a nyomozók üres széfeket találtak, amelyekben a jelentések szerint korábban mintegy kilencmilliárd forint készpénz lehetett.", "A Volánbusz-ügy egyik gyanúsítottja azt vallotta, hogy 2018-ban Seszták pénz mozgatásához kért tőle segítséget, és a beszélgetésből kiderült, hogy kilencmilliárd forintról van szó. Seszták ügyvédje, Papp Gábor a Telexnek azt mondta, a széfben csak 2014 és 2018 közötti iratok voltak, kilencmilliárd forint készpénz sosem, és a bíróság sem állította ezt a fogvatartási tárgyaláson. Szerinte készpénzt nem foglaltak le, csak bankszámlákat zároltak és ingatlanokat biztosítottak.", "Az ügyészség szerint 2015 és 2018 között Seszták és az MNV vezérigazgatója közvetítőn keresztül több mint 11 milliárd forintot kapott a Volánbuszhoz kötődő cégektől. Egy építőipari csoport a szerződéses díj tíz százalékának visszajuttatását ajánlotta fel, a Nemzeti Sportközpontok medence- és tornacsarnok-tendereihez kapcsolódva pedig mintegy 270 millió forintról van szó. Az ügyészség hét rendbeli, hivatalos személyként elkövetett passzív vesztegetést és hat rendbeli bűnsegédi vesztegetést tartja megalapozhatónak."], "cav": "A kilencmilliárdos készpénz egy tanúvallomáson és sajtóértesüléseken alapul, az ügyvéd tagadja, készpénzt nem foglaltak le. Seszták ártatlannak tekintendő, jogerős döntés nincs. A nyomozók titkos megfigyelést is használtak, amit az ügyészség korábban elismert.", "op": "A történet tele van filmbe illő részletekkel, a nyomkövető kutyától az üres páncélszekrényig, de a jogállamban nem a hangulat dönt, hanem a bizonyíték. Éppen ezért fontos, hogy a vádak ne a sajtóban, hanem a bíróságon álljanak helyt. Az viszont sokat elárul az elmúlt évek működéséről, hogy egy volt miniszter ügyében több mint tizenegymilliárdos számokról tárgyal a hatóság.", "src": [["Index: Nyomkövető kutya jelzett Seszták Miklós házában, a kilencmilliárdos ügy újabb részlete derült ki", "https://index.hu/belfold/2026/10/29/sesztak-miklos-volanbusz-ugy-pancelszekreny-keszpenz-9-milliard-ugyved-papp-gabor/"]], "img": "https://kep.cdn.index.hu/1/0/7183/71839/718397/71839751_5295885_074bf83035f2e26c9ccd6eb048b415ba_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/10/29/sesztak-miklos-volanbusz-ugy-pancelszekreny-keszpenz-9-milliard-ugyved-papp-gabor/", "cred": "Fotó: Németh Kata / Index"}, {"id": "benko-tibor-budaorsi-haz", "r": "Belpolitika", "c": "Közpénz", "w": "", "st": "Jelentett", "time": "okt. 30.", "t": "165 millióért vette meg a volt honvédelmi miniszter a tízéves szolgálati házát", "s": "Benkő Tibor és felesége 2022 márciusában megvásárolta a budaörsi házat, amelyet a volt miniszter 2012 óta használt. A HVG szerint a vételár 165 millió forint volt, Benkő szerint a villa-vád nem igaz.", "p": ["A Honvédelmi Minisztérium közlése szerint Benkő Tibor volt vezérkari főnök és honvédelmi miniszter a feleségével 165 millió forintért vette meg a 180 négyzetméteres budaörsi családi házat, amelyet 2012-től 2022 márciusáig használt. Az ingatlant az állami HM Elektronikai, Logisztikai és Vagyonkezelő Zrt. vásárolta 2011-ben. A telek meghaladja az 1400 négyzetmétert, a ház háromszobás, Benkő szerint nincs benne jakuzzi, szauna, lift, mozi, edzőterem vagy medence.", "Benkő elmondta, hogy 40 millió forintos jelzáloghitelt vettek fel, a többit megtakarításból fizették. Vagyonnyilatkozatuk szerint 2021 végén mintegy 135 millió forint saját forrásuk volt. A Proac Ingatlanforgalmazó értékbecslése 163 millió forint volt. A hivatalos nyilvántartásban a felújítás mintegy 2,7 millió forintként szerepel, a HVG információi szerint azonban jóval nagyobb korszerűsítés történt, amely valószínűleg üzemeltetési költségként jelent meg. A biztonsági munkákat Benkő szerint a katonai nemzetbiztonsági szolgálat rendelte meg, ezek költségét nem ismeri.", "Az eladást Benkő jogszerűnek mondja: szerinte a ház nem katonai szolgálati lakás volt, a cég 2019 óta a nemzeti vagyonért felelős miniszter alá tartozott, a minisztérium „portfólió-tisztításra” hivatkozott. Azt állítja, a házat mindenképp eladták volna, ő piaci áron vette meg, és a törvényes kedvezményeket szándékosan nem vette igénybe. A HVG szerint a katonák egy része felháborodott, mert ez már a második állami tulajdonú ingatlan, amelyet megvásárolt: 2000-ben a kiskunhalasi szolgálati lakását is."], "cav": "A vételárat a HM közölte, a hitel, a megtakarítás és az eladás jogszerűsége Benkő saját állítása. A felújítási költségek a hivatalos adat (2,7 millió Ft) és a HVG információi között eltérnek. A HVG a főkép szerzőjét nem nevezi meg egyértelműen.", "op": "Egy ember, aki tíz évig élt állami házban, majd piaci áron megvette, ettől még nem bűnöző, és a tényeket Benkő maga is megadja. A kérdés az, miért nem tette közzé ezt senki hosszú ideig, és miért éppen akkor fordult át a ház magánkézbe, amikor a hatalomváltás már a levegőben volt. Egy normális országban az ilyen eladásokról nyilvános lista van, nem utólagos tisztázás.", "src": [["HVG: 165 millió forintért vásárolta meg Benkő Tibor volt miniszter az általa használt budaörsi házat", "https://hvg.hu/gazdasag/20261030_165-millio-forint-benko-tibor-honvedelmi-miniszter-budaorsi-haz-szolgalati-lakas-vasarlas"]], "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/0957e020-748a-43c5-9311-7a4e0ba51686.jpg", "imgs": "HVG", "imgl": "https://hvg.hu/gazdasag/20261030_165-millio-forint-benko-tibor-honvedelmi-miniszter-budaorsi-haz-szolgalati-lakas-vasarlas", "cred": "HVG / Fazekas István"}, {"id": "matolcsy-parlamenti-meghallgatas-nov-5", "r": "Belpolitika", "c": "Parlament", "w": "MNB-ügy", "st": "Jelentett", "time": "okt. 30.", "t": "Előzetesben is beidézték Matolcsy Györgyöt a parlamenti vizsgálóbizottság elé", "s": "A vizsgálóbizottság november 5-én hallgatná meg az előzetes letartóztatásban lévő volt jegybankelnököt. Jogász szerint a letartóztatottnak is meg kell jelennie, de a nyilatkozattételt megtagadhatja, ha magát vagy hozzátartozóját terhelné.", "p": ["Az Origo beszámolója szerint György Matolcsyt, a volt jegybankelnököt a Parlament MNB-botrányt vizsgáló bizottsága november 5-ére idézte be, bár előzetes letartóztatásban van. Csőszi Attila bizottsági elnök szerint a testület továbbra is tartani szeretné a meghallgatást. Az idézést még a letartóztatása előtt kézbesítették, és Matolcsy jelezte, hogy részt kíván venni.", "Petrik Herold Erik ügyvéd a 444-nek azt mondta, hogy az Alaptörvény és az Országgyűlésről szóló törvény szerint a megjelenési és tanúzási kötelezettség a fogvatartottakra is vonatkozik. Az Origo szóhasználata óvatosabb: szerinte Matolcsy megjelenésre „köteles lehet”. Távoli tanúvallomás általában nem lehetséges, így személyesen kellene megjelennie, a logisztikát a bizottsági elnöknek a Központi Nyomozó Főügyészséggel és a büntetés-végrehajtással kell egyeztetnie.", "A volt jegybankelnök megtagadhatja a választ azokra a kérdésekre, amelyekkel magát vagy közeli hozzátartozóját terhelné. Ha viszont vallomást tesz, igazat kell mondania, különben hamis tanúzás miatt feljelenthető."], "cav": "Az Origo a 444 cikkére hivatkozik. Hogy a letartóztatott Matolcsy tényleg megjelenhet-e, az még nem dőlt el, az ügyvéd megfogalmazása is feltételes.", "op": "Szokatlan helyzet, hogy egy letartóztatott volt jegybankelnököt idéznek be a parlamentbe, de a kérdés, amelyet a választók évek óta feltesznek, ugyanaz: hová lett a pénz? Ha Matolcsy a hallgatás jogával él, az törvényes, de aligha az a válasz, amit a közvélemény vár.", "src": [["Origo: Újabb fordulat Matolcsy György ügyében: hiába van előzetesben, beidézték a Parlamentbe", "https://www.origo.hu/belpol/2026/10/matolcsy-gyorgy-parlamenti-meghallgatas"]], "img": "https://cdn.origo.hu/2026/10/hQjw1UWgKMnHayDccqQIvu6CQiY16oh0ymRox54VvjE/fill/1200/675/no/1/aHR0cHM6Ly9jbXNjZG4uYXBwLmNvbnRlbnQucHJpdmF0ZS9jb250ZW50LzBiMzczNDQzNGFiNzQyZTZhMjY5YThlMTA3Yzk0MWMx.webp", "imgs": "Origo", "imgl": "https://www.origo.hu/belpol/2026/10/matolcsy-gyorgy-parlamenti-meghallgatas", "cred": ""}, {"id": "kata-tervezet-szakerto-hiba", "r": "Gazdaság", "c": "Adó", "w": "", "st": "Jelentett", "time": "okt. 30.", "t": "Szakértő szerint belső ellentmondás van a kata-tervezetben, a köztársasági elnök visszaküldheti", "s": "Az Origo által idézett adószakértő szerint a kormány kata-törvénytervezete következetlen: egy bekezdés az idei, egy másik az előző évi minimálbérrel számol. Az állítás egy szakértő véleménye, a tervezet szövegét nem láttuk.", "p": ["Az Origo beszámolója szerint Angyal József okleveles adószakértő az ATV Start műsorában arról beszélt, hogy a Tisza-kormány kisadózók tételes adóját (kata) átalakító törvénytervezete súlyos hibákat tartalmaz. Egyik bekezdés az adott költségvetési év minimálbérét használja, két bekezdéssel később viszont már az előző évi adatot. Ezt koherenciazavarnak nevezte, és „a legsúlyosabb jogalkotói hibának” minősítette.", "A szakértő szerint a havi kata számítása rögzített matematikai képletet követ, a jogalkotók mégis az általános iskolai százalékszámítás szabályait akarják törvénybe írni. Szerinte Baka András köztársasági elnök biztosan visszaküldi a sietősen megírt törvényt. Az Origo cikke úgy indít, hogy a tervezet jelen formájában biztosan nem válik törvénnyé."], "cav": "Az Origo kormánypárti hangvételű médium, a cikk egyetlen szakértő véleményére épül. A jogszabályszöveget magunk nem ellenőriztük, a köztársasági elnök lépése csak jóslat.", "op": "Ha valóban van ilyen ellentmondás, azt ki kell javítani, és jobb, ha a parlamenti vita során derül ki, nem utána. A sietség kormányzati bűne lehet, de a kata-reform témájában a költségvetés tétje és a kisvállalkozók bizonytalansága a nagyobb kérdés. Az előrejelzéseket, hogy valaki „biztosan” megvétóz valamit, mindig érdemes sóval fogyasztani.", "src": [["Origo: Szakértő leplezte le a kata-tervezetet: „Ez a legsúlyosabb jogalkotó hiba, amit el lehet követni”", "https://www.origo.hu/belpol/2026/10/kata-hibak-szakerto"]], "img": "https://cdn.origo.hu/2026/10/yuxmnPyl40CIUDj6AGE8UKBw0eEUV7Gm3Q3s_ty43DQ/fill/1200/675/no/1/aHR0cHM6Ly9jbXNjZG4uYXBwLmNvbnRlbnQucHJpdmF0ZS9jb250ZW50L2FhNzEyNzU4ODVhOTQ4M2I5YjQ2ZGRiODAxMjQ5Nzdj.webp", "imgs": "Origo", "imgl": "https://www.origo.hu/belpol/2026/10/kata-hibak-szakerto", "cred": "Fotó: YouTube"}, {"id": "2027-adotorvenyek-benyujtas-minimalnyugdij", "r": "Gazdaság", "c": "Adó", "w": "", "st": "Megerősített", "time": "okt. 28.", "t": "Benyújtották a 2027-es adótörvényeket: alacsonyabb szja a minimálbéren, 120 ezerre emelkedik a minimálnyugdíj", "s": "A kormány kedd este benyújtotta az új adótörvényeket és a minimálnyugdíj emeléséről szóló javaslatot. Az Origo által ismertetett adatok a pénzügyminiszter közlésén alapulnak.", "p": ["Az Origo szerint a kormány kedd este benyújtotta az Országgyűlésnek a 2027-es adótörvényeket és a minimálnyugdíj emeléséről szóló javaslatot. Kármán András pénzügyminiszter Facebook-bejegyzése szerint a minimálbér szja-ja 9 százalékra csökken, ami évi 240 ezer forinttal hagy több pénzt a minimálbérből élőknek. A havi 680 ezer forintos bruttó jövedelemig fokozatosan kivezetett adójóváírás mintegy 2,5 millió embert érint, a családi pótlék a tervek szerint megduplázódik.", "A 2008 óta 28 500 forintos minimálnyugdíj 120 ezer forintra emelkedne. A kisvállalkozások megtartanák a 9 százalékos társasági adót, az új lakások 5 százalékos áfája határidő nélkül marad. A többletterhet a kormány szerint a leggazdagabbak, a legnagyobb cégek, bankok, biztosítók, kiskereskedelmi láncok és energiacégek viselnék: a társasági adó és az innovációs járulék módosítása mintegy 240 milliárd, a bankok mintegy 30 milliárd, az energiacégek több mint 10 milliárd forintot hozna.", "2027 januárjától újra bevezetik a reklámadót: az 500 millió és 10 milliárd forint közötti árbevételnél 2,5, a 10 és 40 milliárd közöttinél 4,5, a 40 milliárd feletti bevételnél 7,5 százalékos a kulcs, az 500 millió alatti árbevételű vállalkozások mentesek."], "cav": "A számok a pénzügyminiszter közlésén és az Origo összefoglalóján alapulnak, a törvényszöveget magunk nem ellenőriztük. A bevételi becslések a kormány saját számításai.", "op": "Aki a minimálbéren él, sokat nyerhet, és a 120 ezres minimálnyugdíj régóta esedékes korrekció a 28 500 forint után. A kérdés a fedezet: a bankokra, láncokra és energiacégekre rakott új terhek népszerűek, de kiderül majd, hogyan reagálnak rájuk a piacok és a cégek. A reklámadó visszahozása a médiát is érinti, így ebben a kérdésben a sajtó érintett fél, ezt érdemes észben tartani.", "src": [["Origo: Jön az adócsökkentés és a nagy nyugdíjemelés: benyújtotta a kormány az új törvényeket", "https://www.origo.hu/gazdasag/2026/10/ado-adotorvenyek-orszaggyules-karman-andras"]], "img": "https://cdn.origo.hu/2026/10/gLf8sdoY22YSqCMblyB_M09XS52gbqlw7FHGcg0XYhU/fill/1200/675/no/1/aHR0cHM6Ly9jbXNjZG4uYXBwLmNvbnRlbnQucHJpdmF0ZS9jb250ZW50L2I1ZjM3ZmQzMzc0NTQ1YzU5ZDBjMWYyODRmNDFmNjM2.webp", "imgs": "Origo", "imgl": "https://www.origo.hu/gazdasag/2026/10/ado-adotorvenyek-orszaggyules-karman-andras", "cred": "Mediaworks"}, {"id": "december-24-munkaszuneti-nap-tervezet", "r": "Közélet", "c": "Munka", "w": "", "st": "Megerősített", "time": "okt. 29.", "t": "Társadalmi egyeztetésre bocsátották a december 24-i munkaszüneti nap tervezetét", "s": "Ha elfogadják, 2026-ban már munkaszüneti nap lesz december 24., a kiesett munkanapot december 12-én, szombaton ledolgozzák. Észrevételeket december 5-ig lehet tenni.", "p": ["A kormány a kormany.hu dokumentumtárában szerdán tette közzé társadalmi egyeztetésre azt a tervezetet, amely a jelenleg csak pihenőnapként kezelt december 24-ét munkaszüneti nappá nyilvánítaná, már 2026-tól. A kiesett munkanapot december 12-én, szombaton kellene ledolgozni, a véleményezési határidő december 5. A dokumentum a 2026-os ünnepek körüli munkarendről szóló 10/2025. (IV. 30.) NGM rendelet módosítása.", "A törvényjavaslatot három Tisza-képviselő, Kalázdi-Kerekes Kinga, Molnár Zoltán és Hantosi István nyújtotta be szeptember 23-án. A Kereskedelmi Alkalmazottak Szakszervezete országos népszavazási kezdeményezést indított ugyanerről, de nem gyűlt össze elég aláírás: az Országos Választási Iroda előzetes számítása szerint száz ezernél kevesebb érvényes aláírás volt, az Országos Választási Bizottság kedden hivatalosan megállapította, hogy a kezdeményezés nem felelt meg a feltételeknek."], "cav": "A tervezet még nem elfogadott, a ledolgozási nap és a határidő módosulhat az egyeztetés során.", "op": "Sokaknak a szenteste régóta amúgy is szabadnapot jelent, a kereskedelmi dolgozóknak viszont különösen sokat számít, hogy ez jogilag is biztos legyen. Érdekes, hogy a szakszervezeti népszavazás elhasalt, a képviselői javaslat pedig most gyorsan megy. A szombati ledolgozás viszont azt jelenti, hogy ez nem teljesen ingyen szabadnap.", "src": [["Index: Társadalmi egyeztetésre bocsátotta a kormány december 24. munkaszüneti nappá nyilvánítását", "https://index.hu/belfold/2026/10/29/december-24-munkaszuneti-nap-tarsadalmi-egyeztetes-ledolgozas-torvenyjavaslat/"]], "img": "https://kep.cdn.index.hu/1/0/7228/72287/722871/72287179_5327411_564ad9b8f53f7e37441feff3bc3432ba_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/10/29/december-24-munkaszuneti-nap-tarsadalmi-egyeztetes-ledolgozas-torvenyjavaslat/", "cred": "Fotó: Stiller Ákos / Bloomberg / Getty Images (illusztráció)"}, {"id": "oni-ogyi-novembertol", "r": "Közélet", "c": "Egészségügy", "w": "", "st": "Megerősített", "time": "okt. 29.", "t": "November 1-jétől két intézetre bomlik a Nemzeti Népegészségügyi és Gyógyszerészeti Központ", "s": "A Magyar Közlönyben megjelent kormányrendeletek szerint létrejön az Országos Népegészségügyi Intézet és az Országos Gyógyszerészeti Intézet. A folyamatban lévő ügyeket az átszervezés nem érinti.", "p": ["A Magyar Közlönyben csütörtökön megjelent kormányrendeletek szerint a Nemzeti Népegészségügyi és Gyógyszerészeti Központból (NNGYK) két új intézet jön létre november 1-jével: az Országos Népegészségügyi Intézet (ONI) és az Országos Gyógyszerészeti Intézet (OGYI), mindkettő az NNGYK jogutódja. Az ONI-t az országos tisztifőorvos vezeti, az OGYI élére Szepezdi Zsuzsanna kerül, ahogy Hegedűs Zsolt egészségügyi miniszter korábban bejelentette.", "Az ONI feladata lesz a nemzeti népegészségügyi programok kidolgozása, a népegészségügy, járványügy, mikrobiológia és munkahelyi egészségügy szakmai irányítása, az emberi kutatások és klinikai vizsgálatok szabályozása, az éves oltóanyag-ellátás beszerzése és elosztása, valamint a drogpolitikai adatgyűjtés és megelőzés. Az OGYI gyógyszerészeti államigazgatási szerv: gyógyszerek, orvostechnikai eszközök és in vitro diagnosztikai eszközök hatósági feladatait, engedélyezését és a gyógyszerbiztonságot koordinálja.", "Az MTI szerint a szétválás nem érinti a folyamatban lévő ügyeket, a határidők számítását, az eljárási cselekmények érvényességét és az ügyfelek eljárási jogait."], "cav": "", "op": "Intézetátszervezésből ritkán lesz lelkesítő hír, de az egészségügyben az átláthatóság és a külön felelősségi körök valóban számítanak. A kérdés az lesz, kapnak-e az új intézetek elég embert és pénzt, vagy csak a névtábla változik. A jó szándékot nem vitatom, a számonkérést viszont fenntartom.", "src": [["Index: Létrejön az Országos Népegészségügyi Intézet és az Országos Gyógyszerészeti Intézet", "https://index.hu/belfold/2026/10/29/orszagos-nepegeszsegugyi-intezet-orszagos-gyogyszereszeti-intezet-hegedus-zsolt-szepezdi-zsuzsanna/"]], "img": "https://kep.cdn.index.hu/1/0/7072/70728/707281/70728115_5216911_3a2786f981ee3bc662375b1e0130f765_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/10/29/orszagos-nepegeszsegugyi-intezet-orszagos-gyogyszereszeti-intezet-hegedus-zsolt-szepezdi-zsuzsanna/", "cred": "Fotó: Papajcsik Péter / Index"}, {"id": "catl-debrecen-jogeros-itelet", "r": "Közélet", "c": "Környezet", "w": "", "st": "Megerősített", "time": "okt. 29.", "t": "Jogerősen elutasította a bíróság a civilek keresetét a debreceni CATL-gyár környezethasználati engedélye ellen", "s": "A Debreceni Törvényszék szerint a felperesek nem fellebbeztek az engedély 2025-ös negyedik módosítása ellen, ezért azt nem vizsgálhatta, az eredeti engedély pedig már nem létezik eredeti formájában.", "p": ["A Debreceni Törvényszék csütörtökön jogerősen elutasította a helyi magánszemélyek és civil szervezetek keresetét, amely a CATL akkumulátorgyár egységes környezethasználati engedélye ellen irányult. A tárgyalást vezető bíró, Szászi Ádám szerint az ítélet ellen fellebbezésnek nincs helye. A pert 2023 márciusában indították, az engedélyt azóta négyszer módosították.", "A bíróság indoklása szerint a 2025-ös, negyedik módosítás, amely a gyár műszaki paramétereit is megváltoztatta (jelentősen csökkentette a vízfelhasználást, szürkevíz-használatot írt elő, új szabályokat hozott a szennyvízkezelésre és a kibocsátásokra), jogerőssé vált, mert a felperesek nem támadták meg. Így azt a bíróság nem vizsgálhatta, a 2023-as engedély pedig eredeti formájában már nem létezik, ezért nem is lehetett megsemmisíteni, a felperesek pereshez fűződő érdeke lényegében megszűnt. A maradék jogi érveket a bíróság megvizsgálta, érdemi vagy eljárási jogsértést nem talált.", "A gyár a negyedik módosítás alapján működhet és gyárthat akkumulátorcellákat. A Hajdú-Bihar Vármegyei Kormányhivatal tovább felügyeli a működés jogszerűségét, szabálytalanság esetén módosíthatja vagy visszavonhatja az engedélyt, vagy korlátozhatja a tevékenységet."], "cav": "Az ítélet nem azt mondta ki, hogy a gyár környezetvédelmileg kifogástalan, hanem hogy a per a módosított engedély miatt nem vezethetett eredményre. Az Index szerint augusztusban három debreceni CATL-üzem munkáját felfüggesztették és 10 millió forintra bírságolták, ez külön ügy.", "op": "A jogi logika követhető, de a hatás az, hogy a helybeliek éveken át pereltek egy engedélyt, amelyet közben átírtak a feje fölött. A formai megoldás nem nyugtat meg senkit, aki Debrecen ivóvizéért és levegőjéért aggódik. A hatóság felelőssége most nő: ha a gyárban baj van, nem lehet majd a per lezártságára hivatkozni.", "src": [["Index: Jogerős döntés született a debreceni CATL-gyár ügyében, a bíróság elutasította a civilek keresetét", "https://index.hu/belfold/2026/10/29/debrecen-catl-akkumulatorgyar-kereset-civilek-elutasitas-birosag/"]], "img": "https://kep.cdn.index.hu/1/0/7229/72298/722987/72298705_5328219_bb91d27193810c8871575aa0248ef80b_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/10/29/debrecen-catl-akkumulatorgyar-kereset-civilek-elutasitas-birosag/", "cred": "Fotó: Czeglédi Zsolt / MTI"}, {"id": "nemzeti-sportradio-megszunik", "r": "Kultúra", "c": "Média", "w": "", "st": "Megerősített", "time": "okt. 29.", "t": "Megszűnik a Nemzeti Sportrádió a budapesti frekvencián, a Manna FM Sunrise FM lesz", "s": "A Médiatanács jóváhagyta a közmédia kérését: a Nemzeti Sportrádió november 1-jétől nem sugároz a 105,9 MHz-en. A keresztény Manna FM november 5-től Sunrise FM néven megy tovább.", "p": ["Az Index beszámolója szerint a Médiatanács október 27-i ülésén jóváhagyta, hogy a Nemzeti Sportrádió november 1-jén megszűnjön a budapesti 105,9 MHz-es frekvencián, gazdasági okokból. A közmédia kérte a leállítást azzal, hogy a csatorna nem üzemeltethető gazdaságosan, a cikk ezt az információt a Blikkre hivatkozva közli. A felszabaduló frekvenciáról a Médiatanács dönt később.", "A budapesti 98,6 MHz-en sugárzó keresztény közösségi rádió, a Manna FM új arculattal és névvel, Sunrise FM néven folytatja november 5-től, és a testület ezt is jóváhagyta. A Médiatanács döntött arról is, hogy a Rádió 1 hálózat adóinak száma tizenháromra nő a nagykanizsai 95,6 MHz-es adó beolvadásával, és eljárást indított a debreceni FM95 Rádió 1 ellen burkolt reklám miatt. A testület új tagja Boór-Gőblyös István, aki székfoglalójában az újságírás tekintélyének helyreállítását nevezte célnak."], "cav": "A leállítás indokát az Index a Blikkre hivatkozva közli, közvetlen közmédiás közleményt nem idéz.", "op": "Egy sportrádió megszűnése nem világégés, de a közmédia pénzéből mindig akadt keret mindenféle másra. Az érdekes kérdés, hogy ki kapja meg a felszabaduló frekvenciát, és milyen szempontok alapján dönt erről a Médiatanács.", "src": [["Index: Döntött a Médiatanács: megszűnik a Nemzeti Sportrádió", "https://index.hu/belfold/2026/10/29/manna-fm-nemzeti-sportradio-mediatanacs-radio/"]], "img": "https://kep.cdn.index.hu/1/0/7229/72292/722921/72292101_5327757_291ca023156ee4a7272e3803d0e8332f_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/10/29/manna-fm-nemzeti-sportradio-mediatanacs-radio/", "cred": "Fotó: Szollár Zsófi / Index (az MTVA székháza, 2025)"}, {"id": "patrick-stewart-elhunyt", "r": "Kultúra", "c": "Film", "w": "", "st": "Jelentett", "time": "okt. 29.", "t": "Meghalt Patrick Stewart, a Star Trek és az X-Men legendás színésze", "s": "A család csütörtöki közleménye szerint a 86 éves színész szerdán halt meg los angelesi otthonában, szerettei körében.", "p": ["A HVG a The Independent beszámolójára hivatkozva azt írja, hogy Patrick Stewart angol színész 86 évesen szerdán otthonában, Los Angelesben elhunyt. A család csütörtöki közleménye szerint utolsó pillanatait családja és barátai szerető ölelésében töltötte, élőzene, ima, könnyek és nevetés vette körül, és egész életét nekik szentelte.", "Stewart a Star Trek-sorozat Jean-Luc Picard kapitányaként és az X-Men-filmek Xavier professzoraként vált világhírűvé. A cikk szerint élete végén Alzheimer-kórral és demenciával küzdött, a halál közvetlen okát a cikk nem nevezi meg."], "cav": "A hír a család közleményén alapul, amelyet a HVG a The Independent-ből vett át, az eredeti közleményt magunk nem ellenőriztük.", "op": "Kevés színész adott olyan méltóságot a tudományos-fantasztikus műfajnak, mint ő: Picard kapitány generációknak mutatta meg, hogy a vezetés lehet okos, empatikus és mégis határozott. A család leírása a végéről melegséget áraszt, ez kevés hírben van jelen.", "src": [["HVG: Meghalt Patrick Stewart, a Star Trek-sorozat és az X-Men filmek legendás színésze", "https://hvg.hu/kultura/20261029_halal-star-trek-sorozat-x-men-film-legenda-szinesz"]], "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/5d59a39d-58dc-4e96-94ef-3cdbfcbb28b4.jpg", "imgs": "HVG", "imgl": "https://hvg.hu/kultura/20261029_halal-star-trek-sorozat-x-men-film-legenda-szinesz", "cred": "AFP / Michael Tran"}, {"id": "izrael-valasztas-vegeredmeny-netanjahu", "r": "Külföld", "c": "Közel-Kelet", "w": "", "st": "Jelentett", "time": "okt. 29.", "t": "Izraelben nem szerzett többséget Netanjahu blokkja, de az ellenzék sem áll össze könnyen", "s": "A Haaretz alapján a HVG szerint a szavazatszámlálás végén Netanjahu hatpárti blokkja 53 mandátumot szerzett a 120 fős Knesszetben, a 61-es többséghez nem elég.", "p": ["A HVG a Haaretzre hivatkozva azt írja, hogy befejeződött a szavazatok számlálása Izraelben. Benjámin Netanjahu hatpárti blokkja 53 mandátumot szerzett a 120-ból, 61 kellene a többséghez. Az ellenzék összesen 67 helyet kapott: a Gadi Eizenkot vezette négypárti tömb 48-at, a kétpárti arab blokk 19-et. A pártok közül a Likud 26, az Eizenkot-féle Jasár 21, Naftali Bennett pártja, a Together 12 mandátumot szerzett.", "A Haaretz arra szólította fel Eizenkot tömbjét és az arab pártokat, hogy fogjanak össze, együtt 67 mandátumuk lenne, a lap szerint ez azonban nem valószínű. A kormánykoalíciós politikusok közül többen az arab pártok erős szereplésének kivizsgálását követelték, a nemzetbiztonsági miniszter pedig az arab pártvezetők letartóztatását sürgette."], "cav": "Az adatok a Haaretz beszámolóján alapulnak, a HVG 99 százalékos feldolgozottság mellett közli őket, hivatalos végeredményt magunk nem ellenőriztünk.", "op": "A szám nem hagy kétséget: Netanjahu blokkja nem szerzett többséget, de a puszta aritmetika nem kormányt jelent. Aggasztó, hogy az arab pártok sikerére egyes miniszterek nem programokkal, hanem letartóztatási felhívásokkal reagálnak: ez a demokrácia próbája, nem az ellenfeleké.", "src": [["HVG: Befejezték a szavazatok számlálását Izraelben, nem szerzett többséget Netanjahu blokkja", "https://hvg.hu/vilag/20261029_szavazat-szamlalas-izrael-eredmenyek"]], "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/494edc19-b060-449e-841e-96173aa8d2eb.jpg", "imgs": "HVG", "imgl": "https://hvg.hu/vilag/20261029_szavazat-szamlalas-izrael-eredmenyek", "cred": "AFP / John Wessels"}, {"id": "franciaorszag-70-ezer-rendor-halloween", "r": "Külföld", "c": "Franciaország", "w": "", "st": "Megerősített", "time": "okt. 30.", "t": "Hetvenezer rendőrt vezényelnek az utcákra Franciaországban a szombati halloweeni tüntetésekre", "s": "Laurent Nuñez belügyminiszter szerint nagyon magas a közrend megzavarásának veszélye. A tüntetéseket nem engedik a városközpontokban.", "p": ["Laurent Nuñez francia belügyminiszter csütörtök este bejelentette, hogy 70 ezer rendőrt vezényelnek az utcákra a szombati, halloween estére eső tüntetésekre. A HVG szerint a miniszter „nagyon magas” közrendzavarási veszélyről beszélt: a megmozdulások engedélyezettek, de nem a városközpontokban, ahol a legnagyobb a kockázat.", "A tiltakozásokat megélhetési problémák hajtják: október 17-én és 24-én több százezren vonultak a francia városokban, az elsőn a szakszervezetek, az oktatás finanszírozása miatt egy hónapja tüntető diákok, volt sárgamellényesek, klímaaktivisták és szélsőbaloldali csoportok vettek részt, és több városban fosztogatás is volt. Nuñez szerint a közösségi médiában kódolt felhívások jelentek meg halloween estére, ezeket szerinte ultrabaloldali és radikalizálódott sárgamellényes csoportok tették közzé, és felkelésre, fosztogatásra buzdítanak.", "A miniszter rendkívüli szigort ígért, és a prefektusokat arra utasította, hogy ellenőrzéseket tartsanak főleg a pályaudvarokon és közlekedési csomópontokban, az erőszakra használható eszközök, például sisakok, maszkok és pirotechnikai eszközök után kutatva."], "cav": "A felhívások eredetére és szervezőire vonatkozó állítások a belügyminisztertől származnak, független megerősítést a cikk nem közöl.", "op": "Hetvenezer rendőr egy halloweeni estére sokat elárul arról, mennyire feszült a helyzet Franciaországban. A megélhetési válság nem rendőri kérdés: amíg ennek okai megmaradnak, a következő szombat sem lesz nyugodtabb. A tüntetés joga és az erőszak elítélése együtt kezelhető, nem kell választani közöttük.", "src": [["HVG: Hetvenezer rendfenntartót vezényelnek az utcákra Franciaországban a szombati tüntetésekre", "https://hvg.hu/vilag/20261030_franciaorszag-tuntetesek-laurent-nunez-rendfenntartok"]], "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/58e5b5b3-85ec-4725-b841-4944576e91c7.jpg", "imgs": "HVG", "imgl": "https://hvg.hu/vilag/20261030_franciaorszag-tuntetesek-laurent-nunez-rendfenntartok", "cred": "Umit Donmez / Anadolu via AFP"}, {"id": "quartz-felugyeleti-biztos", "r": "Belpolitika", "c": "Nyomozás", "w": "MNB-ügy", "st": "Megerősített", "time": "okt. 29.", "t": "Felügyeleti biztos került a Matolcsy-körhöz kötött Quartz Alapkezelő élére, mert az ügyvezetőt letartóztatták", "s": "Az MNB határozata szerint a vezérigazgató letartóztatása miatt nem biztosított a társaság jogszerű működése.", "p": ["A Magyar Nemzeti Bank csütörtöki határozatában felügyeleti biztost rendelt ki a Quartz Befektetési Alapkezelő Zrt.-hez. A feladatot a Pénzügyi Stabilitási és Felszámoló Nkft. látja el az intézkedés visszavonásáig. Az MNB indoklása szerint a vezérigazgató, Valkó Mihály letartóztatásban van, ezért nem tudja ellátni a cégvezetési, köztük a befektetési döntéshozatali feladatokat.", "Az MNB-ügyben a múlt heti szerdán Matolcsy György, Sándor Tamás ügyvéd és Valkó Mihály került őrizetbe. A nyomozás középpontjában egy 2025. február 28-án kötött szerződés áll: az MNB-alapítvány vagyonát kezelő Optima Befektetési Zrt. értékpapír-kölcsönügylettel adta át az Optima Befektetési Alapkezelő részvényeit egy, a Quartz által kezelt magántőkealapnak. Ezzel az alapítványi vagyonkezelést befolyásoló társaság feletti tulajdonosi jogok hosszú évekre átkerültek volna. Az új jegybankvezetés felbontotta a szerződést és feljelentést tett.", "A 444 szerint a Quartzot sokáig Száraz István, Matolcsy Ádám régi barátja irányította, Száraz 2024 májusától távolodott a cégbirodalomtól. Matolcsy Ádám idén nyáron közvetve megszerezte az alapkezelőt, korábban pedig a dubaji Minelley FZCO-n keresztül már kisebb részesedése volt benne."], "cav": "A cikk az MNB közleményére és a 444 saját háttérinformációira épül; a büntetőeljárásban senkit nem mondtak ki bűnösnek.", "op": "Ha egy alapkezelő működése azon áll vagy bukik, hogy a vezetője rács mögött ül, az sokat elárul arról, mennyire személyre szabott volt ez az egész építmény. A felügyeleti biztos a betétesek és befektetők szempontjából nyugtató lépés, a politikai tanulság pedig az, hogy a jegybanki alapítványi vagyon körüli ügyletek még hetekig adhatnak híreket.", "src": [["444: Felügyeleti biztost rendelt a Matolcsy-féle Quartz Alapkezelőhöz az MNB, mert az ügyvezetőt letartóztatták", "https://444.hu/2026/10/29/felugyeleti-biztost-rendelt-a-matolcsy-fele-quartz-alapkezelohoz-az-mnb-mert-az-ugyvezeto-letartoztatasban-van"]], "img": "https://assets.4cdn.hu/kraken/8IFqxlfSMj341Ym12Ws-lg.jpeg", "imgs": "444", "imgl": "https://444.hu/2026/10/29/felugyeleti-biztost-rendelt-a-matolcsy-fele-quartz-alapkezelohoz-az-mnb-mert-az-ugyvezeto-letartoztatasban-van", "cred": ""}, {"id": "lelegeztetogep-ugy-ket-letartoztatas", "r": "Belpolitika", "c": "Elszámoltatás", "w": "", "st": "Megerősített", "time": "okt. 29.", "t": "Letartóztatták a lélegeztetőgép-beszerzések ügyének két gyanúsítottját, az egyik a külügyminisztériummal tartotta a kapcsolatot", "s": "A Győri Járásbíróság szökés, elrejtőzés és a bizonyítás megnehezítésének veszélye miatt rendelte el a letartóztatásukat.", "p": ["Az ügyészség két gyanúsított letartóztatását kérte a lélegeztetőgép-beszerzések ügyében, a Győri Járásbíróság pedig helyt adott az indítványnak. Az egyik gyanúsított a céghálózat könyvelését végezte, a másikat azzal gyanúsítják, hogy egy külföldi cég bankszámlájáról részben készpénzt vett fel, és ő volt a kapcsolattartó a Külgazdasági és Külügyminisztériummal. A bíróság a nyomozók érvelése alapján a szökés, az elrejtőzés és a bizonyítás megnehezítésének veszélyét látta fennállónak.", "A NAV keddi közleménye szerint a bűnszervezet vezetői 800 lélegeztetőgépre és 3 millió maszkra kötöttek szerződést, és ezért 15,6 milliárd forintot kaptak az államtól. Tényleges tevékenységet nem folytató cégekből álló hálózatot hoztak létre, így több mint 660 millió forint kár keletkezett. A haszon egy részét egy egyesült arab emírségekbeli cégnek utalták, a többit készpénzben vették fel.", "Háttérként a HVG emlékeztet: az Orbán-kormány 2020 tavaszán mintegy 19 ezer lélegeztetőgépet szerzett be, ebből 16 ezret Szijjártó Péter minisztériuma vásárolt nagyjából 300 milliárd forintért. Sok gépet sosem használtak, jó részük ma is raktárban van."], "cav": "A HVG a letartóztatásról a Telex tudósítására hivatkozik, saját forrást nem jelöl. A gyanúsítottak nevét a cikk nem közli; a bűnösséget bíróság nem állapította meg.", "op": "A lélegeztetőgép-ügy a járvány alatti pánikvásárlások legsötétebb arcát mutatja: a gépek nagy része sosem lett használva, a pénz viszont elment. Az, hogy végre valódi letartóztatások vannak, fontos, de a nagy kérdés a megrendelői oldal felelőssége marad, nem csak a közvetítőké.", "src": [["HVG: Letartóztatták a lélegeztetőgép-beszerzések ügyének két gyanúsítottját", "https://hvg.hu/gazdasag/20261029_lelegeztetogep-beszerzesek-gyanusitott-letartoztatas"]], "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/4777b544-f803-4c44-b3e9-70674c0b7a52.png", "imgs": "HVG", "imgl": "https://hvg.hu/gazdasag/20261029_lelegeztetogep-beszerzesek-gyanusitott-letartoztatas", "cred": "A NAV razziája. Fotó: Facebook / Nemzeti Adó- és Vámhivatal (HVG)"}, {"id": "lagarde-lemondas", "r": "Gazdaság", "c": "Európai Unió", "w": "", "st": "Jelentett", "time": "okt. 29.", "t": "Lemondott Christine Lagarde, az Európai Központi Bank elnöke", "s": "A bejelentést António Costa tette; a lépés a hvg.hu szerint összefügghet a 2027-es francia elnökválasztással.", "p": ["Christine Lagarde lemondott az Európai Központi Bank elnöki posztjáról, a hírt António Costa, az Európai Tanács elnöke jelentette be csütörtökön az X-en. Lagarde mandátuma rendes esetben 2027. október 31-én járt volna le.", "A hvg.hu szerint a távozás összefügghet a 2027-es francia elnökválasztással: a lemondással Emmanuel Macron, aki a tavaszi választások után biztosan távozik, még dönthet az utódról. A beszámolók szerint ezzel megakadályozhatják, hogy euroszkeptikus jelölt kerüljön az EKB élére.", "A cikk szerint Franciaország a holland Klaas Knot jelöltségét támogathatja. Lagarde 2019 novemberében érkezett az EKB-hoz az IMF éléről; lemondása már februárban is felmerült."], "cav": "A lemondás okairól és az utódról szóló részek beszámolókon alapulnak, hivatalos indoklást a cikk nem idéz; Knot jelöltsége nem megerősített.", "op": "Ha igaz, hogy a lemondás célja az utódlás időzítése, az a legtisztább példa arra, hogyan lesz egy független jegybank élére kerülés alku tárgya. Európa legfontosabb pénzügyi posztját nem kéne politikai naptárhoz igazítani.", "src": [["HVG: Lemondott Christine Lagarde, az Európai Központi Bank elnöke", "https://hvg.hu/gazdasag/20261029_christine-lagarde-lemond-antonio-costa-emmanuel-macron-francia-elnokvalasztas"]], "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/6cfaada4-33b3-4180-bc79-2847dc8b293e.jpg", "imgs": "HVG", "imgl": "https://hvg.hu/gazdasag/20261029_christine-lagarde-lemond-antonio-costa-emmanuel-macron-francia-elnokvalasztas", "cred": "Fotó: MTI / EPA / Laurent Gillieron"}, {"id": "szocialis-agazat-atalakitas", "r": "Belpolitika", "c": "Kormány", "w": "", "st": "Megerősített", "time": "okt. 29.", "t": "Húszmilliárd forintnyi plusz és átalakítás jön a szociális és gyermekvédelmi ágazatban", "s": "Kátai-Németh Vilmos szerint a három főigazgatóság helyett kettő lesz, januárban 15 százalékos bértömeg-emelés jön.", "p": ["Kátai-Németh Vilmos szociális és családügyi miniszter a Kossuth Rádióban azt mondta, a gyermekvédelem és a szociális ágazat „vízfejként” működő intézményrendszerét át kell alakítani. A jelenlegi három független főigazgatóság helyett kettő jön létre, az egyik a gyermekvédelemért, a másik a szociális ellátásokért felel, mindkettő kisebb létszámmal.", "A januári béremelés bruttó 15 százalékos bértömeget jelent, a szakállamtitkárság azon dolgozik, hogy ez minden dolgozóhoz eljusson; a bérpótlék és a bértábla rendszere is változik. A gyerekvédelemre 15,5 milliárd forinttal több jut, a pályát elhagyó szakemberek visszahívására és a férőhelybővítésre 4 milliárdot szán a kormány.", "A miniszter krízisalap létrehozását, a családmegtartó szolgáltatások erősítését, a speciális gyermeknevelő intézmények újranyitását és a gyermekvédelmi intézmények folyamatos átvilágítását is említette."], "cav": "A 444 címe húszmilliárdról szól, a leírásban a 15,5 és a 4 milliárdos tételek szerepelnek; a pontos összegzést a cikk nem részletezi. Az adatok a miniszter szavain alapulnak.", "op"
