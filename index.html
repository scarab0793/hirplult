 saját nyilatkozatok alapján közli, azokat külön nem ellenőriztük.", "op": "Egy tizenhét éves sportoló, aki a tanulást sem adja fel, jó példa arra, hogyan lehet külföldön is okosan építkezni. A veszprémi akadémia és az aalborgi képzés közti váltás pedig megmutatja, mennyire nyitottá vált a magyar utánpótlás.", "src": [["Index: A világ egyik legerősebb bajnokságába „adta el” magát a 17 éves magyar zseni", "https://index.hu/sport/kezilabda/2026/10/24/ferfi-kezilabda-veszpremi-kezilabda-akademia-aalborg-egyetem-kezilabda-magyar-valogatott-vers-hunor/"]]}, {"id": "eger-focicsapat-eladas", "r": "Sport", "c": "Labdarúgás", "w": "", "st": "Jelentett", "time": "okt. 27.", "t": "Eladta egri focicsapatát Mészáros Lőrinc ügyvédje", "s": "A HVG szerint Kertész József október 1-jén adta el a Lend-Ball Kft.-t, amely az Eger SE-t birtokolja.", "p": ["A HVG szerint Kertész József október 1-jén eladta az egri focicsapatot birtokló Lend-Ball Beruházó és Szolgáltató Kft.-t. A cikk szerint Kertész gyakran járt el Mészáros Lőrinc vállalatainak ügyvédjeként. A hírt a 444 is megírta. A céget a Med and Sport Bt. vette meg, tulajdonosa Farkas Balázs, aki az Eger SE-t üzemeltető Eger Labdarúgó Sport Kft. ügyvezetője. Farkas Kertész 2021-es megjelenése után pár hónappal lett az egri klub vezetője.", "A pénzügyi adatok szerint az eladott Lend-Ball 2,7 millió forint értékű befektetett eszközzel rendelkezik, tavaly nem volt árbevétele. A vevő Med and Sport tavaly 29 millió forint árbevételt ért el, 8,4 millió forint nyereséget termelt. Az egri klub Kertész megjelenésekor NB III-as volt, és azóta is harmadosztályú. A cikk szerint szponzorai között volt Szíjj László Duna Aszfalt cége és az Aczél Zoltán vezette Belfry-csoport, amely a felcsúti és az eszéki csapatot is támogatja.", "A HVG említi, hogy az áprilisi kormányváltás óta a Duna Aszfalt három másik céggel együtt kihátrált a felcsúti Puskás Akadémia mögül, szeptemberben pedig kiderült, hogy a Hell már nem szponzorálja a DVTK-t."], "cav": "A cikk nem közli az eladási árat és a felek reakcióját. A HVG a 444 beszámolójára is hivatkozik, az eredeti cikket nem láttuk.", "op": "A kormányváltás óta a magyar futball finanszírozói sorra lépnek vissza, az egri eladás pedig ebbe a mintába illik. Ha a közpénzből táplált kör szűkül, kiderülhet, mennyi élet marad a klubokban.", "src": [["HVG: Eladta focicsapatát Mészáros Lőrinc ügyvédje", "https://hvg.hu/kkv/20261027_eger-focicsapat-eladas-kertesz-jozsef-meszaros-lorinc-ugyvedje"]]}, {"id": "m6-atlagsebesseg-meres", "r": "Közélet", "c": "Közlekedés", "w": "", "st": "Megerősített", "time": "okt. 26.", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/0de39d2d-3f41-43fe-9974-ab60bfe9cc1a.jpg", "imgs": "HVG", "imgl": "https://hvg.hu/itthon/20261026_vitezy-david-atlagsebesseg-m6-autopalya", "cred": "Nyitókép: Túry Gergely / HVG", "t": "Az M6-oson 213 km/h volt a legmagasabb mért szakaszátlag: bevezetnék az átlagsebesség-mérést", "s": "A Magyar Közút szerint a személyautók több mint 17 százaléka legalább egy szakaszon 145 km/h fölötti átlagsebességgel haladt.", "p": ["A Magyar Közút október 13-án egész napos sebességvizsgálatot végzett az M6-os autópálya több szakaszán, az eredményeket Vitézy Dávid közlekedési és beruházási miniszter ismertette egy Facebook-bejegyzésben. Összesen 8269 jármű közlekedését vizsgálták. A személyautók több mint 17 százaléka legalább az egyik szakaszon 145 km/h feletti átlagsebességgel haladt, közel 6 százalékuk 165 km/h fölötti átlaggal. A legmagasabb mért szakaszátlag 213,55 km/h volt, a legtöbb szabályszegést éjszaka, hajnali 1 és 4 óra között rögzítették.", "Vitézy szerint az átlagsebesség-mérés azt mutatja meg, kik haladnak kilométereken át a megengedettnél gyorsabban, nem csak egy előzés erejéig. A traffipaxos mérés hátránya, hogy csak egy ponton működik, ezért a sofőrök lassíthatnak, utána újra gyorsíthatnak. A hatályos jogszabályok azonban nem teszik lehetővé a szankcionálást az átlagsebesség alapján, ezt szeretnék megváltoztatni.", "A nyáron indított közlekedésbiztonsági kérdőív több százezer kitöltőjének 72,2 százaléka támogatta az átlagsebesség-mérést, 94,2 százalékuk pedig azt, hogy az autópályán a 200 km/h feletti gyorshajtás önálló bűncselekmény legyen. A sebességhatárt túllépők nagy többsége 1–10 km/h-val lépte túl a korlátot, a szabályozásnak ezt a különbséget is tükröznie kell. A miniszter hangsúlyozta, hogy a cél nem a minél több bírság, hanem a szabályok betartatása és a balesetek megelőzése."], "cav": "A cikk eltérően írja a gyorshajtók arányát: a bevezető „közel ötödéről” beszél, a törzsszöveg pontos száma 17 százalék fölött van. A vizsgált szakaszok pontos helye, az átlagsebesség-mérés bevezetésének időpontja és a jogszabály-módosítás tervezete nem derül ki.", "op": "Az, hogy valaki kilométereken át 200 fölött halad az autópályán, nem „gyorshajtás”, hanem életveszély. Az átlagsebesség-mérés jó eszköz, de csak akkor hiteles, ha a szabályozás megkülönbözteti a 136-tal és a 213-mal haladót.", "src": [["HVG: Átlagsebességet mértek az M6-oson, a legmagasabb szakaszátlag 213 km/h volt", "https://hvg.hu/itthon/20261026_vitezy-david-atlagsebesseg-m6-autopalya"]]}, {"id": "m1-m7-burkolatjavitas", "r": "Közélet", "c": "Közlekedés", "w": "", "st": "Megerősített", "time": "okt. 25.", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/0de39d2d-3f41-43fe-9974-ab60bfe9cc1a.jpg", "imgs": "HVG", "imgl": "https://hvg.hu/itthon/20261025_m1-m7-autopalya-felujitas-utburkolat", "cred": "Illusztráció. Fotó: Túry Gergely / HVG", "t": "Hétfőtől felfordulás az M1–M7 közös szakaszán: nagy felületű burkolatjavítás kezdődik", "s": "A munkák november harmadik hetéig tartanak, közel 35 ezer négyzetméteren, 9 kilométeren dolgoznak.", "p": ["Október 26-tól nagy felületű burkolatjavítás kezdődik az M1–M7 közös szakaszán, valamint az M7-es autópályán és az M0-s autóúton, Budaörs, Törökbálint és Diósd térségében. A munkák több ütemben zajlanak, és várhatóan november harmadik hetéig tartanak. Vitézy Dávid közlekedési és beruházási miniszter szerint a cél nem csak a kátyúk javítása: ahol a pályaszerkezet elöregedése miatt tartós felújításra van szükség, ott a kötő- és a kopóréteget is cserélni kell.", "A következő hetekben, még a téli időszak előtt közel 35 ezer négyzetméteren, összesen mintegy 9 kilométeren dolgoznak, 8400 tonna aszfalt felhasználásával. Október 26–27-én az M1–M7 közös, Budapestről kivezető szakaszán a szétválásnál a középső sávot lezárják, az M7 Balaton felé vezető oldalán az M0-ra és a 8103-as útra vezető lehajtó zárva lesz. Október 27–28-án az M7 Budapest felé vezető oldalán, a Sport utcai csomópontnál lezárják a külső lassítósávot, október 28–29-én ugyanitt, az M0-s csomópont közelében mintegy 500 méteren a külső sávot.", "A munkák novemberben az M7-esen és az M0-s érintett szakaszain folytatódnak. A cikk szerint az ütemezés az időjárástól és a kivitelezési körülményektől függően változhat, a Magyar Közút az Útinform szolgálatán keresztül folyamatosan tájékoztat, és hosszabb menetidővel érdemes számolni."], "cav": "A cikk nem közli a beruházás költségét, a kivitelező nevét és a novemberi ütemek részletes forgalmi rendjét. A forrás az MTI.", "op": "A téli idő előtti burkolatjavítás nem látványos, de ilyenkor derül ki, mennyire komolyan veszi a kormány az infrastruktúra karbantartását. Aki ezeken a szakaszokon közlekedik, a következő három hétben türelmet és plusz időt hozzon magával.", "src": [["HVG: Hétfőtől felfordulás az M1–M7 közös szakaszán: burkolatjavítás kezdődik", "https://hvg.hu/itthon/20261025_m1-m7-autopalya-felujitas-utburkolat"]]}, {"id": "elon-musk-ai-odusszeia", "r": "Kultúra", "c": "Film", "w": "", "st": "Jelentett", "time": "okt. 26.", "t": "Megjelent az Elon Musk saját AI-jával készült Odüsszeia-film előzetese, és a nézők csúfolják", "s": "A hétperces trailer a The Independent szerint negatív fogadtatást kapott; a Grok Imagine-nal készült film év vége előtt jöhet.", "p": ["Elon Musk mesterséges intelligenciával készített Odüsszeia-adaptációjának első, hétperces előzetesét nemrég tették közzé az X-en. A HVG a The Independent beszámolóját idézi, amely szerint a nézők többsége negatívan fogadta, és élesen bírálták a látványvilágot és az AI-jelenetek minőségét. Musk korábban többször támadta Christopher Nolan filmjének szereposztását, és júliusban bejelentette, hogy Grok Imagine nevű AI-platformja az év vége előtt egész estés filmadaptációt készít, amely „történelmileg hiteles” lesz.", "Az AI-változat a Wonder Studiosszal és Dev Walker rendezővel közös együttműködésben készült. Az előzetes Odüsszeusz trójai háborús indulásával kezdődik, a cikk szerint azonban a szereplők angolul beszélnek, nem ógörögül, a színészi játék komikusnak hat, a képi világ pedig nem tűnik jobbnak a legtöbb AI-videónál. Emily Wilson klasszika-filológus, akinek fordítását a forgatókönyv alapjául használták, felszínesnek nevezte a produkciót.", "A cikk megemlíti, hogy Nolan Odüsszeia című filmje világszerte több mint 1,7 milliárd dollár bevételt ért el, a rendező legjobb nyitóhétvégéjét produkálta 264,1 millió dolláros nemzetközi bevétellel, és az IMAX-formátum történetének legjövedelmezőbb filmje lett."], "cav": "A cikk a The Independent beszámolójára épül, az előzetest nem láttuk, a fogadtatás leírása másodkézből származik. A cikkből nem derül ki, hogy a film pontosan mikor jelenik meg.", "op": "Egy trailer még nem film, de az X-es reakciók azt mutatják, hogy az AI-nak a képi igényesség mellett a történetmesélés a legnagyobb akadálya. Egy Homérosz-adaptáció nem csak látványból áll: attól lesz a mű, hogy van mögötte valaki, aki érti és szereti.", "src": [["HVG: Megjelent az Elon Musk saját AI-jával készült Odüsszeia-film előzetese", "https://hvg.hu/kultura/20261026_elon-musk-ai-odusszeia-film-elozetes"]]}, {"id": "pestext-fesztival", "r": "Kultúra", "c": "Irodalom", "w": "", "st": "Megerősített", "time": "okt. 26.", "t": "Kelet és Nyugat találkozik: novemberben újra PesText-fesztivál lesz Budapesten", "s": "A fesztivált november 12–14. között rendezik a Három Hollóban és a Petőfi Irodalmi Múzeumban, fókuszban az ukrán könyvkultúra.", "p": ["A PesText Nemzetközi Irodalmi és Kulturális Fesztivál őszi rendezvénye november 12. és 14. között lesz Budapesten, a Három Hollóban és a Petőfi Irodalmi Múzeumban. A programban pódiumbeszélgetések, felolvasások, könyvbemutatók és dedikálások szerepelnek. Az Index szerint a fesztivált 2019 óta a MISZJE szervezi, idén negyedik egymást követő évben tartanak tavaszi és őszi rendezvényt.", "A külföldi vendégek között van Didier Eribon francia szociológus és író, Guzel Jahina tatár származású orosz szerző, Federica Manzon olasz írónő (Campiello-díjas), a qntm írói néven alkotó brit sci-fi szerző, valamint Ljuba Jakimcsuk ukrán költő és drámaíró, Pavol Rankov szlovák író és Malina Prześluga lengyel drámaíró. A cikk külön kiemeli a műfordítók szerepét: a magyar vendég Tankó Timea, aki német nyelvre fordította Visky András Kitelepítés című regényét.", "A fesztivált hagyományosan kiállítás nyitja a Petőfi Irodalmi Múzeumban, az idei a kortárs ukrán könyvkultúrát és illusztrációt mutatja be, az Agrafka Studio munkásságával. A beszélgetések idegen nyelven zajlanak, de a szervezők tolmácstechnikát biztosítanak a magyar közönségnek, a helyszíneken a szerzők könyveit meg lehet vásárolni."], "cav": "A cikk nem közli a részletes programot, a jegyárakat, a pontos időpontokat és a belépési feltételeket.", "op": "A PesText azért értékes, mert olyan nyelvekből hoz szerzőket, amelyek a magyar könyvpiacon ritkán szólalnak meg. Az ukrán kiállítás és a műfordítók szerepe pedig jelzi: az irodalom ma is egy hidat jelent Kelet és Nyugat között.", "src": [["Index: Kelet és Nyugat találkozik, Budapest lesz a közös nevező", "https://index.hu/kultur/2026/10/26/pestext-nemzetkozi-irodalmi-es-kulturalis-fesztival-2026-vilagirodalom"]]}, {"id": "inkubator-dokumentumfilm", "r": "Kultúra", "c": "Film", "w": "", "st": "Megerősített", "time": "okt. 25.", "t": "Inkubátor: az 1956-os menekültek amerikai gyerekeiről szól az új Jeti Mozi-dokumentumfilm", "s": "Pigniczky Réka 2009-es filmje egy 1984-es cserkésztábor előadását és a kettős identitást követi.", "p": ["A 444 a Jeti Mozi bemutatójában ismerteti Pigniczky Réka Inkubátor című dokumentumfilmjét. A 2009-es film az 1956 után Amerikába menekült magyarok gyermekeiről és kettős identitásukról szól: arra keresi a választ, hol van igazán otthon a menekültek második generációja.", "A film középpontjában egy 1984-es amerikai magyar cserkésztábor áll, ahol a többnyire Amerikában született fiatalok az István, a király című előadást adták elő. Huszonöt évvel később újra összegyűltek, hogy megismételjék a produkciót. A dokumentumfilm azt vizsgálja, hogyan próbáltak a menekült szülők magyar világot teremteni gyermekeiknek Amerikában, és milyen érzés két kultúra és két haza között felnőni.", "A stáblistán szerepel a rendező Pigniczky Réka, az operatőr Kiss Gergő, a vágó Hargittai László és a producerek között Gerő Barnabás. A gyártó és forgalmazó az 56Films."], "cav": "A cikk nem közli a film hosszát, a bemutató pontos időpontját, és díjakat vagy fesztiválszereplést sem említ.", "op": "A kettős identitásról szóló filmek akkor működnek, ha nem csak nosztalgiát mutatnak, hanem a kérdést is feltesszük: mi marad meg egy kultúrából, ha az otthon már nem létezik? Az 1956-os évforduló hetén különösen időszerű téma.", "src": [["444: Inkubátor: Olyan Magyarországot építettek Amerikában, ami otthon már nem létezik", "https://444.hu/2026/10/25/inkubator-olyan-magyarorszagot-epitettek-amerikaban-ami-otthon-mar-nem-letezik"]]}, {"id": "lelegeztetogep-nav-razzia", "r": "Belpolitika", "c": "Bűnügy", "w": "Lélegeztetőgép-ügy", "st": "Megerősített", "time": "okt. 27.", "img": "https://kep.index.hu/1/0/7226/72267/722672/72267249_fd253e73ac1f9790c1e3e041cd1fe7da_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/10/27/nav-lelegeztetogep-biznisz-covid-19-feljelentes/", "cred": "Illusztráció. Fotó: Carmen Ruiz Alonso / Getty Images (Index)", "t": "Lecsapott a NAV a lélegeztetőgép-bizniszre: több mint hárommilliárd forintot moshattak tisztára", "s": "Hazai helyszíneken és Ausztriában is razziázott a NAV: a gyanú szerint a 15,6 milliárdos állami szerződésből bűnszervezet mosott tisztára hasznot.", "p": ["A NAV kedden közölte, hogy október 27-én hajnalban összehangolt akciót hajtott végre több magyarországi helyszínen, Ausztriában pedig külföldi jogsegély alapján. A hatóság szerint a koronavírus-járvány idején lélegeztetőgépekkel és egészségügyi maszkokkal kereskedő bűnszervezet több mint 3 milliárd forint hasznot mosott tisztára, és mintegy 660 millió forint adó elkerülésével károsította meg a költségvetést.", "A szervezet szerződést kötött a Szijjártó Péter vezette Külgazdasági és Külügyminisztériummal, valamint az Állami Egészségügyi Ellátó Központtal, ennek nyomán 800 lélegeztetőgép és 3 millió maszk érkezett Kínából. A HVG és az Index szerint a magyar állam ezekért összesen 15,6 milliárd forintot fizetett.", "A NAV szerint a csoport tényleges tevékenységet nem folytató cégek hálózatán át értékesített. A számlagyártó cégek fiktív, informatikai szolgáltatásokról szóló számlákat állítottak ki, így jogosulatlanul csökkentették az áfát. A haszon egy részét az Egyesült Arab Emírségekben bejegyzett társaságnak utalták, a többit belföldön vették fel készpénzben. A szervezet csúcsán a hatóság szerint egy korábban a Budapesti Értéktőzsdén jegyzett részvénytársaság állt.", "A kényszerintézkedések során nagyjából 1,5 milliárd forint értékű vagyont foglaltak le és zároltak. Egy férfit európai elfogatóparancs alapján fogtak el Ausztriában, tizenegy embert gyanúsítottként hallgattak ki, közülük kettőt őrizetbe vettek. Az egyik szökésben lévő irányító ellen nemzetközi elfogatóparancsot adtak ki, ő a hírek szerint valószínűleg Indonéziában tartózkodik.", "A NAV bűnszervezetben elkövetett, különösen jelentős értékre elkövetett költségvetési csalás és pénzmosás miatt nyomoz, a Nemzeti Nyomozó Iroda pedig hűtlen kezelés miatt vizsgálódik, a túlárazásokra és a gépek használhatóságára is kiterjedően. Hegedűs Zsolt egészségügyi miniszter szerint minden felmerülő visszaélés gyanúját alaposan ki kell vizsgálni. A HVG háttérként felidézi: 2020 tavaszán mintegy 19 ezer lélegeztetőgépet vett az ország, ebből 16 ezret a külügyi tárca, nagyjából 300 milliárd forintért, és a gépek jelentős része ma is raktárban áll."], "cav": "A NAV nem nevezte meg a gyanúsítottakat. A 444 szerint a körözött Majer Bálint, az OTT-One egykori vezérigazgatója; az Index (amely Májer-ként írja a nevet) nem erősíti meg, hogy ő lenne a szökésben lévő vezető, és azt írja, a cég valójában informatikai vállalkozás volt. A számok is eltérnek: a 444 tizenkét elővezetett emberről és három őrizetbe vételről ír, a NAV közlését követő HVG- és Index-cikk tizenegy kihallgatott gyanúsítottról, két őrizetről és egy ausztriai elfogásról.", "op": "A történet nehezen emészthető része nem is a pénzmosás technikája, hanem az arányok: 15,6 milliárd forintnyi közpénz ment el eszközökre, miközben a gépek jó része ma is raktárban áll. A magáncégek felelőssége most kiderül, a szerződést kötő állami oldalé viszont még nem. Az új kormánynak érdemes lesz azt is nyilvánosságra hoznia, mit talál a vizsgálat az állami döntéshozóknál.", "src": [["HVG: Lecsapott a NAV a lélegeztetőgép-beszerzések ügyében, Ausztriában razziázott a hatóság", "https://hvg.hu/gazdasag/20261027_nav-lelegeztetogep-beszerzesek-razzia-orizetbe-vetelek-ausztria"], ["Index: Milliárdokat mostak tisztára a lélegeztetőgép-bizniszben", "https://index.hu/belfold/2026/10/27/nav-lelegeztetogep-biznisz-covid-19-feljelentes/"], ["444: Elfogatóparancsot adtak ki a lélegeztetőgép-biznisz egyik főszereplője, Majer Bálint ellen", "https://444.hu/2026/10/27/elfogatoparancsot-adtak-ki-a-lelegeztetogep-biznisz-egyik-foszereploje-majer-balint-ellen"]]}, {"id": "matolcsy-adam-korozes", "r": "Belpolitika", "c": "Bűnügy", "w": "MNB-ügy", "st": "Megerősített", "time": "okt. 27.", "t": "Európai és nemzetközi elfogatóparancs Matolcsy Ádám és Stofa György ellen", "s": "A bíróság szerint egyikük sem tartózkodik a bejelentett lakóhelyén, feltehetően Európán kívülre távoztak, a magyar hatóság a kiadatásukat kéri.", "p": ["A Budai Központi Kerületi Bíróság október 27-én európai és nemzetközi elfogatóparancsot bocsátott ki két külföldön tartózkodó személy ellen az MNB-üggyel összefüggésben. Erről a Fővárosi Törvényszék közleménye tájékoztatott. Az eljárás különösen jelentős vagyoni hátrányt okozó gazdasági csalás és más bűncselekmények miatt indult.", "A nyomozás során Matolcsy Ádám György és Stofa György gyanúsítotti kihallgatására lett volna szükség, de a tartózkodási helyüket nem sikerült megállapítani, a felkutatásukra tett intézkedések eredménytelenek maradtak. Egyikük sem lakik a bejelentett magyarországi lakóhelyén, adatok szerint külföldre távoztak, és feltehetően Európán kívül vannak. A bíróság ennek ellenére indokoltnak látta, hogy az Európai Unió területén is keressék őket.", "A közlemény szerint Matolcsy Ádám György cselekménye bizonyítottság esetén felbujtóként elkövetett, különösen jelentős vagyoni hátrányt okozó gazdasági csalásnak és hamis magánokirat felhasználásának minősülhet. Stofa György esetében a közlemény a gazdasági csalást társtettesként, a hamis magánokirat felhasználását tettesként említi. A bíróság arányosnak találta az elfogatóparancs kiadását, a magyar igazságügyi hatóság pedig a kiadatásukat, illetve átadásukat kéri."], "cav": "Az Index cikke nem közli a vagyoni hátrány összegét, az érintett országok nevét és azt, hogy az elfogatóparancsok mikor kerülnek be a nyilvántartásba. Október 22-én a Telex még azt írta, hogy nemzetközi körözés nem volt, ez azóta megváltozott.", "op": "Az, hogy a gyanúsítottak a letartóztatás előtt eltűntek, mindent elmond arról, miért volt szükség a gyors fellépésre. Az igazi kérdés most az, hány országban lesz hajlandó a nyomozás együttműködni, és mennyire gyorsan. Az ártatlanság vélelme persze mindenkit megillet, de a körözés ténye önmagában is sokat mond.", "src": [["Index: Nemzetközi elfogatóparancsot adtak ki Matolcsy Ádám ellen", "https://index.hu/belfold/2026/10/27/nemzetkozi-elfogatoparancs-matolcsy-adam-europai-unio/"]]}, {"id": "wekerle-plusz-program", "r": "Gazdaság", "c": "Lakáspolitika", "w": "Wekerle+", "st": "Megerősített", "time": "okt. 27.", "t": "Wekerle+: az Otthon Startot kiváltó lakáshitel, energetikai felújítási támogatás és visszatérő lakástakarék", "s": "A kormány szerdától indítja az új vásárlási és építési hitelt, 2027 januárjában jön a lakástakarék, a babaváró feltételei pedig enyhülnek.", "p": ["Magyar Péter miniszterelnök, Kármán András pénzügyminiszter és Kapitány István gazdasági és energetikai miniszter kedden sajtótájékoztatón mutatta be a Wekerle+ lakásprogramot. Kármán szerint a program október 28-tól érhető el, a vonatkozó kormányrendelet kedden jelenik meg, a bankoknál azonban néhány napos átfutási idővel kell számolni. Az adásvételi szerződéssel már rendelkezők 15 napos türelmi időt kapnak, így ők még igénybe vehetik az Otthon Startot, amelyet a Wekerle+ vált. Magyar Péter lakáspolitikai paradigmaváltásról beszélt.", "A használt lakásra felvehető hitel feltételei Kármán szerint közelebb állnak a piaci viszonyokhoz, és a befektetési célú lakásvásárlásokat kiszűrik. Az 1,5 millió forintos négyzetméterár-limitet vidéken nem differenciálták, Budapesten nem emelték, hogy ne hajtsák fel az árakat. A bankoknak ellenőrizniük kell, hogy az igénylő meglévő ingatlana belefér-e a 30 milliós határba, és hogy az új lakásban életvitelszerűen lakik-e.", "Az energetikai felújítási programot Kapitány István ismertette: a hazahozott uniós forrásokból 1,5 milliárd euró (nagyjából 633 milliárd forint) áll rendelkezésre. Családi házra 15 millió forintos, fix 3 százalékos kamatú hitel vehető fel 30–50 százalékos vissza nem térítendő támogatással, a társasházi program 5 millió, a panelprogram 4 millió forintos, nulla kamatú hitelt ad, szintén 30–50 százalékos támogatással. A tervek szerint 2030-ig 120 ezer lakóingatlant korszerűsítenek.", "A lakástakarék 2027 januárjában indul, és visszatér az állami támogatás: az első öt évben a befizetett összeg 10, a hatodik évtől 20 százalékát egészíti ki az állam. Havi 100 ezer forint befizetésével tíz év után akár 16 millió forint is összegyűlhet. A babaváró hitelt megtartják, de módosítják: a kamatmentesség csak akkor marad meg, ha a gyermek öt éven belül megszületik, önhibán kívüli elmaradás esetén viszont nincs szankció. Meddőségi kezelés vagy örökbefogadás esetén egyéves haladék jár, válás miatt két év kamatmentesség kérhető, büntetőkamat nélkül. A módosítás mintegy 25 ezer családot érint.", "A 2027-es költségvetés tervezetét október 30-án, pénteken nyújtják be. A bérlakás-építésről egyelőre nincsenek konkrét számok: Magyar Péter szerint Vitézy Dáviddal több programon dolgoznak, az állam beruházóként csak kivételesen venne részt, a magántőke bevonásának mértéke nyitott kérdés."], "cav": "A Wekerle+ támogatásainak és a lakástakarék teljes költségét a sajtótájékoztatón nem közölték: Kármán szerint összességében kisebb terhet jelentenek, mint az Otthon Start folytatása, a 2030-ig szóló összeget viszont nem tudta megmondani. A cikk az Index percről percre tudósítása alapján készült, nem a kormányrendelet szövegéből.", "op": "A kormány itt szakít az Otthon Start logikájával, és ez jó irány: a támogatás kevésbé hajtja fel a lakásárakat, a befektetői vásárlásokat kiszűrik, az energetikai felújításra pedig valódi pénz jut. A nyitott kérdés a bérlakás: lakáspolitika addig nem teljes, amíg a bérlőknek csak ígéretek jutnak. A költségvetés pénteki benyújtásakor derül ki, mennyire fedezett mindez.", "src": [["Index: Wekerle Lakásprogram – percről percre (Magyar Péter, Kármán András, Kapitány István)", "https://index.hu/belfold/2026/10/27/magyar-peter-karman-andras-2027-koltsegvetes-ado-szja-kata-tisza-kormany-kapitany-istvan/"]]}, {"id": "banki-utalas-illetek-150-ezer", "r": "Gazdaság", "c": "Pénzügy", "w": "", "st": "Jelentett", "time": "okt. 28.", "t": "Háromszorosára nő az illetékmentes banki átutalások határa: 150 ezer forintig nem kell fizetni", "s": "Magyar Péter bejelentése szerint a jelenlegi 50 ezer forintos határt 150 ezerre emeli a kormány.", "p": ["Magyar Péter miniszterelnök szerdán a Facebook-oldalán jelentette be, hogy a banki átutalások 150 ezer forintig illetékmentesek lesznek. A lakosságra vonatkozó összeghatár jelenleg 50 ezer forint, ezt emeli háromszorosára a kormány.", "A 444 a biztosdontes.hu egy héttel korábbi beszámolójára hivatkozik, amely szerint a kormány 2027-től háromszorosára emelheti az illetékmentes átutalások határát. Ugyanez a forrás azt írta, hogy a tranzakciós illetéket a bankoknak kell megfizetniük, de azt az ügyfeleket érintő díjaikra terhelhetik."], "cav": "A bejelentés alapján nem derül ki, mikortól lép életbe az emelés: a 2027-es évet a cikk csak a biztosdontes.hu-ra hivatkozva említi. A cikk azt sem közli, mely bankdíjakat emelhetnék a bankok, és mennyivel.", "op": "A lépés a háztartásoknak jó hír, de a kérdés az, ki fizeti végül a számlát. Ha a bankok az illetéket továbbhárítják, az ügyfél más díjtételekben veszíthet vissza valamit abból, amit az emelésen nyer. Érdemes lesz látni a rendelet részleteit.", "src": [["444: 150 ezer forintig illetékmentesek lesznek a banki utalások", "https://444.hu/2026/10/28/150-ezer-forintig-illetekmentesek-lesznek-a-banki-utalasok"]]}, {"id": "uzemanyag-adoemeles-halasztas", "r": "Gazdaság", "c": "Adó", "w": "", "st": "Megerősített", "time": "okt. 28.", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/8b99304c-8ded-4bf1-9333-28fa4301015a.jpg", "imgs": "HVG", "imgl": "https://hvg.hu/gazdasag/20261028_uzemanyagok-adoemeles-halasztas", "cred": "Fotó: Veres Viktor / HVG", "t": "Fél évvel elhalasztják a prémium üzemanyagok és a kerozin jövedéki adójának emelését", "s": "A 2027-es emelés januárról júliusra csúszik, a benzinkúton ez literenként néhány forintot jelenthet.", "p": ["A kormány fél évvel elhalasztaná a prémiumbenzin, a prémiumgázolaj és a kerozin jövedéki adójának 2027-es emelését. A HVG a Portfolio beszámolójára hivatkozva azt írja, hogy a döntés az október 27-én benyújtott törvényjavaslaton alapul, az indoklás szerint a magas üzemanyagárak miatt. Az emelés így 2027. január 1. helyett július 1-jén lépne életbe, mértékét a 2026. júliusi, 1,2 százalékos infláció adja.", "A NAV adatai szerint az általános jövedékiadó-mérték jelenleg literenként 165,63 forint benzinnél és 155,16 forint gázolajnál. Az 1,2 százalékos valorizáció benzinnél nagyjából 1,99, gázolajnál 1,86 forintos adóemelést jelentene, ami 27 százalékos áfával literenként nagyjából 2,5, illetve 2,4 forint, ha az árakban teljes egészében megjelenik.", "A halasztás a tankolók szűk körét érinti: a Magyar Ásványolaj Szövetség szerint 2026 első felében 2,08 milliárd liter üzemanyagot adtak el, ebből 120 millió liter volt prémiumbenzin (14,9 százalék), 110 millió liter prémiumgázolaj (8,6 százalék). A kerozinnál a hatás még kisebb lehet, mert a kereskedelmi légi közlekedésben használt kerozin főszabály szerint eleve adómentes, így a halasztás elsősorban a magáncélú repülést érinti."], "cav": "A cikk a Portfolio beszámolójára épül, a benyújtott törvényjavaslat szövegét nem láttuk. A forintos hatás elméleti: attól függ, hogy a forgalmazók mennyit hárítanak át a fogyasztói árakban.", "op": "Pár forint literenként nem fordítja meg a háztartások költségvetését, és az érintett üzemanyagokat a tankolók kisebb része veszi. A halasztás inkább jelzés: a kormány az idén kapott inflációs lökéssel óvatosan bánik. Ennél nagyobb kérdés, hogy az általános üzemanyagárakról mit mond majd a költségvetés.", "src": [["HVG: Több üzemanyag adóemelését is elhalasztja a kormány", "https://hvg.hu/gazdasag/20261028_uzemanyagok-adoemeles-halasztas"]]}, {"id": "bayer-construct-kotveny", "r": "Gazdaság", "c": "Tőzsde", "w": "MNB-ügy", "st": "Megerősített", "time": "okt. 27.", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/d25c1350-246d-4cc4-9102-dcf784553559.jpg", "imgs": "HVG", "imgl": "https://hvg.hu/kkv/20261027_bayer-construct-kotveny-felfuggesztes-nem-fizetes", "cred": "Bosnyák téri Zenit by Bayer irodaházak. Fotó: Veres Viktor / HVG", "t": "Felfüggesztették a Bayer Construct kötvényeinek kereskedését: a jegybank is érintett", "s": "A BÉT szerint a csődeljárás alatt álló cég nem tájékoztatta a tőzsdét a 3,01 milliárdos tőketörlesztésről.", "p": ["A Budapesti Értéktőzsde tájékoztatása szerint a csődeljárás alatt álló Bayer Construct Zrt.-nek 3,01 milliárd forint tőketörlesztés vált esedékessé, a társaság azonban nem közölte a tőzsdével, hogy teljesítette-e. A BÉT ezért október 27-től határozatlan időre felfüggesztette a cég kötvényeinek kereskedését. A tőzsde szerint többször megkereste a céget, de nem kapott megfelelő tájékoztatást. Október 21-én a tőke mellett 1,1 milliárd forint kamatot is ki kellett volna fizetni.", "A cég szeptember 25. óta fizetési moratórium alatt áll, tehát a törlesztést valójában nem kellett teljesítenie, a BÉT kifogása a tájékoztatás hiányára vonatkozik. A Balázs Attila tulajdonában lévő vállalat 2021 októberében, a Matolcsy György vezette jegybank Növekedési Kötvényprogramjában 30,1 milliárd forintot vont be, tízéves futamidejű, 3,7 százalékos fix kamatozású kötvényekkel. A HVG szerint az MNB ebből 20,75 milliárd forintot vásárolt, így a cég fizetésképtelensége a jegybankot is érinti.", "A Bayer augusztus 26-án maga kezdeményezett csődeljárást, főként a XIV. kerületi Bosnyák téri irodakomplexum meghiúsult állami értékesítése miatt. A kormány szeptember 4-én stratégiailag kiemelt jelentőségűvé minősítette az eljárást, a bíróság szeptember 25-én rendelte el. A Scope Ratings augusztus 28-án nemteljesítési (D) kategóriába sorolta a céget. A vállalatcsoport árbevétele 2026 első félévében 91,8 milliárd forint volt, szemben az előző év 122,3 milliárdjával, adózott eredménye 12 milliárdról 4,4 milliárdra esett."], "cav": "A cikk nem közli a cég hivatalos reakcióját és a BÉT-határozat teljes szövegét, és azt sem, hogy a Bayer ténylegesen teljesítette-e a törlesztést vagy a kamatot.", "op": "A jegybanki kötvényprogram egyik legnagyobb szereplője csődben van, a jegybank pedig a kötvények nagy részét birtokolja. Ez a közpénzről szóló vizsgálatok egyik legkézzelfoghatóbb tétele lehet, és az MNB-ügy sokkal szélesebb annál, mint ami az alapítványokról szóló hírekből látszik.", "src": [["HVG: A tőzsde felfüggesztette a Bayer Construct kötvényeinek kereskedését", "https://hvg.hu/kkv/20261027_bayer-construct-kotveny-felfuggesztes-nem-fizetes"]]}, {"id": "forint-dollar-gyenge", "r": "Gazdaság", "c": "Devizapiac", "w": "", "st": "Megerősített", "time": "okt. 27.", "img": "https://kep.index.hu/1/0/7225/72256/722560/72256041_4de5aa1d666f0702bb8f65b27ebefbc2_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/gazdasag/2026/10/27/forint-valuta-deviza-euro-dollar/", "cred": "Fotó: Stiller Ákos / Bloomberg / Getty Images (Index)", "t": "Fél éve nem volt ilyen gyenge a forint a dollárral szemben", "s": "A dollár kedd reggel 329 forint fölé emelkedett, az euróval szemben is nyomás alatt a forint.", "p": ["A forint újabb mélypontra került a dollárral szemben: az amerikai deviza árfolyama kedd reggel 329 forint fölé emelkedett. A Google Finance adatai szerint október 27-én reggel nagyjából 329,20 forintot jegyeztek egy dollárért, és a Twelve Data historikus adatai szerint hétfőn is átlépte a 329 forintot. Az elmúlt hat hónapban nem volt ilyen drága a dollár forintban.", "A Wise hathavi összesítése szerint a dollár tavaszi, körülbelül 300,67 forintos mélypontjától indult felfelé, ez a cikk számítása szerint több mint 9 százalékos emelkedés. Az MNB hivatalos középárfolyama október 26-án 327,49 forint volt dollárnként.", "A gyengülés nem csak a dollárnál látszik: a Portfolio hétfői piaci összefoglalója szerint a forint az előző héten több mint 1 százalékot veszített az euróval szemben is. A befektetők a közeljövőben főleg a 2027-es költségvetésre, a magyar gazdaság középtávú kilátásaira, valamint az amerikai és európai jegybankok kamatdöntéseire figyelhetnek."], "cav": "A piaci jegyzés napközben folyamatosan változik, ezért az idézett számok eltérhetnek az MNB hivatalos árfolyamától. A cikk konkrét euró-árfolyamot és előrejelzést nem közöl.", "op": "A forint gyengülését nem lehet egyetlen okra visszavezetni, de a következő napok eseménye világos: pénteken benyújtják a költségvetést, és a piac ebből olvassa majd ki, mennyire hiteles a kormány pénzügyi pályája.", "src": [["Index: Fél éve nem volt ilyen gyenge a forint a dollárral szemben", "https://index.hu/gazdasag/2026/10/27/forint-valuta-deviza-euro-dollar/"]]}, {"id": "izraeli-valasztas-tozsde", "r": "Külföld", "c": "Közel-Kelet", "w": "Izraeli választás", "st": "Jelentett", "time": "okt. 28.", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/09ec618a-fbff-47e4-912a-4fa5458a3dfb.jpg", "imgs": "HVG", "imgl": "https://hvg.hu/gazdasag/20261028_izraeli-valasztas-zuhan-a-tel-avivi-tozsde-gyengul-a-sekel", "cred": "Szavazás Izraelben 2026. október 27-én. Fotó: Ahmad Gharabli / AFP (HVG)", "t": "Zuhan a tel-avivi tőzsde és gyengül a sékel az izraeli választási részeredmények után", "s": "A TA-125 index 3, a bankok indexe 4,3, az ingatlanpiaci részvények indexe 6 százalék fölött esett.", "p": ["A tel-avivi tőzsde a részleges izraeli választási eredmények megjelenése óta esik, a sékel pedig jelentősen gyengült. A TA-90 index 4,3, a TA-125 3, a TA-35 pedig 2,7 százalékkal csökkent. A tőzsde hétfőn, közvetlenül a választás előtt csaknem 2 százalékot emelkedett.", "Az eladási nyomás elsősorban a pénzügyi és ingatlanpiaci részvényekre nehezedett: a banki index 4,3, a biztosítási index 6,8, a pénzügyi index 5,4 százalékot esett. Az ingatlanpiaci index 6,1, az építőipari index 7,7, az infrastruktúra-index 3 százalékkal gyengült. Egyes részvények kétszámjegyű veszteséget szenvedtek, például az Israel Canada 11,6, az Africa Israel Residences 10,6 százalékot. Emelkedni tudott a Palo Alto Networks (4,1), a Tower Semiconductor (2,3) és a Nova (1,8 százalék).", "A sékel a dollárral és az euróval szemben is gyengült, a trend az exit pollok közzététele után fordult meg, majd a szavazatok összeszámlálásának kezdetekor erősödött. A cikk szerint a csütörtöktől érvényes új üzemanyagárak miatt a 95-ös benzin literenkénti ára megközelítheti a 9 sékelt, nagyjából ezer forintot."], "cav": "A cikk szövege nem közli a választás eredményét. A kapcsolódó ajánlók szerint az exit poll szerint Ejzenkot két-három mandátumnyi előnyt kapott, Netanjahu ellen nincs többség, de az ő pártja kaphatja a legtöbb mandátumot; ezt a cikk nem a törzsszövegben, hanem egy ajánlóban állítja. A sékel konkrét árfolyamát sem adja meg.", "op": "A piac azonnal mondott véleményt, mielőtt a politikai kép tisztázódott volna, és ez önmagában árulkodik: a befektetők a bizonytalanságot árazzák. A részeredményekből viszont még nem érdemes messzemenő következtetést levonni.", "src": [["HVG: Izraeli választás: zuhan a tel-avivi tőzsde, gyengül a sékel", "https://hvg.hu/gazdasag/20261028_izraeli-valasztas-zuhan-a-tel-avivi-tozsde-gyengul-a-sekel"]]}, {"id": "lula-brazil-valasztas", "r": "Külföld", "c": "Amerika", "w": "Brazil elnökválasztás", "st": "Megerősített", "time": "okt. 26.", "t": "Lula fordított és negyedszer is elnök: a vesztes Bolsonaro csalásról beszél", "s": "A hivatalban lévő elnök 51,78 százalékot kapott a második fordulóban; a vesztes oldal szerint a szavazás meghosszabbítása miatt vitatható az eredmény.", "p": ["A hivatalban lévő baloldali elnök, a 80 éves Luiz Inácio Lula da Silva nyerte meg a brazil elnökválasztás október 25-i második fordulóját. A Telex szerint a Munkáspárt jelöltje a szavazatok 51,78 százalékát kapta, kihívója, Flávio Bolsonaro szenátor 48,22 százalékot. Az első fordulóban, október 5-én még Bolsonaro vezetett 47,3 százalékkal Lula 45,16 százaléka előtt. A Telex szerint 1988 óta nem fordult elő, hogy nem az első forduló győztese nyerte a végső győzelmet.", "A választás napján a Legfelsőbb Bíróság elnöke két órával meghosszabbította a szavazóhelyiségek nyitvatartását, mert több városban kevesebb buszjáratot indítottak, így sokan nehezen jutottak el szavazni. A Telex szerint legalább nyolc államban voltak buszproblémák, a bíróság elrendelte, hogy Salvador állítsa helyre a közlekedést, és tegye ingyenessé. A hosszabbítást Lula támogatói kérték, Bolsonaro kampánya pedig a döntést az igazságszolgáltatás által végrehajtott puccsnak nevezte.", "A HVG a Le Monde nyomán azt írja, hogy Bolsonaro pártja, a Liberális Párt hétfőn elfogadta az eredményt, miközben jelöltjük az eredmények érvénytelenítését követeli, és szerinte a választást elcsalták. Donald Trump amerikai elnök a HVG szerint úgy nyilatkozott, hogy az eset számára egy újabb elcsalt választásnak tűnt. A HVG a Guardian nyomán azt is közli, hogy a bíróság megtiltotta Flávio Bolsonarónak az ország elhagyását, és kötelezte útlevele leadására, mert pénzmosás gyanúja miatt nyomoz ellene a rendőrség.", "A távolmaradók aránya 21 százalék volt, ami 1998 óta a legmagasabb, több mint 33 millió ember. Hatmillió szavazat érvénytelen volt. Lula a kampányban a szociális juttatások védelmére hivatkozott, és a büntethetőségi korhatár 18 évről 16 évre csökkentését is ígérte. Bolsonaro keményebb fellépést ígért a bűnözés ellen, és szerepelt a terveiben apja és a puccskísérlet érintettjeinek amnesztiája is. Jair Bolsonaro volt elnököt a puccskísérlet miatt 27 év börtönre ítélték. A Telex szerint a választás tétje az Amazonas-medence erdőinek sorsa is, mert zöld szervezetek szerint Bolsonaro győzelme visszahozhatná az erdőirtást."], "cav": "A Telex még nem tért ki rá, hogy a vesztes fél elismerte-e az eredményt; a HVG szerint a pártja elismerte, Flávio Bolsonaro viszont továbbra is az érvénytelenítést követeli. A szavazás meghosszabbításának jogszerűségét a források eltérően látják: Lula és a bíróság a közlekedési gondokra hivatkozott, Bolsonaro kampánya puccsnak nevezte. A Telex legalább nyolc érintett államot említ, a HVG nem közöl számot.", "op": "Amikor egy szoros eredmény után a vesztes csalásról kezd beszélni, az Egyesült Államok után Brazíliában is ismerős forgatókönyv látszik. A buszügy valós kérdés, de egy kiterjesztett szavazási idő és 3,5 százalékpontos különbség között nagy a távolság: a számok nem a bírói döntésen múltak. Brazília demokráciája a következő hetekben dől el, nem a vasárnapi urnazáráskor.", "src": [["Telex: Lula történelmi fordítással megnyerte a brazil elnökválasztást Flávio Bolsonaro ellen", "https://telex.hu/kulfold/2026/10/26/brazil-elnokvalasztas-flavio-bolsonaro-luiz-inacio-lula-da-silva"], ["HVG: Bolsonaro pártja elismerte Lula győzelmét a brazil elnökválasztáson", "https://hvg.hu/vilag/20261027_brazilia-elnokvalasztas-lula-flavio-bolsonaro-vereseg-utlevel"]]}, {"id": "spanyol-vonatbaleset", "r": "Külföld", "c": "Baleset", "w": "", "st": "Jelentett", "time": "okt. 28.", "img": "https://assets.4cdn.hu/kraken/8PPrXoFbcVcuuSbds.jpeg", "imgs": "444", "imgl": "https://444.hu/2026/10/28/mar-legalabb-64-halottja-van-a-spanyolorszagi-vasuti-tragedianak", "cred": "Fotó: Burak Akbulut / Anadolu via AFP (444)", "t": "Legalább 64 halottja van a spanyolországi nagysebességű vasúti ütközésnek", "s": "Hátulról belerohant egy Renfe-szerelvény egy nyílt pályán álló Iryo-vonatba Mora és Orgaz között.", "p": ["A Kasztília-La Mancha tartományi kormány tájékoztatása szerint a spanyolországi vasúti szerencsétlenségnek már 64 halálos áldozata van, a BBC-re hivatkozva. Nagyjából nyolcvan ember megsebesült. A baleset szerda délelőtt történt a Madridot Andalúziával összekötő nagysebességű vasútvonalon, Mora és Orgaz települések között: egy állami Renfe AVE-szerelvény hátulról nekiütközött az Iryo magánvasút egy, a nyílt pályán várakozó nagysebességű szerelvényének.", "Az első feltételezések szerint emberi mulasztás vezethetett a balesethez. Reggel meghibásodott az automatikus jelzőrendszer, ezért a térségben megállították a vonatokat, amíg az irányítóközpont kézi üzemmódra váltott. Ezután a járatokat továbbindulásra utasították, de az Iryo tisztázatlan okból nem indult el. A forgalomirányító mégis tovább engedte a Renfe járatát, amely a vágányon álló másik szerelvénybe rohant.", "A légifelvételek alapján a Renfe-szerelvény első két, az Iryo-szerelvény utolsó három kocsija kisiklott, közülük kettő felborult és lezuhant a töltésről. A két vonaton több mint ötszázan utaztak. Pedro Sánchez miniszterelnök a helyszínhez legközelebbi településre, Urdába tart, Emiliano García-Page tartományi elnök és Óscar Puente közlekedési miniszter szintén a helyszínre utazott. A cikk szerint ez az idei második halálos kimenetelű vasúti szerencsétlenség a spanyol nagysebességű vonalon: januárban Córdoba közelében két vonat ütközésében 46 ember halt meg. A 64 áldozat a legtöbb 2013 júliusa óta, amikor Santiago de Compostela közelében 80-an haltak meg."], "cav": "Az áldozatok száma a nap folyamán nőtt: a 444 korábbi címei még legalább 30, majd 64 halottról szóltak. A baleset okáról csak első feltételezések vannak. Az MTI spanyol lapértesülésekre hivatkozva azt írta, hogy az eltűntek között van Fátima Bánez volt munkaügyi miniszter; ezt a cikk nem erősíti meg önállóan.", "op": "Ilyenkor a legfontosabb az, hogy a vizsgálat gyorsan és nyilvánosan feltárja, hogyan történhetett ilyen ütközés egy kézi üzemmódra váltott rendszerben. A spanyol nagysebességű vasút egy éven belül már másodszor szenved el halálos balesetet, ezért a kérdés nem csak az egyedi emberi mulasztásról szól, hanem a rendszer biztonságáról is.", "src": [["444: Már legalább 64 halottja van a spanyolországi vasúti tragédiának", "https://444.hu/2026/10/28/mar-legalabb-64-halottja-van-a-spanyolorszagi-vasuti-tragedianak"]]}, {"id": "belgrad-izraeli-nagykovetseg", "r": "Külföld", "c": "Terror", "w": "", "st": "Jelentett", "time": "okt. 28.", "t": "Késsel támadt egy rendőrre az izraeli nagykövetségnél Belgrádban, a támadót lelőtték", "s": "A szerb belügyminisztérium terrorcselekménynek minősítette az éjszakai támadást, és a legmagasabb szintre emelte a terrorkészültséget.", "p": ["Szerdára virradó éjszaka egy feltehetően kiskorú személy késsel támadt Belgrádban az izraeli nagykövetséget őrző rendőrre. A rendőr szolgálati fegyverével lelőtte a támadót, ő maga könnyebb sérülést szenvedett. Ivica Dačić ügyvezető belügyminiszter szerint a támadás éjfél után negyedórakor történt, az elkövető két késsel támadt, és „Allah akbar” kiáltásokat hallatott.", "Az elkövető személyazonosságát még nem sikerült megállapítani, a hatóságok szerint nyugat-szerbiai, sabaci lehet. Dačić azt mondta, hogy a biztonsági szolgálatok már korábban is figyelték, és az eddigi információk alapján az Iszlám Államhoz köthető. A belügyminisztérium terrorcselekménynek minősítette az esetet, és a terrorfenyegetettségi készültséget az országban a legmagasabb, vörös fokozatra emelte.", "A cikk megemlíti, hogy 2024 júniusában egy számszeríjjal fegyverkező férfi súlyosan megsebesített egy rendőrt ugyanott, az izraeli nagykövetségnél, őt akkor szintén lelőtték."], "cav": "A kiskorúság egyelőre csak feltételezés („feltehetően kiskorú”). A cikk nem közli sem a támadó, sem a sérült rendőr nevét, és a nyomozás állásáról sem ad részletet.", "op": "A hír azért nyugtalanító, mert 2024-ben is támadás történt ugyanennél a nagykövetségnél, és a hatóságok szerint az elkövetőt most is figyelték már korábban. A támadóról egyelőre kevés biztosat tudunk, ezért a találgatásokat a nyomozás eredményéig érdemes félretenni.", "src": [["444: Terrortámadás történt Izrael belgrádi nagykövetségénél, a feltehetően kiskorú elkövetőt lelőtték", "https://444.hu/2026/10/28/terrortamadas-tortent-izrael-belgradi-nagykovetsegenel-a-feltehetoen-kiskoru-elkovetot-lelottek"]]}, {"id": "safe-vedelmi-hitel", "r": "Gazdaság", "c": "Védelem", "w": "", "st": "Megerősített", "time": "okt. 28.", "img": "https://assets.4cdn.hu/kraken/8C4zvYgnWtEq1oG1Cqs.jpeg", "imgs": "444", "imgl": "https://444.hu/2026/10/28/az-europai-bizottsag-hozzajarult-hogy-magyarorszag-54-milliard-euro-hitelt-vegyen-fel-vedelmi-beruhazasokra", "cred": "Lynx gyalogsági harcjárművek és Leopard harckocsik a veszprémi lő- és gyakorlóterén. Fotó: Katona Tibor / MTI / MTVA (444)", "t": "Az Európai Bizottság jóváhagyta Magyarország 5,4 milliárd eurós védelmi hitelét", "s": "A tervet a tagállami Tanács elé terjesztik; a magyar kormány a korábban tervezett 16 milliárd helyett kért kevesebbet.", "p": ["Az Európai Bizottság szerdán jóváhagyta Magyarország 5,4 milliárd eurós tervét az uniós SAFE (Security Action for Europe) védelmi hitelprogram keretében. Thomas Regnier, a Bizottság szóvivője az MTI szerint a szerdai sajtótájékoztatón közölte, hogy a magyar tervet ezután a tagállamok Tanácsa elé terjesztik jóváhagyásra. A jóváhagyás után a programban a szóvivő szerint valamivel több mint 21 milliárd euró maradhat felhasználható, a Bizottság később megkeresi a tagállamokat a fennmaradó források ügyében.", "A SAFE az EU 150 milliárd eurós védelmi hitelprogramja, amely kedvezményes, hosszú lejáratú hiteleket nyújt a tagállamoknak védelmi beruházásokra és közös beszerzésekre. Magyarország korábban 16 milliárd euró felvételét tervezte, de Magyar Péter kormánya ezt 5,4 milliárd euróra csökkentette, a 444 szeptember 25-i cikke szerint a gazdaság teherbíró képességére hivatkozva.", "A cikk szerint más tagállamok sem kérik a nekik elkülönített teljes összeget, ezért a Bizottság még idén új pályázati kört tervez, és a fel nem használt összegeket 2026-ban újra meg kell hirdetni. Ruszin-Szendi Romulusz honvédelmi miniszter szeptemberben azt mondta, hogy a hitelről a gazdaság teherbíró képességét figyelembe véve kell dönteni, mert visszafizetendő forrásról van szó, és a pénzből már megkötött honvédelmi szerződéseket is ki lehetne váltani, illetve előre lehetne hozni későbbre tervezett beruházásokat."], "cav": "A cikk nem közli, mikor dönt a Tanács. A képaláírás a veszprémi gyakorlóteret mutatja, az og:image azonosítója azonos azzal a képpel, de ezt a cikk nem mondja ki kifejezetten.", "op": "Itt a kormány pontosan azt tette, amit egy felelős hitelfelvevőtől várunk: a 16 milliárd helyett 5,4 milliárdot kért, mert a pénzt vissza kell fizetni. A védelmi kiadások jogos igény, de a hitel nem ingyenes forrás.", "src": [["444: Az Európai Bizottság hozzájárult, hogy Magyarország 5,4 milliárd euró hitelt vegyen fel védelmi beruházásokra", "https://444.hu/2026/10/28/az-europai-bizottsag-hozzajarult-hogy-magyarorszag-54-milliard-euro-hitelt-vegyen-fel-vedelmi-beruhazasokra"]]}, {"id": "vizsgalobizottsagok-hosszabbitas", "r": "Belpolitika", "c": "Parlament", "w": "Vizsgálóbizottságok", "st": "Megerősített", "time": "okt. 28.", "t": "Fél évvel tolná ki négy vizsgálóbizottság határidejét a Tisza", "s": "A jelentéstételi határidő december 31. helyett 2027. június 15-re módosulna.", "p": ["Tiszás képviselők határozati javaslatot nyújtottak be az Országgyűlésnek, amely négy vizsgálóbizottság jelentéstételi határidejét hosszabbítaná meg a jelenlegi 2026. december 31-ről 2027. június 15-re, vagyis közel hat hónappal. A javaslatot Bujdosó Andrea, a Tisza frakcióvezetője és képviselőtársai nyújtották be, az MTI jelentése alapján.", "Az érintett bizottságok a gyermekvédelmi, a kegyelmi botrányt feltáró, a spontán privatizációt és a közvagyon elvesztését vizsgáló, valamint az MNB működésével kapcsolatos visszaéléseket feltáró vizsgálóbizottság. A végrehajtási visszaélésekkel foglalkozó bizottság határidejét a javaslat nem érinti.", "Az indoklás szerint a hosszabbítást az érintett kérdések tárgyi és időbeli terjedelme, a folyamatok összetettsége, valamint a még feldolgozandó nagy mennyiségű információ, irat, nyilatkozat és meghallgatási anyag indokolja. A hosszabbított határidő lehetővé tenné a szükséges iratok beszerzését, az érintettek meghallgatását és a feltárt tények megalapozott értékelését, hogy a jelentések világos, ellenőrizhető megállapításokat és érdemi jogalkotási, szervezeti és intézményi javaslatokat tartalmazzanak."], "cav": "A cikk nem derít fényt arra, hogy az Országgyűlés elfogadta-e már a javaslatot.", "op": "Egy vizsgálat, amely a közvagyon elvesztését és a jegybank működését kutatja, nem készülhet el félmunkával, így a halasztás érthető. A kockázata viszont az, hogy a jelentések nyárig csúsznak, és közben a nyilvánosság keveset tud a feltárt tényekről. Érdemes lenne közbenső, nyilvános részjelentéseket kérni.", "src": [["444: Négy vizsgálóbizottság jelentéstételi határidejét hosszabbítaná meg a Tisza", "https://444.hu/2026/10/28/negy-vizsgalobizottsag-jelentesteteli-hataridejet-hosszabbitana-meg-a-tisza"]]}, {"id": "erasmus-ujra-teljes", "r": "Közélet", "c": "Oktatás", "w": "Uniós források", "st": "Megerősített", "time": "okt. 27.", "t": "Újra teljes jogú résztvevő Magyarország az Erasmus+ programban", "s": "A 21 érintett egyetem hivatalos értesítést kapott az idei támogatásokról, a hallgatók már ősszel pályázhatnak.", "p": ["Roxana Mînzatu, az Európai Bizottság ügyvezető alelnöke hétfőn Budapestre látogatott, hogy megnyissa az Erasmus+ magyarországi újraindulását. A Tempus Közalapítvány és a Bizottság magyarországi képviselete által szervezett rendezvényen részt vett Lannert Judit oktatási és gyermekügyi miniszter is. Nagy Balázs Vince, a Tempus elnöke átadta az alelnöknek a 21 érintett egyetem Erasmus+ támogatásairól szóló hivatalos értesítést.", "Az Európai Unió Tanácsa a hónap elején fogadta el a Bizottság javaslatát a Magyarországgal szemben a kondicionalitási rendelet alapján bevezetett védelmi intézkedések feloldásáról. A korlátozások megszűnésével a magyar hallgatók, oktatók és egyetemek ismét teljes körűen részesülhetnek az Erasmus+ támogatásaiból. Mînzatu szerint a program ismét valamennyi magyarországi egyetem számára elérhető, a hallgatók már idén ősszel benyújthatják pályázataikat.", "A rendszeres hallgatói kiutazások várhatóan a 2026/2027-es tanév második félévében indulhatnak újra, egyes mobilitási formák korábban is. A 444 szerint mintegy 4700 hallgató kezdheti meg külföldi részképzését 2027 februárjában. Magyarország csatlakozása óta több mint 300 ezer magyar vett részt a program külföldi mobilitásaiban, köztük 80 ezer egyetemi hallgató tanulmányi célú cserében."], "cav": "A 444 cikke háttérként azt írja, hogy a Bizottság 2023 januárjában függesztette fel az Erasmust az alapítványi fenntartású egyetemeken, miközben a kondicionalitási védelmi intézkedéseket 2022-ben vezették be. A két évszám nem mond ellent egymásnak, de nem azonos intézkedésre vonatkozik.", "op": "Az Erasmus-tilalom egyike volt azoknak az intézkedéseknek, amelyek a legtöbb hétköznapi embert közvetlenül érintették, a hallgatók esetében szó szerint. Az újraindulás látható jele annak, hogy az uniós viszony rendeződése nem csak elvont forrásokról szól.", "src": [["444: Magyarország ismét teljes körű résztvevője az Erasmus+ programnak", "https://444.hu/2026/10/27/magyarorszag-ismet-teljes-koru-resztvevoje-az-erasmus-programnak"]]}, {"id": "hanko-letartoztatas-hosszabbitas", "r": "Belpolitika", "c": "Bűnügy", "w": "NKA-ügy", "st": "Megerősített", "time": "okt. 26.", "t": "Február elejéig tarthat Hankó Balázs letartóztatása, ha a bíróság elfogadja az ügyészi indítványt", "s": "A Bács-Kiskun Megyei Főügyészség három hónapos hosszabbítást kért az NKA-ügyben.", "p": ["A Bács-Kiskun Megyei Főügyészség három hónapos meghosszabbítást indítványozott Hankó Balázs és társai letartóztatására, így február 1-jéig maradhatnának előzetesben. A HVG szerint a hírt a 24.hu is megírta. Az indítvány szerint a letartóztatás indokai és különös okai változatlanok: az ügyészség a kiemelkedő súlyú, magas büntetéssel fenyegetett bűncselekmények megalapozott gyanúját, a szökés és elrejtőzés, az eljárás jogellenes befolyásolásának és a bűnismétlés veszélyét említi.", "A Kecskeméti Törvényszék október 13-án helyben hagyta a Kecskeméti Járásbíróság október 1-jei döntését, amellyel Hankó Balázs fideszes országgyűlési képviselőt, volt kulturális és innovációs minisztert, valamint Varga-Bajusz Veronikát, a tárca korábbi államtitkárát letartóztatták. Az eljárás a Nemzeti Kulturális Alap által kifizetett, több mint 17 milliárd forintos támogatásokhoz kapcsolódik.", "A gyanúsítottakkal szemben különösen jelentős vagyoni hátrányt okozó hűtlen kezelés miatt folyik büntetőeljárás. A megalapozott gyanú szerint az NKA működése során a Kiemelt Kulturális Programok Ideiglenes Kollégiumát Hankó irányításával úgy használták, hogy a rendelkezésére álló vagyont tömegesen, a jogszabályoktól és az alapító határozattól eltérően költötték el."], "cav": "A cikk csak az ügyészi indítványról számol be, a bíróság döntéséről nem. A HVG ajánlói szerint Hankó védője azt mondta, hogy a ceglédi börtönben korrektül bánnak az exminiszterrel, és a Fidesz ragaszkodik ahhoz, hogy Hankó megtartsa képviselői mandátumát; ezeket a cikk nem fejti ki.", "op": "Egy volt miniszter hónapokig tartó előzetese új helyzet a magyar politikában, és az ügyészség szerint a letartóztatás indokai a kezdet óta változatlanok. A 17 milliárd forintos támogatási összeg és a hűtlen kezelés gyanúja miatt az ügy komoly. A gyanú persze csak gyanú: a bíróság dönt majd a bűnösségről.", "src": [["HVG: Rács mögött töltheti a karácsonyt Hankó Balázs", "https://hvg.hu/itthon/20261026_nka-letartoztatas-hosszabbitas-hanko-balazs"]]}, {"id": "karacsony-komment-parkolas", "r": "Közélet", "c": "Főváros", "w": "Parkolás", "st": "Megerősített", "time": "okt. 27.", "t": "Kommentháború Karácsony Gergely és a kerületi polgármesterek között a parkolási terv miatt", "s": "Facebook-üzengetés követte a BÖSZ hétfő esti ülését, amelyen két polgármester a főpolgármester szerint idő előtt távozott.", "p": ["Facebook-üzengetés kezdődött Karácsony Gergely főpolgármester és több kerületi polgármester között a Budapesti Önkormányzatok Szövetségének hétfő esti ülése miatt. Az egyeztetést a főpolgármester kezdeményezte, miután a kerületi polgármesterek október eleje óta erősen bírálják a parkolás átalakítására vonatkozó tervet.", "Karácsony kedden reggel azt kifogásolta, hogy két kerületi polgármester idő előtt elhagyta az ülést, és emiatt lemaradtak a közgyűlés által elfogadott határozatokról szóló szavazásról. Nevet nem említett, de a HVG szerint Pikó András (VIII. kerület) és Soproni Tamás (VI. kerület) lehetett az érintett.", "Pikó hétfő este a helyszínen nyilatkozott a sajtónak, majd Karácsony posztja alatt méltatlannak nevezte az „ilyen bokamagasságú csúsztatásokat”. Szerinte az volt méltatlan, hogy a kerületek bevételeiről a fejük felett döntöttek, és hogy évek óta nem hívták össze a BÖSZ-t. Azt is felrótta, hogy a főpolgármester a kezdés előtt másfél órával további öt, a kerületi pénzek elvonására irányuló javaslatot küldött. Pikó szerint a meghirdetett időtartam lejárta után negyed órával állt fel. Soproni Tamás csatlakozott a józsefvárosi kollégájához, a cikk szerint azt üzente a főpolgármesternek, hogy ha tényleg ő írta a posztokat, forduljon fül-orr-gégészhez."], "cav": "A cikk szövege kifejezetten csak Pikó András távozását említi, Soproni Tamás távozása nincs egyértelműen megerősítve. A polgármesterek a parkolásról a korábbi összefoglaló szerint csak a részletszabályok ismeretében kívántak véleményt mondani.", "op": "A fővárosi és kerületi vezetők évek óta ugyanazt a vitát vívják a pénzről és a hatáskörökről, csak a platform változik: ma Facebook-komment. A parkolás ügye valódi kérdés, de egy közös, nyilvános és előre kiküldött napirend sokat segítene azon, hogy a felek ne egymásnak üzengessenek.", "src": [["HVG: Kommentháború tört ki Karácsony Gergely és kerületi polgármesterek között", "https://hvg.hu/itthon/20261027_kommenthaboru-karacsony-gergely-piko-andras-soproni-tamas"]]}, {"id": "tomeges-jarvanyok-calicivirus", "r": "Közélet", "c": "Egészség", "w": "", "st": "Megerősített", "time": "okt. 27.", "img": "https://kep.index.hu/1/0/7225/72255/722555/72255585_98e5d0490e7932bb60df560bddc952f9_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/10/27/jarvany-fertozes-iskola-betegseg-gyor-moson-sopron-hanyas-hasmenes-calicivirus/", "cred": "Fotó: Sviatlana Lazarenka / Getty Images (Index)", "t": "Három tömeges járvány, 251 beteg: calicivírus miatt betegedtek meg diákok és idősek", "s": "A legnagyobb járvány egy győr-moson-soproni általános iskolában volt, ahol 177-en betegedtek meg.", "p": ["A Nemzeti Népegészségügyi és Gyógyszerészeti Központ heti jelentése szerint október 12. és 18. között három tömeges közösségi járványt jelentettek Magyarországon, összesen 251 megbetegedéssel. A legnagyobb járvány egy Győr-Moson-Sopron megyei általános iskolában alakult ki, ahol szeptember 25. óta a 635 érintettből 177-en betegedtek meg, 162 tanuló és 15 dolgozó. A főbb tünetek hányás és hasmenés voltak, kórházi ellátásra senkinek sem volt szüksége. A megvizsgált 20 betegből 19-nél calicivírust mutattak ki, a hatóságok kizárták az ételt mint terjesztő közeget, feltehetően közvetlen érintkezés útján terjedt.", "Pest megyében egy óvodában október 9. óta 195 érintettből 34-en betegedtek meg, köztük 33 gyermek és egy dolgozó, a vezető tünet a hányás volt. A vizsgálat szerint nem az óvodai étel okozta, a fertőzés valószínűleg vírusos eredetű volt. A harmadik járvány Hajdú-Bihar megyei idősek otthonában zajlott október 4. és 14. között: 158 érintettből 40-en betegedtek meg, 38 gondozott és két dolgozó, közülük ketten kórházi ellátásra szorultak, egynél igazolták a calicivírus-fertőzést.", "A heti jelentés szerint két budapesti férfinál mpoxfertőzést, két fővárosi nőnél dengue-lázat állapítottak meg, utóbbiak Srí Lankán, illetve a Maldív-szigeteken fertőződtek meg. A 42. héten 132 campylobacteriosis, 93 szalmonellózis és 39 rotavírus okozta gyomor-bél hurutos esetet, valamint 38 fertőző májgyulladást (ebből 27 hepatitis A) regisztráltak."], "cav": "A cikk nem közli a három járvány pontos kórokozóját az iskolai és óvodai esetben (az iskolában calicivírust igazoltak, az óvodáról csak vírusos eredetet feltételeznek), és három beteg laborvizsgálata még folyamatban volt.", "op": "A calicivírus nem újdonság, de a három közösségi járvány együtt azt mutatja, mennyire számít a jó higiénia és a gyors reagálás gyerekközösségekben és idősotthonokban. Szerencsére a súlyos esetek ritkák voltak.", "src": [["Index: Tömeges járványok robbantak ki az országban: több százan betegedtek meg", "https://index.hu/belfold/2026/10/27/jarvany-fertozes-iskola-betegseg-gyor-moson-sopron-hanyas-hasmenes-calicivirus/"]]}, {"id": "bozai-u19-vb-itelet", "r": "Sport", "c": "Ökölvívás", "w": "", "st": "Jelentett", "time": "okt. 26.", "t": "Ütéssel törte el az orosz orrát, mégis ő esett ki: vitatott döntés az U19-es ökölvívó-vb-n", "s": "A bíró fejelésnek ítélte az ifj. Bozai Gyula balegyenesét, így az orosz Korsakov jutott a döntőbe.", "p": ["Ifj. Bozai Gyula, az MTK ökölvívója az U19-es ökölvívó-világbajnokság elődöntőjében, a montenegrói Budvában elvesztette a helyét a döntőben. A 85 kg-os súlycsoportban vasárnap a címvédő orosz Kirill Korsakov ellen boxolt, és a második menetben egy hátsó kezes balegyenessel eltörte az orosz orrát. A mérkőzésvezető a ringorvoshoz vitte Korsakovot, aki megállapította a törést, és nem engedte tovább a küzdelmet.", "A szabály szerint ilyenkor az nyer technikai KO-val, aki az ellenfele orrát eltörte. A bírói döntés azonban úgy szólt, hogy Bozai fejeléssel okozta a sérülést, ezért a mérkőzést az addigi másfél menet alapján pontozták, amelyben az oroszt látták jobbnak, így ő nyert. Az Index szerint a törés miatt Korsakov nem léphetett volna ring elé a hétfői döntőben.", "Idősebb Bozai Gyula, a fia edzője szerint nem volt fejelés, és a harmadik menet is az övé lett volna, mert a fia az elődöntőig minden mérkőzését a hajrában nyerte. Ács József, a korosztályos válogatott szakvezetője szerint a bíráskodás és pontozás színvonala gyenge volt; azt nem állította, hogy a bíró elcsalta a mérkőzést, szerinte inkább alkalmatlanságát bizonyította."], "cav": "A cikk a magyar szakvezetés és az edzői stáb szemszögét közli, a bíró vagy a nemzetközi szövetség véleményét nem. A fejelés tényét a magyar oldal vitatja.", "op": "Egy elődöntő, amelyben az ütés által eltört orrért az üt, nem az ütött szenved hátrányt, minden szabályszerű sportágban magyarázatot igényel. Ha a nemzetközi szövetség nem tisztázza a döntést, az ifjúsági világbajnokság hitele is csorbul.", "src": [["Index: Elképesztő bírói döntéssel fosztották meg a világbajnoki döntőtől a magyar fiatalt", "https://index.hu/sport/boksz/2026/10/26/ifj.-bozai-gyula-u19-vilagbajnoksag-elkepeszto-itelet/"]]}, {"id": "magyar-peter-beszed", "img": "https://assets.4cdn.hu/kraken/8PI9QNqIZopjmOWHs.jpeg", "cred": "Fotó: Németh Dániel/444", "imgs": "444", "r": "Belpolitika", "c": "Ünnep", "w": "Október 23.", "st": "Megerősített", "time": "okt. 23.", "lead": 1, "t": "Magyar Péter a Kossuth téren: a nemzeti ünnep mindenkié, Magyarország nem komp Kelet és Nyugat között", "s": "A miniszterelnök a forradalom 70. évfordulóján közel egyórás beszédet mondott, Gripen-gépek húztak el a tér felett.", "p": ["Magyar Péter miniszterelnök pénteken, október 23-án, az 1956-os forradalom 70. évfordulóján mondott beszédet a Kossuth téren. A beszéd előtt 56 harangütés hangzott el, majd Gripen vadászgépek repültek át a tér felett. A Telex szerint a beszéd majdnem egy óráig tartott, a 444 szerint a tér a szélek kivételével megtelt.", "A miniszterelnök Nagy Imrére, Maléter Pálra és Gimes Miklósra emlékezett, akiket 1958-ban végeztek ki és jelöletlen sírba temettek. Úgy fogalmazott, hogy egyetlen magyar vezető sem helyezheti a hatalmat a nemzeti függetlenség fölé, és nem kereshet külföldi támogatást a saját népe ellen. Szerinte 1956 intelem mindazoknak, akik Moszkva vagy más külső hatalom felé tekintenek.", "A beszéd másik fő témája az egység volt: Magyar Péter szerint az Orbán-kormány a megosztásra épült, a zászló, a címer és 1956 emléke pedig mindenkié, nem egyetlen politikai tábor kizárólagos tulajdona. Külpolitikai üzenete az volt, hogy Magyarország nem komp, amelyet Kelet és Nyugat között sodor a víz, hanem a szabad, demokratikus Európához tartozik, és megbízható szövetséges kíván lenni.", "A kormányzást szolgálatnak nevezte. Ígéretei között a közbeszéd hitelességének helyreállítása, a közpénz közösségi szolgálata és a törvény előtti egyenlőség szerepelt. Konkrétan említette az elhagyott csecsemők gondozását, a bántalmazott nők védelmét, az időben elvégzett műtéteket, a jó iskolákat, valamint a folyók, a föld és a levegő védelmét a szennyező üzemektől. A 444 tudósítása szerint a legnagyobb tapsot az váltotta ki, amikor Orbán Viktor párizsi szállodaterasz-fotójára utalt.", "Magyar Péter már csütörtökön, a Bem téren bejelentette, hogy a kormány a következő években 1956-os múzeumot, illetve intézményt hoz létre. Szerinte hetven év után sincs olyan közös, méltó hely, amely teljes egészében a forradalom hőseinek és áldozatainak emlékét szolgálná."], "cav": "A repülő Gripenek számát a beszámolók eltérően adják meg (a 444 és az Infostart három gépet említ, az Index tudósítása hetet). A beszéd tartalmát a 444 összefoglalójából és a Telex beszámolójából állítottuk össze, nem a teljes szövegből.", "src": [["444: Magyar Péter október 23-i beszéde", "https://444.hu/2026/10/23/magyar-peter-oktober-23-i-beszede-eljen-a-szabad-demokratikus-es-immaron-valoban-fuggetlen-magyarorszag"], ["Telex: Betyárok, agresszorok, Gripenek és Párizs", "https://telex.hu/belfold/2026/10/23/oktober-23-zaszlomenet-fidesz-magyar-peter-foto-osszefoglalo"], ["Telex: október 23-i programok", "https://telex.hu/belfold/2026/10/23/oktober-23-56-os-forradalom-allami-unnepsegek-magyar-peter-tisza-part-fidesz-zaszlomenet-mi-hazank"]], "op": "Egy beszéd attól lesz hiteles, hogy a mondatokat tettek követik. A „nem komp” kép jól hangzik, és a szabadság melletti kiállás ünnepi alkalmon természetes, a kormányzás tétje viszont a konkrét ígéretek, az iskolák, a műtétek és a közpénz szolgálata. Az 1956-os múzeum bejelentése jó jel, de azt is a megvalósulás fogja megmutatni."}, {"id": "matolcsy-letartoztatas", "img": "https://kep.cdn.indexvas.hu/1/0/7221/72212/722125/72212523_8b449099e1e160f447fcc2f15d068dc5_wm.jpg", "cred": "Bátki Pál, Matolcsy György jogi képviselője. Fotó: Tövissi Bence / Index", "imgs": "Index", "r": "Belpolitika", "c": "Bűnügy", "w": "MNB-ügy", "st": "Megerősített", "time": "okt. 23.", "t": "Egy hónapra letartóztatták Matolcsy Györgyöt, a fiát és egy másik gyanúsítottat körözik", "s": "A Budai Központi Kerületi Bíróság nyomozási bírója elrendelte a volt jegybankelnök letartóztatását a PADME Alapítvány vagyona miatt indult eljárásban.", "p": ["A Budai Központi Kerületi Bíróság nyomozási bírója pénteken egy hónapra elrendelte Matolcsy György volt jegybankelnök letartóztatását. A döntést zárt ülésen hozták a Központi Nyomozó Főügyészség csütörtöki indítványa nyomán. A HVG szerint két társát is letartóztatták, a hír szerint összesen öt gyanúsítottja van az ügynek. Az ügyészség különösen nagy kárt okozó gazdasági csalással és hamis magánokirat felhasználásával gyanúsítja. A letartóztatást egy hónap múlva felülvizsgálják.", "A vád szerint 2025. február 28-án, Matolcsy György hivatali idejének utolsó előtti munkanapján színlelt értékpapír-kölcsönszerződést kötöttek a PADME Alapítvány vagyonának kezelésére. Az ügyészség szerint a cél az volt, hogy a vagyon feletti irányítás olyan emberekhez kerüljön, akik a jegybankelnöki megbízatás lejárta után is befolyásolhatók maradnak, így az apa és a fiú saját érdekeikben használhatják fel. Az Index szerint az ügyészség a kárt jóval 500 millió forint fölöttire becsüli.", "Matolcsy Ádámot, az egykori elnök fiát és Stofa Györgyöt, az Optima volt vezérigazgatóját gazdasági csalás gyanújával körözik. Stofa a lengyelországi GTC Group vezetőségében is szerepelt, amely a jegybanki alapítványok ingatlanbefektetéseit kezeli.", "A védelem a nyilvánosság előtt azt hangsúlyozta, hogy a vád nem a sajtóban emlegetett sokszázmilliárdos vagyonvesztésre vonatkozik. Az ügyvéd, Bátki Pál szerint a védelem mintegy 6000 oldalnyi iratot kapott meg. A letartóztatás ellen a Fővárosi Törvényszéken lehet fellebbezni, de arról nincs hír, hogy fellebbeztek volna."], "cav": "A források eltérnek a körözésről: a Telex csütörtökön még azt írta, nemzetközi körözés nem volt, az Index és a HVG pénteken már nemzetközi elfogatóparancsot említ. Az Index cikke ellentmondóan számol be arról, hogy Matolcsy vallomást tett-e. A Forbes.hu címe szerint óvadékként felajánlotta összes megtakarítását, ezt más forrás nem erősítette meg.", "src": [["Index: Letartóztatták Matolcsy Györgyöt", "https://index.hu/belfold/2026/10/23/matolcsy-gyorgy-letartoztatas-nyomozas-mnb-jegybank-elnok-birosag/"], ["HVG: Letartóztatták Matolcsy Györgyöt és társait", "https://hvg.hu/gazdasag/20261023_letartoztattak-matolcsy-gyorgyot-es-tarsait"], ["444: Elrendelte a bíróság Matolcsy György letartóztatását", "https://444.hu/2026/10/23/elrendelte-a-birosag-matolcsy-gyorgy-letartoztatasat"], ["Telex: Még mindig keresi a rendőrség Matolcsy Ádámot", "https://telex.hu/belfold/2026/10/22/meg-mindig-keresik-mnb-ugy-korozes-elfogatoparancs"]], "op": "Egy volt jegybankelnök letartóztatása a magyar közélet fordulópontja, de a jogállam próbája csak ezután kezdődik: a szabályos, gyors és nyilvános eljárásé. A védelem szerint a vád nem a sajtóban emlegetett sokszázmilliárdos vagyonvesztésre vonatkozik, ezt az eljárásnak kell tisztáznia, nem a szónoklatoknak."}, {"id": "von-der-leyen-parlament", "r": "Külföld", "c": "Diplomácia", "w": "Október 23.", "st": "Megerősített", "time": "okt. 23.", "t": "Von der Leyen a Parlamentben: Magyarország ismét hozzáférhet az uniós forrásokhoz", "s": "Az Országházi díszülésen az Európai Bizottság elnöke szerint az ország megmutatta, hogy a demokratikus visszacsúszás visszafordítható.", "p": ["Pénteken a Parlamentben tartott megemlékezésen felszólalt Ursula von der Leyen, az Európai Bizottság elnöke és António Costa, az Európai Tanács elnöke is. Jelen volt Jens Stoltenberg, a NATO volt főtitkára, jelenlegi norvég pénzügyminiszter is. Az ülést Forsthoffer Ágnes házelnök vezette, az első beszédet Baka András köztársasági elnök mondta.", "Baka András szerint az 1956-os forradalom ítélet volt az elnyomásra és hazugságra épülő rendszer fölött. Arra is figyelmeztetett, hogy ma a magyarok már nemcsak a közös célokban nem tudnak megegyezni, hanem abban sem, hogyan tekintsenek a saját történelmükre.", "Von der Leyen a Privátbankár összefoglalója szerint azt mondta, hogy Magyarország megmutatta a világnak: a demokratikus visszacsúszás visszafordítható, a dezinformáció és a félelem legyőzhető. Hangsúlyozta, hogy a demokratikus győzelem nem garantált, minden nemzedéknek újra meg kell küzdenie a szabadságért. Szerinte az ország reformjai eredményt hoznak, Magyarország újra hozzáférhet az uniós forrásokhoz. Példaként a csalás és korrupció elleni erősebb szabályokat, az átláthatóbb közpénzköltést és az Európai Ügyészséghez való csatlakozást említette. Év végéig további fejleményeket várt a helyreállítási alapnál és az akadémiai szabadsághoz kötött forrásoknál. Konkrét összeget nem nevezett meg.", "Costa azt mondta, hogy a demokráciák nem hódolhatnak be a zsarnokságnak. A 22 éves uniós tagságot sikertörténetként értékelte, és hivatalos adatokra hivatkozva azt állította, hogy a magyarok 80 százaléka a stabilitás forrásának tartja az EU-t.", "A Fidesz, a KDNP és a Mi Hazánk nem vett részt az ülésen. A KDNP közölte, hogy nem akarja legitimálni Baka Andrást. Bóka János, a Fidesz frakcióvezetője a Bem téri beszédében „ócska komédiának” nevezte a díszülést."], "cav": "Az Index tudósítása csak Baka András beszédét foglalja össze, ezért von der Leyen és Costa szavait a Privátbankár beszámolójából vettük át.", "src": [["Privátbankár: 1956 mellett az EU-s pénzekről is beszélt von der Leyen", "https://privatbankar.hu/cikkek/nemzetkozi/1956-mellett-az-eu-s-penzekrol-is-beszelt-ursula-von-der-leyen-az-orszaghazban.html"], ["Index: Von der Leyen a parlamentben", "https://index.hu/belfold/2026/10/23/parlament-diszules-orszaggyules-1956-oktober-23-magyar-peter-ursula-von-der-leyen/"]], "op": "Az uniós források felé nyíló út nem csak pénz kérdése, hanem annak elismerése is, hogy a hazai intézményrendszer helyreállítása elindult. A Bizottság elnöke a Parlamentben politikai gesztust tett, a számlát azonban a végrehajtott reformok és a ténylegesen kifizetett pénzek mutatják majd."}, {"id": "fidesz-zaszlomenet", "r": "Belpolitika", "c": "Ünnep", "w": "Október 23.", "st": "Jelentett", "time": "okt. 23.", "t": "Zászlómenet és Bem téri megemlékezés: Orbán Viktor nem beszélt, Párizsban fotózták", "s": "A Békemenet helyett 1848 méteres zászlóval vonultak a Fidesz-szimpatizánsok, a Bem téren dulakodás tört ki ellentüntetőkkel.", "p": ["A Fidesz idén Békemenet helyett Zászlómenetet tartott, amelyet az 56 Lángja Alapítvány szervezett. A menet délben indult a Műegyetemtől, élén lovas és betyárruhás alakokkal, és egy 1848 méter hosszú nemzeti zászlót vittek. Az alsó rakparton csendben haladtak, majd énekeltek. A Telex szerint a Bem térre érve nagyobb tömeg gyűlt össze, mint a Fidesz bármelyik rendezvényén az elmúlt hónapokban, pontos létszámot azonban egyik beszámoló sem ad.", "A hivatalos Fidesz-megemlékezést a Bem téren tartották. Beszélt Áder János, Bóka János frakcióvezető és Schmidt Mária történész. Orbán Viktor idén nem szólalt fel: a Telex szerint a rendezvény Facebook-közvetítése idején egyedül ülve fotózták egy párizsi szállodateraszon.", "Áder János arról beszélt, hogy a kommunista vezetés egy nap alatt nem vette észre, mi történik, és öt szovjet hadosztályt, 32 ezer katonát, 1130 harckocsit vetettek be. Bóka János szerint a szabad országban nincs politikai rendőrség és nem számolják fel az ellenzéket, és a függetlenséget senki sem védi meg Magyarország helyett, sem Brüsszel, sem más hatalom. Schmidt Mária az '56-os hősöket idézte, és aggodalmának adott hangot a Terror Háza Múzeum sorsa miatt, utalva az igazgató eltávolítására, az ideiglenes zárásra és az átvilágításra.", "Hankóné Hrágyel Zsuzsanna felolvasta férje, Hankó Balázs börtönből küldött üzenetét. A Telex beszámolója szerint Bóka beszéde alatt a Fidesz-szimpatizánsok és az ellentüntetők összetűztek, a rendőrségnek kellett közbelépnie, a lap saját stábját is megtámadták. A Magyar Nemzet beszámolója incidensről nem ír."], "cav": "A Magyar Nemzet a Fidesz-közeli sajtóhoz tartozik, a Bem téri beszédek tartalmát az ő összefoglalójából ismertetjük, az állításokat nem ellenőriztük függetlenül. A dulakodásról csak a Telex és az Index blogja számol be.", "src": [["Magyar Nemzet: Bóka János beszéde a Bem téren", "https://magyarnemzet.hu/belfold/2026/10/fidesz-1956-oktober-23-unnepseg"], ["Telex: Betyárok, agresszorok, Gripenek és Párizs", "https://telex.hu/belfold/2026/10/23/oktober-23-zaszlomenet-fidesz-magyar-peter-foto-osszefoglalo"], ["Index: percről percre október 23-án", "https://index.hu/belfold/2026/10/22/oktober-23-megemlekezes-1956-os-forradalom-es-szabadsagharc-evfordulo-tisza-part-magyar-peter-fidesz-mi-hazank-mozgalom/"]], "op": "A zászlómenet azt mutatja, hogy a Fidesz mozgósító ereje ellenzékben sem tűnt el, de a beszédet nem mondó pártelnök és a párizsi fotó sokat elárult arról, hogyan áll az ellenzéki szerep megtalálásával. A dulakodás rossz jel: egy nemzeti ünnepen senkinek sem kellene ököllel érvelnie."}, {"id": "mi-hazank-ellenallas", "img": "https://kep.cdn.indexvas.hu/1/0/7221/72212/722122/72212257_6e696a437b7d063ebe339a44301c134b_wm.jpg", "cred": "Toroczkai László a Mi Hazánk megemlékezésén a Corvin közben 2026. október 23-án. Fotó: Kertész Renáta / Index", "imgs": "Index", "r": "Belpolitika", "c": "Ünnep", "w": "Október 23.", "st": "Jelentett", "time": "okt. 23.", "t": "A Mi Hazánk a Corvin közben „nemzeti ellenállást” hirdetett, ágyúlövéssel tisztelegtek", "s": "Toroczkai László szerint minden „csapásra” ellencsapással válaszolnak, és bírálta Ursula von der Leyent is.", "p": ["A Mi Hazánk saját megemlékezést tartott a Corvin közben „Nemzeti Ellenállás” címmel. Novák Előd szerint a részvétel minden korábbinál nagyobb volt, ezért a József körút több sávját le kellett zárni. A párt egy 1956-ban is használt löveggel ágyúlövést adott le Pongrátz András, a közelmúltban elhunyt szabadságharcos emlékére, ezt Novák „tisztelgő és figyelmeztető lövésnek” nevezte.", "Toroczkai László elmondta, hogy szerinte Magyar Péter a Mi Hazánk megemlékezésének módját is megpróbálta megszabni, Ursula von der Leyent pedig a korrupció szimbólumának nevezte. Végül nemzeti ellenállási mozgalmat jelentett be, amely minden „csapásra” ellencsapással válaszol. Tóth Máté, a párt elnökhelyettese azt mondta: „70 éve cserben hagyott minket a világ.”", "A Telex előzetese szerint a rendezvényen a 2006-os, Gyurcsány-kormány elleni tüntetésekre is megemlékeztek, a vidéki résztvevőknek ingyenes buszokat indítottak."], "cav": "A tudósítás az Index percről percre blogján és a Telex előzetesén alapul, a pontos résztvevőszámot egyik forrás sem közli, Novák Előd állítását nem tudtuk ellenőrizni.", "src": [["Index: percről percre október 23-án", "https://index.hu/belfold/2026/10/22/oktober-23-megemlekezes-1956-os-forradalom-es-szabadsagharc-evfordulo-tisza-part-magyar-peter-fidesz-mi-hazank-mozgalom/"], ["Telex: október 23-i programok", "https://telex.hu/belfold/2026/10/23/oktober-23-56-os-forradalom-allami-unnepsegek-magyar-peter-tisza-part-fidesz-zaszlomenet-mi-hazank"]], "op": "A „nemzeti ellenállás” és az ágyúlövés nagy szavak és nagy gesztusok, de a hangzatos kirohanások mögött keresni kell a konkrét programot. Különösen igaz ez akkor, ha a fő üzenet az uniós vezetők bírálata, a hazai problémákra adott válasz pedig hiányzik."}, {"id": "fradi-torreense", "r": "Sport", "c": "Foci", "st": "Megerősített", "time": "okt. 22.", "t": "Négy gólt rakott a Torreensének a Ferencváros az Európa-ligában", "s": "A Fradi harmadik győzelmét aratta a sorozatban, a tabellán a második helyen áll.", "p": ["A Ferencváros 4–1-re győzött a portugál Torreense ellen az Európa-liga alapszakaszának harmadik fordulójában, az Üllői úton. A zöld-fehérek Yusuf 20. percben szerzett, a jobb kapufa tövét érintő lövésgóljával szereztek vezetést, a vendégek a 23. perc körül egyenlítettek Pozóval.", "A második félidőben Gomez fejelt gólt Birmancevic szögletéből, a 80. percben a Torreense védője, Mohamed öngólt vétett, a 89. perc körül pedig Lisztes Krisztián lövése megpattant és bement Lenny Joseph beadása után.", "A győzelem a Fradi harmadik egymást követő sikere a sorozatban. A Telex szerint az együttes július óta egyetlen kupameccsen sem volt hátrányban, és ez a csapat legjobb kezdése ebben a sorozatban. Az alapszakasz-tabellán a második helyen áll, bár a késő esti mérkőzések után csúszhat lejjebb. A csapatot Borbély Balázs vezeti."], "cav": "A második félidei gólszerző Gomez pontos percét a cikk nem közli. A tabellahelyezés a mérkőzés napjának esti állását tükrözi.", "src": [["Telex: Ferencváros–Torreense", "https://telex.hu/sport/2026/10/22/ferencvaros-europa-liga-torreense"]], "op": "Négy gól, harmadik győzelem egymás után és a tabella második helye: a Fradi Európa-ligás szezonja egyelőre jól alakul. Egy-két meccsből persze nem érdemes messzemenő következtetést levonni, a valódi mérce az erősebb ellenfelek ellen jön."}, {"id": "kormany-2027-koltsegvetes", "img": "https://kep.cdn.indexvas.hu/1/0/7216/72160/721608/72160847_182eac466568dbd192eaa942b663021c_wm.jpg", "cred": "Magyar Péter miniszterelnök sajtótájékoztatót tart a 2027-es költségvetésről a Pénzügyminisztériumban 2026. október 20-án. Fotó: Hegedüs Róbert / MTI", "imgs": "Index", "r": "Gazdaság", "c": "Költségvetés", "st": "Megerősített", "time": "okt. 20.", "t": "Itt a 2027-es költségvetés: vagyonadó, KATA-kedvezmény és a Wekerle-program", "s": "A kormány nem vezet be új adót, de átalakít meglévőket. A hiánycél 2026 végére 7,5 százalék, 2030-ra 2,8 százalék.", "p": ["Magyar Péter és Kármán András pénzügyminiszter kedden mutatta be a 2027-es költségvetés fő számait. Kármán András 7,5 százalékos hiánycélt jelölt meg 2026 végére, amelyet 2030-ra 2,8 százalékra csökkentenének 3,1 százalékos növekedés mellett. Ezt „óvatos” pályának nevezte. Magyar Péter szerint Magyarországnak a lehető leghamarabb csatlakoznia kell az árfolyam-mechanizmushoz és az euróövezethez, de túlvállalás nélkül.", "A kormány szerint nem lesz új adó, a meglévők átalakulnak. A vagyonadótól 200 milliárd forint bevétel várható, nő a dohány, a szeszes italok és a sok cukrot tartalmazó üdítők jövedéki adója. A nagyvállalatoknak vagy több csökkent munkaképességű embert kell foglalkoztatniuk, vagy egészségügyi hozzájárulást fizetnek. Általános szén-dioxid-adót is terveznek, a Kármán-féle számítás szerint az intézkedések együtt a GDP mintegy 0,9 százalékát hozzák. Lezárják az adóoptimalizálási kiskapukat, köztük a nagyvállalatok vagyonkezelői konstrukcióit.", "A KATA-rendszerből 2027-re nem várnak többletbevételt, a cél a kisvállalkozások segítése, Kármán becslése szerint legalább százezren választják majd. Magyar Péter elmondta, hogy a 40 év feletti, két gyermekes anyák elveszítik adómentességüket. Az árrésstopot hibának nevezte, és kivezetik, a politikai kifizetőhelyeket meg akarja szüntetni.", "A lakhatásban az Otthon Start Wekerle-programmá alakul: új lakásra 3, használtra 5 százalékos kamatozású támogatott hitel jár, a Wekerle+ felújítási hitel 15 millió forintig támogatást nyújt. Az új lakások 5 százalékos áfája marad, határidő nélkül.", "A kiadási oldalon mintegy 1465 milliárd forintnyi megtakarítást terveznek, az egészségügyre 510 milliárd, a szociális területre több mint 1000 milliárd forint jut. A települési szolidaritási hozzájárulás 15 százalékkal csökken (62 milliárd forint megtakarítás az önkormányzatoknak), a budapesti és agglomerációs közösségi közlekedésre 50 milliárd forint jut. A közszféra béremeléséről
