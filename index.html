da2013_wm.png", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/09/01/baleset-ipari-alpinista-halaleset-szeged-meghalt/"}, {"id": "m-pecs-busz", "r": "Megyei", "m": "Baranya", "c": "Korrupció", "w": "", "st": "Jelentett", "time": "szept. 19.", "t": "Kizárták a baranyai főügyészt a pécsi buszbotrány új nyomozásából Bánki Erikkel való ismeretsége miatt", "s": "A helyére a Fejér Vármegyei Főügyészség kerül; Hadházy Ákos új feljelentést tett.", "p": ["A Telex szerint a Baranya vármegyei főügyész elfogultságot jelentett be, mert személyesen ismeri Bánki Eriket, ezért kizárták a pécsi buszbotrány új nyomozásából. A határozatot a Fejér Megyei Rendőr-főkapitányság adta ki, és Hadházy Ákos tette közzé; a helyére a Fejér Vármegyei Főügyészség lépett, a határozat ellen panasznak nincs helye. Hadházy a jogerős ítélet után tett új feljelentést, mert szerinte csak a mellékszereplőket vonták felelősségre.", "Az ügy háttere: a Tüke Busz 2015-ben Volvo-buszokat vásárolt egy holland cégen keresztül, a flotta kisebb és felszereltsége gyengébb lett, az ár magasabb. 2016-ban Csengő András volt holland tiszteletbeli konzul 900 ezer eurót próbált készpénzben befizetni egy woerdeni bankautomatába. A Pécsi Ítélőtábla április 8-án jogerősen bűnösnek mondta ki Csengő Andrást, akit öt év börtönre ítéltek; Siebe P.-t szintén öt évre ítélték és kiutasították, az elsőrendű vádlott az eljárás alatt meghalt."], "cav": "Hadházy szerint az ügyészség „átlátszóan” próbálta kimenteni Bánkit; a közzétett határozat csak a személyes kapcsolatot nevezi meg indokként. Bánki Erik és az ügyészség reakcióját a cikk nem tartalmazza.", "op": "A hír hasznos része, hogy az elfogultságot maga a főügyész jelentette be, és a rendszer ezt kezelte – az más kérdés, hogy egy ekkora ügyben miért csak most, a második nyomozásnál derül ki az ismeretség.", "src": [["Telex: Kizárták a Baranya megyei főügyészt a pécsi buszbotrány újabb nyomozásából", "https://telex.hu/belfold/2026/09/19/hadhazy-akos-volvo-pecs-buszbeszerzes-korrupcio-ugyeszseg-elfogultsag-banki-erik"]], "img": "https://assets.telex.hu/images/20260919/1789824971-temp-5nvd83jg45medjhpipk_facebook.jpg", "imgs": "Telex", "imgl": "https://telex.hu/belfold/2026/09/19/hadhazy-akos-volvo-pecs-buszbeszerzes-korrupcio-ugyeszseg-elfogultsag-banki-erik"}, {"id": "m-kiskunfelegyhaza", "r": "Megyei", "m": "Bács-Kiskun", "c": "Baleset", "w": "", "st": "Megerősített", "time": "szept. 20.", "t": "Elszabadult lovak a kiskunfélegyházi szüreti felvonuláson: öten megsérültek", "s": "A fogat két gyalogost elsodort, majd egy fának csapódva állt meg.", "p": ["Az Index a rendőrség tájékoztatása alapján azt írja, hogy a kiskunfélegyházi szüreti felvonuláson, a Kossuth Lajos és a Holló Béla utca kereszteződésénél a fogat hajtója és segédje leszállt, hogy a lovakon fejzőt cseréljenek. A lovak ekkor megbokrosodtak, és a hintóval együtt elszabadultak. A fogat a járdára hajtott, két gyalogost elsodort, majd egy mellette álló fának ütközött.", "Összesen öten sérültek meg: a két gyalogos súlyos sérüléseket szenvedett, a fogaton utazó három személy az előzetes információk szerint könnyebben. A Kiskunfélegyházi Rendőrkapitányság közúti baleset gondatlan okozása miatt indított eljárást, a körülményeket szakértők bevonásával vizsgálják."], "cav": "A cím „több embert” említ, a szöveg két elsodort gyalogosról ír; az öt sérült a két gyalogos és három utas összege. A három utas sérüléséről szóló adat előzetes.", "op": "", "src": [["Index: Elszabadultak a lovak, több embert elsodortak a kiskunfélegyházi szüreti ünnepségen", "https://index.hu/belfold/2026/09/20/bacs-kiskun-varmegyei-rendorseg-kiskunfelegyhaza-hinto-lovak-szureti-felvonulas-baleset/"]], "img": "https://kep.cdn.index.hu/1/0/7163/71632/716327/71632749_5281277_751d97859aa5e827e90c5b04378fc8d1_wm.png", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/09/20/bacs-kiskun-varmegyei-rendorseg-kiskunfelegyhaza-hinto-lovak-szureti-felvonulas-baleset/"}, {"id": "m-balaton", "r": "Megyei", "m": "Somogy", "c": "Környezet", "w": "", "st": "Megerősített", "time": "szept. 20.", "t": "Folyamatosan apad a Balaton: már csak 11 centi választja el a valaha mért mélypontól", "s": "A HungaroMet adata szerint a legutóbbi mérés 34 cm, a rekord 23 cm (2003).", "p": ["Az Index szerint a Balaton vízállása a HungaroMet adatai alapján az augusztus 20-i hosszú hétvégén átlagosan 45–46 centi volt, a legutóbbi mérés szerint 34 centi. A valaha mért legalacsonyabb vízállás 23 centi volt, 2003. október 4-én, a lap szerint tehát alig tizenegy centi választja el a tavat a mélyponttól. Az apadás fő oka a csapadékhiány, a párolgás tovább csökkenti a szintet.", "Fürdeni még lehet: egy méter mélyen 20–21 fokos a víz. A déli parton, ahol a tó sekély, a strandolóknak egyre hosszabb utat kell megtenniük a fürdésre alkalmas mélységig; a cikk a Balatonfenyvesnél és Fonyódnál tapasztaltakra utal."], "cav": "A „folyamatos apadás” állítását a cikkben csak két adatpont (augusztus 20. és a legutóbbi mérés) támasztja alá, a legutóbbi mérés dátuma nincs megadva. A cikk nem nevezi meg a megyét; Fonyód és Balatonfenyves Somogy megyében fekszik.", "op": "", "src": [["Index: Folyamatosan apad a Balaton, már csak centikre van a valaha mért legalacsonyabb vízszint", "https://index.hu/belfold/2026/09/20/hungaromet-fonyod-balaton-apadas-csapadekhiany/"]], "img": "https://kep.cdn.index.hu/1/0/7163/71637/716376/71637635_5281637_c19685634f1e6c0ab2d506fb6ae17dee_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/09/20/hungaromet-fonyod-balaton-apadas-csapadekhiany/"}, {"id": "m-sertespestis", "r": "Megyei", "m": "Baranya", "c": "Állategészségügy", "w": "", "st": "Megerősített", "time": "szept. 23.", "t": "Újabb két vaddisznóban találtak afrikai sertéspestist Baranyában, bővítik a veszélyeztetett területet", "s": "Mohács és Homorúd térségében, az országhatártól néhány kilométerre.", "p": ["A Telex a Nébih szerdai tájékoztatására hivatkozva azt írja, hogy két újabb, afrikai sertéspestissel fertőzött vaddisznót találtak Baranya vármegyében, Mohács és Homorúd közigazgatási területén, a Duna bal partján. Az egyik állatot diagnosztikai célból kilőtték, a másik elhullott. Az országos főállatorvos elrendelte a fertőzött és a magas kockázatú területek bővítését Baranya, Tolna és Bács-Kiskun megyében is.", "A Nébih szerint az új esetek a Duna mentén északi irányba, valamint a Duna–Tisza köze felé irányuló terjedés kockázatát növelik. A hatóság szerint a betegség természetes terjedéssel került a vaddisznókba, valószínűleg a szomszédos vadgazdálkodási egységből vagy Szerbiából. Az afrikai sertéspestis embernek nem veszélyes, a házisertés-állományokban viszont jelentős gazdasági kárt okozhat."], "cav": "Az eredet két lehetősége (szomszédos vadgazdálkodási egység vagy Szerbia) egymás mellett szerepel, a Nébih egyiket sem erősítette meg bizonyosan.", "op": "", "src": [["Telex: Újabb két vaddisznóban találtak sertéspestist Baranyában", "https://telex.hu/belfold/2026/09/23/ujabb-ket-vaddisznoban-talaltak-sertespestist-baranyaban"]], "img": "https://assets.telex.hu/images/20251126/1764149677-temp-f9bmuohagt962omikhB_facebook.jpg", "imgs": "Telex", "imgl": "https://telex.hu/belfold/2026/09/23/ujabb-ket-vaddisznoban-talaltak-sertespestist-baranyaban"}, {"id": "m-medikemia", "r": "Megyei", "m": "Csongrád-Csanád", "c": "Tűz", "w": "", "st": "Megerősített", "time": "okt. 1.", "t": "Hatalmas tűz a Medikémia szegedi telephelyén: oldószerek égtek kétezer négyzetméteren", "s": "Hét település tűzoltói dolgoztak a helyszínen; a katasztrófavédelem szerint a lángok továbbterjedését megakadályozták.", "p": ["A Telex szerint október 1-jén, dél körül tűz ütött ki Szegeden, a Zsámbok-Réti soron, a Medikémia valószínű telephelyén. A katasztrófavédelem közlése szerint benzin és alkoholszármazékok égtek, kora délután pedig azt közölték, hogy megakadályozták a lángok továbbterjedését; oldószerek és tisztítószerek égtek mintegy kétezer négyzetméteren egy csarnokban és környékén.", "A tűzoltásban a szegedi, hódmezővásárhelyi, kisteleki, makói, orosházi, kiskunmajsai és szentesi hivatásos tűzoltók vettek részt, három vízszállító jármű segítségével. A cikk sérültekről és a tűz okáról nem ad információt."], "cav": "A megyei katasztrófavédelmi szóvivő eleinte kisebb üzemegységről és gyors körülhatárolásról beszélt, később kétezer négyzetméteres csarnoktűzről számoltak be. A Telex csak valószínűsíti, hogy a Medikémia telephelyén történt, a katasztrófavédelem a céget nem nevezte meg.", "op": "", "src": [["Telex: Hatalmas füstfelhő gomolyog, tűz ütött ki a Medikémia szegedi telephelyén", "https://telex.hu/belfold/2026/10/01/medikemia-szeged-tuz-katasztrofavedelem"], ["444: Tűz ütött ki a Medikémia szegedi telephelyén", "https://444.hu/2026/10/01/tuz-utott-ki-a-medikemia-szegedi-telephelyen"]], "img": "https://assets.telex.hu/images/20261001/1790853830-temp-fqbq4v0c7sh24efkgog_facebook.jpg", "imgs": "Telex", "imgl": "https://telex.hu/belfold/2026/10/01/medikemia-szeged-tuz-katasztrofavedelem"}, {"id": "m-radostyan", "r": "Megyei", "m": "Borsod-Abaúj-Zemplén", "c": "Kultúra, tűz", "w": "", "st": "Megerősített", "time": "okt. 4.", "t": "Porig égett a radostyáni műemlék templom és fa harangtornya", "s": "A református templom szombaton égett le; gyűjtés indult az újjáépítésre.", "p": ["Az Index szerint október 3-án, szombaton leégett Radostyán, Miskolc közeli település református műemlék temploma és mellette álló fa harangtornya. A képaláírás szerint a tűz a temetőből terjedt át, a cikk a tűz okát nem közli. A templom középkori eredetű, mai formáját nagyrészt 1784-ben nyerte el, műemléki védelem alatt 1953 óta áll. Az 1762-ben épült, 16 méter magas, hatszögletű barokk fa harangtorony a magyarországi faépítészet ritka, épen maradt emléke volt. A képaláírás szerint elpusztult a festett mennyezeti kazetta, a padok, az orgona, a tető és a harangtorony.", "A Magyar Református Szeretetszolgálat azonnali gyűjtést indított az újjáépítésre. Tarr Zoltán, a kultúráért felelős miniszter Facebook-oldalán „felbecsülhetetlen értékű veszteségnek” nevezte a leégést, megemlítve, hogy egy értékes biblia is elpusztult, és megköszönte a tűzoltók munkáját."], "cav": "A cím szerint a templom „porig égett”, a képaláírás viszont megmaradt falakról beszél. A miniszter „Árpád-kori” eredetet és „Európában egyedülálló” haranglábat említett, a cikk szövege középkori eredetet és „ritka” emléket ír.", "op": "", "src": [["Index: Porig égett a radostyáni műemlék templom, drónképeken a kiégett épület", "https://index.hu/belfold/2026/10/04/borsod-abauj-zemplen-megye-radostyan-templom-tuz-leegett/"]], "img": "https://kep.cdn.index.hu/1/0/7190/71906/719061/71906139_5300579_21ad336bb2597d6d10618463aac192fa_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/10/04/borsod-abauj-zemplen-megye-radostyan-templom-tuz-leegett/"}, {"id": "m-paks-fold", "r": "Megyei", "m": "Tolna", "c": "Korrupció", "w": "", "st": "Jelentett", "time": "okt. 5.", "t": "Hadházy szerint egy tiszás képviselő is hasznot húzhatott a százszorosan túlárazott paksi földügyletekből", "s": "A Paksi Ipari Park 2018 óta 32 milliárd forintért vásárolt földeket; Sárosi József mindent törvényesnek mond.", "p": ["A HVG szerint Hadházy Ákos Facebook-posztban új információkat közölt a paksi földvásárlásokról, és kiegészítette korábbi feljelentését; a rendőrség korábbi tájékoztatása szerint nyomozást rendelt el. A Paksi Ipari Park Kft. 2018 óta 32 milliárd forintért vásárolt földeket. Hadházy szerint a piaci ár hektáronként 1–1,5 millió forint lett volna, a PIP viszont 100–150 millió forintot fizetett; egy 20 hektáros legelőért 3 milliárdot adtak. A KSH adata szerint 2020-ban a gyep átlagos hektárára 800 ezer forint volt.", "Hadházy állítása szerint Sárosi József, Szekszárd mostani tiszás országgyűlési képviselője 2019/2020-ban a paksi városüzemeltetési cég vezérigazgatójaként megkereste a földtulajdonosokat, sikerdíjat ígért, amelyről magánszerződések rendelkeztek volna. Egy 5,5 hektáros, több mint 557 millió forintért megvásárolt mező birtokbaadási jegyzőkönyvében Sárosi neve az eladó kapcsolattartójaként szerepel; a PIP szerződéseiben nem."], "cav": "Hadházy állításai nem bizonyítottak, a nyomozás folyamatban van. Sárosi szerint minden törvényesen és az eladó teljes megelégedésével zajlott. A „túlárazás” Hadházy értékelése, független szakértői megállapítás nincs a cikkben.", "op": "Érdemes megjegyezni, hogy a vádló ezúttal a kormánypárt saját képviselőjét is megnevezi – ez nem bizonyíték, de a hitelességéhez hozzátartozik. A döntő kérdés az, hogy a 100–150 milliós hektáronkénti ár mögött bármilyen indokolható érték állt-e.", "src": [["HVG: Hadházy szerint egy tiszás képviselő is hasznot húzott a százszorosan túlárazott paksi földmutyiból", "https://hvg.hu/gazdasag/20261005_paksi-foldmutyi-hadhazy-akos-sarosi-jozsef-szekszard-tisza-part"], ["Index: Hadházy Ákos: Egy tiszás országgyűlési képviselő is jól járhatott a paksi földek százszoros túlárazásával", "https://index.hu/gazdasag/2026/10/05/hadhazy-akos-tisza-part-paks-tularazas-foldvasarlas/"]], "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/0f444ff0-1f4b-429c-808a-ddd97d929b5d.jpg", "imgs": "HVG", "imgl": "https://hvg.hu/gazdasag/20261005_paksi-foldmutyi-hadhazy-akos-sarosi-jozsef-szekszard-tisza-part"}, {"id": "m-bekes-idosotthon", "r": "Megyei", "m": "Békés", "c": "Szociális ellátás", "w": "", "st": "Jelentett", "time": "okt. 12.", "t": "Félelem és rettegés Békésben: két család és dolgozók vádolják a református idősotthont", "s": "Az intézmény vitatja a vádakat; a kormányhivatal rühességről és adománykérésről vizsgálódik.", "p": ["Az Index szerint a Békési Balogh Mátyás Református Diakóniai Központ 299 férőhelyes idősotthonáról két család és névtelen dolgozók számolnak be súlyos hiányosságokról. Az egyik család szerint az édesanyjukat húgyúti fertőzéssel kezelték, és nem látta orvos, a másik család szerint egy cukorbeteg lakó lábán lévő sebet későn vették észre, szepszis és amputáció után meghalt a kórházban. Az intézmény szerint a személyzet megfelelően járt el, a második esetben fénykép alapján orvos rendelt kezelést.", "A Békés Megyei Kormányhivatal 2025 szeptemberi határozata szerint a személyi feltételek nem feleltek meg a szakmai rendeletnek, a fenntartó pedig vállalta, hogy egy éven belül orvost alkalmaz; a foglalkoztatót mintegy 4 millió forintos munkaügyi bírsággal sújtották. Szeptemberben a MADOSZ rühességgel kapcsolatos bejelentést tett, a kormányhivatal az adománykérési gyakorlat és a rühesség ügyében vizsgálatot folytat. Egy lakó szerint a szobáért 800 ezer forint „adományt” kértek; az intézmény szerint ez belépési hozzájárulás, amelyet három éven belül időarányosan visszafizetnek."], "cav": "A dolgozók szerint műszakonként 2–3 fő jutott akár 65 lakóra, az intézmény szerint nincs létszámhiány. Az intézményi orvos a rühességet dermatitisnek minősítette, a kormányhivatal a feljelentést nem igazolta. Demeter Ottó esperes a vádakat elutasítja.", "op": "Névtelen dolgozói állítások és két család története áll szemben az intézmény adataival; az a rész az erősebb, ahol hatósági határozat van mögötte (orvosi feltételek, bírság). A többit a kormányhivatali vizsgálatnak kell eldöntenie.", "src": [["Index: Félelem és rettegés Békésben", "https://index.hu/belfold/2026/10/12/idosotthon-szocialis-kozpont-bekes-bekes-megye-madosz-balogh-matyas-reformatus-diakoniai-kozpont-ellatas-halaleset/"]], "img": "https://kep.cdn.index.hu/1/0/7198/71986/719860/71986079_5306149_381a1dbe9dd0bf93394a1ef46bcd4a1d_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/10/12/idosotthon-szocialis-kozpont-bekes-bekes-megye-madosz-balogh-matyas-reformatus-diakoniai-kozpont-ellatas-halaleset/"}, {"id": "m-szentendre", "r": "Megyei", "m": "Pest", "c": "Bűnügy", "w": "", "st": "Megerősített", "time": "okt. 12.", "t": "Rágyújtotta szüleire a házukat egy szentendrei férfi, az anyja meghalt", "s": "A rendőrség különös kegyetlenséggel elkövetett emberöléssel gyanúsítja az 51 éves férfit.", "p": ["A HVG az RTL Híradó beszámolójára hivatkozva azt írja, hogy egy 51 éves férfi felgyújtotta szülei szentendrei házát. Édesanyja meghalt a tűzben, édesapja ki tudott menekülni, ő hívta a rendőröket; a fia késsel is megtámadta. A férfi a rendőröket is fenyegette, elfutott, később elfogták. Az épület teljesen leégett, lakhatatlanná vált. A rendőrség különös kegyetlenséggel elkövetett emberöléssel gyanúsítja.", "Szomszédok hangos veszekedést hallottak a tragédia előtt. Egy névtelen szomszéd szerint a férfi pszichés beteg, többször került zárt intézetbe, gyógyszert kellett szednie, és agresszív volt."], "cav": "A metaleírás szerint a férfi „bezárta” a szüleit, a cikk törzse ezt nem említi, és az apa kimenekült. A kés-támadás és a gyújtogatás sorrendje nem egyértelmű. A férfi betegségére vonatkozó állítás egyetlen, névtelen szomszédtól származik. A cikk nem nevezi meg a megyét; Szentendre Pest megyében fekszik.", "op": "", "src": [["HVG: Rágyújtotta szüleire a házukat egy szentendrei férfi", "https://hvg.hu/itthon/20261012_szentendre-gyujtogatas-emberoles"]], "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/d5ad9f13-3e37-413d-9e5c-14e2e7236c83.jpg", "imgs": "HVG", "imgl": "https://hvg.hu/itthon/20261012_szentendre-gyujtogatas-emberoles"}, {"id": "m-esztergom", "r": "Megyei", "m": "Komárom-Esztergom", "c": "Önkormányzat", "w": "", "st": "Jelentett", "time": "okt. 13.", "t": "Hernádi Ádám az esztergomi uszodabotrányról: „Nem a felelősöket kell keresni”", "s": "A 110 éves Szent István strandfürdőt október 9-én, azonnali hatállyal bezáratták vízkezelési szabálytalanság miatt.", "p": ["Az Index interjúja szerint Hernádi Ádám, Esztergom polgármestere az október 9-én bejelentett azonnali bezárásról azt mondta, hogy senkit nem küldött el a város, és nem is fog. A hatóság szeptember 10-én szemlét tartott vízmintavétel nélkül; korábban egy júliusi vízmintára hivatkozva akarták bezáratni a fürdőt. A felújítás Hernádi szerint 2027 tavaszán kezdődik és 2028 tavaszán fejeződik be: az első ütem a nagy medence és a gépészet, a második a műemléki fedett uszoda.", "A pénzügyekről a polgármester azt mondta, hogy a 2023-as Kisfaludy-pályázatból 2,5 milliárd forint soha nem érkezett meg közvetlenül a városhoz, a beruházás költsége pedig 6 milliárd forintra nőtt, amit az önkormányzat a kormányzati elvonások miatt nem tudott kiegészíteni. Átmeneti megoldásként buborékfedést terveznek a 25 méteres medencére, ahol a strandbérletesek ingyen úszhatnak."], "cav": "A cikk „százéves” és „110 éves” fürdőről is ír. Hernádi szerint az üzemeltetési engedély 2029 márciusáig szól, a vízkezelő rendszernek viszont december 31-ig el kellett volna készülnie; a határidőről való tudomására vonatkozó állítások eltérnek. Bírálói „tűzoltásnak” nevezik a városvezetés munkáját, ezt ő elutasítja. A cikk nem nevezi meg a megyét; Esztergom Komárom-Esztergom megyében fekszik.", "op": "Az, hogy a polgármester szerint nem a felelősöket kell keresni, kényelmes mondat egy olyan ügyben, ahol a határidő hosszabb ideje ismert volt. Az viszont tény, hogy a hatósági eljárás menete (mintavétel nélküli szemle, hirtelen bezárás) is kérdéseket vet fel.", "src": [["Index: Hernádi Ádám megszólalt az esztergomi uszodabotrányról", "https://index.hu/belfold/2026/10/13/hernadi-adam-esztergom-polgarmester-szent-istvan-strandfurdo/"], ["Telex: Azonnali hatállyal bezáratták Esztergom 110 éves strandfürdőjét", "https://telex.hu/belfold/2026/10/09/esztergom-szent-istvan-strandfurdo-felujitas-bezaras-kormanyhivatal-hernadi-adam"]], "img": "https://kep.cdn.index.hu/1/0/7201/72015/720151/72015153_5308293_b2acb9c680442217685c02cd2a3f001e_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/10/13/hernadi-adam-esztergom-polgarmester-szent-istvan-strandfurdo/", "cred": "Fotó: Tövissi Bence / Index"}, {"id": "m-szombathely-azbeszt", "r": "Megyei", "m": "Vas", "c": "Környezet", "w": "", "st": "Jelentett", "time": "okt. 16.", "t": "Szombathely 2,25 milliárd forintot kér a kormánytól az azbesztmentesítésre", "s": "A polgármester szerint a teljes munka 2,5 milliárdba kerül, az önkormányzat 250 milliót vállal.", "p": ["A 444 szerint Nemény András szombathelyi polgármester pénteki videójában bejelentette, hogy az azbesztmentesítés összesen 2,5 milliárd forintba kerül, ebből az önkormányzat 10 százalékot, 250 milliót vállal, a maradék 2,25 milliárdot a kormánytól kérik. A tételek: az Oladi plató mentesítése 960 millió, 110 közterületi út és parkoló munkálatai 540 millió, a szennyezett útpadkák felszedése és elszállítása 900 millió forint.", "Az Oladi plató úttestjeit korábban osztrák eredetű, azbesztet tartalmazó kővel fedték, a cikk szerint később több helyre is került belőle, Kőszegen pedig a levegő azbesztrost-koncentrációja a vasi kormányhivatal adatai szerint elérte a határérték negyvenszeresét. A kormány augusztusban hozta létre a 3 milliárd forintos Azbeszt-mentesítési Alapot; a pályázati határidő október 16-án járt le. Kőszeg 545 millió forintra pályázott, az MTI szerint Velem, Lukácsháza és Táplánszentkereszt is beadta a pályázatát."], "cav": "A megnevezett tételek összege (960 + 540 + 900) 2,4 milliárd forint, nem 2,5. A cikk nem részletezi, hogy ebből mennyi szerepel a pályázatban.", "op": "", "src": [["444: Szombathely 2 milliárd 250 millió forintot kér a kormánytól az azbesztmentesítésre", "https://444.hu/2026/10/16/szombathely-2-milliard-250-millio-forintot-ker-a-kormanytol-az-azbesztmentesitesre"]], "img": "https://assets.4cdn.hu/kraken/8LE7YOyTU4aUX2M1s-lg.jpeg", "imgs": "444", "imgl": "https://444.hu/2026/10/16/szombathely-2-milliard-250-millio-forintot-ker-a-kormanytol-az-azbesztmentesitesre"}, {"id": "m-kecskemet-korhaz", "r": "Megyei", "m": "Bács-Kiskun", "c": "Egészségügy", "w": "", "st": "Jelentett", "time": "okt. 22.", "t": "Hónapokig nem javították meg a csőtörés miatt nem működő fűtést a kecskeméti kórházban", "s": "Több műtőben 16–19 fokot mértek; a fűtés október 22-én reggel indult újra.", "p": ["A Telex a Népszabadság videóriportjára hivatkozva azt írja, hogy a kecskeméti Bács-Kiskun Megyei Oktatókórház A épületében augusztusban csőtörés miatt leállt a fűtés, október második felében pedig több műtő maradt fűtés nélkül, a helyiségekben 16–19 fokot mértek. A fűtés az Okfő szerint október 22-én reggel indult újra. A kórház 70 olajradiátort vásárolt, és több millió forintot költött ágyneműre, betegmelegítő matracokra, takarókra és infúziómelegítőkre.", "Óváry Csaba főigazgató szerint már augusztusban látszott, hogy javítás nélkül nem lesz fűtés az épületben, és büntetőfeljelentést is tehet. Az Okfő a KEF-et nevezi felelősnek az épületek üzemeltetéséért; a KEF október 14-én három munkanapos javítási határidőt ígért, az Okfő szerint a 19-i befejezési határidőt nem tartották be. A KEF négy napja nem válaszolt a Népszabadság kérdéseire."], "cav": "A határidők és a munkakezdés dátuma (október 8., 14. vagy 19.) a forrásokban nem egyezik. A kórházvezetés szerint a hibát folyamatosan jelezték, az Okfő szerint a KEF augusztusban azt mondta, a fűtési szezonra zajlik a felkészülés.", "op": "Három hónap egy csőtörésre nem hibaelhárítás, hanem felelősségi lánc, amelyben senki nem érezte magáénak a kórház fűtését. Az operáló orvosoknak és betegeknek a „ki a felelős” vita kevés.", "src": [["Telex: Hónapokig nem javították meg csőtörés miatt nem működő fűtést a kecskeméti kórházban", "https://telex.hu/belfold/2026/10/22/kecskemet-korhaz-futes-hiba-javitas-hideg"]], "img": "https://assets.telex.hu/images/20261022/1792672513-temp-dfg09f0ik7qkeagkphg_facebook.jpg", "imgs": "Telex", "imgl": "https://telex.hu/belfold/2026/10/22/kecskemet-korhaz-futes-hiba-javitas-hideg"}, {"id": "m-mezopeterd", "r": "Megyei", "m": "Hajdú-Bihar", "c": "Baleset", "w": "", "st": "Megerősített", "time": "okt. 24.", "t": "Újabb halálos kisbuszbaleset Hajdú-Biharban: egy férfi meghalt, öten kórházba kerültek", "s": "A 42-es főúton, Mezőpeterd közelében két személyautó és egy kisbusz ütközött.", "p": ["Az Index szerint október 24-én, szombaton a 42-es főúton, Mezőpeterd közelében két személyautó és egy kisbusz ütközött. Az Országos Mentőszolgálat kommunikációs referense, Greutter Valentina Hanna az MTI-nek azt mondta, hogy az 50 éves férfi a helyszínen meghalt, a mentők nem tudták újraéleszteni. A mentők a halott férfival együtt hat személyt vizsgáltak meg.", "Egy 30 év körüli nő légzése a kiszabadításakor leállt, a mentők újraélesztették, életveszélyes állapotban szállították kórházba. Négy további érintett könnyebben sérült; összesen öt sérültet vittek kórházba. A szakaszt délelőtt teljes szélességében lezárták, a forgalom kora délután indult újra, a félpályás lezárás 17 órakor szűnt meg."], "cav": "A cikk nem közli, melyik járműben ült az elhunyt, és hogy a sérültek melyik járművel utaztak. A cím „újabb” balesetet említ, a korábbiról a cikk nem ír.", "op": "", "src": [["Index: Újabb halálos kisbuszbaleset történt Hajdú-Biharban", "https://index.hu/belfold/2026/10/24/karambol-kisbusz-auto-mentok-mezopeterd/"]], "img": "https://kep.cdn.index.hu/1/0/6926/69263/692637/69263793_5111641_cb0079e84ae384a5ccf1c0b3a1ce99c0_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/10/24/karambol-kisbusz-auto-mentok-mezopeterd/"}, {"id": "m-algyo", "r": "Megyei", "m": "Csongrád-Csanád", "c": "Tűz", "w": "", "st": "Jelentett", "time": "okt. 27.", "t": "A MÁV vitatja, hogy egy tehervonat okozta volna az algyői avartüzet", "s": "A katasztrófavédelem szerint felmerült, hogy egy vonat valamelyik féke beragadt.", "p": ["A Telex Szegeder rovata szerint október elején jelentős terület égett le az Algyő és Szeged közötti vasútvonal mentén, a forgalmat le kellett állítani. A szerkesztőséghez olyan információ jutott, hogy a tüzet egy arra haladó tehervonat okozhatta, és fotók készültek egy mozdonyról, amely napokig Algyőn vesztegelt, nagyjából a tűz végpontjánál. A MÁV szerint a vágányok menti tüzeknek gyakran külső okuk van (illegális tűzgyújtás, eldobott cigaretta), a szegedi esetben egy váltó kábele megégett, amelyet pótoltak.", "A MÁV válasza szerint nyáron vagy kevésbé szélsőséges aszályban szinte elenyésző az esélye, hogy a fékezés szikrája tüzet okoz, extrém aszályban azonban előfordulhat. A cikk háttérként cseh és norvég esetekre hivatkozik (2723 vasút menti tűz 2011 és 2019 között Csehországban)."], "cav": "A MÁV nem erősítette meg, hogy a tehervonat okozta a tüzet. A Csongrád-Csanád Megyei Katasztrófavédelmi Igazgatóság szerint felmerült, hogy egy vonat fékje beragadhatott, a pontos műszaki okot nem tudták megmondani. A tűz pontos napját a cikk nem adja meg.", "op": "", "src": [["Telex: A MÁV vitatja, hogy egy tehervonat okozta volna az algyői avartüzet", "https://telex.hu/belfold/2026/10/27/mav-avartuz-katasztrofavedelem-algyo-tehervonat"]], "img": "https://assets.telex.hu/images/20261020/1792491549-temp-v73p8tlpr4ad8gnpacj_facebook.jpg", "imgs": "Telex", "imgl": "https://telex.hu/belfold/2026/10/27/mav-avartuz-katasztrofavedelem-algyo-tehervonat"}, {"id": "m-jarvany", "r": "Megyei", "m": "Győr-Moson-Sopron", "c": "Egészségügy", "w": "", "st": "Megerősített", "time": "okt. 27.", "t": "Tömeges járványok: egy győr-moson-sopron megyei iskolában 177-en betegedtek meg", "s": "Az NNGYK heti jelentése szerint október 12–18. között három tömeges közösségi járványt jeleztek, összesen 251 megbetegedéssel.", "p": ["Az Index az NNGYK heti jelentése alapján három tömeges járványt ismertet. Győr-Moson-Sopron megyében egy általános iskolában szeptember 25. óta a 635 érintettből 177-en betegedtek meg (162 tanuló, 15 dolgozó), fő tünet a hányás és hasmenés, kórházi ellátásra senki nem szorult. A vizsgált 20 betegből 19-nél calicivírust mutattak ki; a hatóságok az étel szerepét kizárták, a terjedés feltehetően közvetlen érintkezéssel történt.", "Pest megyében egy óvodában október 9. óta a 195 érintettből 34-en (33 gyermek, 1 dolgozó) betegedtek meg; az óvodai étel nem okozta, a fertőzés feltehetően vírusos. Hajdú-Bihar megyében egy idősek otthonában október 4. és 14. között a 158 érintettből 40-en (38 gondozott, 2 dolgozó) betegedtek meg, ketten kórházba kerültek; az öt vizsgált beteg közül egynél igazoltak calicivírust."], "cav": "A jelentési időszak (október 12–18.) nem fedi a járványok kezdetét. A győri esetben a calicivírus kimutatása igazolt, a terjedési mód csak „feltehetően” közvetlen érintkezés.", "op": "", "src": [["Index: Tömeges járványok robbantak ki az országban: több százan betegedtek meg", "https://index.hu/belfold/2026/10/27/jarvany-fertozes-iskola-betegseg-gyor-moson-sopron-hanyas-hasmenes-calicivirus/"]], "img": "https://kep.cdn.index.hu/1/0/7225/72255/722555/72255563_5325211_04d6b71971a9d79c0812e975f05e81d7_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/10/27/jarvany-fertozes-iskola-betegseg-gyor-moson-sopron-hanyas-hasmenes-calicivirus/"}, {"id": "m-bolcsode", "r": "Megyei", "m": "Somogy", "c": "Bűnügy", "w": "", "st": "Megerősített", "time": "okt. 27.", "t": "Vádat emeltek két somogyi bölcsődei dolgozó ellen, akik „undormánynak” neveztek egy hároméves kisfiút", "s": "Az ügyészség felfüggesztett börtönt és végleges eltiltást indítványozott.", "p": ["A Somogy Megyei Főügyészség közleménye szerint a Kaposvári Járási Ügyészség vádat emelt két volt bölcsődei dolgozó – egy gyermeknevelő és egy dajka – ellen egy Kaposvár közeli község bölcsődéjében. Az ügyészség szerint 2024 novembere óta többször szidalmazták a hároméves kisfiút, és fegyelmezési céllal megrángatták. Egy ebéd közben, miután a gyerek az asztal alá mászott, a dajka az ágyhoz vitte, széles ragasztószalaggal leragasztotta a száját, majd néhány másodperc múlva letépte.", "Az ügyészség szerint a gyermeknek nem keletkezett sérülése, de a két dolgozó súlyosan megszegte hivatási kötelességét. A munkáltató rendkívüli felmentéssel azonnal megszüntette a jogviszonyukat. A vád kiskorú veszélyeztetése; az ügyészség felfüggesztett börtönbüntetést és minden 18 év alatti személlyel foglalkozó munkától való végleges eltiltást indítványozott."], "cav": "A cím és a leírás „bántalmazásról” beszél, a szöveg szerint a gyermek nem szenvedett sérülést. Jogerős ítélet nincs, a cikk csak a vádemelésről számol be.", "op": "", "src": [["Index: Vádat emeltek két somogyi bölcsődei dolgozó ellen", "https://index.hu/belfold/2026/10/27/somogy-megye-kaposvari-jarasi-ugyeszseg-vademeles-bolcsodei-dolgozok-birosag/"]], "img": "https://kep.cdn.index.hu/1/0/6314/63143/631437/63143771_4669425_70fa6aa3a0d855f0dbe98f573a9e7282_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/10/27/somogy-megye-kaposvari-jarasi-ugyeszseg-vademeles-bolcsodei-dolgozok-birosag/"}, {"id": "m-csaroda", "r": "Megyei", "m": "Szabolcs-Szatmár-Bereg", "c": "Bűnügy", "w": "", "st": "Megerősített", "time": "okt. 28.", "t": "Előre megszervezett akció volt a csarodai fegyveres rablás, négy embert letartóztattak", "s": "A támadók két ukrán nőtől több tízmillió forintnyi valutát vittek el.", "p": ["Az Index a megyei rendőrség tájékoztatására hivatkozva azt írja, hogy október 15-én reggel, a csarodai postahivatal előtt két fekete ruhás, maszkos férfi két, autóban ülő ukrán nőre támadt: betörték az oldalsó szélvédőt, paprikasprayt fújtak be, majd fegyverrel fenyegetve pénzt követeltek. A rablók több tízmillió forintnak megfelelő valutával menekültek el.", "Október 21-én a TEK és a szabolcsi Jonatán Közterületi Támogató Alosztály elfogta a négy gyanúsítottat: egy 36 éves nyíregyházi férfit Tiszaújvárosban, egy 34 éves tiszatarjáni nőt Polgáron, egy 42 éves férfit és 38 éves feleségét Nyíregyházán. A házkutatásokon a pénz egy részét lefoglalták, fegyvert nem találtak. A bíróság letartóztatást rendelt el, az egyik gyanúsítottal szemben bűnügyi felügyeletet. A rendőrség szerint előre tudták, hogy a sértettek mikor tartózkodnak ott, és hogy náluk pénz van; a két nő sofőrként és figyelőként vett részt."], "cav": "Az összeg nem egységes: a lead „több tízmillió forintnak megfelelő”, a leírás „tízmillió forintnak megfelelő”, egy korábbi közlemény címe „közel 10 millió forintot” említ.", "op": "", "src": [["Index: Előre megszervezett akció volt a csarodai fegyveres rablás, négy embert letartóztattak", "https://index.hu/belfold/2026/10/28/szabolcs-szatmar-bereg-varmegye-csaroda-rablas-ukran-nok-szervezett-tamadas/"]], "img": "https://kep.cdn.index.hu/1/0/7227/72275/722756/72275679_5326611_aa94afe6f3db2c3933493a1b68856dce_wm.png", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/10/28/szabolcs-szatmar-bereg-varmegye-csaroda-rablas-ukran-nok-szervezett-tamadas/"}, {"id": "m-catl-itelet", "r": "Megyei", "m": "Hajdú-Bihar", "c": "Ipar, környezet", "w": "", "st": "Megerősített", "time": "okt. 29.", "t": "Jogerős döntés a debreceni CATL-gyár ügyében: a bíróság elutasította a civilek keresetét", "s": "A fellebbezésnek helye nincs; a kormányhivatal felügyeli a gyár működését.", "p": ["Az Index szerint október 29-én a Debreceni Törvényszék jogerősen elutasította a helyi magánszemélyek és civil szervezetek keresetét, amely a Hajdú-Bihar Vármegyei Kormányhivatal egységes környezethasználati engedélyét támadta. A pert 2023 márciusában indították. Szászi Ádám tanácsvezető bíró szerint a bíróság a kereseteket elutasította, az ítélet ellen fellebbezésnek nincs helye.", "Az engedélyt 2023 óta négyszer módosították, a gyár a 2025-ben elfogadott negyedik módosítás szerint működhet. A felperesek ez ellen nem fellebeztek, így az jogerőssé vált, a 2023-as engedélyről a bíróság már nem dönthetett, mert az eredeti formájában nem létezik. A bíróság jogszabálysértést nem állapított meg. Az indoklás szerint szabálytalanság esetén a kormányhivatal módosíthatja vagy visszavonhatja az engedélyt, sőt felfüggesztheti vagy megtilthatja a működést."], "cav": "A keresetek a 2023-as engedélyt támadták, a bíróság szerint viszont az már nem létezik, ezért az érdemi vizsgálat a hatályos engedélyre vonatkozott. Az ítélet tehát elsősorban eljárási okokból sikertelen a felperesek számára, nem a környezeti aggályok érdemi cáfolata.", "op": "A jogerős ítélet csak annyit jelent, hogy az engedély jogszerű; a gyár környezeti hatásairól szóló vita ezzel nem dőlt el, főleg az augusztusi nikkelterhelés után. A kormányhivatal felügyeleti szerepe most lesz igazán lényeges.", "src": [["Index: Jogerős döntés született a debreceni CATL-gyár ügyében", "https://index.hu/belfold/2026/10/29/debrecen-catl-akkumulatorgyar-kereset-civilek-elutasitas-birosag/"]], "img": "https://kep.cdn.index.hu/1/0/7229/72298/722987/72298705_5328219_bb91d27193810c8871575aa0248ef80b_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/10/29/debrecen-catl-akkumulatorgyar-kereset-civilek-elutasitas-birosag/"}];

const dayVal=t=>{const m=String(t).match(/(\d{1,2})\./);return m?+m[1]:0};
{const s=items.map((i,k)=>[i,k]).sort((a,b)=>dayVal(b[0].time)-dayVal(a[0].time)||a[1]-b[1]).map(x=>x[0]);items.splice(0,items.length,...s)}
const stc=i=>i.st=="Megerősített"?"c":"u";
function newsFallback(i){
 const palette={"Belpolitika":"#284c83","Gazdaság":"#16756e","Külföld":"#873d68","Közélet":"#816422","Sport":"#367e47","Kultúra":"#6846a2"};
 const color=palette[i.r]||"#344c6b";
 const svg='<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><rect width="640" height="360" fill="'+color+'"/><circle cx="540" cy="70" r="150" fill="#ffffff" opacity=".07"/><path d="M0 295L640 145" stroke="#ffffff" stroke-width="16" opacity=".12"/><text x="35" y="168" fill="#ffffff" font-family="Arial,sans-serif" font-size="56" font-weight="bold">HÍRPULT</text><text x="37" y="215" fill="#ffffff" font-family="Arial,sans-serif" font-size="25">'+(i.r||"Hírek")+'</text></svg>';
 return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
function row(i){
 const fallback=newsFallback(i);
 const image=i.img&&/^https:\/\//.test(i.img)?i.img:fallback;
 return `<article class="row${i.lead?" lead":""}" data-r="${esc(i.r)}"><div class="gut"><span class="tag">${esc(i.r)}</span><span class="sub">${esc(i.c)}${i.w?" · "+esc(i.w):""}</span></div>
 <div><img class="news-image" src="${esc(image)}" data-fallback="${esc(fallback)}" alt="${i.img?"Hírillusztráció":"Hírpult rovatillusztráció"}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src=this.dataset.fallback"><small class="news-credit">${i.img?`Kép: ${esc(i.imgs||i.c)} · <a href="${esc(i.imgl||i.src?.[0]?.[1]||"#")}" target="_blank" rel="noopener noreferrer">Eredeti forrás</a>`:"Illusztráció: Hírpult"}</small><h3><a class="t" href="#" data-id="${esc(i.id)}">${esc(i.t)}</a></h3><p>${esc(i.s)}</p><a class="more" href="#" data-id="${esc(i.id)}">${i.ai_edited?"Hírpult-cikk":"Hírösszefoglaló"} →</a></div></article>`;
}
function bind(){app.querySelectorAll("[data-id]").forEach(a=>a.onclick=e=>{e.preventDefault();open(a.dataset.id)})}
function home(){
 const cnt=c=>c=="Mind"?items.length:items.filter(i=>i.r==c).length;
 const th=["Wekerle+","MNB-ügy"].map(w=>{const l=items.filter(i=>i.w==w);return `<button class="thread" data-t="${w}" aria-pressed="${thr==w}"><b>${w}</b><span>${l[0].t}</span></button>`}).join("");
 app.innerHTML=`<div class="shell"><nav class="rail" aria-label="Rovatok"><h2>Rovatok</h2>${cats.map(c=>`<button class="sec" data-c="${c}" aria-pressed="${c==cat}">${c}</button>`).join("")}</nav>
 <div class="main"><input type="search" class="search" id="q" placeholder="Keresés a hírekben" aria-label="Keresés a hírekben" value="${esc(term)}">
 <div class="threads" aria-label="Fókuszban lévő témák">${th}</div><div id="list"></div></div></div>`;
 app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{cat=b.dataset.c;home()});
 app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{thr=thr==b.dataset.t?"":b.dataset.t;home()});
 document.getElementById("q").oninput=e=>{term=e.target.value.toLowerCase();list()};
 list();document.title="Hírpult";
}
function list(){
 const el=document.getElementById("list");
 const l=items.filter(i=>(cat=="Mind"||i.r==cat)&&(!thr||i.w==thr)&&(i.t+" "+i.s).toLowerCase().includes(term));
 if(!l.length){el.innerHTML='<p class="empty">Nincs találat. Töröld a keresést, vagy válassz másik rovatot.</p>';return}
 let h="",d=null;
 for(const i of l){const dv=dayVal(i.time);if(dv!==d){d=dv;h+=`<div class="day">${DAYS[dv]||i.time}</div>`}h+=row(i)}
 el.innerHTML=h;bind();
}
function open(id){
 const i=items.concat(COUNTY).find(x=>x.id==id);if(!i)return;
 app.innerHTML=`<div class="full" data-r="${i.r}"><button class="back" id="bk">← Vissza a hírekhez</button><div><span class="tag">${i.r} · ${esc(i.c)}</span><span class="mm">${i.time} · ${i.st}</span></div><h2>${i.t}</h2><p class="lede">${i.s}</p>${i.img?`<figure class="ph"><img src="${i.img}" alt="${esc(i.t)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"><figcaption>${i.cred?esc(i.cred)+" · ":"Kép: "}${i.imgs} – az eredeti cikkből, <a href="${i.imgl||i.src[0][1]}" target="_blank" rel="noopener">megtekintés a forrásnál</a>. A kép jogosultja az eredeti kiadó.</figcaption></figure>`:""}${i.p.map(p=>`<p>${p}</p>`).join("")}
 ${i.op?`<div class="cav op"><b>Szubjektív nézőpont</b>${i.op}</div>`:""}
 ${i.ai_edited?"":i.cav?`<div class="cav"><b>Amit érdemes tudni</b>${i.cav}</div>`:""}
 <div class="srcs"><b>Forrás${i.src.length>1?"ok":""}:</b> ${i.src.map(s=>`<a href="${esc(s[1])}" target="_blank" rel="noopener noreferrer">${esc(s[0])}</a>`).join(" · ")}</div></div>`;
 document.getElementById("bk").onclick=home;
 document.title=i.t+" – Hírpult";window.scrollTo(0,0);
}
document.getElementById("home").onclick=e=>{e.preventDefault();thr="";cat="Mind";term="";home()};

const COUNTY_ALL=COUNTY.map(i=>Object.assign({},i,{r:i.m}));
const MKEY=t=>{const M={"júl.":7,"aug.":8,"szept.":9,"okt.":10,"nov.":11};const m=String(t).match(/^(\S+)\s+(\d{1,2})/);return m?(M[m[1]]||0)*100+ +m[2]:0};
COUNTY_ALL.sort((a,b)=>MKEY(b.time)-MKEY(a.time));
const MEGYEK=["Mind"].concat([...new Set(COUNTY_ALL.map(i=>i.m))].sort((a,b)=>a.localeCompare(b,"hu")));
let view="nat", mcty="Mind";
const CITIES=[["Budapest",47.4979,19.0402],["Debrecen",47.5316,21.6273],["Miskolc",48.1035,20.7784],["Szeged",46.253,20.1414],["Pécs",46.0727,18.2328],["Győr",47.6875,17.6504],["Nyíregyháza",47.9554,21.7167],["Siófok",46.9049,18.052]];
const WC=c=>c==0?"Derült":c<=3?"Felhős":c<=48?"Köd":c<=67?"Eső":c<=77?"Havazás":c<=82?"Zápor":"Zivatar";
const _homeNat=home;
const _tabs=()=>`<nav class="views" aria-label="Nézetek">${[["nat","Országos"],["megye","Megyei hírek"],["ido","Időjárás"]].map(([k,l])=>`<button class="vt" data-v="${k}" aria-pressed="${view==k}">${l}</button>`).join("")}</nav>`;
function bindTabs(){app.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;home()})}
function mlist(){
  const el=document.getElementById("list"); if(!el)return;
  const l=COUNTY_ALL.filter(i=>(mcty=="Mind"||i.m==mcty)&&(i.t+" "+i.s).toLowerCase().includes(term));
  if(!l.length){el.innerHTML='<p class="empty">Nincs találat. Töröld a keresést, vagy válassz másik megyét.</p>';return}
  let h="",d=null;
  for(const i of l){const k=MKEY(i.time);if(k!==d){d=k;h+=`<div class="day">2026. ${i.time}</div>`}h+=row(i)}
  el.innerHTML=h;bind();
}
function megye(){
  app.innerHTML=_tabs()+`<div class="shell"><nav class="rail" aria-label="Megyék"><h2>Megye</h2>${MEGYEK.map(m=>`<button class="sec" data-m="${esc(m)}" aria-pressed="${m==mcty}">${esc(m)}</button>`).join("")}</nav><div class="main"><p class="note">Megyei és helyi hírek, 2026. július 30. és október 30. között. Minden tétel forráscikkre épül, a forrás a cikk alján látható.</p><input type="search" class="search" id="q2" placeholder="Keresés a megyei hírekben" aria-label="Keresés a megyei hírekben" value="${esc(term)}"><div id="list"></div></div></div>`;
  bindTabs();
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mcty=b.dataset.m;megye()});
  document.getElementById("q2").oninput=e=>{term=e.target.value.toLowerCase();mlist()};
  mlist();document.title="Hírpult – Megyei hírek";
}
function weather(){
  app.innerHTML=_tabs()+`<h2 class="wxh">Időjárás – élő előrejelzés</h2><p class="wxn">Az adatok az Open-Meteo előrejelzési szolgáltatásból töltődnek be az Ön böngészőjébe, a szolgáltató frissítése szerint. Hivatalos figyelmeztetésekért: <a href="https://www.met.hu/idojaras/veszelyjelzes/index.php" target="_blank" rel="noopener">HungaroMet</a>.</p><div id="wxg" class="wxg"><p class="empty">Betöltés…</p></div>`;
  bindTabs();document.title="Hírpult – Időjárás";
  const lats=CITIES.map(c=>c[1]).join(","),lons=CITIES.map(c=>c[2]).join(",");
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=Europe%2FBudapest&forecast_days=1`)
  .then(r=>{if(!r.ok)throw 0;return r.json()})
  .then(d=>{const arr=Array.isArray(d)?d:[d];const g=document.getElementById("wxg");if(!g)return;
    g.innerHTML=arr.map((x,k)=>{const c=x.current;return `<article class="wxc"><b>${CITIES[k][0]}</b><span class="wt">${Math.round(c.temperature_2m)}°C</span><small>${WC(c.weather_code)} · szél ${Math.round(c.wind_speed_10m)} km/h</small><small>Ma: ${Math.round(x.daily.temperature_2m_min[0])}…${Math.round(x.daily.temperature_2m_max[0])}°C · csapadék ${x.daily.precipitation_sum[0]} mm</small></article>`}).join("")})
  .catch(()=>{const g=document.getElementById("wxg");if(g)g.innerHTML='<p class="empty">Az élő előrejelzés most nem tölthető be. Próbálja később, vagy nézze meg a <a href="https://www.met.hu/idojaras/elorejelzes/index.php" target="_blank" rel="noopener">HungaroMet előrejelzését</a>.</p>'});
}
home=function(){
  if(view=="nat"){_homeNat();app.insertAdjacentHTML("afterbegin",_tabs());bindTabs();return}
  if(view=="megye"){megye();return}
  weather();
};
home();
// Load timestamped RSS news; editorial records remain unchanged.
async function loadNews(){
 try {
  const response=await fetch("data/news.json",{cache:"no-store"});
  if(!response.ok)return;
  const payload=await response.json();
  if(!Array.isArray(payload.items))return;
  const allowed=new Set(["24.hu","Telex","HVG","444"]);
  const known=new Set(items.map(i=>i.id));
  const incoming=payload.items.filter(i=>i && typeof i.id==="string" && !known.has(i.id) && typeof i.t==="string" && typeof i.published_at==="string" && allowed.has(i.c) && Array.isArray(i.src) && i.src[0] && /^https:\/\//.test(i.src[0][1]));
  incoming.sort((a,b)=>Date.parse(b.published_at)-Date.parse(a.published_at));
  if(!incoming.length)return;
  items.unshift(...incoming);
  // Merge RSS and editorial records into one newest-first national timeline.
  const months={"jan.":1,"febr.":2,"márc.":3,"ápr.":4,"máj.":5,"jún.":6,"júl.":7,"aug.":8,"szept.":9,"okt.":10,"nov.":11,"dec.":12};
  const stamp=i=>{if(i.published_at){const t=Date.parse(i.published_at);if(Number.isFinite(t))return t;}const m=String(i.time||"").match(/^(\S+)\s+(\d{1,2})/);return m&&months[m[1]]?Date.UTC(2026,months[m[1]]-1,Number(m[2])):0;};
  items.sort((a,b)=>stamp(b)-stamp(a));
  if(view==="nat" && typeof home==="function")home();
 }catch(err){console.warn("News RSS data unavailable",err)}
}
loadNews();
</script>
