 tesz fel az első napon, az évad felét. A hivatalos előzetes szerdán jelent meg, a nyár eleji San Diego Comic-Con-os rövidebb ízelítő után.", "A Telex szerint az előzetesben nagy seregek, olifántok és trollok, a Gyűrűlidércek előfutárai, a Sauron által a Gyűrűkkel megrontott kilenc ember, Celeborn érkezése, egy Balrog és első alkalommal az, hogyan kovácsolta Sauron az Egy Gyűrűt. Gandalf kezd varázslóként viselkedni, és csaták vannak Sauron és az ellene harcoló emberek, elfek és törpék szövetsége között. A showrunner, Patrick McKay szerint a nézők nincsenek felkészülve arra, ami következik."], "cav": "", "src": [["Telex: A hatalom gyűrűi harmadik évad előzetes", "https://telex.hu/after/2026/10/21/a-hatalom-gyuruji-prime-video-sorozat-harmadik-evad-elozetes"]], "op": "Az évad felének az első napon való közzététele azt jelzi, hogy a streaming-szolgáltatók mennyire a binge-nézésre építenek. A Tolkien-rajongók örülhetnek: Sauron és a Balrog is előkerül az előzetesben."}, {"id": "orban-okostelefon-parizs", "img": "https://assets.4cdn.hu/kraken/8PHwuSzBP8oBT2JMs.jpeg", "imgs": "444", "cred": "Orbán Viktor Párizsban 2026. október 23-án. Fotó: olvasónk (444)", "imgl": "https://444.hu/2026/10/23/orban-viktor-parizsban-tolti-oktober-23-at", "r": "Belpolitika", "c": "Fidesz", "st": "Jelentett", "time": "okt. 24.", "t": "Okostelefonnal fotózták Párizsban Orbán Viktort, aki évekig a nyomógombos Nokiára esküdött", "s": "A lesifotón a volt miniszterelnök egy louvre-i szálloda teraszán okostelefont használ, miközben otthon a Fidesz ünnepelt nélküle.", "p": ["Az Index szombati cikke szerint október 23-án paparazzifotó készült Orbán Viktorról a párizsi Normandy Hotel teraszán, a Louvre közelében. A képen a volt miniszterelnök okostelefont használ. Orbán korábban többször is azt mondta, hogy nyomógombos telefon híve, a 2026-os választás előtt pedig azzal indokolta az okostelefon kerülését, hogy tart a nemzetközi lehallgatástól. 2020 áprilisában egy 2009-es Nokia 6700-ról posztolt fotót azzal a felirattal, hogy az Európai Tanács elnökével egyeztetett.", "Orbán nem volt jelen a Fidesz Bem téri megemlékezésén, ahol Bóka János beszélt. A 444 elsőként számolt be párizsi jelenlétéről. Havasi Bertalan, a Fidesz sajtófőnöke megerősítette a távollétet, de nem mondta meg, miért utazott el, és azt kérdezte, mit tudna megváltoztatni, ha otthon lenne. Magyar Pétert azzal vádolta, hogy önkényt épít.", "Háttérként: Párizsban hetek óta tüntetések zajlanak, a francia kormány a hírek szerint 70 ezer rendőrt vetett be."], "cav": "A fotó egy lesifotó, a cikk nem közli, hogy Orbán miért tartózkodott Párizsban.", "op": "A kormányváltás után első alkalommal ünnepelt ellenzékben a Fidesz. Aki évekig a „nemzeti ünnep” őrének mutatta magát, annak távolléte a legfontosabb magyar állami ünnepen kérdéseket vet fel, a Fidesz szerint viszont ez magánügy.", "src": [["Index: Orbán Viktor okostelefonnal Párizsban", "https://index.hu/belfold/2026/10/24/orban-viktor-okostelefon-parizs-foto-nokia-nyomogombos/"], ["444: Orbán Viktor Párizsban tölti október 23-át", "https://444.hu/2026/10/23/orban-viktor-parizsban-tolti-oktober-23-at"]]}, {"id": "matolcsy-ovadek-fellebbezes", "img": "https://assets.4cdn.hu/kraken/7NhhHSIheD5EzwfIs.jpeg", "cred": "Matolcsy György 2019-ben. Fotó: Botos Tamás/444", "imgs": "444", "r": "Belpolitika", "c": "Bűnügy", "w": "MNB-ügy", "st": "Jelentett", "time": "okt. 23.", "t": "A bíróság elutasította Matolcsy 30 milliós óvadékát, mindhárom letartóztatott fellebbezett", "s": "A volt jegybankelnök a teljes megtakarítását felajánlotta, de a nyomozási bíró egy hónapra letartóztatta őt, a cégjogászt és a Quartz vezetőjét is.", "p": ["A 444 beszámolója szerint Matolcsy György és védője, Bátki Pál 30 millió forint óvadékot ajánlott fel a letartóztatás elkerülésére. A Telex szerint ezt a teljes megtakarításaként nevezte meg. A bíróság elutasította. A pénteki tárgyalás nagyjából két és fél óráig tartott, Matolcsy hosszan beszélt a személyes körülményeiről, a bíró a fiáról, Matolcsy Ádámról nem kérdezett.", "A bíróság egy hónapra letartóztatta Matolcsy Györgyöt, Sándor Tamást (Matolcsy Ádám cégeinek állandó jogászát) és Valkó Mihályt, egy kapcsolódó cég vezetőjét. Mindhárman fellebbeztek, így a döntés nem jogerős. Az írásbeli indoklás a jövő héten várható, a másodfokú döntés a hírek szerint heteken belül megszülethet.", "Az ügy középpontjában egy 2025. február 28-i értékpapír-kölcsönszerződés áll, amelyben az MNB-alapítványok vagyonát kezelő Optima Befektetési Zrt. érintett. Az ügyészség szerint a cél az volt, hogy Matolcsy a megbízatása lejárta után is befolyásolhassa az alapítványok vagyonát. A kárt több százmillió forintra becsülik. A szerződést utolsó hivatali napján írták alá, a magyarázatot nem adta meg. A gyanú gazdasági csalás, a felek vitatják, hogy a cselekmény megfelel-e a törvényi tényállásnak.", "Matolcsy Ádám és Stofa György, az Optima volt vezetője külföldön tartózkodnak, ellenük belföldi elfogatóparancs van érvényben. Az ügyészség európai és nemzetközi körözést kért, erről a bíróság még nem döntött."], "cav": "A letartóztatottak számát és neveit a források eltérően közlik, a 444 cikke három letartóztatottat nevez meg. A letartóztatás nem jogerős.", "op": "Az MNB-ügy jogállami minősége az eljárás hátralévő részén múlik: a fellebbezések és az indoklás tisztességes elbírálása ugyanolyan fontos, mint a vagyon visszaszerzése.", "src": [["444: Matolcsy óvadék, bíróság elutasította", "https://444.hu/2026/10/23/matolcsy-gyorgy-az-osszes-megtakaritasat-30-millio-forintot-ajanlott-fel-ovadekkent-de-a-birosag-elutasitotta"], ["Index: Letartóztatták Matolcsy Györgyöt", "https://index.hu/belfold/2026/10/23/matolcsy-gyorgy-letartoztatas-nyomozas-mnb-jegybank-elnok-birosag/"]]}, {"id": "matolcsy-adam-dubaj", "img": "https://kep.cdn.index.hu/1/0/7218/72183/721830/72183021_5320123_906e49466fa8fa9b28ddec5f9f05c676_wm.jpg", "imgs": "Index", "r": "Belpolitika", "c": "Bűnügy", "w": "MNB-ügy", "st": "Jelentett", "time": "okt. 23.", "t": "Egy ügyvéd szerint egy hónapon belül hazahozható lehet Matolcsy Ádám Dubajból, ha gyorsak a tárgyalások", "s": "Magyarország és az Egyesült Arab Emírségek között nincs kiadatási szerződés.", "p": ["Braun Balázs ügyvéd (Újváry Zsolt Ügyvédi Iroda) a Klubrádióban azt mondta, hogy Matolcsy Ádám akár egy hónapon belül kiadható lehet az Egyesült Arab Emírségekből, ha a tárgyalások gyorsak és magas szinten zajlanak. Magyarország és az Emírségek között nincs kétoldalú kiadatási szerződés, egy 2025 végi miniszterelnöki határozat tárgyalást rendelt el, de megállapodás azóta sem született.", "A kiadatás feltétele a kettős büntethetőség, a feltételezett gazdasági csalás az Emírségekben is büntethető lehet. A politikai bűncselekmény elutasítási ok lehet. Ha a kiadatást megtagadnák, az Emírségek kitoloncolhatja egy olyan országba, amellyel Magyarországnak van szerződése, vagy amely az ügyben együttműködik. A vagyon visszaszerzéséhez a helyi hatóságok segítsége kellene, és egyedi megállapodás is kötődhet.", "Matolcsy Ádámot és Stofa Györgyöt gazdasági csalás gyanújával körözik. Matolcsy György a bíróság előtt nem tett vallomást a letartóztatási tárgyaláson a cikk szerint, a védője indokolatlannak tartja a letartóztatást."], "cav": "A kiadatás időtartamára vonatkozó becslés egy ügyvéd véleménye, nem hivatalos álláspont. Azt, hogy Matolcsy Ádám valóban Dubajban tartózkodik-e, a cikk nem erősíti meg.", "op": "A volt jegybankelnök fiának hazahozatala diplomáciai próbatétel lesz az új kormánynak: ha az Emírségekkel nincs kiadatási szerződés, a siker politikai akaraton és kapcsolatokon múlik.", "src": [["Index: Akár egy hónapon belül hazahozhatják Matolcsy Ádámot", "https://index.hu/belfold/2026/10/23/matolcsy-adam-mnb-ugy-egyesult-arab-emirsegek-dubaj/"]]}, {"id": "kindlovits-ellentuntetok", "img": "https://kep.index.hu/1/0/7221/72212/722121/72212143_1e6043f61874bb52421d146c12b2a7b5_wm.jpg", "cred": "Fotó: Papajcsik Péter / Index", "imgs": "Index", "r": "Belpolitika", "c": "Fidesz", "st": "Jelentett", "time": "okt. 23.", "t": "Lincshangulat a Fidesz Bem téri rendezvényén: a rendőrök védték az ellentüntetőket, a Telex stábjára is rátörtek", "s": "Bede Zsolt vezetésével Fidesz-szimpatizánsok kísérték ki a tüntetőket a térről, Kindlovits Máté nyugtatta a tömeget.", "p": ["Az Index beszámolója szerint a Fidesz október 23-i Bem téri megemlékezésén a Fidesz-szimpatizánsok és az ellentüntetők összetűztek, a rendőrök szétválasztották őket. A rendőrök kivezették az ellentüntetőket a térről, egy Bede Zsolt vezette fideszes csoport „Mocskos Tisza” kiáltozva követte őket. A Ganz utcában a rendőrök megállították és szétválasztották a csoportokat.", "A dühös szimpatizánsok a rendőröknek is kiabáltak, azt mondták, hogy a Tisza-szimpatizánsokat védik. A Telex stábjára néhányan rárontottak. Kindlovits Máté, Kubatov Gábor személyi titkára lenyugtatta a helyzetet, és visszaterelte a szimpatizánsokat a térre, közben azt mondta, hogy a liberális média úgyis tudósít az esetről.", "A HVG korábban beszámolt arról, hogy a március 15-i Békemeneten Kindlovits egy riportert fogyatékkal élőnek nevezett, és a Valton-biztonságiakkal kísértette ki."], "cav": "A leírás az Index és a Telex beszámolóján alapul, a Fidesz közleménye az esetről nem szerepel a forrásban. A Magyar Nemzet beszámolója incidensről nem írt.", "op": "Aki újságírót vagy ellentüntetőt fenyeget vagy lökdös, az az ünnep méltóságát rongálja, bármelyik oldalon áll. A rendőrök közbelépése a helyes válasz volt.", "src": [["Index: Lincshangulat, kiabálás és Bede Zsolt", "https://index.hu/belfold/2026/10/23/oktober-23-fidesz-kindlovits-mate-bede-zsolt/"], ["HVG: ellentüntetőkkel szólalkoztak össze a fideszes megemlékezők", "https://hvg.hu/itthon/20261023_kindlovits-mate-oktober-23-ellentutetok-bem-ter-ganz-utca-lokdosodes-rendorok"]]}, {"id": "hanko-balazs-level", "img": "https://kep.cdn.index.hu/1/0/7220/72205/722058/72205859_5321693_a7b479ba6a98a002f9693f27db529592_wm.jpg", "imgs": "Index", "r": "Belpolitika", "c": "Fidesz", "st": "Jelentett", "time": "okt. 23.", "t": "Hankó Balázs a börtönből üzent a Bem térre: „politikai foglyok” vagyunk, szervereket és embereket is lefoglaltak", "s": "A feleség olvasta fel a levelet a Fidesz-rendezvényen, a vádakról és a nyomozásról a levél nem szól részleteiben.", "p": ["Az Index beszámolója szerint a Fidesz Bem téri rendezvényén Áder János, Schmidt Mária, Bóka János és Szűcs Gábor beszélt. Hankó Balázs börtönből küldött levelét felesége, Hankóné Hrágyel Zsuzsanna olvasta fel. A levélben Hankó azt írta, hogy ő és mások politikai foglyok, és tovább küzdenek a szabadságért.", "A levél szerint az ellenfeleik a nemzeti identitás eltávolítására törekednek, és az eljárások először a volt kollégákat, majd a szülőket vették célba. Bírálta a gyermekvédelmi törvény módosítását, és úgy fogalmazott, hogy a kulturális támogatások elvonását pénzügyi hátrányként kezelték. Idézett mondata: „Nemcsak szervereket, hanem embereket is lefoglaltak, jogtalanul.” A szimpatizánsokat piros-fehér-zöld karkötő viselésére és minden este kilenc órai imára kérte.", "Orbán Viktor a rendezvényen nem szólalt fel, hat éve nem fordult elő ilyen."], "cav": "A levél tartalma Hankó Balázs állítása, az ellene folyó eljárásban a bíróság még nem döntött. A bírósági eljárás részleteit a cikk nem ismerteti.", "op": "Az eljárás megítélése a bíróságokra tartozik, nem a Bem téri szónoklatokra. A „politikai fogoly” megnevezés csak akkor állja meg a helyét, ha a bíróság előtt az ügyészség nem tud vádat bizonyítani, a fogvatartás ténye ezt még nem dönti el.", "src": [["Index: Hankó Balázs a börtönből üzent", "https://index.hu/belfold/2026/10/23/oktober-23-fidesz-1956-os-forradalom-es-szabadsagharc-ader-janos-schmidt-maria-boka-janos/"]]}, {"id": "pocs-janos-aratonap", "img": "https://kep.cdn.index.hu/1/0/7167/71672/716721/71672191_5284063_07d346698bdf66a5310d645b3ce649a8_wm.jpg", "cred": "Pócs János 2026. szeptember 22-én. Fotó: Papajcsik Péter / Index", "imgs": "Index", "r": "Belpolitika", "c": "Közpénz", "st": "Jelentett", "time": "okt. 23.", "t": "Pócs János a 2024-es aratónap pénzeiről: napi két-három feljelentést kap, és számít rá, hogy őt is kihallgatják", "s": "Az Ultrahang Plusz szerint a lánya cége 1500 adag birkapörköltet számlázott, a képviselő szerint háromezren voltak.", "p": ["Az Index beszámolója szerint Pócs János fideszes képviselő az Ultrahang Plusz csatornán válaszolt az állami pénzek felhasználására vonatkozó állításokra a 2024-es Jászsági Aratónappal kapcsolatban. A műsorvezető, Molnár Áron (noÁr) szerint a Bethlen Gábor Alapkezelő két Pócs-közeli szervezetet támogatott, a Jászapáti Gazdakört 10 millió forinttal, ebből 5 millió forint Pócs lányának, Tari-Pócs Mónikának ment vendéglátásért.", "A Gazdakör elnöke egykori fideszes képviselő, a másik egyesület a családi birtokon van bejegyezve, Pócs megerősítette, hogy a Gazdakör alelnöke. A lánya 1500 adag birkapörköltet számlázott adagonként 3200 forintért, a Jász Nemzet Egyesület pedig állítólag 1,6 millió forintot költött húsra ugyanerre az eseményre.", "Pócs szerint aznap négy esemény volt, köztük birkafőző verseny, a résztvevők száma a várt 1500 helyett körülbelül 3000 volt, és fényképekre, hatósági ellenőrzésekre hivatkozott. Elmondta, hogy napi két-három feljelentést kap, és számít arra, hogy őt is meghallgatják. Szerinte a Tisza-frakció jövőre már nem lesz frakció, és Magyar Péterről olyan információja van, amelyet „egyelőre” nem árul el."], "cav": "Az állításokat a műsorvezető fogalmazta meg, Pócs János vitatja a helytelen felhasználást. Hatósági eljárásról a cikk nem számol be.", "op": "A kérdés nem a birkapörkölt ára, hanem az, hogy a közpénzes támogatás miért ment családi kapcsolatrendszeren át. A hatóságok feladata megállapítani, történt-e jogsértés, a Fidesz-politikus válasza pedig, hogy minden szabályos volt.", "src": [["Index: Pócs János arra számít, hogy őt is kihallgatják", "https://index.hu/belfold/2026/10/23/pocs-janos-ultrahang-noar/"]]}, {"id": "okosz-facebook", "img": "https://kep.cdn.index.hu/1/0/7219/72190/721900/72190047_5320601_30da92d3813bd62e14b83eb04b29e782_wm.jpg", "imgs": "Index", "r": "Gazdaság", "c": "Kereskedelem", "st": "Jelentett", "time": "okt. 23.", "t": "Magyar Péter az egyeztetést kérő kereskedőknek: „Ok, akkor majd kiírom a facebookra”", "s": "Az Országos Kereskedelmi Szövetség új főtitkára szerint a vállalkozások a Magyar Közlönyből értesülnek a szabályokról.", "p": ["Balázs Ildikó, az Országos Kereskedelmi Szövetség (OKSZ) új főtitkára a HVG-nek adott interjúban a kereskedelmi különadóról szóló kormányzati egyeztetés hiányát „némi csalódásnak” nevezte. Azt kérte, hogy a vállalkozások még azelőtt értesüljenek az új szabályokról, mielőtt azok megjelennének a Magyar Közlönyben, és legyen valódi szakmai párbeszéd, hogy előre tudjanak tervezni.", "Magyar Péter miniszterelnök a HVG Facebook-bejegyzése alatt azt írta: „Ok, akkor majd kiírom a facebookra”, mellé síró-nevető emojit tett.", "A Tisza választási programja bírálta, hogy a társadalmi egyeztetés formálissá vált, és érdemi egyeztetést ígért az adó- és pénzügyi szabályok változásainál, illetve megfelelő felkészülési időt az érintetteknek. Az OKSZ 1990 óta független, tagvállalatai évi 5000 milliárd forint fölötti forgalmat bonyolítanak, ami a hazai kiskereskedelmi forgalom nagyjából harmada. Tagjai között a SPAR, a Tesco, a Lidl, az Auchan és az Aldi is szerepel."], "cav": "A kormány az érdekvédők megkereséséről nem adott ki külön közleményt, a miniszterelnök reakciója egy közösségi oldali komment.", "op": "A kormány ígéretet tett az érdemi egyeztetésre, ezért a kereskedők jogos kérdése, hogy a Facebook-bejegyzés hogyan váltja ki a törvényi felkészülési időt. A kampányban hirdetett szakmai párbeszéd éppen ezt kérte volna számon az előző kormányon.", "src": [["Index: Magyar Péter az egyeztetést kérő érdekvédőknek", "https://index.hu/belfold/2026/10/23/magyar-peter-egyeztetes-erdekvedok-facebook-uzenet/"], ["HVG: „Azt szeretném, ha nem a Magyar Közlönyből értesülnénk”", "https://hvg.hu/360/20261022_kereskedok-kertek-balazs-ildiko-oksz-interju-arresstop-plazastop-hvg"]]}, {"id": "janosi-katalin-meghivas", "img": "https://kep.cdn.indexvas.hu/1/0/7220/72202/722024/72202481_1be29f5bf839939bb0378a47704ee251_wm.jpg", "cred": "Magyar Péter 2026. október 9-én. Fotó: Németh Kata / Index", "imgs": "Index", "r": "Belpolitika", "c": "Ünnep", "w": "Október 23.", "st": "Jelentett", "time": "okt. 23.", "t": "Nagy Imre unokája szerint nem kapott meghívást, Magyar Péter szerint az elsők között hívták", "s": "Jánosi Katalin képzőművész és a miniszterelnök a közösségi médiában vitatkozott az állami ünnepség előtt.", "p": ["Magyar Péter miniszterelnök és Jánosi Katalin képzőművész, Nagy Imre unokája nyilvánosan vitatkozott az állami ünnepségekre szóló meghívás miatt, néhány órával a Kossuth téri megemlékezés előtt. Jánosi Katalin a HVG-nek azt mondta, hogy nem hívták meg, noha Magyar Péter beszédeiben gyakran említi Nagy Imrét.", "Magyar azt írta a közösségi médiában, hogy nem érti, miért hazudik valaki egy ilyen egyszerű dologról, és szerinte az elsők között hívták meg. Jánosi korábban egy Facebook-bejegyzésében azt írta, hogy „titokzatos módon” meghívást kapott a kétnapos rendezvénysorozatra.", "A vita a 70. évforduló központi állami ünnepségei előtt zajlott."], "cav": "A két fél állítása ellentmond egymásnak, a meghívás pontos módját és időpontját a cikk nem tisztázza.", "op": "Egy ilyen vita az ünnep napján azt mutatja, mennyire kényes a Nagy Imre-örökség. Az a közösség, amely ünnepelni akar, azzal jár jól, ha a meghívások kérdését egyszerűen tisztázza.", "src": [["Index: Egymásnak feszült Nagy Imre unokája és Magyar Péter", "https://index.hu/belfold/2026/10/23/nagy-imre-janosi-katalin-1956-magyar-peter-meghivas/"], ["HVG: Jánosi Katalin portré", "https://hvg.hu/360/20261023_janosi-katalin-portre-nagy-imre-1956-forradalom"]]}, {"id": "euronews-meghivok", "img": "https://kep.index.hu/1/0/7221/72219/722197/72219795_1d815d1f05a8c3ec1871844440e61a05_wm.jpg", "cred": "Magyar Péter miniszterelnök beszédet mond az 1956-os forradalom és szabadságharc 70. évfordulója alkalmából Budapesten. Fotó: Szollár Zsófi / Index", "imgs": "Index", "r": "Külföld", "c": "Diplomácia", "w": "Október 23.", "st": "Jelentett", "time": "okt. 24.", "t": "Késve kiküldött meghívók és diplomáciai feszültségek nehezítették az október 23-i ünnep szervezését", "s": "Macron, Tusk és Zelenszkij sem utazott Budapestre, mintegy 40 ország küldött delegációt, többnyire alacsonyabb szinten.", "p": ["Az Index az Euronews tudósítására hivatkozva azt írja, hogy Magyar Péter több vezető politikai személyiséget szeretett volna látni az október 23-i ünnepségen. Ursula von der Leyen beszélt a Parlamentben, António Costa is részt vett. Emmanuel Macron és Donald Tusk nem utazott Budapestre, Tusk Indiában volt, Giorgia Meloni pedig Kuvaitban. Volodimir Zelenszkij sem jött el, Magyar a rendezvény előtt maga mondta, hogy nem számít a részvételére.", "Mintegy 40 ország küldött delegációt, többnyire miniszteri, házelnöki vagy alacsonyabb szinten. Maia Sandu moldovai elnök és Irakli Kobahidze grúz miniszterelnök jelen volt. Névtelen kormánypárti források szerint a meghívók későn mentek ki, sokat csak szeptemberben küldtek, amikor a vezetők naptára már tele volt. Egy forrás elismerte, hogy rossz volt a kommunikáció a miniszterelnöki hivatal és a külügyminisztérium között.", "Szent-Iványi István volt diplomata szerint hiba volt ilyen magasra tenni a lécet. Hegedűs Dániel elemző szerint Magyar Péter közösségi médiás bejegyzései a francia zavargásokról, amelyeket a migrációhoz kötött, beavatkozásnak tűnhettek a francia politikába, és nem segítették Macron látogatását. A kormány a megjelenésig nem válaszolt az Euronews kérdéseire."], "cav": "A cikk névtelen kormányzati forrásokra és két külső elemző véleményére támaszkodik, a kormány hivatalos válasza hiányzik.", "op": "A nemzetközi vendégkör a vártnál szerényebb volt, ami a források szerint jórészt a siető szervezésből fakad. Ez tanulság a következő nagy rendezvényre, de nem változtat azon, hogy az Európai Bizottság és az Európai Tanács elnöke itt volt.", "src": [["Index (Euronews nyomán): késve kiküldött meghívók", "https://index.hu/belfold/2026/10/24/oktober-23-megemlekezes-magyar-peter-diplomacia-emmanuel-macron-donald-tusk-ursula-von-der-leyen/"]]}, {"id": "karacsony-von-der-leyen", "img": "https://kep.index.hu/1/0/7221/72213/722135/72213587_ab1b4fa5d9f1da9a5b683a51c8d0d534_wm.jpg", "cred": "Karácsony Gergely főpolgármester fogadja Ursula von der Leyent. Fotó: Kocsis Zoltán / MTI", "imgs": "Index", "r": "Külföld", "c": "Diplomácia", "w": "Október 23.", "st": "Megerősített", "time": "okt. 23.", "t": "Karácsony Gergely a Városházán fogadta von der Leyent, először jár Európai Bizottsági elnök a fővárosban", "s": "A bizottsági elnök az európai értékek következetes védelméért mondott köszönetet a fővárosi vezetésnek.", "p": ["Ursula von der Leyen október 23-án meglátogatta a budapesti Városházát, az Index szerint ez az első alkalom, hogy az Európai Bizottság elnöke a magyar fővárosba látogat. Karácsony Gergely főpolgármester fogadta, és közös fotót is készítettek.", "A vendég bejegyzett a város díszkönyvébe, ahol az 1956-os hősök előtt tisztelgett, és megköszönte a városvezetésnek, hogy következetesen kiáll az európai értékek mellett. Karácsony Gergely Facebookon megtiszteltetésnek nevezte a látogatást, és kiemelte szimbolikus és gyakorlati jelentőségét, illetve hogy a város nem adja fel ezeket az értékeket.", "A kétoldalú tárgyaláson részt vett Tüttő Kata, a Régiók Európai Bizottságának elnöke is. A témák között politikai kérdések és a városfejlesztés szerepelt, különösen az, hogy az érkező uniós források hogyan támogathatják a főváros projektjeit az elkövetkező években. A nagy beruházások befejezéséhez közelednek, finanszírozásuk nagy része uniós pénz. Mindkét fél egyetértett abban, hogy a forrásnak olyan élhető fővárost kell építenie, amely ellenállóbb a lakhatási válsággal és az éghajlatváltozással szemben."], "cav": "", "op": "A látogatás szimbolikája egyértelmű: az EU vezetője a fővárosi önkormányzatot is partnernek tekinti, amellyel a korábbi kormány évekig konfliktusban állt.", "src": [["Index: A Városházán fogadta Karácsony Gergely Ursula von der Leyent", "https://index.hu/belfold/2026/10/23/karacsony-gergely-ursula-von-der-leyen-oktober-23-talalkozo-budapest/"], ["Telex: Karácsony Gergely a Városházán fogadta", "https://telex.hu/belfold/2026/10/23/karacsony-gergely-a-varoshazan-fogadta-ursula-von-der-leyent"]]}, {"id": "norveg-alap-93-milliard", "img": "https://kep.index.hu/1/0/7165/71658/716580/71658055_5254883568e317dcb1f499b9ad50487e_wm.jpg", "cred": "Kármán András 2026. szeptember 21-én. Fotó: Tövissi Bence / Index", "imgs": "Index", "r": "Gazdaság", "c": "Uniós pénzek", "st": "Megerősített", "time": "okt. 23.", "t": "Közel 93 milliárd forint érkezhet Norvégiából, megerősítették a megállapodást", "s": "Kármán András és Jens Stoltenberg Budapesten tárgyalt az 1956-os évforduló napján.", "p": ["Kármán András pénzügyminiszter az Index beszámolója szerint október 23-án Budapesten találkozott Jens Stoltenberg norvég pénzügyminiszterrel. A két ország megerősítette a Magyarországnak szánt fejlesztési támogatásról szóló megállapodást, amelynek összege közel 93 milliárd forint. A pénzt zöld fejlesztésre, egészségügyi beruházásokra és helyi közösségeket támogató programokra lehet fordítani.", "A tárgyaláson szó volt a magyar költségvetésről, az euró bevezetésének lehetőségéről és az egységes piac működéséről. Stoltenberg apja, Thorvald Stoltenberg 1956-ban részt vett a szovjet csapatok elől menekülő magyarok kimenekítésében, és 1992-ben magyar állami kitüntetést kapott. Norvégia a forradalom után közel 1500 magyar menekültet fogadott be.", "Szeptemberben Orbán Anita külügyminiszter bejelentette, hogy újraindultak a tárgyalások a Norvég Alapról, október 14-én pedig azt mondta, hogy a norvég és az EGT pénzügyi mechanizmusról szóló tárgyalások lezárultak. A támogatás céljai között szerepel a zöld átállás, a kulturális projektek, a társadalmi befogadás, az egészségügy és az intézményfejlesztés. Egy 2021-es jelentés szerint Magyarország korábban 77 milliárd forintnyi norvég támogatást végleg elveszített."], "cav": "", "op": "Az, hogy a Norvég Alap pénze visszatérhet, a jogállami viszonyok javulásának egyik konkrét, kézzelfogható jele. A korábbi kormány idején kiesett források újabb példa arra, mennyibe került az elszigetelődés.", "src": [["Index: közel 93 milliárd forint érkezhet Norvégiából", "https://index.hu/belfold/2026/10/23/karman-andras-jens-stoltenberg-norveg-alap/"]]}, {"id": "sni-javaslatcsomag", "img": "https://kep.cdn.indexvas.hu/1/0/7221/72213/722134/72213443_9cb25ad0c0a4c35a9575989da58652a0_wm.jpg", "cred": "Kókayné Lányi Marietta 2026. szeptember 28-án. Fotó: Hatházi Tamás / MTI", "imgs": "Index", "r": "Közélet", "c": "Oktatás", "st": "Megerősített", "time": "okt. 23.", "t": "Kész a terv: az SNI-s tanulók két-három főnek számítanának az osztálylétszámnál", "s": "Az Oktatási és Gyermekügyi Minisztérium tízpontos javaslatcsomaga a sajátos nevelési igényű gyerekek oktatását alakítaná át.", "p": ["Az Oktatási és Gyermekügyi Minisztérium munkacsoportja elkészítette a sajátos nevelési igényű (SNI) gyermekek oktatásának átalakítására vonatkozó tízpontos javaslatcsomagot, a tárca csütörtökön közölte az MTI-vel. A munkacsoportot nyáron hozták létre Kókayné Lányi Marietta oktatási államtitkár vezetésével. Lannert Judit miniszter október 10-én jelentette be először a csomagot.", "A kiindulópont, hogy minden gyerek másképp fejlődik, és joga van a szükségleteihez illő oktatáshoz. Az iskoláknak alkalmazkodniuk kell a gyerekek képességeihez és ütemükhöz, és megkapják ehhez a szükséges tudást, időt, szakmai támogatást és eszközöket. A gyógypedagogusoknak be kellene kapcsolódniuk az osztálytermi munkába a pedagógusokkal együtt, kötelező heti óráik közül kettőt az együttműködésre kellene fordítaniuk.", "Az SNI-s tanulókat az osztálylétszám megállapításánál két-három tanulónak számítanák, így az osztályok kisebbek lehetnének. A szakvélemények minden érintett tanárhoz eljuthatnának, szakmai nap lenne az SNI-irányelvekről, a foglalkozások a gyerek tűréshatárához igazodnának, és egyszerűsödne az utazó gyógypedagógusok adminisztrációja. Törvényben határoznák meg a súlyos és halmozott fogyatékosság fogalmát, szabályoznák ezek intézményeit, és tisztáznák a konduktív és gyógypedagógiai intézmények helyzetét."], "cav": "A javaslatcsomag nem törvény, a megvalósítás ideje és költsége a forrásban nincs megadva.", "op": "Az SNI-ellátás régóta a magyar oktatás egyik legnagyobb mulasztása. A kisebb osztálylétszám és a gyógypedagógusok osztálytermi jelenléte jó irány, a próba az lesz, hogy lesz-e rá pénz és szakember.", "src": [["Index: gyökeresen átalakítanák az SNI-s gyermekek oktatását", "https://index.hu/belfold/2026/10/23/oktatasi-miniszterium-sni-gyerekek-munkacsoport-javaslatcsomag/"], ["Eduline: SNI javaslatcsomag", "https://eduline.hu/kozoktatas/20261023_sni-ogym-javaslatcsomag"]]}, {"id": "szelrekord-budapest", "img": "https://kep.cdn.index.hu/1/0/7220/72202/722027/72202793_5321477_d1bac20e0dd41026b0026adabe490501_wm.jpg", "cred": "Illusztrációnkon egy teherautó halad el egy szélzsák mellett. Fotó: Sóki Tamás / MTI", "imgs": "Index", "r": "Közélet", "c": "Időjárás", "st": "Megerősített", "time": "okt. 23.", "t": "99 km/h-s széllökés döntött napi rekordot a budapesti János-hegyen", "s": "A HungaroMet szerint egy hullámzó hidegfront okozta a viharos szelet, a korábbi rekord 93,6 km/h volt.", "p": ["Csütörtökön 99 km/h-s széllökést mértek a budapesti János-hegyen, ezzel megdőlt a napi rekord. Az előző, 93,6 km/h-s értéket 2014. október 22-én mérték ugyanott, a HungaroMet közlése szerint.", "A rekordot egy hullámzó hidegfront-rendszer okozta, amelynek átvonulása után sok helyen viharossá erősödött az északnyugati, nyugati szél. Az Index szerint a hétvégére a nyugati országrészben csapadékos, hűvös időt jeleztek előre."], "cav": "", "src": [["Index: évtizedes szélrekord Budapesten", "https://index.hu/belfold/2026/10/23/napi-szelrekord-megdolt-budapest-hullamzo-frotnrendszer/"], ["HVG: megdőlt a budapesti szélrekord", "https://hvg.hu/itthon/20261023_szelrekord-oktober-22-100-km-h"]], "op": "99 km/h-s széllökés egy fővárosi dombon nem hétköznapi, és emlékeztet arra, hogy az előrejelzést érdemes komolyan venni. Aki kárt szenvedett, jobb, ha időben bejelenti."}, {"id": "idojaras-hetvege-oktober-24", "img": "https://kep.cdn.index.hu/1/0/5620/56201/562015/56201595_4155479_1475733980b68538719177a4f79ce03d_wm.jpg", "imgs": "Index", "r": "Közélet", "c": "Időjárás", "st": "Megerősített", "time": "okt. 24.", "t": "Kettészakad az ország időjárása: eső délnyugaton, szárazabb idő keleten", "s": "A HungaroMet szerint a Dunántúlon 10 fok körül alakul a csúcshőmérséklet, a keleti határnál 19 fokig is felmehet.", "p": ["A HungaroMet szombati előrejelzése szerint a Dunántúlon és délnyugaton jelentős eső várható hűvös, szeles időben, kisebb délnyugati területeken a napi csapadékösszeg megközelítheti a 20 millimétert. A Tiszántúl szárazabb és enyhébb marad, az ország keleti harmada száraz lesz.", "A Duna–Tisza közén és az Északi-középhegységben csak szórványos, gyenge csapadék valószínű. Hajnalban az északkeleti országrészben helyenként sűrű köd képződhet. Északi szél lesz, a legerősebb lökések a Dunántúl nyugati és délnyugati részén várhatók. A csúcshőmérséklet a Dunántúlon 10 fok körül, a Dunától keletre 10 és 19 fok között alakul, a legmelegebb a délkeleti és keleti határ mentén lesz.", "Az időjárás-érzékenyek fejfájásra és vérnyomás-ingadozásra számíthatnak. A levegő minősége az eső és a szél miatt országszerte kedvező."], "cav": "", "src": [["Index: Kettészakad az ország időjárása", "https://index.hu/belfold/2026/10/24/idojaras-elorejelzes-felhos-ido-borult-eso-szel-nap-radar/"]], "op": "Ősszel az ország időjárása gyakran kettéválik: aki a Dunántúlon utazik, vigyen esernyőt, a Tiszántúlon viszont élvezheti az enyhébb, szárazabb napot."}, {"id": "emberkereskedelem-nni", "img": "https://kep.cdn.index.hu/1/0/6872/68724/687241/68724131_5072567_c7879cebf0cb0c2acd7d8503899146f4_wm.jpg", "imgs": "Index", "r": "Közélet", "c": "Bűnügy", "st": "Megerősített", "time": "okt. 23.", "t": "Tíz embert fogtak el emberkereskedelem gyanújával, 15 magyar áldozatot azonosítottak", "s": "A 33 országot érintő akcióban mintegy ezer rendőr ellenőrzött nagyjából négyezer embert.", "p": ["A Nemzeti Nyomozó Iroda (NNI) közölte, hogy tíz magyar gyanúsítottat fogtak el, nyolc férfit és két nőt. Hét gyanúsítottat kényszermunkával, hármat szexuális kizsákmányolással gyanúsítanak. A hatóságok 15 áldozatot azonosítottak, mindannyian magyar állampolgárok. Tizenegyet munkára, négyet szexuális célokra használtak ki, közülük kettő kiskorú. Az áldozatokat főként a mezőgazdaságban dolgoztatták, vagy háztartási munkára kényszerítették.", "Az akció szeptember 14. és 20. között zajlott 33 másik ország részvételével. Több megyei rendőr-főkapitányság nyomozott, köztük Békés, Csongrád-Csanád, Fejér, Pest, Somogy és Szabolcs-Szatmár-Bereg. Mintegy ezer rendőr nagyjából négyezer embert ellenőrzött.", "A munkaügyi hatóság 70 fővel 77 helyszínen 392 munkavállalót vizsgált meg, 29 munkáltatónál találtak szabálytalanságot, ami 174 dolgozót érintett. Két esetben merült fel emberkereskedelem és kényszermunka gyanúja."], "cav": "", "src": [["Index: tíz embert fogtak el emberkereskedelem gyanújával", "https://index.hu/belfold/2026/10/23/nni-emberkereskedelem-prostitucio/"]], "op": "Az emberkereskedelem elleni nemzetközi összefogás fontos, és az, hogy a tíz magyar gyanúsított mellett tizenöt magyar áldozatot is azonosítottak, jelzi a probléma méretét. Ilyenkor az áldozatok védelme legalább annyira fontos, mint az elkövetők elfogása."}, {"id": "kives-zoltan-tavozik", "img": "https://kep.cdn.indexvas.hu/1/0/7219/72198/721985/72198597_f25bb6e9fb3aee162580aa741cef472a_wm.jpg", "cred": "Kivés Zoltán 2024. május 16-án. Fotó: Purger Tamás / MTI", "imgs": "Index", "r": "Belpolitika", "c": "Kormányzat", "st": "Megerősített", "time": "okt. 23.", "t": "Távozik Kivés Zoltán, az Orbán-kormány egyik utolsó magas rangú tisztviselője", "s": "Magyar Péter aláírta a helyettes államtitkár felmentését, november 1-jétől Peresztegi Gergely veszi át a posztot.", "p": ["Magyar Péter miniszterelnök aláírta Kivés Zoltánnak, a Vidék- és Településfejlesztési Minisztérium helyettes államtitkárának felmentését november 1-jei hatállyal. A döntés a Magyar Közlöny csütörtök esti számában jelent meg, Lőrincz Viktória javaslatára. Kivés 2022 óta töltötte be a posztot, az Index szerint az Orbán-kormány egyik utolsó magas rangú tisztviselőjeként távozik.", "Pályája 2013 óta az önkormányzati ügyekhez kötődik, először a Belügyminisztériumban, majd a Közigazgatási és Területfejlesztési Minisztériumban, Navracsics Tibor alatt dolgozott. Utódja Peresztegi Gergely, aki a Pénzügyminisztériumban főosztályvezető-helyettes volt, az önkormányzati költségvetésekkel foglalkozott."], "cav": "", "src": [["Index: Kivés Zoltán felmentése", "https://index.hu/belfold/2026/10/23/kives-zoltan-videk-es-telepulesfejlsztesi-miniszterium-helyettes-allamtitkar-felmentes-magyar-kozlony/"], ["HVG: az Orbán-kormány újabb veteránja távozik", "https://hvg.hu/itthon/20261022_magyar-kozlony-kives-zoltan-helyettes-allamtitkar-felmentes"]], "op": "Kormányváltás után az utolsó magas rangú tisztviselők távozása természetes lépés, de a közigazgatás szakmai folytonosságára is érdemes figyelni. A kérdés az, hogy az új vezető milyen átláthatósággal dolgozik majd."}, {"id": "2006-rendori-eroszak-husz-ev", "img": "https://kep.cdn.index.hu/1/0/7219/72198/721983/72198349_5321179_3b2afdafcace51ae4b26483bcd233474_wm.jpg", "imgs": "Index", "r": "Közélet", "c": "Történelem", "st": "Jelentett", "time": "okt. 23.", "t": "Húsz éve szabadult el a rendőri erőszak Budapesten: szemtanúk emlékeznek 2006 őszére", "s": "Az Index összeállítása a rendőri túlkapások áldozatait és a tudósító akkori tapasztalatait idézi fel.", "p": ["Az Index 2006 őszére emlékezik, amikor az Őszöd-beszéd kiszivárgása nyomán kitört tüntetésekre rendőri erőszak válaszolt. Macsotai Gergely a Magyar Televízió székházának ostroma utáni napon csatlakozott a tüntetőkhöz. A feloszlatás megkezdésekor a rendőrök a sorfal mögé húzták, ahol bántalmazták. A Rádió udvarába vitték, ahol bilincsben térdepeltetve sértegették. Sérülései kórházi ellátást igényeltek, ahol az ágyához bilincselve őrizték, és attól félt, hogy börtönbüntetést kap.", "Hatvany István bűnügyi tudósító akkor a Független Hírügynökség tudósítója volt, és szinte minden összecsapást közelről látott. A rendőrség tagadta, hogy „viperát” használt volna, annak ellenére, hogy a felvételeken ez látszott. Hatvany a tájékoztatót „sajtóelkerülésnek” nevezte, kivonult, és később már nem ment el a tájékoztatókra. Több forrás szerint a rendőrfőnök, Gergényi Péter megpróbálta elbocsáttatni.", "Az események során csaknem 400 egyenruhás sebesült meg. A rendőrség egy héttel később röviden elutasította a riporter kérését, hogy interjút kapjon egy rendőrrel. A cikk archív felvételeket a HírTV-től vett át."], "cav": "Az összeállítás szemtanúi beszámolókra épül, a vitatott események megítélése a mai napig megosztó.", "src": [["Index: Húsz éve elszabadult a rendőri erőszak Budapesten", "https://index.hu/belfold/2026/10/23/2006-oktober-23-rendorseg-tuntetesek-aldozatok-evfordulo/"]], "op": "Húsz év után is nyitott sebek: a 2006-os rendőri túlkapások emlékezete azt mutatja, hogy az állam erőszakát csak átlátható felelősségre vonással lehet lezárni. A szemtanúk beszámolói fontos történelmi források."}, {"id": "lengyel-magyar-1956", "img": "https://kep.cdn.indexvas.hu/1/0/7216/72166/721668/72166895_1ff410a91f6b40ee0fe288edb8a34152_wm.jpg", "cred": "Gomułka 1956. október 24-én beszédet mond egy Varsóban tartott, becslések szerint félmilliós tömeg előtt. Fotó: Bettmann / Getty Images Hungary", "imgs": "Index", "r": "Külföld", "c": "Történelem", "w": "Október 23.", "st": "Jelentett", "time": "okt. 23.", "t": "1956-ban egyszerre lázadt lengyel és magyar, de teljesen más lett a vége", "s": "A Poznańi felkeléstől Gomułka visszatéréséig és Nagy Imre semlegességi nyilatkozatáig: a két ország eltérő útja.", "p": ["Az Index Johanna Granville 2022-es tanulmánya (1956 Reconsidered: Why Hungary and Not Poland?) alapján mutatja be a két ország 1956-os útját. 1956 júniusában a poznańi Sztálin Művek munkásai a bérek, a normák és az élelmezés miatt tiltakoztak, a varsói küldöttség kudarca után a tüntetés erőszakba fordult, több tucat ember meghalt, több száz megsebesült.", "Edward Ochab, Bierut március 12-i halála után megbízott pártvezető, lehetővé tette Władysław Gomułka visszatérését, aki 1956. október 24-én becslések szerint félmillió ember előtt beszélt. Magyarországon október 23-án az egyetemisták a Petőfi-szobortól a Bem-szoborig vonultak, és 16 pontot fogalmaztak meg, köztük Gerő Ernő eltávolítását, Nagy Imre visszatérését és a szovjet csapatok kivonását. Október 28-án Nagy Imre tűzszünetet hirdetett és bejelentette a szovjet csapatok kivonását Budapestről, november 1-jén kimondta a semlegességet és a Varsói Szerződésből való kilépést.", "A szovjet vezetés a beszámoló szerint október 31-én döntött a második beavatkozásról, ami november 4-én kezdődött. A cikk további dátumai: Hruscsov küldöttsége október 19-én érkezett Varsóba, Ausztria semlegességi törvénye október 26-án született meg, az osztrák államszerződést 1955. május 15-én írták alá."], "cav": "Történelmi összefoglaló, a források értelmezései vitatottak.", "src": [["Index: 1956-ban egyszerre lázadt lengyel és magyar", "https://index.hu/belfold/2026/10/23/lengyelorszag-magyarorszag-1956-felkeles-forradalom-poznan-budapest/"]], "op": "A lengyel és a magyar 1956 összevetése tanulságos: a két ország hasonló követelésekkel indult, a kimenetel mégis nagyon eltért. A tanulság nem az, hogy melyik út volt jobb, hanem az, hogy a körülmények és a döntések mennyit számítanak."}, {"id": "orban-ralel-tiborcz-london", "img": "https://kep.index.hu/1/0/6415/64155/641553/64155395_603e4161bdc776d0c3bc25a92bf987b2_wm.jpg", "cred": "Orbán Ráhel 2024. augusztus 1-jén. Fotó: Papajcsik Péter / Index", "imgs": "Index", "r": "Belpolitika", "c": "Fidesz", "st": "Jelentett", "time": "okt. 23.", "t": "Panyi Szabolcs: Orbán Ráhel és Tiborcz István brit magániskolákba íratta a gyerekeit", "s": "A VSquare újságírója szerint a pár az Egyesült Államokból az Egyesült Királyságba költözött, és magyar vagyonát próbálja eladni.", "p": ["Panyi Szabolcs a VSquare hírlevelében azt írta, hogy Orbán Ráhel és férje, Tiborcz István az Egyesült Államokból az Egyesült Királyságba költözött, és gyerekeiket brit magániskolákba íratták be. Az Index szerint Panyi forrásai azért döntöttek így, mert az Egyesült Államokat kevésbé tartják biztonságosnak, ahogy Donald Trump hatalma gyengül.", "Egy, a családot ismerő forrás állítása szerint a pár magyarországi vagyonát próbálja eladni, hogy a lehető legkevesebbet hagyja Magyarországon, „minden eladó”. London közelsége megkönnyítheti a vagyon kezelését. Ráhel és Tiborcz korábban New Yorkba költözött.", "Panyi májusban arról írt, hogy Trump köre egy ENSZ-posztot szerezhet Orbán Viktornak, amely diplomáciai mentességet adna neki, áprilisban pedig arról, hogy Orbán a nyári labdarúgó-világbajnokságra az Egyesült Államokba utazik."], "cav": "Névtelen források állításaira épülő beszámoló, a család nem reagált a cikkben. Gyerekekről szóló részleteket nem közlünk.", "op": "Aki a család vagyoni mozgásairól ír, annak a forrásait is meg kell védenie: egy névtelen forrás állítása még nem tény. A kérdés közérdekű, mert a vagyon eredete és sorsa a közpénzekről szóló viták része.", "src": [["Index (Panyi Szabolcs): brit magániskolák", "https://index.hu/belfold/2026/10/23/orban-rahel-tiborcz-istvan-koltozes-london-panyi-szabolcs/"], ["HVG: Orbán Ráhel és Tiborcz István", "https://hvg.hu/kkv/20261022_orban-tiborcz-koltozes-egyesult-kiralysag"]]}, {"id": "kompany-osszeesett", "img": "https://kep.index.hu/1/0/7221/72213/722130/72213089_61830ef0624806f01c1100663fd3d8f1_wm.jpg", "cred": "Vincent Kompany 2026. október 21-én. Fotó: Leonhard Simon / Getty Images", "imgs": "Index", "r": "Sport", "c": "Foci", "st": "Jelentett", "time": "okt. 23.", "t": "Összeesett a Bayern München edzője, Vincent Kompanyt mentőhelikopterrel vitték kórházba", "s": "A Sky szerint az állapota stabil, a klub szerint az orvosok kezelik, a segédedzők vezetik az edzéseket.", "p": ["A Bild értesülése szerint Vincent Kompany (40), a Bayern München vezetőedzője pénteken összeesett a klub edzőközpontjában. Mentőhelikopterrel vitték egy müncheni kórházba. A Sky szerint az állapota stabil.", "Kompany a felnőtt keret edzését még levezette, a U23-as edzést is végignézte, majd rosszul lett. Az előző héten vírusos fertőzése volt, és az RB Leipzig elleni szombati bajnoki közben és után az Allianz Arena öltözőjében pihent. A szerdai Arsenal elleni Bajnokok Ligája-mérkőzésen eredetileg nem számítottak rá, de végül ő irányította a csapatot.", "Max Eberl sportigazgató szerint az edző egészsége az elsődleges. A Bayern közleménye szerint orvosi ellátás alatt áll, az edzéseket és a mérkőzéseket a segédedzők vezetik további értesítésig. Jamal Musiala augusztusban, a német Szuperkupa előtt kétszer is összeesett, és nem játszhatott. Joshua Kimmich édesapja halála miatt hagyta ki az Arsenal elleni meccset."], "cav": "Az információ a Bildből és a Skyból származik, a klub az egészségi állapotról részleteket nem közölt.", "src": [["Index: összeesett a Bayern München edzője", "https://index.hu/sport/futball/2026/10/23/vincent-kompany-bayern-munchen-rosszullet-mentohelikopter-korhaz/"]], "op": "Egy edző hirtelen rosszulléte mindenkit megrémít. Reméljük, hogy a Sky stabil állapotra vonatkozó értesülése igaz, és Vincent Kompany hamarosan felépül."}, {"id": "bajnokok-ligaja-3-fordulo", "img": "https://kep.cdn.indexvas.hu/1/0/7218/72181/721811/72181137_cc2aa0dda9fac7760898c8ffdc2d322e_wm.jpg", "cred": "Eze még az Arsenalnak szerzett vezetést. Fotó: Stuart MacFarlane / Getty Images Hungary", "imgs": "Index", "r": "Sport", "c": "Foci", "st": "Megerősített", "time": "okt. 21.", "t": "Rice késői góljával 2–2 lett a Bayern–Arsenal, a Real négyet vágott a Leipzignek", "s": "A Bajnokok Ligája harmadik fordulójában az Aston Villa, a Betis és a Real Madrid is veretlen maradt.", "p": ["A Bajnokok Ligája alapszakaszának harmadik fordulójában szerdán a Bayern München 2–2-es döntetlent játszott az Arsenallal. A Bayern góljait Alphonso Davies a 35. percben és Harry Kane (tizenegyesből) szerezte, az Arsenalnál Eberechi Eze és az 82. percben Declan Rice volt eredményes.", "A Real Madrid 4–1-re nyert az RB Leipzig ellen, Orbán Willi végigjátszotta a meccset a Leipzigben. Az Inter 1–0-ra legyőzte a Sahtar Donyeckot Carlos Augusto cserejátékos góljával, a milánói csapat az utolsó húsz percben emberhátrányban játszott, mert Alessandro Bastonit kiállították. További eredmények: Sporting Lisszabon–LASK 2–3, Aston Villa–Viking Stavanger 3–1, Club Brugge–Lens 3–0, Real Betis–Feyenoord 1–0 (Isco, tizenegyesből).", "Kedden a Liverpool 4–3-ra nyert a Villarreal ellen, a PSG 4–2-re a Barcelona ellen, a Manchester City 5–1-re az AEK Athén ellen, a Roma 4–0-ra a Slovan Bratislava ellen, a Napoli 4–3-ra a Bodø/Glimt ellen. A harmadik forduló után az Aston Villa, a Real Betis és a Real Madrid veretlen."], "cav": "", "src": [["Index: BL-eredmények, Bayern–Arsenal", "https://index.hu/sport/futball/2026/10/21/bajnokok-ligaja-2026-2027-bayern-munchen-arsenal-real-madrid-rb-leipzig-inter/"]], "op": "Egy 2–2-es Bayern–Arsenal és a Real négy góljával lezárt Leipzig-meccs: a harmadik forduló jól mutatja a mezőny erejét. Az Aston Villa és a Betis veretlen szereplése külön figyelmet érdemel."}, {"id": "szoboszlai-brighton", "img": "https://kep.cdn.index.hu/1/0/7221/72211/722119/72211919_5322103_57a60239d7c3161c38d0d860c70d03b8_wm.jpg", "imgs": "Index", "r": "Sport", "c": "Foci", "st": "Megerősített", "time": "okt. 23.", "t": "Szoboszlai kihagyja a Brighton elleni meccset, a Fenerbahce ellen már játszhat", "s": "Andoni Iraola szerint a középpályás közel van a visszatéréshez, de még nem edzett a csapattal.", "p": ["A Liverpool vasárnap az Anfielden fogadja a harmadik helyezett Brightont, Szoboszlai Dominik nem lesz ott, ezt Andoni Iraola vezetőedző a pénteki sajtótájékoztatón megerősítette. Iraola szerint a magyar középpályás visszatérése közel van, de még nem edzett a csapattal: egyénileg dolgozik, hamarosan csatlakozik.", "Szoboszlai november 4-én, a Fenerbahce elleni Bajnokok Ligája-meccsen már játszhat, ha a rehabilitáció az ütemterv szerint halad. A Liverpool a következő 15 napban öt tétmérkőzést játszik: Brighton, majd Chelsea és Arsenal, aztán Fenerbahce és Crystal Palace.", "A játékos az októberi válogatott szünetben sérült meg, a Manchester City elleni bajnokit és a LASK elleni BL-meccset is kihagyta. A Brentford ellen kezdőként tért vissza, de nagyjából 30 perc után cserét kért."], "cav": "A mérkőzésprogram a Nemzeti Sport adataira hivatkozik.", "src": [["Index: friss helyzetjelentés Szoboszlai Dominikról", "https://index.hu/sport/futball/2026/10/23/szoboszlai-dominik-liverpool-serules-premier-league-andoni-iraola/"], ["HVG: Szoboszlai újabb meccset kihagy", "https://hvg.hu/sport/20261023_tovabbra-sincs-rendben-szoboszlai-dominik-ujabb-meccset-hagy-ki"]], "op": "Szoboszlai hiánya nagy veszteség a Liverpoolnak, de a visszatérés közelsége jó hír a magyar szurkolóknak. A sérülések kezelésében a türelem a legfontosabb."}, {"id": "kubatov-sporttorveny", "img": "https://kep.cdn.index.hu/1/0/7220/72201/722012/72201229_5321377_e2a78fa764fa439eca9285710ca70289_wm.jpg", "imgs": "Index", "r": "Sport", "c": "Foci", "st": "Jelentett", "time": "okt. 23.", "t": "Kubatov Gábor kontra kormány: nemzetközi fórumra vihetné a vitát, ha a sporttörvény miatt távoznia kell a Fradi éléről", "s": "Az FTC kedden választ elnököt, a tervezett törvény négy évre kitiltaná a politikusokat a nagy klubok és szövetségek éléről.", "p": ["Borbély Zoltán ügyvéd az Index szerint azt mondta, hogy Kubatov Gábor akár nemzetközi fórumokig is vihetné az ügyét, ha az új összeférhetetlenségi szabályokra hivatkozva távolítanák el a Ferencváros (FTC) éléről. Az FTC elnökválasztó közgyűlését kedden, október 27-én tartják, a klub nyolc nappal előtte közölte a 11 vezetőségi jelölt nevét, köztük szerepel Kubatov is.", "Magyar Péter miniszterelnök szeptember 18-án jelentette be azt a törvénytervezetet, amely a minisztereket, államtitkárokat, kormánybiztosokat, pártvezetőket, képviselőket és európai parlamenti képviselőket kitiltaná a sportági szövetségek és az 500-nál több sportolót tömörítő klubok vezetéséből, a politikai tisztség megszűnése után négy évre. Megnevezett példák: Deutsch Tamás (MTK Budapest), Kubatov Gábor (FTC) és Szijjártó Péter (Budapest Honvéd).", "A Blikk szerint a javaslat még nincs a parlament előtt, és nem szerepel a függőben lévő törvények listáján. A tizenegy jelöltből kilenc kerül be a vezetőségbe, amely ezután megválasztja az elnököt. Borbély szerint a visszaható hatály tilalma alkotmányos elv. A parlament a kétharmados többség miatt valószínűleg elfogadná a törvényt, a köztársasági elnök aláírása azonban bizonytalan."], "cav": "A törvényjavaslat nem került a parlament elé, az ügyvéd álláspontja jogi vélemény, nem bírósági döntés.", "op": "Hogy politikai vezetők évtizedekig irányíthassák a legnagyobb sportklubokat, a mostani szabályozási vita lényege. A visszaható hatály alkotmányos kérdés, a politika és a sport összefonódása pedig évek óta ismert probléma.", "src": [["Index: Kubatov Gábor kontra kormány", "https://index.hu/sport/futball/2026/10/23/kubatov-gabor-ferencvaros-sporttorveny-magyar-peter-borbely-zoltan/"]]}, {"id": "umathum-eltiltas", "img": "https://kep.cdn.index.hu/1/0/7220/72202/722026/72202689_5321467_d3ac767b368b8872dc80f83b246d01c8_wm.jpg", "imgs": "Index", "r": "Sport", "c": "Foci", "st": "Jelentett", "time": "okt. 23.", "t": "Február közepéig eltiltották a 15 éves magyar focistát, mert mellkassal meglökte a játékvezetőt", "s": "Az ETO FC védője az U16-os Litvánia elleni felkészülési meccsen kapott piros lapot, a klub szerint túlzás a büntetés.", "p": ["Az MLSZ fegyelmi bizottsága 2027. február 15-ig eltiltotta minden labdarúgással kapcsolatos tevékenységtől Umathum Rolandot, az ETO FC 15 éves védőjét. A játékost az október 15-i, 2–1-es magyar vereséggel végződő U16-os Litvánia elleni felkészülési mérkőzésen állították ki a 94. percben, miután csapatkapitányként mellkasával meglökte a játékvezetőt, Erni Edmond Attilát. Az MLSZ a játékvezetővel szembeni súlyos sportszerűtlenséggel indokolta a büntetést.", "Havas Máté, a Fehér Miklós Futballakadémia igazgatója szerint a büntetés túlzó lehet egy olyan játékosnak, akinek korábban nem volt piros lapja és alig volt sárgája. Az akadémia az indoklás áttanulmányozása után valószínűleg fellebbez.", "Umathum szeptember végén, 14 évesen írta alá első profi szerződését az ETO FC-nél. Egy barátságos mérkőzésen a felnőtt csapatban debütált, majdnem 60 percet játszott, és az U17-es csapat rendszeres tagja."], "cav": "", "src": [["Index: rendkívül súlyos büntetést kapott a fiatal magyar focista", "https://index.hu/sport/futball/2026/10/23/umathum-roland-eltiltas-magyar-futball-eto-fc-havas-mate/"]], "op": "Egy 15 éves fiú eltiltása február közepéig szinte felnőtt büntetés, és az ETO szerint túlzás. Az MLSZ fegyelmi szerepe fontos, de fiatalkorúaknál az arányosság különösen számít."}, {"id": "szeged-bl-kiesés", "img": "https://kep.cdn.index.hu/1/0/7219/72199/721990/72199051_5321233_aafbce36654b16671504644535f904f3_wm.jpg", "imgs": "Index", "r": "Sport", "c": "Kézilabda", "st": "Megerősített", "time": "okt. 23.", "t": "Kiesett a Bajnokok Ligájából a Szeged: 33–33 a GOG ellen, az Európa Ligában folytatja", "s": "A Frimmel utolsó másodperces lövését Kevin Möller védte, Mikler Roland tizenegyest hárított.", "p": ["A Pick Szeged 33–33-as döntetlent játszott otthon a dán GOG ellen a Bajnokok Ligája csoportkörének ötödik fordulójában, így nem jutott tovább, az Európa Ligában folytatja. Bánhidi Bence hiányzott, Lukas Sandell és Lazar Kukic sérülésből tért vissza.", "A GOG a 23. percben 15–11-re vezetett, félidőben három góllal állt jobban. A második félidő elején a szegediek 23–22-re feljöttek, később 32–31-re vezettek. Sebastian Frimmel utolsó másodperces lövését Kevin Möller védte. Mikler Roland tizenegyest hárított, összesen öt védésig jutott. A góllövők: Mario Sostaric 9, Magnus Röd 6, Marin Jelinic 5, a GOG-nál Hjalte Lykke 8, Möller 9 védéssel. Michael Apelgren edző szerint a csapata a végéig benne maradt a meccsben.", "A Veszprém öt győzelemmel már továbbjutott, a következő szerdán a Portóhoz látogat. A Szeged egy győzelemmel, két döntetlennel és két vereséggel zárja, másnap az IFK Kristianstadot fogadja, tét nélkül. A két csapat hatodszor találkozott, ez volt az első döntetlen. A Szeged utoljára a 2013–14-es szezonban játszott az Európa Ligában, és megnyerte a trófeát."], "cav": "", "src": [["Index: kiesett a Bajnokok Ligájából a Szeged", "https://index.hu/sport/kezilabda/2026/10/23/szeged-bajnokok-ligaja-gog-mikler-roland/"]], "op": "Az utolsó másodperces védés elvitte a továbbjutást, de a Szeged az Európa Ligában folytathatja. Ilyen mérkőzések után a csapatnak a megerősödés lehet a legjobb válasz."}, {"id": "toth-alex-serules", "img": "https://kep.cdn.index.hu/1/0/7219/72198/721986/72198671_5321203_18ff51c94843dd371926d970f3c59896_wm.jpg", "imgs": "Index", "r": "Sport", "c": "Foci", "st": "Jelentett", "time": "okt. 23.", "t": "Elképesztő balszerencse: megsérült Tóth Alex, miközben a Bournemouth 3–0-ra verte az AC Milant", "s": "A magyar középpályás a 62. percben állt be, a 78. percben le kellett cserélni, valószínűleg combizomgyulladás miatt.", "p": ["Tóth Alex, a magyar válogatott 16-szoros középpályása a 62. percben állt be a Bournemouth 3–0-s hazai győzelmén az AC Milan ellen az Európa-liga alapszakaszának harmadik fordulójában, majd a 78. percben lecserélték. Marco Rose edző szerint valószínűleg combizomsérülést szenvedett, a súlyosság és a kiesés időtartama ismeretlen.", "A Bournemouth a 28. perctől emberelőnyben játszott, a három gólból kettő tizenegyesből született. A Milan 2023 októbere óta először kapott három gólos vereséget európai kupameccsen. A Milan november 5-én a Ferencvárost fogadja.", "További magyar vonatkozások: a Salzburg 2–2-t játszott a Celjével (a Celje november 26-án az FTC ellenfele), Redzic Damir 83 percet játszott és mindkét gólt előkészítette. Vitályos Viktor és Hegyi Krisztián cserejátékos maradt a Sparta Praha 0–1-es vereségén az Olympiacos ellen. Loïc Nego öngólt lőtt a 14. percben az Omónia 1–4-es vereségén a Benfica ellen."], "cav": "", "src": [["Index: Tóth Alex sérülése", "https://index.hu/sport/futball/2026/10/23/toth-alex-bournemouth-ac-milan-europa-liga-serules/"]], "op": "Egy 3–0-s hazai győzelem mellé a sérülés a legrosszabb mellékhatás. Reméljük, hogy Tóth Alex combizomsérülése nem lesz súlyos, és hamar visszatér."}, {"id": "1956-olimpiai-csapat", "img": "https://kep.cdn.indexvas.hu/1/0/7217/72177/721771/72177161_56ed949f1564cd17ddfc48a5cd3810af_wm.jpg", "cred": "Dömölky Lídia. Fotó: Szigetváry Zsolt / MTI", "imgs": "Index", "r": "Sport", "c": "Történelem", "w": "Október 23.", "st": "Jelentett", "time": "okt. 23.", "t": "„Robbantsátok fel a hidat!” – az 1956-os olimpiai csapat drámája, amelyet a forradalom törölt át", "s": "Sákovicsné Dömölky Lídia és Kamuti Jenő vívók idézik fel, hogyan jutott el a csapat Melbourne-be.", "p": ["Az Index interjúja szerint Sákovicsné Dömölky Lídia, az 1956-os melbourne-i olimpia aranyérmes és világbajnok vívója, aki március 9-én lett 91 éves, és Kamuti Jenő olimpiai ezüstérmes vívó idézi fel 1956 őszét. Dömölky akkor 20 éves volt, 1955-ben egyéniben és csapatban is világbajnok lett Rómában, Melbourne-ben első asszóját elvesztette Gillian Sheen ellen.", "1956. október 23-án a csapat Tatán edzett, és egy vasútállomás „amerikai vonalas” telefonján keresztül követte az eseményeket. A csapatot a budapesti Nagyszállóba vitték a Margitszigetre. Csehszlovákia nem engedte be őket Prágába, ezért vasúti sztrájk miatt busszal mentek Nymburkba, november 4-én ott voltak. 111 sportoló vállalta az utat, Iharos Sándor október 31-én bejelentette, hogy nem megy.", "Kamuti Jenő akkor budapesti orvostanhallgató volt, apja a MÁV forradalmi bizottságának vezetője. A Csap hídjának felrobbantására szóló parancs későn érkezett. 1957 kora tavaszán a rendőrség letartóztatta az apját, és hamis bizonyítékként egy 100 dolláros bankjegyet tett a holmijai közé. Kilenc hónapig tartották fogva, majd szabadon engedték."], "cav": "", "src": [["Index: „Robbantsátok fel a hidat!”", "https://index.hu/sport/2026/10/23/1956-os-olimpiai-csapat-domolky-lidia-kamuti-jeno/"]], "op": "A forradalom és az olimpia története azt mutatja, hogyan szólnak bele a világ eseményei egyetlen sportoló sorsába. A visszaemlékezések azért értékesek, mert a szemtanúk száma egyre fogy."}, {"id": "antonelli-vb-cim", "img": "https://kep.cdn.indexvas.hu/1/0/7218/72187/721871/72187155_f25b0fa387cedf52bdc71eb4bf5ecc2c_wm.jpg", "cred": "Kimi Antonelli. Fotó: Getty Images", "imgs": "Index", "r": "Sport", "c": "Autósport", "st": "Megerősített", "time": "okt. 22.", "t": "Vasárnap Austinban világbajnok lehet Kimi Antonelli, ha nyer és a riválisai gyengén szerepelnek", "s": "A 20 éves Mercedes-pilóta 102 ponttal vezet Russell előtt, hat futam van hátra.", "p": ["Kimi Antonelli (Mercedes, 20, bolognai) az Egyesült Államok Nagydíján, vasárnap Austinban megszerezheti a 2026-os Forma–1 világbajnoki címét. Ezzel a legfiatalabb világbajnok lenne a sportág történetében, mindössze második szezonjában. Csapattársa, George Russell előtt 102 ponttal vezet, hat futam van hátra, 125 pont a tét.", "A feltétel: Antonellinek nyernie kell Austinban, Russell legfeljebb kilencedik, Lewis Hamilton (Ferrari, hétszeres világbajnok) legfeljebb ötödik lehet. A legfiatalabb világbajnok rekordját Sebastian Vettel tartja, aki 2010-ben, 23 évesen nyerte az első címét. Antonelli ebben a szezonban nyolc futamot nyert, legutóbb Madridban szeptemberben, Bakuban ötödik, Malajziában második, Szingapúrban harmadik volt.", "Max Verstappen (Red Bull, négyszeres világbajnok) nyert Malajziában és Szingapúrban, Madridban és Bakuban második volt. Toto Wolff megerősítette, hogy a legújabb fejlesztéscsomagot mindkét autón használják Austinban. Olasz világbajnok 73 éve nem volt, Antonelli a harmadik lenne Giuseppe Farina (1950) és Alberto Ascari (1953) után. A hátralévő naptár: Mexikóváros, Brazília, Las Vegas, Katar és Abu-Dzabi a közel-keleti konfliktus miatt bizonytalan. Magyar idő szerint az első szabadedzés pénteken 19:30-kor volt, az időmérő szombaton 23:00-kor, a 56 körös verseny vasárnap 21:00-kor kezdődik."], "cav": "A cikk csütörtökön jelent meg, a pénteki és szombati eredmények a forrásban nem szerepelnek.", "src": [["Index: Kimi Antonelli világbajnok lehet", "https://index.hu/sport/forma1/2026/10/22/formula-1-amerikai-nagydij-austin-kimi-antonelli-felvezeto/"]], "op": "Ha a sportág legfiatalabb világbajnoka születne, az páratlan teljesítmény volna egy 20 éves pilótától. A cikk a futam előtt készült, ezért a végeredményről a későbbi tudósítások adnak képet."}, {"id": "lebron-valasz-trump", "img": "https://kep.cdn.index.hu/1/0/7219/72199/721997/72199701_5321277_c4f0c56a505df9776d5171528f2d9d3e_wm.jpg", "imgs": "Index", "r": "Sport", "c": "Kosárlabda", "st": "Megerősített", "time": "okt. 23.", "t": "LeBron James visszaszólt Trumpnak: „eseménytelen nap van az irodában”, a Philadelphia nyert a Knicks ellen", "s": "A 41 éves James a Sixers színeiben mutatkozott be 14 ponttal, 9 lepattanóval és 6 gólpasszal.", "p": ["A Philadelphia 76ers 106–100-ra legyőzte a címvédő New York Knickst az NBA-szezon nyitómérkőzésén a Madison Square Gardenben. A 41 éves LeBron James a Philadelphia színeiben mutatkozott be, 14 pontot, 9 lepattanót és 6 gólpasszt jegyzett.", "Donald Trump a Truth Socialon azt írta, hogy James tiszteletlen volt a himnusz alatt, egy videó szerint golflendítést és dobást utánzott, míg csapattársai álltak. Trump szerint bocsánatot kell kérnie az amerikai katonáktól és hősöktől. Nick Nurse, a 76ers vezetőedzője szerint Trump megjegyzései a csapatot érő külső zavaró tényezőket növelték. James azt válaszolta: „Úgy látszik, eseménytelen nap van az irodában”, vagyis szerinte Trump egy lényegtelen kérdésen akad ki a médiafigyelemért.", "A Miami Herald egy 2020-as videója szerint Trump egy Super Bowl-himnusz alatt képzeletbeli zenekart vezényelt. A két férfi évek óta bírálja egymást, James korábban „semmirekellőnek” nevezte Trumpot."], "cav": "A korábbi hírünk (Trump bocsánatkérést követel) Trump állítására épült, James válasza azóta megjelent.", "src": [["Index: LeBron James visszaszólt Trumpnak", "https://index.hu/sport/kosarlabda/2026/10/23/donald-trump-lebron-james-amerikai-himnusz-kritika-egyesult-allamok-nba/"]], "op": "LeBron James humoros válasza jó példa arra, hogyan lehet méltósággal reagálni egy politikai támadásra. A Philadelphia győzelme és James bemutatkozása a sportoldalnak is jó hír."}, {"id": "psg-lyon-halasztas", "img": "https://kep.cdn.index.hu/1/0/7221/72212/722124/72212497_5322147_27ae3cc78c319c9496d0b0d0a7a76e72_wm.jpg", "imgs": "Index", "r": "Sport", "c": "Foci", "st": "Megerősített", "time": "okt. 23.", "t": "A párizsi zavargások miatt hétfőre tették át a PSG–Lyon meccset", "s": "A rendőrség kérésére a bajnoki mérkőzés vasárnap helyett hétfőn, 20:30-kor kezdődik.", "p": ["A Paris Saint-Germain és az Olympique Lyon Ligue 1-es, nyolcadik fordulós mérkőzését a rendőrség kérésére vasárnapról hétfőre halasztották, a kezdés vasárnap 20:45 helyett hétfőn 20:30. A rendőrség erői le vannak kötve, mert a hétvégére nagy tüntetéseket terveznek Párizsban. Ez már a negyedik első- vagy másodosztályú mérkőzés, amelyet a hétvégén a tüntetések miatt áttettek.", "A Lyon vezeti a tabellát, a Bajnokok Ligája címvédő PSG második, mindkettőnek 14 pontja van. Vasárnap 14:30-kor a Stade de France-ban NFL-mérkőzés lesz a New Orleans Saints és a Pittsburgh Steelers között, ami szintén nagy rendőri jelenlétet igényel.", "Az előző hétvégén Franciaország az utóbbi évek legsúlyosabb zavargásait élte át, a rendőrökkel összecsapások voltak, üzleteket és középületeket rongáltak vagy gyújtottak fel. Szombaton az MTI szerint 110 tüntetést tartottak országszerte mintegy 550 ezer résztvevővel. A tiltakozás az emelkedő megélhetési költségek és az oktatási intézmények rossz helyzete ellen szólt."], "cav": "", "src": [["Index: a párizsi zavargások a PSG életére is hatással vannak", "https://index.hu/sport/futball/2026/10/23/parizs-zavargasok-paris-saint-germain-lyon-rangado-rendorseg/"]], "op": "Ha a rendőrség erői annyira le vannak kötve, hogy egy bajnoki mérkőzést is át kell tenni, az jól mutatja, mekkora a feszültség Franciaországban. A sport ilyenkor másodlagos, a halasztás józan döntés."}, {"id": "jepchirchir-doppingg", "img": "https://kep.cdn.index.hu/1/0/7221/72211/722111/72211101_5322045_cff1a40ace7c60bea5c1a5e5b90bd442_wm.jpg", "imgs": "Index", "r": "Sport", "c": "Atlétika", "st": "Jelentett", "time": "okt. 23.", "t": "Eltiltották ideiglenesen az olimpiai és világbajnok maratonit, Peres Jepchirchirt EPO-gyanú miatt", "s": "Az Atlétikai Integritási Egység szerint a verseny nélküli vérmintában tiltott hormon jelent meg.", "p": ["A World Athletics Atlétikai Integritási Egysége (AIU) október 23-án ideiglenesen felfüggesztette Peres Jepchirchir kenyai maratoni versenyengedélyét doppinggyanú miatt. A szerv szerint a Sydney-i Maraton előtt, augusztusban Kenyában vett, versenyen kívüli vérmintában az EPO (eritropoetin) tiltott hormon jelent meg.", "A cikk szerint a vizsgálat még nem kezdődött meg. Jepchirchir 33 éves, olimpiai és világbajnok, a sydney-i maratont is megnyerte, ez a negyedik Major-győzelme New York, Boston és London után. Az AIU az elmúlt évtizedben több mint 140 kenyai sportolót tiltott el vagy függesztett fel tiltott szer miatt.", "Október elején Witold Banka, a WADA elnöke arra szólította Kenyát, hogy mutasson jó példát a doppingellenes küzdelemben. Kenya volt az első afrikai ország, amely megnyerte a 2029-es atlétikai világbajnokság rendezési jogát."], "cav": "Ideiglenes felfüggesztésről van szó, a vizsgálat nem zárult le, a sportoló védekezéséről a cikk nem számol be.", "src": [["Index: doppinggyanúba keveredett az olimpiai és világbajnok sportoló", "https://index.hu/sport/2026/10/23/peres-jepchirchir-epo-atletika-maraton-wada/"]], "op": "Az ideiglenes felfüggesztés még nem a bűnösség megállapítása, a vizsgálat lezárásáig az ártatlanság vélelme illeti meg a sportolót. Ha az EPO-gyanú beigazolódik, az az atlétika hitelességének újabb csapása lenne."}, {"id": "veszprem-fuchse", "img": "https://kep.cdn.index.hu/1/0/7218/72181/721817/72181761_5320027_05e78f90e8b1c85c2290fda4c39a3c87_wm.jpg", "imgs": "Index", "r": "Sport", "c": "Kézilabda", "st": "Megerősített", "time": "okt. 22.", "t": "Öt héten belül harmadszor verte a Fuchse Berlint a Veszprém: 39–35 a Bajnokok Ligájában", "s": "A magyar bajnok 10 ponttal vezeti a csoportot, és már továbbjutott.", "p": ["A Veszprém 39–35-re (félidő: 20–13) győzött a Füchse Berlin ellen október 21-én, a férfi Bajnokok Ligája csoportkörének ötödik fordulójában. A 12. hivatalos találkozón ez a magyar csapat hatodik, a berlini ötödik győzelme, egy döntetlen mellett. Egyben a harmadik veszprémi siker a berliniek ellen öt hét alatt, a szeptember 16-i BL-meccs és a szeptember 27-i klubvilágbajnoki győzelem után.", "Matthes Langhoff a 15. percben kiállított, a Berlin végig hátrányban volt. A Veszprém góllövői: Dragan Pechmalbec 8, Nedim Remili 7, Hugo Descat 6, Emil Nielsen 14 védést jegyzett. A Berlinnél Mathias Gidsel 9 gólt szerzett, Andreas Palicka 8 védést ért el. A Veszprémből Lukas Jörgensen és Luka Cindric hiányzott.", "A csoportállás: Veszprém 10 pont, Füchse 6, FC Porto 3, Partizan Belgrád 1. A Veszprém egy hét múlva a Portóhoz látogat, tét nélkül. Az első két csapat a legjobb 12 közé jut, a harmadik és a negyedik az Európa Ligába kerül."], "cav": "", "src": [["Index: Veszprém–Füchse Berlin", "https://index.hu/sport/kezilabda/2026/10/22/ferfi-kezilabda-bajnokok-ligaja-one-veszprem-fuchse-berlin/"]], "op": "Öt héten belül harmadszor verni ugyanazt az ellenfelet a legjobb európai kézilabdacsapatok szintjén komoly teljesítmény. A továbbjutás megszerzése után a Veszprém most már a csoport éléért játszhat."}, {"id": "nemeth-andras-puskas", "img": "https://kep.cdn.indexvas.hu/1/0/7217/72175/721754/72175411_e675794f5197b5e2dd7b949a5111e7d2_wm.jpg", "cred": "Németh András az Újpest FC – Puskás Akadémia FC mérkőzésén a Szusza Ferenc Stadionban 2026. október 17-én. Fotó: Szollár Zsófi / Index", "imgs": "Index", "r": "Sport", "c": "Foci", "st": "Jelentett", "time": "okt. 22.", "t": "Német András öt gólt szerzett tíz meccsen a Puskás Akadémiában, három éve nem hívta be Rossi", "s": "A 23 éves csatár a bajnoki éllovas klubban újra a válogatott felé kacsingat.", "p": ["Az Index portréja szerint Német András, a Puskás Akadémia csatára Dél-Afrikában született, családja egyéves korában költözött Magyarországra. 2018-ban 16 évesen a Genk színeiben megnyerte a Puskás–Suzuki-kupa gólkirályi címét, 2019-ben az U17-es Európa-bajnokságon és az U17-es világbajnokságon is eredményes volt. 19 évesen debütált a Genk felnőtt csapatában, és gólt szerzett.", "2023-ban a német másodosztályú Hamburghoz igazolt, amely a hírek szerint 750 ezer eurót fizetett érte. 2024 nyarán kölcsönbe a Münsterhez került, ahol több mint 900 napig nem szerzett gólt. Négy felnőtt válogatott mérkőzése van, Marco Rossi három éve nem hívta be. 2023 novemberében Rossi azt tanácsolta neki, hogy váltson klubot, de maradt a Hamburgnál.", "2025-ben csatlakozott a Puskás Akadémiához, az első idény csalódás volt. Az idei bajnokságban tíz meccsen öt gólt szerzett, köztük egy 30 méteres lövéssel az Újpest ellen. A Puskás Akadémia tíz forduló után vezeti az NB I-et. A játékos a sikert Babó Levente edzőnek tulajdonítja, aki visszaadta az önbizalmát. Szeretne visszatérni a válogatottba, de nem sértődött meg. A szokásos csatár, Varga Barnabás hetekig sérült az AEK Athénban."], "cav": "", "src": [["Index: Német András portré", "https://index.hu/sport/futball/2026/10/22/nemeth-andras-puskas-akademia-magyar-valogatott/"]], "op": "Öt gól tíz meccsen nem rossz, és a klubban nyújtott teljesítménye lehet a kulcs ahhoz, hogy újra szóba kerüljön a válogatottban. A portré mutatja, mennyi út vezet egy tehetségtől a kerethez."}, {"id": "messi-asztúria", "img": "https://kep.cdn.index.hu/1/0/7220/72200/722007/72200761_5321347_5cf1e1920b7566ae2ba63064f735b206_wm.jpg", "imgs": "Index", "r": "Sport", "c": "Foci", "st": "Megerősített", "time": "okt. 23.", "t": "Lionel Messi átvette az Asztúria hercegnője-díjat Oviedóban", "s": "A zsűri a tehetsége és karrierje mellett a hátrányos helyzetű gyerekeket segítő jótékonysági munkáját is méltatta.", "p": ["Lionel Messi október 23-án átvette a sport kategóriában odaítélt Asztúria hercegnője-díjat a spanyolországi Oviedóban. A zsűri a tehetsége és karrierje mellett a hátrányos helyzetű gyerekek oktatását és egészségügyi ellátását segítő jótékonysági tevékenységét is kiemelte.", "Messi csütörtökön érkezett, a ceremónia előtti napon, egy sportcsarnokban több mint 6000 ember fogadta, a rendezvény jegyei az MTI szerint 13 perc alatt elfogytak. Mintegy 1500 diákhoz szólt, azt mondta, hogy a legfontosabb az, hogy élvezzék a játékot, a gyerekekre nyomást gyakorló szülőket pedig bírálta, szerint ez árt, nem segít. Elmondta, hogy gyerekként azért hagyta el szülővárosát, Rosariót, mert a Barcelona volt az álma. 21 évet játszott Spanyolországban, mindet a Barcelonában, jelenleg az Inter Miamiban szerepel."], "cav": "", "src": [["Index: rangos díjban részesült Lionel Messi", "https://index.hu/sport/futball/2026/10/23/lionel-messi-aszturia-hercegnoje-dij-oviedo-spanyolorszag-elismeres/"]], "op": "A díj különlegessége nem az, hogy sportoló kapta, hanem az, hogy a zsűri a jótékonysági munkáját is méltatta. Egy sportoló példája akkor a legértékesebb, ha a pályán kívül is segít."}, {"id": "basa-janos", "r": "Sport", "c": "Jégkorong", "st": "Jelentett", "time": "okt. 23.", "t": "Meghalt Basa János, a csíkszeredai és a Fradi jégkorongcsapatának egykori edzője", "s": "82 éves volt, 1992-ben a Ferencvárossal bajnokságot és magyar kupát nyert.", "p": ["Basa János, a Csíkszereda és a Ferencváros jégkorongcsapatának egykori edzője 82 éves korában hosszú betegség után elhunyt. A hírt a Székelyhon közölte, az Index átvette.", "A román válogatottban játszott az 1968-as grenoble-i téli olimpián, pályafutását 1975-ben fejezte be. Tizenkét évig edzette a Csíkszeredát, a klubbal bajnoki címet nyert. Legnagyobb edzői sikerét 1992-ben érte el a Ferencvárossal, amikor a csapat megnyerte a bajnokságot és a magyar kupát. A csíkszeredai Márton Áron Főgimnázium megbecsült tanára is volt."], "cav": "", "src": [["Index: meghalt Basa János", "https://index.hu/sport/jegkorong/2026/10/23/basa-janos-ferencvaros-fradi-csikszereda-edzo-meghalt/"]], "op": "Basa János a magyar és a csíkszeredai jégkorong egyik meghatározó edzője volt. Emléke előtt tisztelgünk."}, {"id": "bardoczky-tenisz", "img": "https://kep.cdn.indexvas.hu/1/0/7217/72178/721783/72178331_da596228e55bdac1654bcd07d3c5792c_wm.jpg", "cred": "Bardóczky Kornél. Fotó: Papajcsik Péter / Index", "imgs": "Index", "r": "Sport", "c": "Tenisz", "st": "Jelentett", "time": "okt. 23.", "t": "Bárdóczky Kornél a rá zúduló támadásokról: lezárt ügynek tekinti, de tudják, ki áll mögötte", "s": "A Davis Kupa- és Billie Jean King-kupa szövetségi kapitány az Index és az MTSZ Love Game podcastjában beszélt.", "p": ["Az Index és a Magyar Tenisz Szövetség (MTSZ) Love Game című podcastja 13. adásában vendég volt Bárdóczky Kornél, a magyar Davis Kupa- és női Billie Jean King-kupa válogatott kapitánya. A női csapat november végén az Egyesült Államok ellen játszik fontos mérkőzést.", "Bárdóczky méltatta Novak Djokovics pekingi győzelmét 39 évesen, amely során a negyeddöntőben Alexander Zverevet verte. Alejandro Davidovich Fokina és Rafael Jodar játszotta a sanghaji Masters döntőjét, Jodart „a jövőnek” nevezte. Daniil Medvegyev 200 rangsorpontot és a pénzdíjat elveszítette, mert elődöntőjében Djokovics ellen véletlenül megütött egy nézőt a labdával, fellebbezett. A kapitány szerint a büntetés a szabályok szerint indokolt, de egyetért azzal, hogy a labdaérintés véletlen volt.", "A közösségi médiában ellene indított kampányokról azt mondta, hogy a szövetség elnökválasztása idején csúcsosodtak, részben a sporton belülről, lezárt ügynek tekinti, a szövetség mindenki előtt nyitva áll. Szóba került Carlos Alcaraz visszatérése csuklósérüléséből, Aryna Szabalenka gyengélkedése és az MTSZ új elnöke, dr. Szőcs Árpád László."], "cav": "", "src": [["Index: Love Game podcast, Bárdóczky Kornél", "https://index.hu/sport/tenisz/2026/10/23/love-game-mtsz-index-tenisz-podcast-13.-adas-bardoczky-kornel/"]], "op": "A szövetségi kapitány azt mondta, lezárt ügynek tekinti a támadásokat, de tudják, ki áll mögötte: ez inkább sejtetés, mint állítás. A női csapat novemberi mérkőzése az igazi próba lesz."}, {"id": "putyin-haromoldalu-targyalas", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/3939e1e2-1ea9-4389-8a96-81da9635b144.jpg", "imgs": "HVG", "r": "Külföld", "c": "Ukrajna", "st": "Jelentett", "time": "okt. 23.", "t": "Putyin újabb „békenyilatkozata”: tárgyalna, tűzszünetet viszont nem akar", "s": "Az orosz elnök szerint Moszkva és Washington megállapodott a háromoldalú tárgyalások újraindításáról, de csak végleges rendezést akar.", "p": ["Vlagyimir Putyin a Rosszija 1 televíziónak azt mondta, Oroszország kész újraindítani az orosz–amerikai–ukrán háromoldalú tárgyalásokat. Idézete szerint „megegyeztünk” Washingtonnal abban, hogy folytatják.", "Az orosz elnök olyan megállapodást akar, amely végleges formában garantálja Oroszország és Ukrajna jövőbeli biztonságát, nem pedig rövid szüneteket a harcokban. A tűzszünetet korábban is ellenezte, mert szerinte az Ukrajnának kedvezne.", "Putyin a megszállt területeket „történelmi orosz területnek” nevezte, azt pedig, hogy Oroszország nem készül Európa megtámadására, a nyugati figyelmeztetéseket „politikai skizofréniának” minősítve állította.", "A HVG szerint Putyin korábbi békenyilatkozatait nem követte a harcok vagy az infrastruktúra elleni támadások csökkenése, a titkosszolgálati és katonai vélemények szerint pedig Oroszország hibrid hadviselést folytat Európa ellen."], "cav": "Az állításokat Putyin tévéinterjújából idézzük, függetlenül nem ellenőriztük őket. Az amerikai fél megerősítését a cikk nem közli.", "op": "Aki egyszerre ostromol egy országot és „békéről” beszél, de a tűzszünetet elutasítja, az nem tárgyalni akar, hanem időt nyerni. Putyin szavait a tettei alapján érdemes mérni, nem a tévéinterjúi alapján.", "src": [["HVG – Putyin: kész az újabb háromoldalú tárgyalásokra", "https://hvg.hu/vilag/20261023_putyin-oroszorszag-ukrajna-haboru-kodosites"]]}, {"id": "fitch-2027-koltsegvetes", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/e07de7bd-cdc8-4930-9b51-5bc2ffb8c8d6.jpg", "imgs": "HVG", "r": "Gazdaság", "c": "Hitelminősítés", "st": "Megerősített", "time": "okt. 23.", "t": "Fitch: az euróbevezetés még elérhető, de a kormánynak végre kell hajtania a fájdalmas kiigazítást", "s": "A hitelminősítő 2027-re 5,4 százalékos hiányt vár a kormány 4,9 százalékos terve helyett, és az adósságráta csúcsát 77,7 százalékra teszi.", "p": ["A Fitch szerint a 2027-es költségvetés és a középtávú hiánycélok összeegyeztethetők azzal, hogy Magyarország 2030-ra teljesítse az euróövezeti belépés feltételeit, de a minősítő kockázatokra és bizonytalanságokra is felhívja a figyelmet.", "A Fitch a hiányt 2026-ban 7,3, 2027-ben 5,4 százalékra becsüli. A kormány 2027-es terve 4,9 százalék, a 2026-os pótköltségvetésé 7,5. A minősítő szerint 2030-ra a 3 százalék alatti hiány elérhető. Az államadósság a Fitch számításai szerint 2027–2028-ban éri el csúcsát, a GDP 77,7 százalékán, ami pesszimistább a kormány előrejelzésénél.", "A növekedést a Fitch 2027-re körülbelül 2,5, 2028-tól 3 százalékra várja, nagyjából a kormánnyal egyezően.", "Magyarország a befektetési kategória legalsó fokán áll, 2025 decembere óta negatív kilátással, egy újabb leminősítés a bóvli kategóriát jelentené. A Fitch szerint a döntés a 2027-es költségvetés végrehajtásán múlik, a decemberi felülvizsgálaton nem várható lépés.", "A minősítő azt figyeli, sikerül-e megvalósítani a Kármán András pénzügyminiszter által beígért „fejnehéz” kiigazítást. A nyugdíjemelés, a nyugdíjas Szép-kártya, a szja-csökkentés, a közszféra béremelése és az egészségügyi kiadások a GDP körülbelül 1,4 százalékát kitevő megtakarítást igényelnek, a Fitch kétli, hogy a kiadás-felülvizsgálatok ezt hozzák."], "cav": "A cikk a következő felülvizsgálat időzítésénél ellentmondó: a szövegben tavasz, de inkább jövő ősz szerepel, a metaadatban „inkább jövő télen”.", "op": "Hat hónappal a kormányváltás után a Fitch nem leminősít, hanem lehetőséget ad. Ez a legjobb hír, amit egy örökölt, hétszázalékos hiányú költségvetésről mondhatnak. A feltétel az, hogy a beígért megszorítás ne maradjon papíron.", "src": [["HVG – Fitch a 2027-es költségvetésről", "https://hvg.hu/gazdasag/20261023_fitch-ertekeles-koltsegvetes-bizonytalansagok-kiigazitas-leminosites"]]}, {"id": "koltsegvetes-elemzok-reakcio", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/32024468-83e0-4618-9c5e-fec2eca8f1c6.jpg", "cred": "Kármán András pénzügyminiszter és Magyar Péter miniszterelnök sajtótájékoztatója a jövő évi költségvetés tervezetéről. Fotó: HVG / Fazekas István", "imgs": "HVG", "r": "Gazdaság", "c": "Költségvetés", "st": "Megerősített", "time": "okt. 23.", "t": "Elemzők a 2027-es költségvetésről: szoros, de teljesíthető, a hitelminősítők tetszését is elnyerheti", "s": "A CIB és a Raiffeisen elemzője szerint a 4,9 százalékos hiánycél kevés tartalékot hagy, de nem irreális.", "p": ["Trippon Mariann (CIB) és Török Zoltán (Raiffeisen Bank vezető elemzője) a HVG-nek úgy értékelte a 2027-es költségvetést, hogy szoros és követelő, de nagyrészt teljesíthető. Mindketten alaposan előkészítettnek nevezték a Pénzügyminisztérium munkáját.", "A 4,9 százalékos hiánycél Trippon szerint kevés puffert hagy. Török szerint a költségvetés nagyobb tartalékot is elbírna, mint az 5 százalékos korlát alatti 300 milliárd forintos mozgástér.", "Török kockázatként említette, hogy 135 milliárd forintnyi megtakarítás azzal számol, hogy az EU nem vonja le a migrációs bírságot a magyar forrásokból. Az energiaárak miatt a rezsitámogatások fenntartása jóval drágább lehet, a tervezett 10 százalékos általános kiadáscsökkentés pedig szigorú fegyelmet kíván.", "Trippon szerint a hasonló kiadáscsökkentések történelmileg gyakran elmaradnak a tervezettől. Pozitívumként említették, hogy a kiigazítás nagyjából kétharmada a kiadási oldalra esik, az adórendszer kissé progresszívebb lesz, a lakástámogatások célzottabbak.", "Hiányosságként Trippon a különadók meghosszabbítását és a rezsitámogatások célzatlanságát nevezte meg. A hitelminősítők időt adtak az új kormánynak, a főbb döntések a november–decemberi felülvizsgálaton várhatók. Török szerint a felminősítési pálya elindult, de első felminősítésre most nem számít."], "cav": "Két bankelemző véleményét közöljük, ők nem a kormány függetlenített szakértői.", "op": "Az elemzők kritikája nem az, hogy a költségvetés rossz, hanem hogy szoros. Ez a megszokotthoz képest jelentős változás: a korábbi rezsim idején a hiánycélokat rendre elfelejtették.", "src": [["HVG – elemzők a költségvetésről", "https://hvg.hu/gazdasag/20261023_koltsegvetes-elemzok-budzse-hiany-hitelminositok"]]}, {"id": "pegasus-amerikai-telefonszam", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/9d59472c-4a3d-4c8a-9533-58dd8d5b54a8.jpg", "cred": "Fotó: AFP / Joel Saget", "imgs": "HVG", "r": "Belpolitika", "c": "Fidesz", "st": "Jelentett", "time": "okt. 22.", "t": "Amerikai telefonszámra váltanak a NER-elit tagjai, mert félnek a Pegasustól", "s": "Panyi Szabolcs szerint a Fidesz-közeli elit a +1-es előhívót keresi, mert az NSO csoport nem engedi a kémszoftver telepítését ilyen számokra.", "p": ["A HVG a VSquare Panyi Szabolcs által jegyzett hírlevelére hivatkozva írja, hogy a NER-elit tagjai egyre gyakrabban váltanak amerikai (+1-es) telefonszámra. Az indok a Pegasus-kémszoftvertől való félelem, most, hogy a Fidesz már nincs hatalmon.", "A hírek szerint az NSO Group szabálya tiltja a Pegasus telepítését +1-es számú telefonokra.", "A Pegasus-botrány 2021-ben robbant ki, amikor nemzetközi oknyomozás kimutatta, hogy magyar újságírók, ügyvédek, üzletemberek és hozzátartozóik is célpontok voltak. A kémkedés áldozatai között olyan emberek is voltak, akik a Fidesz belső köréhez tartoztak.", "Panyi szerint a jelenlegi magyar kormánynak nincs szerződése az NSO Grouppal. A cikk azt is felveti, hogy egyes NER-tagok külföldi kormányok figyelmétől is tarthatnak."], "cav": "Az információ egyetlen hírlevélen alapul, a név nélküli megfigyelések nem ellenőrizhetők.", "op": "Aki egykor a Pegasus megrendelője vagy haszonélvezője volt, most maga is attól retteg. Ez nem ítélet, de elgondolkodtató: a megfigyelési eszközöket nem lehet csak az ellenfelek ellen alkalmazni.", "src": [["HVG – amerikai telefonszám és a Pegasus", "https://hvg.hu/tudomany/20261022_amerikai-orszagkod-telefonszam-ner-elit-felelem-pegasus"]]}, {"id": "kushner-hercegek-tolvajok", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/e02d1be5-0090-49c4-a50b-edfabf3e3924.jpg", "imgs": "HVG", "r": "Külföld", "c": "Egyesült Államok", "st": "Jelentett", "time": "okt. 23.", "t": "Holland ti
