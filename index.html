 az ágazati vezetők döntenek. A sporttámogatás TAO-rendszerét átlátható támogatás váltja fel, az üres állásokat nem töltik be a minisztériumokban, de hivatalos létszámstop nincs."], "cav": "Az adatok az Index percről percre tudósításából származnak, részletes szabályokat és ellenzéki reakciókat a tudósítás nem tartalmaz. Az szja-kulcsokat nem közölték.", "src": [["Index: a 2027-es költségvetés bemutatása", "https://index.hu/belfold/2026/10/20/magyar-peter-karman-andras-2027-koltsegvetes-ado-szja-kata-tisza-kormany/"]], "op": "A kormány azt ígéri, hogy új adók nélkül is rendbe teszi a költségvetést, de a számok mögött kemény választások állnak: 7,5 százalékos hiány idén, 2,8 százalék 2030-ra. Az eurócsatlakozási cél és az óvatos pálya összefér, a megtakarítások részleteit viszont a benyújtott tervezetben kell majd számon kérni."}, {"id": "koltsegvetes-2026-modositas", "r": "Gazdaság", "c": "Költségvetés", "st": "Megerősített", "time": "okt. 21.", "t": "Átírták az idei költségvetést: 7110 milliárd forintos hiánnyal számolnak", "s": "A módosítás szerint átvilágítás nélkül a hiány a GDP 8,3 százaléka lett volna, a cél 7,5 százalék.", "p": ["A módosított törvény szerint az idei központi költségvetés hiánya 7110 milliárd forint. A kiadás mintegy 49 025 milliárd, a bevétel mintegy 41 915 milliárd forint. Az eredeti költségvetésben 43 781 milliárd forint kiadás és 39 562 milliárd forint bevétel szerepelt, 4218 milliárdos hiánnyal, ami a GDP 3,7 százaléka lett volna.", "A kormány azzal indokolja a módosítást, hogy az átvilágítás szerint korrekció nélkül az idei hiány a GDP 8,3 százalékára nőtt volna. Az intézkedésekkel és egy uniós megállapodással 7,5 százalékra szeretnék leszorítani. A növekedés idén a tervezett 4,1 százalék felénél is alacsonyabb lehet, tavaly is 2 százalékponttal elmaradt a tervtől. Az államadósság aránya átmenetileg 74,6 százalékról 77,5 százalékra emelkedhet, 2026 után csökkenésre számítanak.", "A költségvetés 500 milliárd forintos Havária Alapot hoz létre az aszály, az örökölt energiaválság és más előre nem látható kiadások fedezésére. Mintegy 400 milliárd forintnyi hiánycsökkentő intézkedés a túlárazásokat, a pazarlást, a korábbi kormányhoz köthető üzleti körök támogatását, a propagandakiadásokat és az államigazgatás racionalizálását érinti.", "A szociális intézkedések között szerepel iskolakezdési támogatás, a vényköteles gyógyszerek áfamentessége, a tűzifa áfájának 27-ről 5 százalékra csökkentése és a szociális tűzifa-támogatás duplázása. A törvény preambulumát „A valóság költségvetése” címre keresztelték át."], "cav": "A Pénzcentrum cikke az eredeti törvényt egy helyen 2025-ös költségvetésként nevezi meg, ez valószínűleg elírás. A Pénzcentrum a forintösszegeket is pontatlanul jelöli, mi milliárd forintban értelmeztük őket.", "src": [["Pénzcentrum: átírták az idei költségvetést", "https://www.penzcentrum.hu/gazdasag/20261021/hatalmas-lyuk-tatong-a-koltsegvetesben-atirtak-az-idei-budzset-erre-keszul-a-kormany-1207683"]], "op": "A 7110 milliárd forintos hiány az előző évek költségvetési politikájának számlája: a módosítás megmutatja, mekkora a különbség az eredeti, 3,7 százalékos terv és a valóság között. A tisztább számok hitelességet adnak, még ha fájdalmasak is."}, {"id": "mnb-alapkamat", "img": "https://assets.telex.hu/images/20261020/1792497059-temp-qf6q8ls61gu60igleip_facebook.jpg", "imgs": "Telex", "r": "Gazdaság", "c": "Jegybank", "st": "Megerősített", "time": "okt. 20.", "t": "Marad 5,5 százalék az alapkamat, az infláció szeptemberben 1,6 százalék volt", "s": "A Monetáris Tanács az elemzői várakozásnak megfelelően nem változtatott, Varga Mihály szerint az eurócsatlakozás fegyelmezett költségvetést kíván.", "p": ["Az MNB Monetáris Tanácsa október 20-i ülésén 5,5 százalékon hagyta az alapkamatot, az éjszakai betéti kamat 4,5, az éjszakai hitel kamata 6,5 százalék maradt. Utoljára augusztusban csökkentettek 25 bázisponttal, szeptember végén szintén változatlanul hagyták a kamatot.", "Az infláció szeptemberben 1,6 százalékra gyorsult. A jegybank a következő hónapokban a magasabb üzemanyagárak és a dohány jövedéki adójának változása miatt némi gyorsulást vár, 2027-ben az energiaárak átmenetileg tovább emelhetik, 2028-ban pedig a 2,5 százalékos célhoz térhet vissza. A forint az elmúlt hónapokban erősebb sávban mozog, és az év eleji szintnél is erősebb, a volatilitás az utóbbi hetekben csillapodott.", "Varga Mihály jegybankelnök szerint az óvatos monetáris politika a nemzetközi helyzet miatt indokolt, bár a hazai inflációs folyamatok kedvezőek. Kockázatként említette a közel-keleti konfliktust, az európai gázárak 2023 óta legmagasabb szintjét és a fejlett országok hosszú lejáratú hozamainak közel két évtizedes csúcsát. A kormány bejelentett hiánycéljait (2028-ban 4, 2029-ben 3,4, 2030-ban 2,8 százalék) összhangban lévőnek nevezte az euróövezeti követelményekkel, de a részletek még nem ismertek. Szerinte az eurócsatlakozás tartósan fegyelmezett költségvetést, nem egyetlen év eredményét igényli."], "cav": "", "src": [["Telex: változatlanul hagyta az alapkamatot a jegybank", "https://telex.hu/gazdasag/2026/10/20/magyar-nemzeti-bank-kamatdonto-ules-jegybanki-alapkamat"], ["MNB: közlemény a Monetáris Tanács 2026. október 20-i üléséről", "https://www.mnb.hu/monetaris-politika/a-monetaris-tanacs/kozlemenyek/2026/kozlemeny-a-monetaris-tanacs-2026-oktober-20-i-uleserol"]], "op": "A változatlan 5,5 százalékos alapkamat nem meglepetés. Az 1,6 százalékos szeptemberi infláció a háztartásoknak jó hír, a jegybank elnöke szerint pedig az eurócsatlakozás fegyelmezett költségvetést kíván, tehát a kamatpályát a kormány költségvetési politikája is formálja."}, {"id": "sk-on-elbocsatas", "img": "https://assets.telex.hu/images/20261022/1792696958-temp-is1rqcbsci0tdldfgkn_facebook.jpg", "imgs": "Telex", "r": "Gazdaság", "c": "Munkaerőpiac", "st": "Jelentett", "time": "okt. 22.", "t": "Váratlanul elbocsátottak több magyar dolgozót az iváncsai akkumulátorgyárban", "s": "Az SK On Hungary szerint a döntés elkerülhetetlen volt, a szakszervezet további leépítéstől tart.", "p": ["Az SK On Hungary Kft. iváncsai akkumulátorgyárában szerdán több magyar munkavállalót váratlanul elbocsátottak. A dél-koreai SK Innovation leányvállalata 2024 májusában kezdte meg a tömegtermelést. A pontos létszámot a cikk nem közli.", "A LIGA szakszervezet SK On csoportja szerint a dolgozók további elbocsátásoktól tartanak. A szakszervezet kifogásolta az azonnali felmondásokat, szerinte az sérti az emberi méltóságot, és csoportos létszámleépítés esetén a jogszabályi feltételeknek is teljesülniük kellene. Részletes tájékoztatást kért a tervezett leépítés mértékéről és okairól, valamint a közelmúltban kiszabott munkavédelmi bírságokról.", "A cég a Telexnek megerősítette az elbocsátásokat, és azt közölte, hogy azok a gyár működésének az aktuális üzleti körülményekhez igazításához szükséges, „elkerülhetetlen létszámdöntések”. Vállalta, hogy segíti az érintetteket.", "A háttérhez tartozik, hogy a cég két 100 millió forintos bírságot kapott: az egyiket súlyos, a dolgozókat veszélyeztető munkavédelmi szabálysértések, a másikat a talajvíz szennyezése miatt. A Komárom és Iváncsa telephelyek együttes létszáma a 2024-es mintegy 2700-ról 2025-re 1819-re csökkent, a cég 2025-ös árbevétele 1,182 milliárd dollár (kb. 378 milliárd forint), adózott nyeresége 335 millió dollár volt."], "cav": "A cikk nem állítja, hogy a bírságok és az elbocsátások összefüggenek.", "src": [["Telex: elbocsátások az iváncsai akkumulátorgyárban", "https://telex.hu/gazdasag/2026/10/22/tobb-magyar-munkavallalot-elbocsatottak-az-ivancsai-akkumulatorgyarbol"]], "op": "A külföldi tulajdonú gyár váratlan elbocsátásai mindig figyelmeztetők: a magyar akkumulátoripar nem biztos pont. A szakszervezet félelme jogos kérdést vet fel, azt, hogy milyen garanciák vannak a munkavállalók számára, amikor egy beruházás után a gyár leépít."}, {"id": "szijjarto-feleseg-ceg", "img": "https://assets.telex.hu/images/20261020/1792509546-temp-pr66omeijsas4kcmkjc_facebook.jpg", "imgs": "Telex", "r": "Gazdaság", "c": "Közbeszerzés", "st": "Jelentett", "time": "okt. 22.", "t": "Szijjártó Péter feleségének cége alvállalkozó lett egy milliárdos miskolci kollégiumfelújításon", "s": "A cégnek nincs működő weboldala és nyilvános telefonszáma, mégis milliárdos árbevételt ért el.", "p": ["A Telex összeállítása szerint Szijjártó-Nagy Szilvia, Szijjártó Péter volt külügyminiszter felesége a tulajdonosa az Interior Design Kft.-nek. A cég a Miskolci Egyetem két kollégiumi épületének (E/5 és E/6, összesen 220 szoba) mintegy 4 milliárd forintos felújításánál alvállalkozó volt. A fővállalkozó, a Peka Bau 2000 Kft. a tendert a legolcsóbb ajánlattal nyerte meg. Az Interior Design alvállalkozói szerződésének nettó értéke 23 175 000 forint, ablakok és ajtók cseréjére, beléptető- és tűzjelző rendszerek telepítésére szólt.", "A cég 2019-ben alakult, árbevétele az első csonka évben 229 millió, 2023-ban 1,76 milliárd, tavaly közel 1,2 milliárd forint volt, kilenc alkalmazottal. 2019 óta 2,334 milliárd forint osztalékot fizetett ki. Nincs működő weboldala, nyilvános telefonszáma és közzétett referenciája.", "Szijjártó Péter a Telexnek azt mondta, hogy nem milliárdos, a család a cég jövedelméből él és fektet be, a működésében nem vesz részt, és nem tudta megmondani, hogyan lehet elérni a céget."], "cav": "A cikk nem állítja, hogy törvénysértés történt, a tényeket a cég üzleti tevékenységének megkérdőjelezésére hozza fel. Az Interior Design Kft. és a Peka Bau 2000 Kft. a megjelenésig nem válaszolt.", "src": [["Telex: Szijjártó Péter feleségének cége", "https://telex.hu/gazdasag/2026/10/22/szijjarto-peter-feleseg-ceg-interior-design-kft-alvallalkozo-peka-bau-miskolc-kollegium-milliard"]], "op": "A cikk nem állítja, hogy törvénysértés történt, de a kérdés jogos: miért lesz egy működő weboldal és nyilvános telefonszám nélküli cég milliárdos alvállalkozó? Az átlátható közbeszerzés nem csak a nyertes kiválasztásáról szól, hanem az alvállalkozói láncról is."}, {"id": "orban-anita-utazasok", "img": "https://assets.telex.hu/images/20261022/1792686032-temp-2ta7tg7gu9lqcocdbgg_facebook.jpg", "imgs": "Telex", "r": "Belpolitika", "c": "Külügy", "st": "Jelentett", "time": "okt. 22.", "t": "Orbán Anita: a külügy utazásai egytizedébe kerülnek, mint Szijjártó alatt, a Fidesz 22 552–0-t üzent", "s": "A külügyminiszter szerint egy út átlagosan 2,7 millió forintba kerül a korábbi 25,9 millió helyett.", "p": ["Orbán Anita külügyminiszter Facebook-bejegyzése szerint Szijjártó Péter minisztériuma 2025 májusa és októbere között több mint 960 millió forintot költött 37 útra, a mostani minisztérium ugyanebben az időszakban 63 millió forintnál kevesebbet 23 útra. Ez átlagosan 25,9 millió forint helyett 2,7 millió forint alatt van utazásonként.", "A tárca átnézte a központi igazgatás múltbeli kiadásait, és a 2027-es költségvetésben alacsonyabb kiadásokat tervez. A közdiplomáciai és fejlesztési programokon mintegy 30 százalékot takarítanak meg, program törlése nélkül. A miniszteri delegációs utak egyedi charterjáratainak megszüntetése hazai szinten csaknem 1,2 milliárd forintot spórol. Több üzemeltetési szerződést felmondtak vagy egyszerűsítettek.", "A Fidesz-frakció válaszában azt írta, hogy a teljesítmény mérhető a költséggel és az országnak hozott haszonnal is. Állításuk szerint Szijjártó ugyanebben az időszakban 1635 milliárd forintnyi beruházást jelentett be, indított el vagy adott át, ami 22 552 munkahelyet jelent, Orbán Anita pedig nem hozott beruházást és új munkahelyet. A Fidesz válaszának címe: „Szijjártó Péter–Orbán Anita: 22 552–0.”", "Háttérként: a minisztérium korábbi összesítése szerint 2025-ben Szijjártó útjainak charterköltsége 2 036 759 693 forint volt."], "cav": "Az összehasonlítás a külügyminiszter saját számítása, a Fidesz pedig a beruházási adatokat jelentette be, függetlenül nem ellenőriztük őket.", "src": [["Telex: Orbán Anita és a külügyi utazások költségei", "https://telex.hu/belfold/2026/10/22/orban-anita-kulugyminiszterium-utazasok-koltsegek-fidesz-reakcio"]], "op": "Ha az összehasonlítás igaz, a különbség nem kicsi: utazásonként 2,7 millió forint a 25,9 millió helyett. A számot érdemes független ellenőrzésnek alávetni, de a vita iránya világos: a külügy utazásait ma már számon lehet kérni."}, {"id": "gyor-fidesz-frakcio", "img": "https://assets.telex.hu/images/20261022/1792661727-temp-8c3icfll7q2bchlmeao_hero-normal:xl.jpg", "cred": "Fűzy András, a Fidesz győri városi elnöke volt mostanáig. Fotó: Szami", "imgs": "Telex", "r": "Közélet", "c": "Önkormányzat", "st": "Megerősített", "time": "okt. 22.", "t": "Húsz év után elvesztette többségét a Fidesz a győri közgyűlésben", "s": "Nyolc képviselő kilépett és „Csak Győr” néven új frakciót alapított.", "p": ["Csütörtökön a Fidesz–KDNP elvesztette a többségét a 22 fős győri közgyűlésben, mintegy húsz év után. A 14 tagú frakcióból nyolcan kiléptek, és új csoportot alapítottak „Csak Győr” néven. Köztük van Laczkovics-Takács Tímea, a volt frakcióvezető és Fűzy András, a győri Fidesz elnöke. Négyen maradtak a Fidesz-frakcióban, két KDNP-s képviselő pedig saját csoportot alakított.", "Az új székosztás: Csak Győr 8, a polgármester pártja, a TSZV 5, Fidesz 4, KDNP 2, független 2. Fűzy András lemondott a pártelnöki tisztségről, és a kilépők Fidesz-tagsága is megszűnt.", "Fűzy szerint a csoport egy része „helyi patrióta közösségben” akar folytatni, szerintük a Fidesz-címke megbélyegzés lett, és a jobboldaliság nem jelent kötelező Fidesz-tagságot. Tagadták, hogy a mandátumvesztéstől való félelem vezette volna őket.", "Pintér Bence polgármester ismét megpróbálta feloszlatni a közgyűlést, de a nyolc tagú Csak Győr nem támogatta, így 8–8 arány lett, és az indítvány nem került napirendre. Alkotmánymódosítási kezdeményezést jelentett be, amely népszavazással tenné lehetővé a testület feloszlatását."], "cav": "", "src": [["Telex: Győr közgyűlés, a Fidesz frakció felbomlása", "https://telex.hu/belfold/2026/10/22/gyor-kozgyules-fidesz-kdnp-frakcio-felbomlas-csak-gyor-helyi-tudositas"]], "op": "Egy városban, ahol húsz évig egy párt vezette a közgyűlést, a helyi politika a legőszintébb mérce. Az, hogy nyolc képviselő kilépett és „Csak Győr” néven frakciót alapított, azt jelzi, hogy a helyi érdekek számukra fontosabbak a pártszolidaritásnál."}, {"id": "fovaros-megallapodas", "img": "https://assets.telex.hu/images/20261022/1792675843-temp-o8m9li3ab89sfpedihf_facebook.jpg", "imgs": "Telex", "r": "Közélet", "c": "Önkormányzat", "st": "Jelentett", "time": "okt. 22.", "t": "Budapest 120 milliárd forintos egyszeri támogatást kap, de a szolidaritási adó után csak 30 milliárd marad", "s": "A főváros 20 milliárdot spórol 2027-ben, a kormány ellenőrt jelöl ki a fővárosi költségvetéshez.", "p": ["A főváros 120 milliárd forintos egyszeri állami támogatást kap. Az idei 90 milliárdos szolidaritási hozzájárulást ebből levonják, így Kiss Ambrus, a Főpolgármesteri Hivatal vezetője szerint 30 milliárd forint marad a fővárosnak.", "Karácsony Gergely szerint az összeggel a város ki tudja fizetni a szolidaritási hozzájárulást, és rendezhet bizonyos tartozásokat, így nehezen, de le tudja zárni az évet. A hozzájárulás csökken, de a pontos új összeg csak akkor ismert, ha minden településsel megkötik a megállapodást.", "Budapestnek 2027-ben 20 milliárd forintot kell megtakarítania az üzemeltetésen, ezt Karácsony nehéznek, de megvalósíthatónak nevezte. Vitézy Dávid közlekedési és beruházási miniszter szerint a kormány ellenőrt jelöl ki a fővárosi költségvetés vizsgálatára, és garanciákat akar látni a főváros pénzügyi stabilitására. Szerinte az egyszeri összeg a korábbi túlfizetések több mint 80 százalékát fedezi."], "cav": "A cikk Karácsony Gergely hosszú távú együttműködési szándékát közvetett idézetként közli.", "src": [["Telex: a főváros és a kormány megállapodása", "https://telex.hu/belfold/2026/10/22/fovarosi-onkormanyzat-tamogatas-kormany-megallapodas"]], "op": "120 milliárd forint első olvasatra sok, de a szolidaritási hozzájárulás levonása után 30 milliárd marad. Hogy a megállapodás működik-e, az azon múlik, hogy a főváros és a kormány hosszú távon is együtt tud-e dolgozni, és hogy az ellenőr kijelölése nem válik-e a beavatkozás eszközévé."}, {"id": "fürcht-tomin", "img": "https://assets.telex.hu/images/20261022/1792658734-temp-3c7cv4r3grsd0ilopni_hero-normal:xl.jpg", "cred": "Toroczkai László Fürcht Pál meghallgatásán 2026. október 21-én. Fotó: Huszti István / Telex", "imgs": "Telex", "r": "Belpolitika", "c": "Jogállam", "st": "Jelentett", "time": "okt. 22.", "t": "Toroczkai beidézné Tomin Szilviát a Schadl–Völner-ügy miatt: „fentről” szóltak le neki", "s": "Fürcht Pál szerint a Nemzeti Védelmi Szolgálat vezetőjét arra utasították, hogy zárja le az ügyet, de nem mondta meg, kitől jött az utasítás.", "p": ["A végrehajtási visszaélésekkel foglalkozó vizsgálóbizottság elnöke, Toroczkai László a Kossuth Rádióban azt mondta, be akarja idézni Tomin Szilviát, a Nemzeti Védelmi Szolgálat főigazgatóját. Ezt a bizottság szerdai meghallgatása indokolja, amelyen Fürcht Pál, a Központi Nyomozó Főügyészség volt vezetője azt mondta, hogy Tomin szerint „fentről” azt az utasítást kapta, hogy zárja le a Völner Pálra vonatkozó előkészítő eljárást, mert „ebből nem lehet ügy”.", "Fürcht elmondása szerint Tomin egy autó hátsó ülésén közölte vele ezt. Az előkészítő eljárás lezárása helyett a Budapesti Nyomozó Főügyészség vezetője feljelentést tett a Központi Nyomozó Főügyészségen, ami lehetővé tette az ügy folytatását. Fürcht szerint Tomin nélkül nem lenne Schadl–Völner-ügy. Arra, hogy ki adta az utasítást, nem válaszolt, Toroczkai többször rákérdezett.", "Toroczkai zárt ülést is kér a titkos információk megtárgyalásához. Ehhez előbb a minősített adatot kezelő szervezetnek, majd az Országgyűlés Hivatalának kell engedélyt adnia."], "cav": "Az információ Fürcht Pál elmondásán alapul, Tomin Szilvia álláspontját a cikk nem közli.", "src": [["Telex: Toroczkai beidézteti Tomin Szilviát", "https://telex.hu/belfold/2026/10/22/toroczkai-laszlo-beidezi-tomin-szilviat-nemzeti-vedelmi-szolgalat-schadl-volner-ugy-vegrehajtasi-visszaelesek-vizsgalobizottsag"]], "op": "Ha egy vezető „fentről” kapott utasításra zár le egy ügyet, az nem magánügy, hanem a jogállam próbája. Fürcht Pál állítása mindaddig csak állítás, amíg Tomin Szilvia nem szólal meg, de a vizsgálóbizottságnak jogos kötelessége kideríteni, ki adta az utasítást."}, {"id": "ep-delegacio", "img": "https://assets.telex.hu/images/20261022/1792681636-temp-creh6a4a114a2npfhlc_facebook.jpg", "imgs": "Telex", "r": "Külföld", "c": "Jogállam", "st": "Megerősített", "time": "okt. 22.", "t": "Nyolctagú EP-küldöttség érkezik október 26-án, a 7. cikk szerinti eljárás jelentéséhez gyűjtenek tapasztalatot", "s": "A LIBE-bizottság delegációja három napig tárgyal kormányzati, ellenzéki, igazságügyi és civil szereplőkkel.", "p": ["Az Európai Parlament LIBE-bizottságának nyolctagú delegációja október 26. és 28. között Magyarországra látogat, hogy áttekintse az áprilisi választás óta történt fejleményeket. A delegációt Sophie Wilmès (liberális) vezeti, tagja László András (Fidesz) mint az egyetlen magyar, valamint Tineke Strik (zöldek), aki a 7. cikk szerinti eljárás jelentéstevője.", "A Parlament az eljárást 2018-ban indította el, azóta nem történt előrelépés. Ha az uniós miniszterek megállapítanák az alapértékek megsértését, bizonyos tagsági jogok, például a szavazati jog felfüggeszthető. Strik szerint az októberi út jó alkalom megkérdezni az érintetteket, elégedettek-e a gyakorlati működéssel, és ez akár az eljárás megállapításainak visszavonására tett javaslathoz is vezethet a jelentésükben.", "A delegáció találkozik a kormány vezető tisztviselőivel, a parlamenti bizottságokkal, az ellenzéki pártokkal, az Alkotmánybírósággal, az Országos Bírói Tanáccsal, a korrupcióellenes szervekkel, civil szervezetekkel és a sajtóval. A Patriots for Europe frakció azt kérte, hogy vizsgálják meg Hankó Balázs, Seszták Miklós és Bús Balázs fogvatartási körülményeit, de a bejelentés ezt nem említi, és a cikk szerint valószínűleg nem is foglalkoznak vele."], "cav": "", "src": [["Telex: az EP-delegáció látogatása", "https://telex.hu/kulfold/2026/10/22/eu-europai-parlament-oroszorszag-bulgaria-romania-dronok"]], "op": "Az Európai Parlament delegációja kormányzati, ellenzéki, igazságügyi és civil szereplőkkel is tárgyal, és ennek a nyitottságnak van értelme. A 7. cikk szerinti eljárás jelentése attól lesz hiteles, hogy minden oldalt meghallgat."}, {"id": "eub-ugyved", "img": "https://assets.telex.hu/images/20261022/1792659477-temp-f75ih6b2hebmeilcpil_facebook.jpg", "imgs": "Telex", "r": "Külföld", "c": "Jogállam", "st": "Megerősített", "time": "okt. 22.", "t": "Az Európai Unió Bírósága: Magyarország megsértette az uniós jogot, amikor ügyvéd nélkül is kihallgathatott gyanúsítottakat", "s": "A luxembourgi bíróság a magyar és a cseh szabályozást is jogsértőnek találta.", "p": ["Az Európai Unió Bírósága csütörtökön elmarasztalta Magyarországot és Csehországot az Európai Bizottság kötelezettségszegési eljárásában. A magyar szabályok szerint a gyanúsított kihallgatása akkor is megtartható, ha a védője a megszabott határidőn belül nem jelenik meg.", "A bíróság szerint ez ellentétes a büntetőeljárásbeli jogi segítséghez való hozzáférést garantáló uniós irányelvvel. A cikk szankciókat vagy a jogszabály módosítására vonatkozó határidőt nem említ."], "cav": "Az MTI-beszámolóra támaszkodó cikk csak a jogsértés megállapítását közli.", "src": [["Telex: az uniós bíróság döntése", "https://telex.hu/belfold/2026/10/22/europai-unio-birosag-magyarorszag-unios-jogsertes-kihallgatas-ugyvedi-jelenlet"]], "op": "Az ügyvédhez való jog nem technikai részlet, hanem a tisztességes eljárás alapja. Az, hogy az uniós bíróság elmarasztalta Magyarországot, az elmúlt évek jogalkotásának újabb figyelmeztetése, a javítás pedig most már a jelenlegi kormány dolga."}, {"id": "szerb-valasztas", "r": "Külföld", "c": "Választás", "st": "Jelentett", "time": "okt. 20.", "t": "Vasárnap szerbiai választás: kis előnyben az Egyetemista lista egy felmérés szerint", "s": "Az NSPM felmérésében az Egyetemista lista 44,5, a Vučić-lista 42,7 százalékon áll.", "p": ["Szerbiában október 25-én tartanak parlamenti választást. Az NSPM őszi, telefonos felmérése, amelyet szeptember végén és október elején 1050 válaszadó körében végeztek, szerint a pártot választók körében az Egyetemista lista 44,5, a Vučić vezette lista 42,7 százalékon áll. Az SPS, az Európai Szerbia koalíció és a Hiteles Jobboldal listája a 3 százalékos küszöb alatt maradna. A megkérdezettek 18,3 százaléka bizonytalan volt vagy nem válaszolt.", "A válaszadók 79,8 százaléka mondta, hogy biztosan elmegy szavazni, 13,3 százalék valószínűleg. Az embereknek 44 százaléka szerint a diák- és ellenzéki győzelem lenne a legjobb Szerbiának, 22,5 százalék a jelenlegi kormány változatlan maradását támogatná. Egy hipotetikus uniós tagsági népszavazáson 41,3 százalék szavazna igennel, 39,6 százalék nemmel.", "A Telex október 20-i cikke szerint a szerb ellenzék a választási csalásokat megakadályozó magyar tapasztalatokat is felhasználná Vučić legyőzésére."], "cav": "Egyetlen felmérésről van szó, amelynek hibahatárát a forrás nem közli, a végeredmény ettől jelentősen eltérhet. A forrás nem említi a vajdasági magyar pártot.", "src": [["SZMSZ: közvélemény-kutatás a szerbiai választás előtt", "https://szmsz.press/2026/10/20/kozvelemeny-kutatas-kozel-80-szazalekos-valasztasi-reszvetel-az-egyetemista-lista-vezet-vucicek-elott/"], ["Telex: a szerb ellenzék és a magyar tapasztalatok", "https://telex.hu/kulfold/2026/10/20/szerbia-valasztas-vajdasag-megfigyelok-de-vmu-crta"]], "op": "Egyetlen felmérés nem jósol meg egy választást, a 44,5 és a 42,7 százalék közti különbség pedig a hibahatáron belül lehet. A cikk a választás előtt készült: azóta a HVG fotója a Diákok Listája támogatóinak ünneplését mutatja, a legfrissebb szerbiai cikkeinkben többet olvashatsz az eredményről."}, {"id": "vance-orban", "img": "https://assets.telex.hu/images/20261021/1792607670-temp-aibotb6topg00hlbjom_facebook.jpg", "imgs": "Telex", "r": "Külföld", "c": "Diplomácia", "st": "Jelentett", "time": "okt. 21.", "t": "Vance: soha többé nem fog nyilvánosan külföldi politikust támogatni", "s": "Az amerikai alelnök szerint az Orbán Viktor melletti áprilisi kiállása „nem sült el túl jól”.", "p": ["J. D. Vance amerikai alelnök szerdai sajtótájékoztatóján arra a kérdésre, hogy miért nem támogatja nyilvánosan Benjamin Netanjahut az október 27-i izraeli választás előtt, ahogy Donald Trump tette, azt mondta: egész életében egyetlen külföldi politikust támogatott nyilvánosan, Orbán Viktort. Hozzátette, hogy nagy csodálója Orbán miniszterelnök úrnak, de ez „nem sült el túl jól”, és soha többé nem támogat külföldi jelöltet nyilvánosan.", "Vance áprilisban Budapesten kampányolt Orbán mellett, néhány nappal a parlamenti választás előtt a Karmelitában magabiztosan jósolta meg a győzelmét. Mostani szavai szerint a november 3-i amerikai félidős választásokra akar koncentrálni."], "cav": "A szöveg a Telex fordítása és összefoglalója alapján készült.", "src": [["Telex: Vance és Orbán Viktor támogatása", "https://telex.hu/kulfold/2026/10/21/jd-vance-orban-viktor-tamogatas"]], "op": "Ha az amerikai alelnök maga mondja, hogy az Orbán melletti kiállás „nem sült el jól”, az sokat elárul arról, mennyire kockázatos külföldi politikusok mellé állni. Aki egy másik ország választásába beleszól, annak a vereség árát is el kell viselnie."}, {"id": "gyogyszerhiany", "img": "https://assets.telex.hu/images/20261021/1792594406-temp-i800qt8cm6difeipmln_hero-full:xl.jpg", "cred": "Gyógyszertár jele Budapesten, a kép illusztráció. Fotó: G7", "imgs": "Telex", "r": "Közélet", "c": "Egészség", "st": "Jelentett", "time": "okt. 22.", "t": "Gyógyszerhiány: 5–10 ezer krónikus beteget érint a hasnyálmirigy-enzimpótló hiánya", "s": "A gyártó szerint a hiány 2027 első feléig tarthat, az NNGYK importtal enyhítene.", "p": ["A Telex G7 cikke szerint Magyarországon hiány van a hasnyálmirigy-enzimpótló fő készítményéből (a lap a hirdetési szabályok miatt nem nevezi meg a márkát), és a fő helyettesítője is hiánycikk lett, amely szeptember közepétől hivatalosan is szerepel a listán, de a gyógyszertárakban hónapokkal korábban is alig lehetett kapni.", "A gyártó februárban azt közölte az NNGYK-val, hogy a hatóanyaggyártás problémái okozzák a hiányt, amely várhatóan 2027 első feléig tart. Az érintettek: a exokrin hasnyálmirigy-elégtelenséggel, krónikus hasnyálmirigy-gyulladással, cisztás fibrózissal és más emésztési betegséggel élők. A cikk becslése szerint 5–10 ezer krónikus beteget érint közvetlenül és súlyosan. Táplálék nélkül az emésztés nehezített lehet, ennek súlyos rövid távú következményei lehetnek.", "Szeptemberben az NNGYK 3000 doboz készítményt hozott be Lettországból és 30 000 doboz másik változatot Szlovákiából. A betegszervezetek szerint a lett szállítmány átlagos igény mellett 3000 betegnek csak öt napra elég. A Mezym Forte a legjobb vény nélküli alternatíva, de a leginkább szükséges hatáserősségben nem kapható Magyarországon. A nyugat-európai importtermékek drágák és nem támogatottak.", "Az NNGYK közlése szerint együttműködik a forgalombahozatali engedély jogosultjával és a nagykereskedőkkel, hogy a rendelkezésre álló készletet a magyar betegekhez irányítsák, de a piaci folyamatokba csak hatáskörének keretei között avatkozhat be, szükség esetén piacfelügyeleti eljárást indíthat."], "cav": "Az érintettek számát a cikk becsléseként közöljük, hivatalos adat nem szerepel a forrásban.", "src": [["Telex G7: gyógyszerhiány, hasnyálmirigy-enzimpótlók", "https://telex.hu/g7/elet/2026/10/22/gyogyszer-hiany-hasanyalmirigy-betegek-enzimpotlok-nngyk"]], "op": "Egy krónikus beteg számára a gyógyszerhiány nem statisztika, hanem mindennapi bizonytalanság. A gyártó 2027 első feléig tartó hiányról beszél, az importmegoldás pedig csak akkor ér valamit, ha a betegek valóban hozzájutnak a készítményhez."}, {"id": "var-airbnb", "r": "Közélet", "c": "Lakhatás", "st": "Jelentett", "time": "okt. 22.", "t": "A Várnegyedben 2028-tól betilthatják az Airbnb-t, kész a rendelettervezet", "s": "A budai I. kerület tervezete szerint a Várban teljesen megszűnne a rövid távú lakáskiadás.", "p": ["Az I. kerületi önkormányzat rendelettervezete szerint a budai Várnegyedben 2028. január 1-jétől teljesen megszűnne a rövid távú lakáskiadás. A kerület többi részén a társasházakban lévő szálláshelyek 2028-tól csak a ház hozzájárulásával működhetnének tovább. A tervezet szigorúbb ellenőrzéseket és magasabb bírságokat is tartalmaz.", "A tervezet 15 napig társadalmi egyeztetésen van, a testület várhatóan novemberben szavaz a végleges szabályokról. A kerület szeptemberi lakossági szavazásán a mintegy 24 ezres népességből 4053-an vettek részt, 58,6 százalékuk támogatta a teljes tiltást, 41,4 százalék ellenezte (ebből 18 százalék feltételekkel, 23,4 százalék korlátozás nélkül). A Várnegyedben a tiltás támogatottsága 66 százalék fölött volt. A kerületben több mint 400 engedélyezett magánszálláshely és hasonló rövid távú lakáskiadás működik.", "A VI. kerület (Terézváros) volt az első, amely korlátozta a rövid távú lakáskiadást: egy 2024-es helyi népszavazás után 2026. január 1-jétől betiltotta."], "cav": "", "src": [["Telex: az I. kerület betilthatja az Airbnb-t", "https://telex.hu/belfold/2026/10/22/az-i-kerulet-is-betilthatja-az-airbnb-t-elkeszult-a-rendelet-tervezete"]], "op": "A Várnegyed lakóinak joga a nyugalomhoz legalább annyira fontos, mint a turizmus. A teljes tiltás radikális, de a többi szigorítás, a társasház hozzájárulása és a magasabb bírságok, a józan irányba mutat."}, {"id": "allami-kituntetesek", "img": "https://assets.telex.hu/images/20261021/1792593867-temp-k9f3gm0cpcvgenjafmp_cikktorzs:xl.jpg", "cred": "Fotó: Illyés Tibor / MTVA", "imgs": "Telex", "r": "Kultúra", "c": "Kitüntetés", "st": "Megerősített", "time": "okt. 21.", "t": "Krasznahorkai László, Schiff András és Kende Péter a Magyar Érdemrend nagykeresztjét kapta", "s": "Az október 23-i állami kitüntetések között Enyedi Ildikó, Závada Pál és Mészáros Márta is szerepel.", "p": ["Október 23. alkalmából a Magyar Érdemrend polgári tagozatának kitüntetéseit adták át. A nagykeresztet Krasznahorkai László Nobel-díjas író, Schiff András zongoraművész és Kende Péter politológus kapta. A parancsnoki keresztet a csillaggal Mészáros Márta filmrendező és Oravecz Imre költő, író vehette át.", "A parancsnoki kereszt kitüntetettjei: Enyedi Ildikó filmrendező, Závada Pál író, Kéri László politológus, Jeszenszky Géza volt külügyminiszter, Báldi András ökológus és Verrasztó Zoltán olimpiai érmes úszó és edző. Az 1956-os szolgálatért Lázár Gyula és Süle Tamás kapott parancsnoki keresztet, akik a forradalom idején pécsi orvostanhallgatóként az egyetemi nemzetőr-zászlóalj tagjai voltak.", "A Parlamentben szerdán kapta meg a kitüntetést Krasznahorkai László, Závada Pál és Enyedi Ildikó."], "cav": "A cikk nem közli, ki adta át a kitüntetéseket.", "src": [["Telex: állami kitüntetések október 23. alkalmából", "https://telex.hu/karakter/kultura/2026/10/21/krasznahorkai-laszlo-zavada-pal-enyedi-ildiko-allami-kituntetes"], ["Telex: október 23-i programok", "https://telex.hu/belfold/2026/10/23/oktober-23-56-os-forradalom-allami-unnepsegek-magyar-peter-tisza-part-fidesz-zaszlomenet-mi-hazank"]], "op": "A kitüntetettek névsora arról is szól, kit tekint az állam és a kulturális közösség közös értéknek. Krasznahorkai László Nobel-díjas író elismerése magától értetődő, az pedig jó, hogy a lista szerteágazó életpályákat és alkotókat jutalmaz."}, {"id": "gauguin-szepmuveszeti", "img": "https://assets.telex.hu/images/20261022/1792671113-temp-c19q7g04hla81ckekpd_hero-normal:xl.jpg", "cred": "Paul Gauguin Fiatal lány arcképe – Vaïte (Jeanne) Goupil című festményének kicsomagolása a Szépművészeti Múzeumban. Fotó: Déry Ágoston / Szépművészeti Múzeum", "imgs": "Telex", "r": "Kultúra", "c": "Képzőművészet", "st": "Megerősített", "time": "okt. 22.", "t": "Gauguin-kiállítás nyílik a Szépművészeti Múzeumban október 30-án", "s": "A Bonjour Monsieur Gauguin 1896-os arcképét a koppenhágai Ordrupgaard Múzeum kölcsönzi.", "p": ["A Szépművészeti Múzeum „Bonjour Monsieur Gauguin – A posztimpresszionisták és szimbolisták körei” című kiállítása október 30-án nyílik, és 2027 februárjának végéig látható.", "A Telex a tárlat egyik kulcsművét mutatta be: Paul Gauguin 1896-ban festett olajfestményét, a „Fiatal lány arcképe – Vaïte (Jeanne) Goupil” című, 75 × 65 cm-es vásznat, amelyet a Koppenhága melletti Ordrupgaard Múzeum kölcsönöz."], "cav": "", "src": [["Telex: Gauguin-kiállítás, Szépművészeti Múzeum", "https://telex.hu/karakter/kultura/2026/10/22/gauguin-kiallitas-szepmuveszeti-muzeum-kicsomagolas"]], "op": "Egy jó kiállítás az ünnepi hetek után is jólesik a közönségnek. A koppenhágai kölcsönmű külön ízt ad a tárlatnak, érdemes időben jegyet venni, hogy a tavaszi hajrában ne maradjunk le."}, {"id": "tom-skerritt", "img": "https://assets.telex.hu/images/20261022/1792701294-temp-bm65omp817k15hehkon_hero-normal:xl.jpg", "cred": "Tom Skerritt 2014-ben. Fotó: Mat Hayward / Getty Images", "imgs": "Telex", "r": "Kultúra", "c": "Film", "st": "Jelentett", "time": "okt. 22.", "t": "Meghalt Tom Skerritt, az Alien és a Top Gun színésze", "s": "A Telex szerint 93 éves korában hunyt el.", "p": ["A Telex október 22-i beszámolója szerint meghalt Tom Skerritt amerikai színész, aki az Alien – A nyolcadik utas: a Halál és a Top Gun című filmekben nyújtott alakításáról ismert. 93 éves volt.", "Más részletet, például a halál okát vagy helyszínét, a Telex főoldali ajánlója nem közöl."], "cav": "A hír a Telex címlapi ajánlóján alapul, a teljes cikket nem olvastuk.", "src": [["Telex: Tom Skerritt meghalt 93 évesen", "https://telex.hu/after/2026/10/22/tom-skerritt-meghalt-93-evesen-alien-top-gun"]], "op": "Tom Skerritt azok közé a színészek közé tartozott, akiket sok filmből ismerünk, és hitelesen jelent meg mindenhol. 93 évesen hunyt el, tisztelettel emlékezünk rá."}, {"id": "bem-ter-beszed", "r": "Belpolitika", "c": "Ünnep", "w": "Október 23.", "st": "Megerősített", "time": "okt. 22.", "t": "Magyar Péter a Bem téren: „hetven éves adósságot törlesztünk”, 1956-os múzeum készül", "s": "A miniszterelnök csütörtök este a Műegyetemtől gyalog érkezett a térre, és bejelentette a „magyar szabadság méltó szentélyét”.", "p": ["Magyar Péter miniszterelnök csütörtökön a budapesti Bem József téren mondott ünnepi beszédet az 1956-os forradalom évfordulója alkalmából. A Műegyetemtől a Bem rakparton gyalog érkezett a térre. A Telex hangsúlyozza, hogy a forradalom budapesti eseményei hetven éve a műegyetemi diákgyűlésekkel indultak.", "A beszédben azt mondta, hogy az ország hetven éves adósságot törleszt, és vállalta, hogy a következő években létrehozzák a „magyar szabadság méltó szentélyét”, vagyis egy önálló 1956-os múzeumot. Méltatta a lengyel–magyar barátságot is, felidézve a poznańi gyári munkások 1956-os támogatását és a magyarok lengyelekkel való szolidaritását azon az őszön.", "Az ünnepség végén mindenkit meghívott a pénteki, Kossuth téri állami megemlékezésre, a beszédet a szabad, valóban független Magyarország éltetésével zárta."], "cav": "Az Index blogja fáklyás menetről ír, a Telex beszámolója viszont gyaloglásról, fáklyát nem említ.", "src": [["Telex: Magyar Péter október 23-i beszéde a Bem téren", "https://telex.hu/belfold/2026/10/22/magyar-peter-oktober-23-1956-beszed"], ["Index: percről percre október 23-án", "https://index.hu/belfold/2026/10/22/oktober-23-megemlekezes-1956-os-forradalom-es-szabadsagharc-evfordulo-tisza-part-magyar-peter-fidesz-mi-hazank-mozgalom/"]], "op": "A hetven éves adósság törlesztésének emlegetése szép mondat, az 1956-os múzeum pedig valódi, kézzelfogható ígéret. Az emlékezetpolitikában az igazi próba az, hogy a bejelentett intézmény valóban megépül-e, és mindenki számára nyitva áll-e."}, {"id": "laar-velemeny", "r": "Külföld", "c": "Vélemény", "w": "Október 23.", "st": "Jelentett", "time": "okt. 22.", "t": "Mart Laar: 1956 az észtek számára is a remény és a csalódás története volt", "s": "Észtország volt miniszterelnöke a Telexen írt arról, hogyan hatott a magyar forradalom a szovjet megszállás alatt élő észtekre.", "p": ["Mart Laar, Észtország volt miniszterelnöke véleménycikkében felidézi, hogy 1993-ban Antall József meghívására Budapestre látogatott, és koszorút helyezett el az 1956-os mártírok sírjánál az Új köztemetőben. Szerinte az észtek mindig is magukénak érezték a magyarok szabadságvágyát, részben Petőfi költészetén keresztül, amelyet Ellen Niit fordított észtre.", "A cikk összefoglalja az 1956-hoz vezető folyamatot: Berija korai reformjait, Nagy Imre 1953-as hatalomra kerülését, az osztrák államszerződést, a Varsói Szerződés megalakulását és Hruscsov 1956-os Sztálin-ellenes beszédét. Laar megemlíti, hogy a forradalomban nagyjából 180 ezer magyar menekült nyugatra, több mint 2500 ember halt meg és mintegy 13 ezren sebesültek meg, mintegy 22 ezer embert ítéltek el és nagyjából 350-et kivégeztek, köztük Nagy Imrét.", "Az észtekre gyakorolt hatásról azt írja, hogy sokan eleinte azt hitték, a szovjet uralom vége közel van. Tartuban, Pärnuban és Lihulában diákcsoportok titkos ellenállási hálózatokat szerveztek. Enn Uibo költőt, aki verset írt a hősi magyar harcosok emlékére, bebörtönözték, és 1965-ben munkatáborban halt meg. A Nyugat tétlensége szerinte csalódottságot és passzív beletörődést váltott ki Észtországban.", "Laar szerint az 1989-es újratemetés (mintegy 250 ezer résztvevővel) és Nagy Imre rehabilitációja azt mutatta, hogy a vereségben már benne volt a későbbi győzelem magja. A kitartásra és az emlékezet továbbadására buzdít."], "cav": "Véleménycikk, a szerző álláspontját közöljük, nem a Telex szerkesztőségi álláspontját.", "src": [["Telex: Mart Laar véleménycikke", "https://telex.hu/velemeny/2026/10/22/mart-laar-esztorszag-miniszterelnok-1956-forradalom-szabadsagharc-oktober-23-szovjetunio-antall-jozsef"]], "op": "Mart Laar írása azért érdekes, mert kívülről, egy hasonló sorsot átélt ország tapasztalatából látja 1956-ot. Az észt–magyar kapcsolat nem csak történelem: a szabadságvágy közös nyelve ma is érthető."}, {"id": "56-perc-szabadsag", "r": "Kultúra", "c": "Rádiójáték", "w": "Október 23.", "st": "Jelentett", "time": "okt. 22.", "t": "„56 perc szabadság”: négy női hangra írt hangjáték a forradalom budapesti napjairól", "s": "A Telex október 23. és 25. között közli a részeket, a készítők a forradalom női szereplőiről és a fekete humorról beszéltek.", "p": ["A „56 perc szabadság” dokumentarista hangjáték, amelyet Vágvölgyi B. András író-rendező és Eörsi László történész készített. A Telex október 23. és 25. között mutatja be online a részeit. Vass Norbert interjút készített az alkotókkal.", "A mű négy női hangra épül, és az 1956-os budapesti eseményeket követi. Tóth Ilonka kitalált szereplő a VIII. és IX. kerületben, a Bem téren, a Műegyetemen, a Rádiónál és a Corvin közben fordul meg, később a Péterfy Sándor utcai kórházban önkénteskedik. Az utolsó epizód kitalált szála azt sugallja, hogy a jugoszláv partizánmódszerek hatottak Ilonka csoportjára, amely árulónak tart egy ÁVO-s egyenruhás fényképen látott férfit.", "Az alkotók beszélnek a korabeli rádióadásokról (a Kossuth és a Szabad Európa), a nők szerepéről a felkelésben és a fekete humorról is, mint a harcok közbeni túlélési eszközről."], "cav": "", "src": [["Telex: 56 perc szabadság, interjú az alkotókkal", "https://telex.hu/karakter/kultura/2026/10/22/56-perc-szabadsag-1956-hangjatek-vagvolgyi-b-andras-eorsi-laszlo-interju"]], "op": "A női hangok és az akasztófahumor jó választás egy dokumentarista hangjátékhoz: az 1956-os történet gyakran a férfiak hőstetteire szűkül. Az ilyen feldolgozások a teljesebb képhez segítenek hozzá."}, {"id": "mbh-reszveny-uzlet", "r": "Gazdaság", "c": "Bűnügy", "w": "MNB-ügy", "st": "Jelentett", "time": "okt. 21.", "t": "Percek múltak azon, hogy 200 milliárd forint visszakerüljön a jegybanki alapítványokhoz", "s": "A Válasz Online dokumentumai szerint tavaly nyáron kudarcot vallott egy titkos MBH-részvénycsere.", "p": ["A Telex a Válasz Online dokumentumaira hivatkozva azt írja, hogy a Varga Mihály vezette új jegybanki vezetés 2025 nyarán titkos megállapodást készített elő a Matolcsy Ádámhoz köthető üzleti körrel. Ez mintegy 200 milliárd forintot hozott volna vissza az MNB alapítványi hálózatához: az alapítványok megszerezték volna az MBH Bank 12,4 százalékát az Ultima Capitalba fektetett, problémás svájci befektetésük fejében. Az MBH-részvények értéke mintegy 200 milliárd forint volt.", "A 23 százalékos MBH-részesedést a Quartz Befektetési Alapkezelőhöz kapcsolódó cégek tartották. A 2025. júniusi szerződéstervezet az MNB-alapítványi Alpine Holding Kft.-t, valamint a Quartz-körhöz tartozó Pinnacle Asset Groupot és a Hungary Apex Investments Zrt.-t nevezte meg. Száraz István is aláírta, Valkó Mihály, a Quartz vezetője aláírására várt. Az aláíráskor megjelent Sándor Tamás, Matolcsy Ádám korábbi cégjogásza, szóba állt Valkóval, aki ezután érvénytelenítette az iratokat. A tanúvallomás szerint az üzlet percek múlva hiúsult meg.", "Később Száraz majdnem teljesen kiszorult a Quartzból, Matolcsy Ádám közvetlen tulajdonos lett. A 23 százalékos csomagot állítólag egy Mészáros Lőrinchez köthető csoport vásárolta meg, az MBH-részvények mintegy 6,2 százaléka később ismét Matolcsy Ádám érdekeltségéhez került. Az alapítványoknál maradt az Ultima-befektetés, amelynek megtérülése bizonytalan.", "Háttérként: az Állami Számvevőszék 2025 márciusában szabálytalanságokat és jelentős vagyonvesztést talált a PADME alapítványnál. Az Optima Befektetési Zrt. kezelte a vagyont, a pénz nagy része kockázatos, Matolcsy Ádám köréhez köthető ingatlanbefektetésekbe került. A hatóságok 92 milliárd forintnyi vagyont foglaltak le, az MBH-részvényeket állítólag nem."], "cav": "Másodlagos beszámoló a Válasz Online dokumentumai, tanúvallomásai és forrásai alapján. A Telex a megjelenésig nem kapott választ az MNB-től és a Quartztól.", "src": [["Telex: 200 milliárd forint visszaszerzése hiúsult meg", "https://telex.hu/gazdasag/2026/10/21/mnb-mbh-bank-reszveny-matolcsy-adam-ugyved-meghiusul-visszaszerez"]], "op": "A cikk szerint a jegybanki vezetés is tárgyalt volna egy titkos, 200 milliárdos megállapodásról, ami önmagában kérdéseket vet fel: közpénzről szóló ügyletek nem születhetnek titokban. A forrás a Válasz Online dokumentuma, ezért a hivatalos reakciókat is meg kell várni."}, {"id": "mnb-vizsgalobizottsag", "r": "Belpolitika", "c": "Jogállam", "w": "MNB-ügy", "st": "Jelentett", "time": "okt. 22.", "t": "November 5-én akkor is meghallgatnák Matolcsy Györgyöt a vizsgálóbizottságban, ha őrizetben van", "s": "A bizottság szerint a volt jegybankelnököt akár kísérettel is el lehet hozni, az ügyészség azonban még nem döntött.", "p": ["Az MNB-ügyet vizsgáló parlamenti bizottság közölte, hogy a november 5-re tervezett meghallgatást megtartja Matolcsy György volt jegybankelnökkel, annak ellenére is, hogy az őrizetbe vették. Csőszi Attila, a bizottság Tisza-s elnöke szerint számítanak a megjelenésére, szükség esetén kísérettel, ha ezt a büntetőeljárás megengedi.", "A bizottság október 1-jén egyhangúlag megszavazta Matolcsy és Varga Mihály volt gazdasági miniszter meghallgatását. Azt is közölték, hogy meg akarják idézni Matolcsy fiát, Matolcsy Ádámot is.", "A Központi Nyomozó Főügyészség még nem döntötte el, hogy engedélyezi-e a meghallgatást, mert a bíróság a letartóztatásról még nem határozott. Nagy Attila ügyész általánosságban azt mondta, hogy a hatóság a törvény adta lehetőségek között mindenben együttműködik a bizottsággal. A meghallgatás formája és megtartása a bírósági döntéstől függ."], "cav": "A cikk csütörtökön, a letartóztatásról szóló pénteki bírósági döntés előtt jelent meg.", "src": [["Telex: vizsgálóbizottság és a KNYF engedélye", "https://telex.hu/belfold/2026/10/22/matolcsy-gyorgy-mnb-feltaro-bizottsag-knyf-engedely"]], "op": "Amikor egy parlamenti vizsgálóbizottság meghallgatásra hív egy őrizetben lévő volt jegybankelnököt, az a hatalmi ágak közti egyensúly próbája is. Az igazság kiderítése nem sérülhet a büntetőeljárás miatt, de fordítva sem szabad megtörténnie."}, {"id": "szemerey-neumann", "r": "Közélet", "c": "Egyetem", "w": "MNB-ügy", "st": "Jelentett", "time": "okt. 22.", "t": "Felmentették a munkavégzés alól Szemerey Szabolcsot, a kecskeméti egyetemi alapítvány stratégiai igazgatóját", "s": "A kecskeméti polgármester férje Matolcsy György másodunokatestvére, az alapítvány szerint az átvilágítás zavartalanságát szolgálja a döntés.", "p": ["A Neumann János Egyetemért Alapítvány kuratóriuma ideiglenesen mentesítette a munkavégzés alól Szemerey Szabolcsot, az alapítvány stratégiai igazgatóját. Szemerey Szemereyné Pataki Klaudia kecskeméti polgármester férje és Matolcsy György volt jegybankelnök másodunokatestvére. A Kecsup szerint sokan befolyásosnak tartották az egyetemen, de sem a kuratóriumnak, sem a felügyelőbizottságnak nem volt tagja.", "Az alapítvány közleménye szerint az intézkedés az alapítvány korábbi működésével kapcsolatos egyes körülmények elfogulatlan és zavartalan felülvizsgálatát szolgálja, a működés közben zavartalan.", "Az alapítvány az MNB-ügyhöz kapcsolódik, Matolcsy Györgyöt október 21-én vették őrizetbe. Szemerey korábban a Kecskeméti Duális Oktatás Zrt. (KEDO) vezetője volt, 2020-ban érdekösszeütközés miatt lemondott, mert felesége a KEDO-t fenntartó alapítvány felügyelőbizottságába került. A MOME kuratóriumának is tagja volt, amelynek korábbi tagjai áprilisban mind távoztak."], "cav": "A Kecsup megkereste Szemereyt, de a cikk megjelenéséig nem válaszolt.", "src": [["Telex: Szemerey Szabolcs felmentése", "https://telex.hu/belfold/2026/10/22/kecskemeny-neumann-janos-egyetem-alapitvany-szemerey-szabolcs-felmentes"]], "op": "Az átvilágítás zavartalansága miatt hozott döntés önmagában helyes, és azt mutatja, hogy az egyetemi alapítványoknál is elindult a számonkérés. A rokonsági kapcsolat nem bűn, de az átláthatóság elvárható minden olyan intézménytől, amely közfeladatot lát el."}, {"id": "kozmedia-megtakaritas", "r": "Gazdaság", "c": "Költségvetés", "st": "Megerősített", "time": "okt. 21.", "t": "61,3 milliárd forinttal csökken a közmédia támogatása, 93,4 milliárd marad", "s": "A megtakarításnak mintegy hat százaléka a közmédiából jön, a támogatás nominálisan a 2015-ös szintre esik vissza.", "p": ["A Telex G7 szerint a kormány a 2027-es költségvetésben 1465 milliárd forinttal csökkenti az állami kiadásokat. Ebből mintegy 447 milliárd általános megtakarítás, 1018 milliárd pedig főleg a NER-korszak működésével összefüggő költségek racionalizálásából jön. Kármán András pénzügyminiszter elmondta, hogy a közmédia állami támogatása 61,3 milliárd forinttal csökken, ez az 1018 milliárdos kategória mintegy hat százaléka.", "A központi költségvetési támogatás a közmédiának jövőre 93,4 milliárd forint lesz, nominálisan a 2015-ös költségvetés szintjén. Magyar Péter a csökkentést a túlárazott szerződésekkel, a párhuzamos feladatellátással és a felesleges működési költségekkel indokolta. A kormány 2027-re 4,9 százalékos hiánycélt tűzött ki, 2030-ra 3 százalék alá akarja vinni.", "A cikk szerint az MTVA költségvetése a NER-években 30-ról 155 milliárd forintra nőtt, a közmédia finanszírozása nagyjából ötszörösére emelkedett, míg az árak hozzávetőleg megduplázódtak. A kormány júliusban ideiglenes vezetést nevezett ki jogi és gazdasági átvilágításra, amely az első két hétben mintegy 7 milliárd forint megtakarításról számolt be. Augusztus végén feljelentést tett az MTVA politikai felügyelete miatt, októberben újabbat 2 milliárd forint hiányzó vagyon miatt. Egy júliusban kötött, hatmilliárdos egyéves focijogi szerződés szakértők szerint akár a valós érték kétszerese is lehet, de még így is nagyjából fele a korábbi éveknek."], "cav": "A 2027-es hiánycélt a Telex G7 4,9 százalékban adja meg, ami eltér a 2027-es költségvetésről szóló más beszámolók számaitól (ott 2028-ra 4 százalék szerepel). A különbség a források eltérő számításából adódhat.", "src": [["Telex G7: a közmédia a költségvetésben", "https://telex.hu/g7/kozelet/2026/10/21/koltsegvetes-kozmedia-mtva-tularazas-nertelenites"]], "op": "A közmédia támogatásának 61 milliárdos csökkentése azt jelzi, hogy a kormány a NER-korszak működését racionalizálja. A közmédia független működésének biztosítása viszont a költségvetési döntésnél is fontosabb kérdés."}, {"id": "munkanelkuliseg-ksh", "r": "Gazdaság", "c": "Munkaerőpiac", "st": "Megerősített", "time": "okt. 22.", "t": "Egyszerre nő a foglalkoztatás és a munkanélküliség: 4,6 százalék volt a ráta szeptemberben", "s": "A KSH adatai szerint 224 ezer munkanélküli volt, a Telex szerint ennek oka a több aktív álláskereső.", "p": ["A KSH szeptemberi adatai szerint a 15–74 évesek átlagos foglalkoztatotti létszáma 4 millió 661 ezer volt, június óta harmadik hónapja nő. A foglalkoztatási ráta 65,4-ről 65,8 százalékra emelkedett. Ugyanakkor a munkanélküliek száma 214 ezerről 224 ezerre, a munkanélküliségi ráta 4,4-ről 4,6 százalékra nőtt, amit a cikk három éve legmagasabbnak nevez. A munkanélküliség 2022 közepe óta emelkedik.", "A Telex szerint a két mutató együttes emelkedésének fő oka, hogy többen kezdtek aktívan munkát keresni, ezért munkanélkülinek számítanak. Ezt az igazolja, hogy az aktivitási ráta az év eleje óta folyamatosan nő, és a betöltetlen állások száma is emelkedett.", "Az Eurostat 2026 második negyedévi adatai szerint a 20–64 évesek magyar foglalkoztatási rátája 81 százalék volt, az EU nyolcadik legmagasabb értéke, a munkanélküliségi ráta 4,5 százalék, a kilencedik legalacsonyabb, az uniós átlag 6,1 százalék. Orbán Viktor azt állította, hogy véget ért a teljes foglalkoztatás, Kapitány István gazdasági és energiaügyi miniszter szerint júniusban az autóiparban mintegy 14 százalékkal többen dolgoztak, mint egy évvel korábban. A GKI foglalkoztatási indikátora októberben nagyjából változatlan maradt (−4,2, szemben az áprilisi −4,5-tel), a cégek még mindig kissé több leépítést terveznek, mint felvételt."], "cav": "Az aktív álláskeresők számának emelkedése a Telex értelmezése, a KSH adatai alapján.", "src": [["Telex G7: munkanélküliség és foglalkoztatás", "https://telex.hu/g7/adat/2026/10/22/munkanelkuliseg-foglalkoztatottsag-statisztika-munkaeropiac"]], "op": "Egyszerre nő a foglalkoztatás és a munkanélküliség: ez nem feltétlenül ellentmondás, ha a Telex szerint több ember kezd aktívan munkát keresni. A 4,6 százalékos ráta még mindig alacsony, de az emelkedés óvatosságra int."}, {"id": "nav-adotartozok", "r": "Gazdaság", "c": "Adó", "st": "Megerősített", "time": "okt. 21.", "t": "25 cég tartozik 100 millió forint fölött a NAV-nak, köztük egy ralicsapat és egy Volán-jegyellenőr", "s": "Az adóhiány meghaladja a 8 milliárd forintot, a büntetésekkel és pótlékokkal együtt több mint 18 milliárd.", "p": ["A NAV harmadik negyedéves listáján 25 cég szerepel 100 millió forint fölötti adótartozással. A hiány mintegy 8 milliárd forint, ehhez adóbírságok, késedelmi pótlékok és eljárási bírságok jönnek, így az összes követelés meghaladja a 18 milliárd forintot. A Telex szerint a cégek többségének valószínűleg nincs vagyona, így a behajtás kétséges.", "Az első helyen a Cult of Trade Kft. áll 2,4 milliárd forintos adóhiánnyal és további 2,3 milliárd forintnyi egyéb NAV-tartozással, székhelyszolgáltatónál bejegyezve. A Hórusz-Global Kft. takarítással foglalkozott, és a Volánbusz bérlet- és jegyellenőrzését is végezte Komárom-Esztergom és Fejér megyében, a cég gyakorlatilag összeomlott, a NAV 400 millió forintnál is többet akar behajtani. Az Andrew Motorsport Kft. egykori ralicsapat 232 millió forint adóhiánnyal és további 154 millió forintnyi NAV-követeléssel, egy bíróság nemrég megszűntnek nyilvánította, és kényszertörlési eljárást rendelt el.", "A listán sok cég székhelyszolgáltatónál van bejegyezve, ahol egy címen több száz vagy ezer cég is lehet, ami nehezíti a felkutatásukat."], "cav": "A Telex nem érte el a Hórusz-Globalt (az e-mail-címe inaktív), az Andrew Motorsport a megjelenésig nem válaszolt.", "src": [["Telex G7: adótartozói lista", "https://telex.hu/g7/vallalat/2026/10/21/adohiany-milliard-rali-volan"]], "op": "Huszonöt cég több mint nyolcmilliárd forinttal tartozik az államnak, és a legtöbbnél nincs mit behajtani. Egy ilyen lista nyilvánossága azért fontos, mert megmutatja, mennyire hatékony az adóbehajtás."}, {"id": "zuglo-kartell", "r": "Közélet", "c": "Önkormányzat", "st": "Jelentett", "time": "okt. 22.", "t": "Kartellgyanú miatt a GVH-hoz fordult Zugló polgármestere a fagondozási tenderek miatt", "s": "Mind az öt ajánlat ugyanattól a hat cégtől érkezett, a budapesti fakivágási és gondozási tendereken azóta mindig valamelyikük nyert.", "p": ["Rózsa András zuglói polgármester Facebook-bejegyzésében közölte, hogy feljelentést tett a Gazdasági Versenyhivatalnál a zöldterület-fenntartó cégek körében feltételezett kartellezés miatt. A Zuglói Zrt. egyéves fagondozási tendert írt ki, mind az öt ajánlat ugyanattól a hat cégtől érkezett. Ez a hat cég 2024 vége óta több mint egy tucat budapesti önkormányzati fagondozási tenderen indult, és minden alkalommal valamelyikük nyert. Az első két helyezett ajánlattevő között tulajdonosi kapcsolat van.", "A polgármester szerint az eljárás nem vetett fel kérdést a nyertes szakmai alkalmasságáról, a tulajdonosi kapcsolat azonban összejátszás gyanúját keltheti. Ha az az önkormányzat tudta nélkül történt, a zuglói lakók fizethetik meg az árát. Azt, hogy kartellezés történt-e, csak a GVH tudja megállapítani.", "A közbeszerzési törvény szerint a legjobb ajánlattevővel kell szerződni, ha pedig a nyertest kizárnák, a második helyezett következne, aki a polgármester szerint ugyanabból a körből kerülne ki. Nem akarja eredménytelennek nyilvánítani az eljárást, mert az mintegy hat hónapot csúsztatna a fagondozási munkákon."], "cav": "A cikk nem közöl szerződéses értékeket, és nem nevezi meg a hat céget.", "src": [["Telex: kartellgyanú Zuglóban", "https://telex.hu/belfold/2026/10/22/gazdasagi-versenyhivatalnal-kartellezes-gyanuja-zoldterulet-fenntarto-cegek-zuglo-rozsa-andras"]], "op": "A kartellezés gyanúja a közpénz felhasználásában a legkárosabb visszaélések közé tartozik. Az, hogy a zuglói polgármester a GVH-hoz fordult, példa a határozott fellépésre, de a végén a hatóság bizonyítékai döntenek."}, {"id": "gruevszki-budapest", "r": "Belpolitika", "c": "Diplomácia", "st": "Jelentett", "time": "okt. 22.", "t": "Hadházy: Budapesten fotózták a körözött volt észak-macedón miniszterelnököt, Gruevszkit", "s": "A képviselő a kormánytól a menekültstátusz visszavonását kéri.", "p": ["Hadházy Ákos Facebook-bejegyzésében azt írta, hogy Nikola Gruevszki volt észak-macedón miniszterelnököt egy belvárosi budapesti étteremben fényképezte le egy magyar állampolgár. Gruevszkit Észak-Macedóniában korrupció miatt tíz év börtönre ítélték, az ítélet jogerős, nemzetközi elfogatóparancs van ellene. 2018-ban Magyarországra menekült és politikai menedékjogot kapott, Hadházy szerint magyar diplomaták segítettek a kijutásában.", "Hadházy azt kéri az új kormánytól, hogy vonja vissza a menekültstátuszt, hogy hazatérhessen és letölthesse a büntetését. Gruevszkit Orbán Viktor és Szijjártó Péter közeli szövetségesének nevezte, megemlítve Szíjj László vállalkozót is, aki egy észak-macedóniai autópálya-építésben érdekelt.", "A Telex idézi Magyar Péter áprilisi, a választás utáni szavait, hogy felülvizsgálják Gruevszki és több korábbi lengyel miniszter menedékjogát. Hoffmann Tamás nemzetközi jogász szerint a menedékjog visszavonható, ha az érintett valójában nem fenyegeti politikai üldöztetés, de ez önmagában nem vezet kiadatáshoz. Észak-Macedónia nem újította meg korábbi kiadatási kérelmét, ahhoz új kérelem vagy érvényes nemzetközi elfogatóparancs kellene."], "cav": "A cikk nem tartalmaz hivatalos választ a magyar kormánytól, az észak-macedón hatóságoktól vagy Gruevszkitól.", "src": [["Telex: Hadházy Ákos és Gruevszki", "https://telex.hu/belfold/2026/10/22/hadhazy-akos-budapesti-etterem-volt-eszakmacedon-miniszterelnok-gruevszki"]], "op": "Egy jogerősen elítélt, nemzetközi elfogatóparancs alatt álló egykori kormányfő budapesti jelenléte kínos kérdés a kormánynak. A menekültstátusz felülvizsgálatáról a hatóságoknak kell dönteniük, a kormánynak pedig illik válaszolnia."}, {"id": "esztergom-strand", "r": "Közélet", "c": "Önkormányzat", "st": "Megerősített", "time": "okt. 22.", "t": "Bezárt a 110 éves esztergomi Szent István Strandfürdő, a polgármester 2028 tavaszára tervez felújítást", "s": "A kormányhivatal fertőtlenítési szabálytalanságok miatt október 9-én azonnali hatállyal bezáratta a fürdőt.", "p": ["A Komárom-Esztergom Vármegyei Kormányhivatal 2026. október 9-én azonnali hatállyal bezáratta az esztergomi, 110 éves, védett Szent István Strandfürdőt. A hivatal szeptemberben indított eljárást a fertőtlenítés miatt, és megállapította, hogy a fürdő engedélyezett technológiai szabályzat nélkül adagolt fertőtlenítőszert. A takarítás utáni vízmintában aktív klór mutatkozott, a szabályozás a medencék vízforgató rendszerére épül, ami hiányzik. A hivatal szerint a zárást nem közvetlenül a késedelmes korszerűsítés okozta, de a problémák egymásra épültek.", "Október 21-én közel kétórás lakossági fórumot tartottak a városháza dísztermében. A fórumot Hernádi Ádám (Fidesz–KDNP) polgármester hívta össze, Bádi Gábor, a Szeretgom Egyesület kezdeményezésére. A polgármester szerint a városnak nincs pénze, 2026-ban több mint 2,66 milliárd forint szolidaritási hozzájárulást fizet, a 2020 előtt ígért állami támogatást pedig a 2022-es választás után visszavonták. Nem fellebbeznek, a 2028 tavaszára tervezett felújításra összpontosítanak, a lényegest tartva előbbre a látványosságnál. Az első a 1927-es 50 méteres medence, az 1912-es 20 méteres medence 2022 óta zárva van. A sportegyesületek az Aquasziget és a párkányi, illetve dorogi medencéket használják.", "Radnai Márk, a térség országgyűlési képviselője szerint a jogszabályt be kell tartani, és a döntés nem politikai bosszú. Finanszírozást nem tud garantálni, de utánajár. A problémát 2017-ig vezeti vissza. Fontos dátumok: 2026 végéig kell megoldani a vízforgató rendszert, 2027 februárjáig el kell fogadni a költségvetést a felújítási forrásokkal, a jelenlegi üzemeltetési kiterjesztés határideje 2029."], "cav": "", "src": [["Telex: esztergomi strandfürdő", "https://telex.hu/belfold/2026/10/22/esztergom-szent-istvan-strandfurdo-bezaras-rendkivuli-lakossagi-forum-hernadi-adam-badi-gabor"]], "op": "Egy 110 éves, védett fürdő bezárása fájdalmas, de a közegészségügyi szabályok megszegése nem lehet vitás. A felújítás 2028-as dátuma viszont hosszú idő: a városnak közben a lakosság tájékoztatására is gondolnia kell."}, {"id": "hazi-orvos-szerep", "r": "Közélet", "c": "Egészség", "st": "Jelentett", "time": "okt. 22.", "t": "A háziorvosnak dietetikus, pszichiáter és szociális munkás is kell lennie: csoportpraxisok felé mozdulhat az alapellátás", "s": "A Telex szerint a magyar egészségügy fő problémája a források hiánya, nem a hatékonyság.", "p": ["A Telex cikke szerint a háziorvostól elvárják, hogy egyszerre töltsön be sok szerepet. Filippov Gábor szerint ez túlterheli az alapellátást, a magyar házi praxisok a fejlettebb rendszerekhez képest kisebbek is.", "A cikk a csoportpraxisokat tartja követendőnek, ahol több szakma dolgozik együtt a háziorvossal, a megelőzésre és az egészségmagatartás javítására összpontosítva. Dietetikusok, gyermekpszichológusok, pszichiáterek és nőgyógyászok célzottan kezelik a hozzájuk forduló betegeket.", "Magyarország a GDP-hez mérten kevés pénzt költ egészségügyre mind a régióban, mind az EU-ban, és szokatlanul magas a magánfizetések aránya. A cikk szerint az alulfinanszírozás, nem a hatékonyság a fő gond, szemben például az oktatással. Szektorsemleges modellben a társadalombiztosítás az állami és a magán ellátót is fizetné. A finanszírozás a teljes ellátási útra vagy csak egyes eseményekre (például műtétekre) vonatkozhatna, ezt nyitott kérdésnek tekinti. Az osztályok bezárását elsősorban az ápolók és más szakképzett munkatársak hiánya okozza, nem az orvoshiány."], "cav": "Elemző jellegű cikk, háziorvosi létszám, praxisszám, fizetés vagy költségvetési szám nem szerepel benne, és reformidőtervet sem közöl.", "src": [["Telex: a háziorvos szerepe és az egészségügy finanszírozása", "https://telex.hu/belfold/2026/10/22/magyarorszag-jovo-idoben-egeszsegugyi-ellatorendszer-haziorvosok-finanszirozas"]], "op": "Egy háziorvostól nem lehet elvárni, hogy egyszerre legyen dietetikus, pszichiáter és szociális munkás. A csoportpraxis útja logikus, de forrás nélkül ez is csak szép elmélet maradna."}, {"id": "pilis-baleset", "r": "Közélet", "c": "Baleset", "st": "Megerősített", "time": "okt. 22.", "t": "Szikláról zuhant le két túrázó nő a Pilisben, mindkettőjüket élve kimentették", "s": "A katasztrófavédők és a barlangi mentők a jelzett turistaútról letért nőket mentették ki.", "p": ["Szerdán délután két nő letért a jelzett turistaútról Pilisszentlélek környékén, és egy nagyon meredek lejtőn lecsúszott. Az egyik nő egy kitett, függőleges sziklaszakaszról zuhant, mintegy 20–30 métert csúszott, és önállóan nem tudott távozni. A tűzoltók alulról közelítették meg, a mentők a helyszínen ellátták, majd a tűzoltók segítettek a mentőautóhoz vinni. Sérüléseinek részleteit a cikk nem közli.", "A másik nő a meredek oldalban ágakba kapaszkodott meg, a tűzoltók mentőkötéllel érték el, és biztosították, hogy ne csússzon tovább. Mentéséhez speciális eszközök és képzettség kellett, ezért a Pest Megyei Kutató-Mentő Szolgálat és a Magyar Barlangi Mentőszolgálat is kivonult. Fél órával később érkeztek, és kötéltechnikával engedték le a szikláról. Nem szenvedett további sérülést.", "A mentőszolgálat hangsúlyozta, hogy a jelzett útról való letérés sok veszéllyel jár, a kimenetel szerencsére nem lett tragikus, de közel volt hozzá."], "cav": "", "src": [["Telex: balesetek a Pilisben", "https://telex.hu/szepkilatas/2026/10/22/pilis-turautvonal-sziklafal-baleset-mentes"]], "op": "Szerencse a szerencsétlenségben: mindkét nőt élve sikerült kimenteni. A mentők munkája elismerést érdemel, a túrázóknak pedig emlékeztető, hogy a jelzett útról letérni mindig kockázat."}, {"id": "macron-tuntetesek", "r": "Külföld", "c": "Tüntetés", "st": "Megerősített", "time": "okt. 22.", "t": "Macron betiltja a szakszervezetek által nem hívott tüntetéseket, az „ultrabaloldali csoportokat” okolja", "s": "Október 17-én több mint félmillióan tüntettek Franciaországban, legalább 400 embert vettek őrizetbe.", "p": ["Emmanuel Macron francia elnök csütörtökön, egy nemzetbiztonsági tanácsülés után azt mondta, hogy a République megdöntésére törekvő, szervezett ultrabaloldali csoportok állnak az erőszakos cselekmények mögött. A szakszervezetek által nem összehívott tüntetéseket betiltják, de a tiltás ellenére is voltak megmozdulások, a hétvégére újabbakat jelentettek be. Az elnök elismerte, hogy a kormány válasza a múlt heti erőszakra hiányos volt, és a hatóságokat több fejlemény meglepte.", "A helyi hatóságok bizonyos intézkedésekről, például gyülekezési tilalomról maguk dönthetnek. Macron támogatta az igazságügyi tárca kérését, hogy szigorú ítéleteket szabjanak ki a zavargókra. A szakszervezetek által szervezett eseményeket a törvény alapján felülvizsgálják és engedélyezik, de az útvonalakat megváltoztathatják. Sébastien Lecornu miniszterelnök a jövő héten találkozik a diákszervezetekkel „jogos követeléseikről”.", "A tüntetések az oktatás miatti diáktüntetésként indultak, majd országos zavargássá nőttek. Október 17-én, szombaton több mint 500 ezren vonultak az élelmiszerárak és az oktatás miatt, többségük békésen, de több helyen erőszakba csapott át, legalább 400 embert vettek őrizetbe. Fekete ruhás, arcukat eltakaró fiatalok barikádokat építettek, fosztogattak, autókat és középületeket gyújtottak fel. Marseille-ben betörtek a városházára és rongálták a rendőrséget, Lyonban felgyújtották a turistairodát, Lille-ben betörtek a városházára, Limoges-ban pedig felgyújtották a 143 éves városháza épületét, amely nagyrészt megsemmisült."], "cav": "", "src": [["Telex: Macron a zavargásokról", "https://telex.hu/kulfold/2026/10/22/emmanuel-macron-franciaorszag-tuntes-zavargasok-koztarsasag-megdontese"]], "op": "A szakszervezet által nem hívott tüntetések betiltása komoly lépés, amelynek a szólásszabadságra gyakorolt hatását is mérlegelni kell. Az erőszak ellen fel kell lépni, de a tiltás könnyen eszkalálhatja a feszültséget."}, {"id": "becsi-egyetemi-tuntetes", "r": "Külföld", "c": "Tüntetés", "st": "Megerősített", "time": "okt. 22.", "t": "Legalább 40 ezren tüntettek Bécsben az egyetemi költségvetés ellen", "s": "A rektorok szerint 2028–2030-ra legalább 2 milliárd euró hiányzik, a kormány védi a megszorítást.", "p": ["Több tízezer diák vonult csütörtökön Bécs belvárosában az egyetemi költségvetés ellen. A tüntetést az ÖH (Osztrák Diákszövetség) szervezte, szerinte legalább 40 ezren vettek részt, a rendőrség 20 ezerrel számolt. Salzburgból, Innsbruckból és Grazból is érkeztek diákok és tanárok.", "A 23 állami egyetem 2028–2030-ra 16 milliárd eurót kap, a rektorok szerint legalább 18 milliárdra lenne szükség a jelenlegi szolgáltatási szint megtartásához, vagyis legalább 2 milliárd euró hiányzik. A rektorok szerint nagyjából minden tizedik állást meg kell szüntetni, csökken az oktatási órák és a kutatási programok száma. Selina Wienerrother, az ÖH alelnöke szerint kevesebb lesz a tanár és a helyek száma, nőni fog a verseny.", "Az egyetemi klinikákat is érintheti a döntés, ami hatással lehet a betegellátásra és az orvosképzésre. A konzervatív–szociáldemokrata–liberális koalíció védi a megszorításokat, arra hivatkozva, hogy az egyetemek az elmúlt években jelentős forrást kaptak."], "cav": "A részvevők számánál a szervezők és a rendőrség becslése eltér.", "src": [["Telex: bécsi egyetemi tüntetés", "https://telex.hu/kulfold/2026/10/22/tobb-tizezer-egyetemista-tuntet-becsben-egyetemi-koltsegvetes"]], "op": "Húsz- és negyvenezer közti résztvevő így is nagy tüntetés, és jól mutatja, mennyire érintik az egyetemi vezetőket és a diákokat a költségvetési megszorítások. A kormány az államháztartási kényszerre hivatkozik, a rektorok viszont legalább 2 milliárd eurós hiányról beszélnek."}, {"id": "trump-atlanti-ocean", "r": "Külföld", "c": "Diplomácia", "st": "Jelentett", "time": "okt. 22.", "t": "Trump szerint felhívta a Google vezérigazgatóját, hogy nevezzék át az Atlanti-óceánt", "s": "Az elnök elmondása szerint Sundar Pichai elutasította a kérést, független megerősítés nincs.", "p": ["Donald Trump amerikai elnök szerda este egy dél-karolinai kampányrendezvényen azt mondta, hogy a közelmúltban felhívta Sundar Pichait, a Google vezérigazgatóját, és megkérdezte, át tudják-e nevezni az Atlanti-óceánt a Google Térképen, ahogy javasolta. A Telex a The Guardianre hivatkozik.", "A cikk szerint Trump azt kérte, hogy az óceánt róla vagy Amerikáról nevezzék el. Elmondása szerint csak az Atlanti- és a Csendes-óceán jöhet szóba, más földrajzi elemet nem akar a nevéről vagy Amerikáról elnevezni. Trump szerint Pichai elutasította, azzal, hogy az óceánok sok országhoz tartoznak, mire Trump azt mondta, hogy szerinte az Atlanti-óceánnak meg kell tartania a nevét.", "Háttérként: Trump végrehajtói rendelettel „Amerika-öbölre” nevezte át a Mexikói-öblöt, és az Ontario-tavat is átnevezte. A Google Térkép zárójelben mutatja az „America” nevet az öbölnél és a tónál. Múlt hónapban Trump a Hormuzi-szorost „TRUMP-szorosra” nevezte át javaslatában."], "cav": "A cikk Trump saját beszámolójára támaszkodik, a Google független közleményét nem tartalmazza.", "src": [["Telex: Trump és az Atlanti-óceán átnevezése", "https://telex.hu/kulfold/2026/10/22/donald-trump-atlanti-ocean-atnevezes-google-maps-sundar-pichai"]], "op": "Az Atlanti-óceán átnevezése egy kampányszónoklatban szórakoztató ötlet lehet, a valóságban azonban nem egy cég dönt a földrajzi nevekről. Mivel a történet Trump saját beszámolójára épül, érdemes fenntartással kezelni."}, {"id": "lebron-himnusz", "r": "Sport", "c": "Kosárlabda", "st": "Jelentett", "time": "okt. 22.", "t": "Trump bocsánatkérést követel LeBron Jamestől a himnusz alatti viselkedése miatt", "s": "James a Knicks idénynyitóján golfozást és kosárra dobást utánzott az amerikai himnusz alatt.", "p": ["Donald Trump azt állítja, hogy LeBron James tiszteletlen volt az Egyesült Államokkal szemben, mert nem állt mozdulatlanul a himnusz alatt, és bocsánatkérést követelt. A cikk a BBC-re hivatkozik.", "Az eset szerdán történt a New York Knicks idénynyitó mérkőzésén. A himnusz alatt James golflendítéseket és kosárra dobást utánzott, csapattársai többsége nagyjából mozdulatlanul állt. Trump a Truth Socialon azt írta, hogy James tiszteletlen az országgal, bocsánatot kell kérnie a zászlóért meghalt amerikai harcosoktól és hősöktől, és „TELJES SZÉGYENnek” nevezte az esetet.", "A cikk szerint a himnusz körüli viták 2016 óta, Colin Kaepernick térdelése óta kényesek az Egyesült Államokban. James és Trump már korábban is összeütközött. Arra a kérdésre, hogy ki a legnagyobb kosaras, Michael Jordan vagy James, Trump azonnal Jordant választotta."], "cav": "LeBron James reakcióját a cikk nem tartalmazza.", "src": [["Telex: Trump és LeBron James", "https://telex.hu/sport/2026/10/22/donald-trump-lebron-james-tiszteletlenseg-bocsanatkeres-himnusz"]], "op": "Egy sportoló nem köteles tökéletes mozdulatlansággal állni a himnusz alatt, és kérdés, hogy egy politikusnak van-e joga ezért bocsánatkérést követelni. A történet az amerikai közélet megosztottságát mutatja."}, {"id": "ronai-egon-atv", "r": "Kultúra", "c": "Média", "st": "Megerősített", "time": "okt. 22.", "t": "Rónai Egon otthagyja az ATV-t, a Network4 Media Grouphoz igazol", "s": "Több mint tizenöt év után távozik a csatornától, a 24.hu írta meg először.", "p": ["Rónai Egon 2011-ben csatlakozott az ATV-hez, ahol politikai, közéleti és portréműsorokat készített. A 24.hu által elsőként közölt hír szerint a Network4 Media Grouphoz igazol, a távozás okát a Telex-cikk nem közli. Az ATV megerősítette a 24.hu-nak a távozást.", "Németh S. Szilárd, az ATV vezérigazgatója úgy fogalmazott, hogy a csatorna, mint sok munkatárs és néző, sajnálja Rónai távozását, de tiszteletben tartja a döntését. Rónai maga azt mondta, hogy az ATV sokat tett a közszolgálati újságírásért és a pártatlan, objektív tájékoztatásért az elmúlt több mint tizenöt évben, és megköszönte az indulástól kapott bizalmat és a támogató környezetet, ahol turbulens időkben is szabadon dolgozhatott."], "cav": "", "src": [["Telex: Rónai Egon otthagyja az ATV-t", "https://telex.hu/after/2026/10/22/ronai-egon-otthagyja-az-atv-t"]], "op": "Több mint tizenöt év után egy közéleti műsorvezető távozása mindig fontos pillanat a magyar médiában. A távozás okát nem ismerjük, de Rónai Egon hangja a közéleti beszélgetések fontos szereplője volt."}, {"id": "arulok-otodik-evad", "r": "Kultúra", "c": "Tévé", "st": "Megerősített", "time": "okt. 22.", "t": "Vasvári Vivien és Piréz Sapkás nyerte az Árulók ötödik évadát, 13 140 000 forinton osztoznak", "s": "A magyar adaptációban először fordult elő, hogy két áruló is a nyertesek között volt.", "p": ["Vasvári Vivien és Piréz Sapkás nyerte az RTL Árulók című műsorának ötödik, hírességekkel készült évadát. Mindketten gyilkosok voltak, ami a magyar változatban még nem fordult elő, hogy két áruló nyerjen. Sapkás utólag lett áruló, Vasvári az elejétől gyilkos volt. A nyereményen, 13 140 000 forinton osztoznak.", "A csütörtöki záró részben öten maradtak: Sapkás és Vasvári gyilkosként, valamint Bettina Beslin, Estilla Mikecz és Urbanovits Krisztina ártatlanként. Urbanovits gyanakodott Vasvárira és Sapkásra, de nem tudta meggyőzni a többieket. A kerekasztalnál Beslinre szavazott, de a többiek rá, így kiesett, és nem fedhette fel a szerepét.", "A Tűzszertartáson a négy megmaradt játékos piros vagy zöld port dobott a tűzbe. Az első körben mindenki pirosat választott, és Mikecz kiszavazták. A második körben három zöld láng jelent meg, és mindenki felfedte a szerepét. Beslin, aki azt hitte, nincs több áruló, felfedezte, hogy kettő maradt, így veszített."], "cav": "", "src": [["Telex: Az Árulók ötödik évadának nyertesei", "https://telex.hu/after/2026/10/22/vasvari-vivien-es-sapkas-pirez-nyerte-az-arulok-otodik-evadat"]], "op": "Két áruló a nyertesek között: a játék logikája ezzel még izgalmasabb lett. Jó szórakozás a nézőknek, és szép nyeremény a győzteseknek."}, {"id": "pussy-riot-budapest", "r": "Kultúra", "c": "Koncert", "st": "Megerősített", "time": "okt. 22.", "t": "Pussy Riot-koncert lesz Budapesten 2027. április 23-án a Magyar Zene Házában", "s": "A Riot Days című zenés-színházi előadást a jegyek már elérhetők.", "p": ["A Pussy Riot 2027. április 23-án lép fel a budapesti Magyar Zene Házában. A jegyek már kaphatók, az árat a cikk nem közli. A műsor a Riot Days, a zene, a színház és a politikai performansz keveréke, Maria Aljohina Riot Days és Political Girl című könyvei alapján, dokumentumfilmes betétekkel, punkkal, elektronikus zenével és beszélt szóval. Az előadás idővel változik, és az oroszországi és ukrajnai eseményekre reagál.", "Fellép Aljohina, Taso Pletnyer színész és dokumentumszínházi rendező, valamint Alina Petrova multiinstrumentalista. A 2025 júniusa óta velük turnézó dobos, Eric Breitenbach New Age Doom nevű szólóprojektje az előzenekar.", "A csoport 2018-ban az Akváriumban lépett fel Budapesten. 2025 decemberében Oroszországban extrémista szervezetnek minősítették, és a tevékenységét betiltották."], "cav": "", "src": [["Telex: Pussy Riot Budapesten", "https://telex.hu/after/2026/10/22/pussy-riot-budapest-koncert-magyar-zene-haza-riot-day-putyin-ellenes-orosz-kollektiva"]], "op": "A Riot Days egy darab a mai kelet-európai ellenállás történetéből, ezért különösen érdekes lesz látni, hogyan fogadja a budapesti közönség. A jegyek már kaphatók, érdemes nem várni."}, {"id": "ea-bioware-mass-effect", "img": "https://assets.telex.hu/images/20261021/1792605773-temp-cjavi84k63e39gddkpn_facebook.jpg", "imgs": "Telex", "r": "Kultúra", "c": "Videójáték", "st": "Jelentett", "time": "okt. 21.", "t": "Leépít az EA, gyakorlatilag megszűnik a BioWare, törölték az új Mass Effectet", "s": "Egy belső forrás szerint mintegy 400 ember veszítheti el az állását, az EA nem erősítette meg a számot.", "p": ["Az Electronic Arts szerdán leépítést jelentett be, egy bennfentes szerint mintegy 400 ember veszítheti el a munkáját, ebből nagyjából 50 a BioWare-nél. A létszámcsökkentés gyakorlatilag a stúdió megszűnését jelenti. A BioWare-t 1995-ben alapították, a Baldur's Gate, a Neverwinter Nights, a Knights of the Old Republic, a Dragon Age és a Mass Effect készítője, az EA 2007-ben vette meg. Hanyatlása a Mass Effect: Andromedával (2017) és az Anthemmel (2019) kezdődött, a 2024-es Dragon Age: The Veilguard megbukott.", "A már évek óta fejlesztett új Mass Effectet törölték. Az EA belső feljegyzése szerint a döntés a projektek fenntarthatóságának és hosszú távú nyereségességének hónapokig tartó felülvizsgálatát követte. Megmaradnak a sportjátékok, az Apex Legends és a Battlefield, folytatódik a Star Wars Jedi sorozat. A Battlefield-stúdiók új közös projektet indítanak, valószínűleg új Star Wars: Battlefrontot, készül egy Vasember-játék is. Egy Sims-projekt fókusza megváltozik, a skate. csapata szűkül.", "Amikor mintegy egy éve szaúdi befektetők megvették az EA-t, a cég azt mondta a dolgozóknak, hogy nem lesz azonnali hatás az állásokra. A cikk szerint az adósságból finanszírozott vásárlás már akkor költségcsökkentési félelmeket keltett."], "cav": "A létszámot egy belső forrás állítja, az EA nem erősítette meg.", "src": [["Telex: EA-leépítés, BioWare, Mass Effect", "https://telex.hu/after/2026/10/21/videojatek-ea-leepites-bioware-mass-effect"]], "op": "Egy legendás játékstúdió gyakorlati megszűnése fájdalmas hír mindenkinek, aki szerette a Baldur's Gate-et vagy a Mass Effectet. A leépítések ára az alkotók tehetsége és munkahelye."}, {"id": "biff-2026", "img": "https://assets.telex.hu/images/20261021/1792591775-temp-f7fm7qe40gju6ombdim_hero-normal:xl.jpg", "cred": "Részlet Az ismeretlen című filmből. Forrás: Bathysphere.fr", "imgs": "Telex", "r": "Kultúra", "c": "Film", "st": "Megerősített", "time": "okt. 21.", "t": "Október 24-én kezdődik a BIFF a Corvinban, kilenc film, amire még volt jegy", "s": "A Budapesti Nemzetközi Filmfesztivál november 1-ig tart, a legnépszerűbb vetítésekre már elfogytak a jegyek.", "p": ["A Budapesti Nemzetközi Filmfesztivál (BIFF) 2026. október 24. és november 1. között zajlik a Corvin moziban. A Telex ajánlója szerint a legvártabb dokumentumfilm (La Gradiva), A fekete golyó és a Telex Filmklub A beton története című vetítése már teljesen elfogyott.", "Az ajánló szerint még volt jegy többek között Nicolás Pereda Everything Else Is Noise című mexikói filmjére (okt. 26., hétfő, 17:30), Mike Leigh Tender Loving Care című drámájára (okt. 26. és 31.), a Chronovisorra (okt. 28.), a thaiföldi 9 Temples to Heaven című filmre (okt. 28., a rendező jelen lesz), Terrence Malick 1978-as Days of Heaven című klasszikusára felújított 4K-s változatban (okt. 29.), Arthur Harari Az ismeretlen című francia filmjére (okt. 29. és 31.), Joko Anwar Ghost in the Cell című indonéz horrorjára (okt. 30., péntek 23:00, egyetlen vetítés), Sandra Wollner Everytime című osztrák filmjére (okt. 31.) és Angela Schanelec My Wife Cries című filmjére (nov. 1.).", "A vetítési idők és jegyelérhetőség azóta változhattak, a cikk a biff.hu oldalát ajánlja."], "cav": "A jegyelérhetőség a cikk megjelenésének időpontját tükrözi.", "src": [["Telex: BIFF 2026 filmajánló", "https://telex.hu/after/2026/10/21/biff-2026-budapesti-nemzetkozi-filmfesztival-filmajanlo-corvin"]], "op": "A fesztivál jegyeinek gyors elfogyása azt mutatja, hogy van igény az igényes filmekre. Aki még nem szerzett jegyet, érdemes a kisebb vetítéseket is megnézni."}, {"id": "agyagpofa-kritika", "img": "https://assets.telex.hu/images/20261020/1792508506-temp-mhp4uugst7updophpie_hero-normal:xl.jpg", "cred": "Fotó: Warner Bros. Pictures", "imgs": "Telex", "r": "Kultúra", "c": "Film", "st": "Jelentett", "time": "okt. 22.", "t": "Agyagpofa: a DC új filmje inkább kis horror, mint szuperhős-eposz, a kritikus szerint „pontosan közepes”", "s": "James Watkins rendezése, Mike Flanagan forgatókönyvével csütörtöktől látható a magyar mozikban.", "p": ["A Clayface (Agyagpofa) című DC-film csütörtöktől látható a magyar mozikban. Rendezte James Watkins, a forgatókönyvet Mike Flanagan írta. Tom Rhys Harries Matt Hagent, egy színészt alakít, akinek arcát egy gengszter összevágja, Naomi Ackie dr. Caitlyn Corr, aki nanotechnológiával ajánlja javítani az arcát.", "Klág Dávid, a Telex kritikusa szerint a film inkább kis horror, mint nagy szuperhősfilm: alacsony költségvetésű, kevés színésszel és helyszínnel, inkább nyugtalanító, mint ijesztő. A maszkos és átalakulási effektek jórészt gyakorlatiak, de néhány átalakulás túl simának tűnik, a kritikus aggódik az MI vagy animáció használatán. Szerinte sokkal jobb, mint a bukott DC-szupergonosz-filmek (Madame Web, Kraven a vadász, Morbius), de „pontosan közepes”, ami jobb, mint várta."], "cav": "Egyetlen kritikus véleménye.", "src": [["Telex: Agyagpofa kritika", "https://telex.hu/after/2026/10/22/agyagpofa-clayface-dc-film"]], "op": "Egyetlen kritikus véleménye még nem ítélet, a „pontosan közepes” jelző pedig egy szempont a sok közül. A DC-filmek között érdekes lehet egy kisebb horror hangulatú darab."}, {"id": "hatalom-gyuruji-3", "r": "Kultúra", "c": "Sorozat", "st": "Megerősített", "time": "okt. 21.", "t": "November 11-én érkezik A hatalom gyűrűi harmadik évada, négy résszel indul", "s": "Megjelent az előzetes, benne Sauron az Egy Gyűrű kovácsolásánál és egy Balrog.", "p": ["A Prime Video A hatalom gyűrűi című sorozatának harmadik évadából november 11-én az első négy rész érkezik, az Amazon a korábbi két-három résznél többet
