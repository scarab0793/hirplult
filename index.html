: "Az átalakítás iránya érthető, a „vízfejtelenítés” viszont akkor hiteles, ha a dolgozók valóban többet látnak belőle a fizetésükben, nem csak kevesebb főnököt a szervezeti ábrán. A 15 százalék a szakma évek óta tartó lemaradása mellett inkább kezdet, mint megoldás.", "src": [["444: Húszmilliárd forintnyi plusz és átalakítás jön a szociális ágazatban", "https://444.hu/2026/10/29/huszmilliard-forintnyi-plusz-es-atalakitas-jon-a-szocialis-agazatban"]], "img": "https://assets.4cdn.hu/kraken/8PR7hrrzjwBjFUBcs-lg.jpeg", "imgs": "444", "imgl": "https://444.hu/2026/10/29/huszmilliard-forintnyi-plusz-es-atalakitas-jon-a-szocialis-agazatban", "cred": "Fotó: Facebook (444)"}, {"id": "egeszsegugyi-beremeles-hegedus", "r": "Belpolitika", "c": "Egészségügy", "w": "", "st": "Megerősített", "time": "okt. 29.", "t": "Hegedűs Zsolt: nem ígértünk azonnali 20–25 százalékos béremelést a szakdolgozóknak", "s": "Az egészségügyi miniszter szerint az örökölt hiány korlátozza a bérrendezést, 2027-től évi 192 milliárd többletforrás jön.", "p": ["Hegedűs Zsolt egészségügyi miniszter a 444 Facebook-bejegyzésének kommentjében közölte, hogy a kormány nem ígért azonnali 20–25 százalékos béremelést az egészségügyi szakdolgozóknak, és a Hugonnai Vilma Egészségügyi Programban sem szerepelt ilyen. Júliusban ő maga mondta, hogy optimálisan ekkora emelés kellene, és ezt ma is így gondolja.", "A bérrendezés mintegy 123 ezer egészségügyi dolgozót érint, 2027-től évi 192 milliárd forint többletforrással. Az új bértábla hat besorolási csoportból és 15 gyakorlatiidő-fokozatból áll. Átlagosan 15 százalékos emelés várható, egyes dolgozóknál az szja csökkentésével együtt akár 17 százalékos nettó keresetnövekedés.", "Magyar Péter miniszterelnök szerint több mint 600 ezer állami alkalmazott fizetése nő 15–22 százalékkal, 1,7 százalékos infláció mellett 2,5 millió ember adója csökken. A 444 szerint a minisztérium nyolc nappal korábban kapott kérdéseket, de csak türelmet kért."], "cav": "Az adatok a miniszterek Facebook-kommentjeiből származnak, független ellenőrzés nélkül; a szakdolgozói szervezetek reakcióját a cikk nem közli.", "op": "Egy miniszteri komment nem a legszebb műfaj egy ennyire érzékeny bérvitához, az őszinteség viszont elismerésre méltó: nem azt mondja, hogy minden rendben lesz, hanem hogy a költségvetés szűk. A csalódott szakdolgozók ettől még nem fognak jobban élni, szóval a bértábla részleteinél érdemes lesz éberen követni a végrehajtást.", "src": [["Index: Kommentben üzent az egészségügyi miniszter: Nem ígértünk azonnali 20-25 százalékos béremelést", "https://index.hu/belfold/2026/10/29/egeszsegugy-szakdolgozok-beremeles-hegedus-zsolt-miniszter/"]], "img": "https://kep.cdn.index.hu/1/0/7166/71665/716653/71665357_5283595_17f162fabf29237c2ef3822e07c6b8eb_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/10/29/egeszsegugy-szakdolgozok-beremeles-hegedus-zsolt-miniszter/", "cred": "Hegedűs Zsolt 2026. szeptember 14-én. Fotó: Tövissi Bence / Index"}, {"id": "szolgalati-nyugdij-berplafon-eltorles", "r": "Gazdaság", "c": "Nyugdíj", "w": "", "st": "Megerősített", "time": "okt. 29.", "t": "Eltörlik a szolgálati nyugdíjak bérplafonját, 2028-tól az szja-t sem vonják le", "s": "Ruszin-Szendi Romulusz és Pósfai Gábor szerint a honvédelmi és rendvédelmi nyugdíjak 2027-től kedvezőbb szabályok alá kerülnek.", "p": ["A kormány eltörli a honvédelmi és rendvédelmi szolgálati nyugdíjak bérplafonját 2027-től, 2028-tól pedig a nyugdíjat terhelő 15 százalékos szja-t sem vonják le. A bejelentést Ruszin-Szendi Romulusz honvédelmi miniszter és Pósfai Gábor belügyminiszter tette egy Facebook-videóban. A szolgálati nyugdíjak 2012 óta fizetnek 15 százalékos szja-t, és bérplafon is vonatkozott rájuk.", "A HVG háttérként azt írja, hogy a kormány ezen a héten mutatta be: 2027-től az eddigi szja-kedvezmények helyett adójóváírások lépnek életbe, az összes meglévő adóalap-kedvezmény a fizetendő adót csökkentő összegkedvezménnyé alakul. A cikk számításokat is közöl különböző keresetek utáni jóváírásról."], "cav": "A cikk a miniszterek bejelentésére épül, a törvényi részletek még nem ismertek.", "op": "A szolgálati nyugdíj-szabályok rendbetétele jogos igény volt, hiszen sok érintett évtizedeken át vállalt kockázatot az államért. Az viszont nem árt megkérdezni, mennyibe kerül mindez egy költségvetésben, ahol máshol fájdalmas megszorítások vannak.", "src": [["HVG: Megváltoztatja a kormány a fegyveresek nyugdíjainak és adózásának szabályait is", "https://hvg.hu/gazdasag/20261029_fegyveresek-nyugdij-adozas"]], "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/1d21d370-ae44-4117-9cb8-821f34a2b3b5.jpg", "imgs": "HVG", "imgl": "https://hvg.hu/gazdasag/20261029_fegyveresek-nyugdij-adozas", "cred": "Fotó: HVG / Cabrera Martin"}, {"id": "posfai-kozszolgalati-lakastamogatas", "r": "Belpolitika", "c": "Kormány", "w": "", "st": "Megerősített", "time": "okt. 29.", "t": "Pósfai: az év végével megszűnik a közszolgálati dolgozók egymillió forintos otthonteremtési támogatása", "s": "A belügyminiszter szerint 15 százalékos béremelés jön a rendvédelmi állománynak, és 9000 fő hiányzik a rendvédelemből.", "p": ["Pósfai Gábor belügyminiszter az RTL Klubnak azt mondta, az év végével megszűnik a közszolgálati dolgozók évi egymillió forintos otthonteremtési támogatása. Helyette más típusú támogatást dolgoznak ki, amely az országon belüli mobilitást segítené, és már az első munkanaptól járna, nem csak a próbaidő után.", "A béremelés 15 százalékos lesz; a miniszter megértését fejezte ki a csalódottak iránt, de szerinte a költségvetés állapotát figyelembe kellett venni. Az illetményalap utoljára 2008-ban változott, a szakszervezetek legalább 50 százalékos emelést tartanának elfogadhatónak. A rendvédelemből jelenleg 9000 fő hiányzik, több mint 1200-an jelezték visszatérési szándékukat, és 400-nál többen már szolgálnak.", "A belügyi tárca átvilágítása során eddig nyolc feljelentés született, főleg a sportot érintik, a Pegasus-üggyel kapcsolatos átvilágítás pedig zajlik. A Terrorelhárítási Központ október 1-je óta az ORFK alá tartozik, januártól a katasztrófavédelem ismét tűzoltóságként működik; a rendészeti csomagot a következő hetekben nyújtják be az Országgyűlésnek."], "cav": "A cikk az MTI által közölt interjúra épül; az új támogatási forma részleteit a miniszter nem közölte.", "op": "A kormány most azt kéri a rendőröktől, hogy higgyék el: a 15 százalék kezdet, a lakhatási támogatás átalakítása pedig nem lefaragás. Ezt a szakszervezetek 50 százalékos igénye mellett nehéz eladni, de legalább az az őszinte, hogy a miniszter nem tagadja a csalódottságot.", "src": [["HVG: Pósfai Gábor: Megszűnik a közszolgálati dolgozók évi egymillió forintos támogatása", "https://hvg.hu/itthon/20261029_posfai-gabor-kozszolgalati-dolgozok-egymillio-forintos-tamogatas-kivezetes-rendorseg"]], "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/06bf4481-73c1-439c-9fb0-024c9df805a2.jpg", "imgs": "HVG", "imgl": "https://hvg.hu/itthon/20261029_posfai-gabor-kozszolgalati-dolgozok-egymillio-forintos-tamogatas-kivezetes-rendorseg", "cred": "Fotó: HVG / Cabrera Martin"}, {"id": "orban-lakitelek-feljelentes", "r": "Belpolitika", "c": "Ellenzék", "w": "", "st": "Jelentett", "time": "okt. 29.", "t": "Feljelentették Orbán Viktort a lakiteleki beszéde miatt, a Nemzeti Nyomozó Iroda vizsgálja", "s": "A feljelentés egy októberi DPK-táborban elhangzott mondat miatt érkezett; egyelőre nem tudni, indul-e nyomozás.", "p": ["Október közepén a lakiteleki Digitális Polgári Körök táborában Orbán Viktor a Fidesz által meghirdetett „nemzeti ellenállásról” szóló kérdésre válaszolva azt mondta: „Mi már abban vagyunk, itt kioszthatnánk az erre alkalmas eszközöket.” A HVG szerint a mondatot láthatóan viccnek szánta. Magyar Péter miniszterelnök szerint Orbán „nevetgélve” fegyveres lázadásról beszélt, amit az állam elleni egyik legsúlyosabb bűncselekménynek nevezett.", "A Nemzeti Nyomozó Iroda a kedden érkezett ATV-megkeresésre megerősítette, hogy a feljelentés megérkezett, és kiegészítés keretében vizsgálják. Múlt héten az ORFK még azt közölte, hogy a témában nem indult eljárás. Egyelőre nem tudni, indul-e nyomozás, és milyen gyanúval."], "cav": "A feljelentőt a HVG nem azonosítja. A mondat értelmezése vitatott: a cikk szerint Orbán viccnek szánta, a kormányfő fegyveres felhívásnak olvasta.", "op": "Egy volt miniszterelnöktől elvárható, hogy ne dobálózzon „eszközökkel”, még ha viccnek is szánta; a szándékos félreértés viszont a másik oldalon is nagyon kényelmes. Büntetőjogi felelősség kérdésében a nyomozó hatóságnak kell dönteni, nem a pártoknak.", "src": [["HVG: Feljelentették Orbán Viktort a lakiteleki beszéde miatt", "https://hvg.hu/itthon/20261029_feljelentes-orban-viktor-lakitelek-beszed-dpk-tabor-nemzeti-nyomozo-iroda"]], "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/4b500ed3-4551-4884-9e58-cbab161812d9.jpg", "imgs": "HVG", "imgl": "https://hvg.hu/itthon/20261029_feljelentes-orban-viktor-lakitelek-beszed-dpk-tabor-nemzeti-nyomozo-iroda", "cred": "Orbán Viktor Lakitelken. Fotó: MTI / Ujvári Sándor"}, {"id": "elektromos-roller-szigorites", "r": "Közélet", "c": "Közlekedés", "w": "", "st": "Megerősített", "time": "okt. 28.", "t": "Magyar Péter: jelentős szigorítás jön az elektromos rollerekre, korhatár és sebességkorlát is napirenden", "s": "A miniszterelnök Facebook-bejegyzése szerint a részleteket később ismertetik; 2025-ben 635 rollerbaleset történt.", "p": ["Magyar Péter szerdai Facebook-bejegyzésében azt írta, hogy a kormány „jelentős szigorítást javasol az elektromos rollerek használata terén”, és a javaslatot széles körű szakmai és társadalmi egyeztetés előzte meg. A részleteket később ismertetik. Az Origo szerint a tervezett elemek között a kis- és nagy teljesítményű rollerek külön szabályozása, sebességkorlátozás, kötelező védőfelszerelés és alsó korhatár szerepel.", "Vitézy Dávid október közepén azt mondta, hogy a 25 km/h-nál lassabb és gyorsabb eszközöket külön kezelnék, alsó korhatárként 14 vagy 16 év merült fel, de végleges döntés még nincs. A közlekedésbiztonsági kérdőívet több mint 300 ezren töltötték ki, 94 százalékuk támogatta a szigorúbb szabályozást. 2025-ben 635 személyi sérüléses balesetet okozott elektromos roller, ez több mint 70 százalékos emelkedés."], "cav": "A konkrét szabályok még nem ismertek; az Origo által felsorolt elemek és a korhatár kiindulási javaslatok. A 70 százalékos növekedésre és a felmérés adataira a cikk nem közöl független forrást.", "op": "Itt egyszer nem nagyon van miről vitatkozni: a számok magukért beszélnek, és a rollerezők sem járnak jól, ha a baleset-statisztika tovább romlik. A vita inkább arról szólhat majd, hogy az ellenőrzés mennyire lesz kivitelezhető, mert egy szabály csak annyit ér, amennyire betartatják.", "src": [["Origo: Magyar Péter bejelentette: jelentős szigorítás jön az elektromos rollerekre", "https://www.origo.hu/belpol/2026/10/elektromos-roller-magyar-peter-bejelentes-szigoritas"], ["HVG: Szigorítják a rollerezést, meghosszabbították Seszták és Hankó letartóztatását", "https://hvg.hu/itthon/20261029_szigoritjak-a-rollerezest-meghosszabbitottak-sesztak-es-hanko-letartoztatasat-newscast"]], "img": "https://cdn.origo.hu/2026/10/B3uEdyC3OvYFW4D0rV7GX0GjE_-I_iS8fDF8rf-hDGk/fill/1200/675/no/1/aHR0cHM6Ly9jbXNjZG4uYXBwLmNvbnRlbnQucHJpdmF0ZS9jb250ZW50LzQ5OTczOTQ1ZmU4ZTQ1ZjY5Y2FiYTBmYmQyNWRlODRj.webp", "imgs": "Origo", "imgl": "https://www.origo.hu/belpol/2026/10/elektromos-roller-magyar-peter-bejelentes-szigoritas", "cred": "Fotó: Unsplash (Origo)"}, {"id": "hanko-fodrasz-nem-mehet-be", "r": "Közélet", "c": "Bíróság", "w": "", "st": "Megerősített", "time": "okt. 29.", "t": "Nem engedik be Hankó Balázs fodrászát a börtönbe", "s": "A Bács-Kiskun Megyei Főügyészség elutasította a volt miniszter kérelmét; a döntés nem jogerős.", "p": ["Hankó Balázs volt kulturális és innovációs miniszter hétfőn (október 26.) kérte, hogy budapesti fodrásza vághassa le a haját a kecskeméti börtönben. A Bács-Kiskun Megyei Főügyészség elutasította a kérelmet, amelyet kapcsolattartási kérelemnek minősítettek. A döntés nem jogerős, Hankó panasszal élhet ellene.", "Szerdán derült ki, hogy Hankó és Varga-Bajusz Veronika volt államtitkár letartóztatását február 1-jéig meghosszabbították, mert az ügyészség szerint a szökés, az elrejtőzés, a bizonyítás befolyásolása és a bűnismétlés veszélye fennáll. Az NKA-botrány áprilisban, a választások után robbant ki: a Kiemelt Kulturális Programok Ideiglenes Kollégiuma kormányközeli művészeknek és rendezvényeknek osztott milliárdokat.", "Hankó szeptemberi interjújában azt mondta, a támogatások jogszerűek voltak, az eljárás pedig politikai indíttatású."], "cav": "Az elutasításról az Index a Telexnek adott főügyészségi szóvivői nyilatkozatra hivatkozik. A vádakat bíróság nem bírálta el.", "op": "Egy fodrászügy önmagában apró dolog, a jogállamiságról viszont éppen az ilyen apróságokból derül ki, hogy mindenkire egyformán vonatkoznak-e a szabályok. Ha a börtönben a hétköznapi fogvatartottaknak sincs fodrász, akkor a volt miniszternek sem kell lennie.", "src": [["Index: Nem engedik be Hankó Balázs fodrászát a börtönbe", "https://index.hu/belfold/2026/10/29/hanko-balazs-borton-fodrasz-ugyeszseg-elutasitas/"]], "img": "https://kep.cdn.index.hu/1/0/7185/71855/718557/71855761_5297021_e8aaaf332308cac26b1cf2a87f3af576_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/10/29/hanko-balazs-borton-fodrasz-ugyeszseg-elutasitas/", "cred": "Hankó Balázs 2026. október 1-jén. Fotó: Tövissi Bence / Index"}, {"id": "vitezy-ot-kozutfejlesztes", "r": "Közélet", "c": "Közlekedés", "w": "", "st": "Megerősített", "time": "okt. 29.", "t": "Vitézy Dávid: öt régóta várt közútfejlesztés előkészítése megkezdődött", "s": "Nyíregyházán, Mezőtúron, a 442-esen, Keszthelynél és Kaposvár–Dombóvár között indulnak a tervezések.", "p": ["Vitézy Dávid közlekedési és beruházási miniszter Facebook-oldalán közölte, hogy öt közútfejlesztés előkészítéséről döntött a minisztérium. Nyíregyházán a Tokaji úti sorompós vasúti keresztezést aluljáró váltaná ki, Mezőtúron a 46-os főút és a háromvágányos vasúti keresztezés különszintű kiváltását tervezik, a Szolnok–Kunszentmárton közötti 39,5 kilométeres 442-es főútra felújítási tervet készítenek.", "Keszthelynél egy 7 kilométeres, részben új nyomvonalú út épülhet az M76-os és a keszthelyi elkerülő között, emellett három Balaton-körhöz kapcsolódó kerékpárúti fejlesztés is szerepel. Kaposvár és Dombóvár között egy 20 kilométeres, a településeket elkerülő 61-es főúti nyomvonalat vizsgálnak.", "Vitézy szerint az előző kormány a gyorsforgalmi utakra koncentrált, a meglévő főúthálózat karbantartása háttérbe szorult; idén a Magyar Közút mintegy 20 milliárd forintot fordíthat útfelújításokra."], "cav": "Egyelőre tervezési és engedélyezési munkák kezdődnek; megvalósítási határidőt és költséget a cikk nem közöl.", "op": "A főútfelújítás nem fényes szalagátvágás, de a kisebb városok lakói pontosan ezt érzik meg a mindennapokban. Jó látni, hogy nem csak a gyorsforgalmi hálózat dicsőségéről szól a közlekedéspolitika, csak éppen a pénzt is oda kell tenni a tervek mellé.", "src": [["Index: Bejelentést tett Vitézy Dávid, öt régóta várt fejlesztés kapott zöld utat", "https://index.hu/belfold/2026/10/29/vitezy-david-kozlekedes-kozutfejlesztes-tervezes-elokeszites-felujitas/"]], "img": "https://kep.cdn.index.hu/1/0/7228/72282/722825/72282569_5327083_c65f7c43b8d434f70950f1a7c832e9c2_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/belfold/2026/10/29/vitezy-david-kozlekedes-kozutfejlesztes-tervezes-elokeszites-felujitas/", "cred": "Vitézy Dávid 2026. október 9-én. Fotó: Németh Kata / Index"}, {"id": "uresorvosi-praxisok-lorincz", "r": "Közélet", "c": "Egészségügy", "w": "", "st": "Megerősített", "time": "okt. 29.", "t": "1,75 milliárdra növelik az üres háziorvosi praxisok betöltését segítő keretet", "s": "Lőrincz Viktória szerint több mint ezer körzetben nincs állandó orvos, ez nagyjából 1,4 millió embert érint.", "p": ["A kormány a 2027-es költségvetésben 1,75 milliárd forintra emeli az üres orvosi praxisok betöltését segítő keretet, Lőrincz Viktória vidék- és településfejlesztési miniszter szerda esti Facebook-bejegyzése szerint. A miniszter szerint több mint ezer körzetben nincs állandó orvos, így nagyjából 1,4 millió ember jár változó helyettesítő orvosokhoz.", "A forrást a kormányzati propaganda és a drága rendezvények visszafogásából teremtenék elő. Az önkormányzatokkal együttműködve szolgálati lakásokkal és helyi kedvezményekkel segítenék az orvosok letelepedését. Ez egy négyéves program első lépése, a miniszter elismerte, hogy az évtizedek óta üres rendelőket nem lehet egy nap alatt megtölteni."], "cav": "Az adatok a miniszter bejelentéséből származnak; a keret és a ténylegesen betöltendő praxisok számát a cikk nem veti össze.", "op": "Az 1,75 milliárd nem sok, ha az ember az üres rendelők számára gondol, de az irány jó: aki háziorvost hív falura, annak lakást és közösséget is kell kínálnia, nem csak pénzt. A kérdés az, lesznek-e egyáltalán orvosok, akik el akarnak menni oda.", "src": [["HVG: 1,75 milliárd forintra növelt alappal segítené az üres orvosi praxisok betöltését a kormány", "https://hvg.hu/itthon/20261029_betoltetlen-orvosi-praxisok-lorincz-viktoria"]], "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/71acbc19-5a42-427e-91d8-1a54f01ce0cd.jpg", "imgs": "HVG", "imgl": "https://hvg.hu/itthon/20261029_betoltetlen-orvosi-praxisok-lorincz-viktoria", "cred": "Lőrincz Viktória. Fotó: HVG / Cabrera Martin"}, {"id": "orban-anita-rubio-washington", "r": "Külföld", "c": "Magyar külpolitika", "w": "", "st": "Jelentett", "time": "okt. 29.", "t": "Orbán Anita két nap csúszással találkozik Marco Rubióval Washingtonban", "s": "A külügyminiszterek csütörtökön helyi idő szerint 11 órakor egyetértési megállapodást írnak alá, utána kétoldalú tárgyalás lesz.", "p": ["Az amerikai kormány honlapján megjelent Marco Rubio amerikai és Orbán Anita magyar külügyminiszter találkozójának időpontja, a 444 a Világgazdaságra hivatkozik. A program helyi idő szerint csütörtök 11 órakor, magyar idő szerint 16 órakor kezdődik: előbb egy többtémás egyetértési megállapodás aláírása, utána kétoldalú megbeszélés. Az eredetileg keddre tervezett találkozót elhalasztották, mert Rubio elkísérte Donald Trumpot Texasba.", "Orbán Anita előzetesen nem közölte, miről tárgyalnak. Szerdán Washingtonban Francis Brooke amerikai pénzügyminiszter-helyettessel egyeztetett a magyar makrogazdasági és költségvetési helyzetről, a növekedés ösztönzéséről és további amerikai beruházásokról, emellett konzultált a DFC-vel. Magyar Péter meghívta Rubiót az 1956-os budapesti megemlékezésekre, de nem érkezett el."], "cav": "A cikk megjelenésekor a találkozó még nem zajlott le; az egyetértési megállapodás tartalma nem ismert.", "op": "A késés nem tragédia, az viszont árulkodó, hogy a külügyminiszter útja során előbb a pénzügyi és beruházási témák kerültek elő, nem a nagy geopolitikai kérdések. Egy költségvetési gondokkal küzdő kormánynak ez érthető, de azt a megállapodást érdemes lesz alaposan elolvasni.", "src": [["444: Orbán Anita két nap csúszással randevúzik csütörtökön Marco Rubióval", "https://444.hu/2026/10/29/orban-anita-ket-nap-csuszassal-randevuzik-csutortokon-marco-rubioval"]], "img": "https://assets.4cdn.hu/kraken/8PRBiZQws9gqX2M1s-lg.jpeg", "imgs": "444", "imgl": "https://444.hu/2026/10/29/orban-anita-ket-nap-csuszassal-randevuzik-csutortokon-marco-rubioval", "cred": "Forrás: Orbán Anita Facebook-oldala (444)"}, {"id": "eufor-helikopter-bosznia", "r": "Külföld", "c": "Bosznia", "w": "", "st": "Jelentett", "time": "okt. 29.", "t": "Lezuhant az EUFOR egyik helikoptere Boszniában, hárman meghaltak", "s": "A Brčko közelében lezuhant olasz Chinookon tizenkét ember megsérült.", "p": ["Az Európai Unió bosznia-hercegovinai békefenntartó erejének, az EUFOR-nak egyik helikoptere lezuhant az ország északkeleti részén, Brčko közelében. Három ember meghalt, tizenkettő megsérült. A Klix.ba szerint a gép teljesen megsemmisült.", "Brčko polgármestere az Avaz napilapnak megerősítette a három halálos áldozatról szóló első híreket. A gép az olasz hadsereg ICH-47F Chinook nehéz teherhelikoptere volt. A baleset okát vizsgálják. A 444 az MTI-re, az Il Sole 24 Ore-ra, a Klix.ba-ra és az Avazra hivatkozik."], "cav": "A részletek bosnyák és olasz médiaforrásokból származnak; a baleset oka nem ismert, a szám változhat.", "op": "Egy békefenntartó misszió baleset közben szenvedett veszteséget, ami mindig kegyetlen fordulat. Itt még nincs mit politizálni, csak együttérzés és a vizsgálat eredményére való várakozás.", "src": [["444: Lezuhant az EUFOR egyik helikoptere Boszniában, hárman meghaltak", "https://444.hu/2026/10/29/lezuhant-az-eufor-egyik-helikoptere-boszniaban-harman-meghaltak"]], "img": "https://assets.4cdn.hu/kraken/8PRgcYMNkSPCGWB0s-lg.jpeg", "imgs": "444", "imgl": "https://444.hu/2026/10/29/lezuhant-az-eufor-egyik-helikoptere-boszniaban-harman-meghaltak", "cred": ""}, {"id": "madrid-vonatbaleset-tuntetes", "r": "Külföld", "c": "Spanyolország", "w": "", "st": "Jelentett", "time": "okt. 29.", "t": "Rendbontás volt Madridban a súlyos vasúti baleset után, a szélsőjobb Sánchez lemondását követelte", "s": "Mintegy 1500 ember tüntetett a közlekedési minisztérium előtt, a rendőrség könnygázt vetett be.", "p": ["Szerda este Madridban, a közlekedési minisztérium épülete előtt rendbontás volt. A szélsőjobboldali csoportok által meghirdetett tüntetésen nagyjából 1500 ember vett részt, egy részük összetűzésbe került a rendőrséggel, amely könnygázt vetett be. A tüntetők Pedro Sánchez miniszterelnök és Óscar Puente közlekedési miniszter lemondását követelték.", "A baleset Urda közelében történt: a Renfe nagysebességű vonata belerohant az Iryo szerelvényébe, a két szerelvényen több mint ötszázan utaztak. A HVG szerint legalább 68-an haltak meg. Puente szerint informatikai hiba miatt leállt az automatikus vezérlőrendszer egy 63 kilométeres szakaszon, az atochai irányítóközpont pedig ennek ellenére elindította a Renfe járatát, miközben az Iryo szerelvénye a vágányon állt. A miniszter ezt megmagyarázhatatlannak nevezte, és emberi hibára utalt.", "Ez az év második halálos áldozatokkal járó spanyol vasúti balesete: januárban ugyanazon a Sevilla–Madrid vonalon negyvenöten haltak meg."], "cav": "Az áldozatok száma forrásonként eltér: a korábbi tudósításunk 64 halottról szólt, a HVG legalább 68-at ír. A felelősséget a most indult vizsgálat állapítja meg.", "op": "Egy tragédiát politikai tüntetéssé fordítani aljas dolog akkor is, ha a felelősségre vonás jogos kérdés. A miniszter nyilatkozata az emberi hibáról viszont azt mutatja, hogy a vizsgálat előtt senki ne vonjon le végleges következtetést.", "src": [["HVG: Tüntetés, rendbontás volt Madridban a súlyos vasúti szerencsétlenség után", "https://hvg.hu/vilag/20261029_tuntetes-rendbontas-volt-madridban-a-sulyos-vasuti-szerencsetlenseg-utan"]], "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/aba15d3e-a661-4e78-8dad-757a1bd5cefd.jpg", "imgs": "HVG", "imgl": "https://hvg.hu/vilag/20261029_tuntetes-rendbontas-volt-madridban-a-sulyos-vasuti-szerencsetlenseg-utan", "cred": "Fotó: AFP / Javier Soriano"}, {"id": "szerb-egyetemista-lista-nikolic", "r": "Külföld", "c": "Szerbia", "w": "", "st": "Megerősített", "time": "okt. 29.", "t": "Mirjana Nikolić, az Egyetemista Lista képviselője: első lépés a korábbi kormány dokumentumainak átvilágítása", "s": "A Belgrádi Művészeti Egyetem rektora interjúban beszélt a szerbiai választás utáni tervekről.", "p": ["Mirjana Nikolić, a Belgrádi Művészeti Egyetem rektora az Egyetemista Lista jelöltjeként mandátumot szerzett a szerbiai választáson. A PULSE európai médiaprojekt keretében közölt interjúban a transzparenciát, a jogállamiságot és az egyetemek védelmét ígérte. Szerinte a változást a diákok kétéves munkája tette lehetővé.", "Az első feladatnak a korábbi kormány összes dokumentumához való hozzáférést és azok átvilágítását nevezte, az újvidéki felújítás dokumentációjának nyilvánossága pedig a diákok alapkövetelése, amely szerinte máig nem teljesült. Az Egyetemista Lista mögött nincs hagyományos párt; Nikolić szerint a kulcsszereplők az államfő- és miniszterelnök-jelölt kiválasztása után válnak láthatóvá.", "Tervei között szerepel az ingyenes oktatás, az esélyegyenlőség, a diákszervezetek depolitizálása és az uniós csatlakozás a jogállamiság erősítésével."], "cav": "Az interjú az olasz OBCT anyagán alapul, a HVG szerkesztőségi megerősítés nélkül közli Nikolić állításait.", "op": "A diákmozgalom Szerbiában azt bizonyítja, hogy a közélet megújulása alulról is indulhat, ha a tiltakozás kitart. A nehéz rész most jön: a mozgalmi lelkesedésből kormányzati munkát csinálni még a tapasztalt pártoknak is nehezen megy.", "src": [["HVG: A Belgrádi Művészeti Egyetem rektora: „Számon kell kérnünk mindenkit, aki kárt okozott az országnak”", "https://hvg.hu/vilag/20261029_szerbia-valasztas-egyetemista-lista-mirjana-nikolic-pulse"]], "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/be62e2bd-5b25-4c23-b427-619b131d484a.jpg", "imgs": "HVG", "imgl": "https://hvg.hu/vilag/20261029_szerbia-valasztas-egyetemista-lista-mirjana-nikolic-pulse", "cred": "Fotó: HVG"}, {"id": "spar-kulonado-kotelezettsegszegesi", "r": "Gazdaság", "c": "Kereskedelem", "w": "", "st": "Jelentett", "time": "okt. 29.", "t": "A Spar osztrák vezetője uniós kötelezettségszegési eljárást sürget a magyar különadó miatt", "s": "Hans Reisch szerint a Tisza-kormány eddigi lépései látszatintézkedések, az „eufória” alaptalannak bizonyult.", "p": ["Hans Reisch, a Spar osztrák anyavállalatának vezetője újabb levelet küldött az Európai Bizottságnak, és kötelezettségszegési eljárást sürget Magyarország ellen a kiskereskedelmi különadó miatt. Szerinte a külföldi áruházláncok rendszerszintű hátrányos megkülönböztetést szenvednek, és nem számít arra, hogy a kormány a közeljövőben megszünteti az adót.", "A kormány eltörli az árrésstopot, ám a különadó a 2027-es költségvetésben is megmarad: az 50 milliárd forint feletti adóalapra 4,5 százalékos kulcs vonatkozik. A Spar szerint a két intézkedés együtt évente mintegy 130 millió eurós terhet jelent, ebből 90 millió euró a különadó, 40 millió pedig az árrésszabályozás. Peter Manhartsberger igazgató a Die Presse-nek azt mondta, a magyar kormánnyal kapcsolatos várakozások nem váltak valóra."], "cav": "A cég saját érdekből nyilatkozik; a számokat és a diszkriminációra vonatkozó állítást független forrás nem erősítette meg.", "op": "Egy külföldi multi természetesen az adóterheit panaszolja, ez nem hír. Az viszont, hogy a különadó a Tisza-költségvetésben is marad, jelzi: az egyensúly kedvéért a kormány sem mond le azokról az eszközökről, amelyeket ellenzékben bírált.", "src": [["Index: „Alaptalannak bizonyult az eufória”", "https://index.hu/gazdasag/2026/10/29/spar-osztrak-anyavallalat-kiskereskedelmi-kulonado-tisza-kormany/"]], "img": "https://kep.cdn.index.hu/1/0/5572/55720/557207/55720723_4119053_26e71b5821c3d42ba03671ea2a4e50e4_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/gazdasag/2026/10/29/spar-osztrak-anyavallalat-kiskereskedelmi-kulonado-tisza-kormany/", "cred": "Illusztráció. Fotó: Németh Kata / Index"}, {"id": "otthon-start-ingatlanos-roham", "r": "Gazdaság", "c": "Lakáspiac", "w": "Wekerle+", "st": "Jelentett", "time": "okt. 29.", "t": "Megrohamozták az ingatlanosokat az Otthon Start megszűnésének bejelentése után", "s": "A Duna House szerint a héten 1000–2000-rel több adásvétel jöhet létre az átlagosnál.", "p": ["A kormány kedden bejelentette, hogy az Otthon Start 3 százalékos hitelét csak az október 31-ig megkötött szerződésekhez lehet igényelni, a hitelkérelmet november 15-ig még be lehet adni. A Duna House szerint azonnal megugrott az érdeklődés, a hét végéig országosan 1000–2000-rel több adásvétel jöhet létre, mint egy átlagos héten.", "A vevők főleg tiszta tulajdoni lapú, azonnal eladható ingatlanokat keresnek. Nem a kínálat, hanem az ügyvédi kapacitás szűkös. A BiztosDöntés.hu számítása szerint a program november 15-i lezárásakor a teljes hitelösszeg akár 2500 milliárd forintot is elérhet; az indulás óta idén augusztus végéig 2045 milliárd forintnyi szerződést kötöttek. Egy év alatt a támogatott hitelek aránya az új lakáshiteleken belül 20–25 százalékról körülbelül 80 százalékra nőtt, az átlagos hitelösszeg 19,6 millióról 27,4 millió forintra."], "cav": "A 2500 milliárdos összeg a BiztosDöntés.hu becslése, az 1000–2000 plusz adásvétel a Duna House előrejelzése.", "op": "A rövid határidő panikot szül, és aki most kapkod, az könnyen túlfizeti az ingatlant. Az árak tavaly óta futtak, a támogatott hitel pedig nagyban hozzájárult ehhez, szóval a kivezetés végül a piacot is kijózaníthatja.", "src": [["HVG: Megrohamozták az ingatlanosokat a kormány bejelentése után", "https://hvg.hu/gazdasag/20261029_otthon-start-lakas-hitel-bejelentes"]], "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/6865ed88-49e0-40ea-be1b-7b7a72615489.jpg", "imgs": "HVG", "imgl": "https://hvg.hu/gazdasag/20261029_otthon-start-lakas-hitel-bejelentes", "cred": "Fotó: HVG / Fazekas István"}, {"id": "kamarai-hozzajarulas-megszunes", "r": "Gazdaság", "c": "Vállalkozások", "w": "", "st": "Megerősített", "time": "okt. 28.", "t": "Törvényjavaslat: 2027-től megszűnik az 5000 forintos kötelező kamarai hozzájárulás", "s": "Több mint 900 ezer vállalkozást érint, a kormány évi 4,5 milliárd forint bevételkiesést vállal.", "p": ["A Tisza-kormány törvényjavaslatot nyújtott be október 27-én késő este, amely megszüntetné a vállalkozások évi 5000 forintos kötelező kamarai hozzájárulását 2027. január 1-jétől. A javaslat a hátralékok behajtására vonatkozó rendelkezést is hatályon kívül helyezné, a kamarai regisztráció viszont kötelező maradna.", "A kiesés évi nagyjából 4,5 milliárd forint, és több mint 900 ezer vállalkozást érint. A kormány indoklása szerint a díjért a legtöbb cég nem kapott kézzelfogható szolgáltatást. A javaslat nem rendelkezik arról, honnan pótolnák a kieső bevételt. A kamarai rendszer átfogó átvilágítását is bejelentették, amelyet kamarai biztos vezet; az MKIK tudomásul vette a döntést."], "cav": "A szövegben szereplő idézetek a Portfolio saját szavai a kormány indoklásáról; a javaslat még nem lett törvény.", "op": "Az ötezres tétel nem rengeti meg a cégek költségvetését, de szimbolikus: ha valamiért fizetni kell, akkor valamit adjon is cserébe. A kamarák átvilágítása a valódi kérdés, mert a kieső 4,5 milliárd mögött komoly intézményi hatalom áll.", "src": [["Portfolio: Közel 1 millióan fizették a terhet, januártól megszünteti a Tisza-kormány", "https://www.portfolio.hu/gazdasag/20261028/kozel-1-millioan-fizettek-a-terhet-januartol-megszunteti-a-tisza-kormany-872442"]], "img": "https://pcdn.hu/articles/images-xl/o/r/s/orszaghaz-parlament-budapest-duna-magyarorszag-epiteszet-turizmus-fovaros-kormany-politika-856854.jpg", "imgs": "Portfolio", "imgl": "https://www.portfolio.hu/gazdasag/20261028/kozel-1-millioan-fizettek-a-terhet-januartol-megszunteti-a-tisza-kormany-872442", "cred": "Illusztráció. Fotó: Getty Images (Portfolio)"}, {"id": "kubatov-eltavolitas-jogaszok", "r": "Sport", "c": "Sportpolitika", "w": "", "st": "Jelentett", "time": "okt. 29.", "t": "Jogászok szerint nehezebb lesz Kubatov Gábort elmozdítani a Ferencváros éléről, mint a kormány gondolta", "s": "A tervezett összeférhetetlenségi törvény jelen formájában nem feltétlenül vonatkozik rá.", "p": ["Kedden a Ferencváros tisztújító közgyűlésén Kubatov Gábort újabb négy évre megválasztották az FTC elnökének. A kormány múlt szombaton nyújtotta be a sportbeli politikai összeférhetetlenségi törvénytervezetet, amely szerint a tisztségviselők a tisztségük alatt és megszűnése után négy évig nem lehetnek sportvezetők. Magyar Péter szeptemberben azt mondta, a javaslat Kubatovra is vonatkozik majd.", "Borbély Zoltán ügyvéd szerint a tervezet jelen formájában Kubatovra nem vonatkozik: a tervezet csak a pártok első számú vezetőit nevesíti, ő pedig már nem képviselő, így a 60 napos rendezési határidő sem alkalmazható rá. Wenczel Kristóf sportjogász egyetért. Kubatov azt mondta, már nem politikus, és szerinte a visszaható hatály miatt a köztársasági elnök nem írja alá a törvényt.", "A Fradiváros-ügyben a Belügyminisztérium augusztus 28-án feljelentést tett a csaknem 25 milliárd forintos állami támogatás felhasználása miatt. Kálnoki-Kiss Attila sportállamtitkár nem zárta ki, hogy a tervezet módosul."], "cav": "A jogi értelmezés a két megszólaló szakértő véleménye; a tervezet még módosulhat. A Fradiváros-ügyben senkit nem mondtak ki bűnösnek.", "op": "Ha a jogalkotás célja egy konkrét embertől való megszabadulás, az a legrosszabb módszer egy törvényhez: vagy általános szabályt hoznak, vagy ne ígérjenek célzott csapást. A sportban az összeférhetetlenség jogos kérdés, csak ne egy személy köré kelljen megírni.", "src": [["Index: Jogászok szerint sokkal nehezebb lesz Kubatov Gábort elmozdítani, mint azt Magyar Péterék gondolták", "https://index.hu/sport/2026/10/29/ferencvaros-kubatov-gabor-elnok-osszeferhetetlensegi-torveny-magyar-peter-kormany-jogaszok-fradivaros/"]], "img": "https://kep.cdn.index.hu/1/0/7227/72276/722766/72276615_5326679_919b3fe805ee3b2e06fc2db15de3d5cf_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/sport/2026/10/29/ferencvaros-kubatov-gabor-elnok-osszeferhetetlensegi-torveny-magyar-peter-kormany-jogaszok-fradivaros/", "cred": "Kubatov Gábor 2026. október 27-én. Fotó: Papajcsik Péter / Index"}, {"id": "magyar-kupa-4-fordulo", "r": "Sport", "c": "Labdarúgás", "w": "", "st": "Megerősített", "time": "okt. 28.", "t": "Magyar Kupa: a Fradi simán továbbjutott Bicskén, a Paks és a DVSC is nehezen", "s": "A Debrecen Csepelen fordított, a Paks Cigándon az utolsó percekben nyert.", "p": ["A Magyar Kupa 4. fordulójában a Bicskei TC ellen a Ferencváros az Index szerint továbbjutott. A hazaiak gólját a csapatkapitány, Király Patrik szabadrúgásból szerezte. A cikk címe és bevezetője 4–1-es fővárosi győzelmet jelez, a táblázat az 1–1-es félidei állást mutatja.", "A Csepel SC–Debreceni VSC mérkőzést a Debrecen nyerte 3–2-re, miután a hazaiak a 90. perc végén még 2–1-re vezettek. Cigándon a Paks 2–1-re győzött, Szalai József a 91. percben döntött. A Szentlőrinc–Vasas 3–4, a Monor–MTK 1–5, a Tiszaújváros–Kecskemét 0–4 (Merényi Ádám három gólt szerzett), az Ózd-Sajóvölgye–Nyíregyháza 1–3 hosszabbítás után, az ESMTK–Haladás pedig tizenegyesekkel 4–2 lett."], "cav": "A cikk a Fradi–Bicske végeredményt a bevezetőben 4–1-nek, a táblázatban 1–1-nek mutatja (utóbbi valószínűleg a félidei állás); a Fradi góllövőit nem nevezi meg.", "op": "A kupa legnagyobb varázsa pont az ilyen forduló: a kisebbek ugyan kikaptak, de a bajnokesélyes elleni vezetés vagy a hosszabbítások sokat adnak a sorozatnak. A Fradinak közben a pályán kívüli viták miatt is nagyobb a téttel bíró idény.", "src": [["Index: Óriási gólt kapott a Ferencváros a Magyar Kupában, majd megszórta az ellenfelét", "https://index.hu/sport/futball/2026/10/28/ferencvaros-fradi-bicske-magyar-kupa-szabadrugas/"]], "img": "https://kep.cdn.index.hu/1/0/7227/72277/722778/72277843_5326769_09295653aa57c751199c27afd7e1e6b0_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/sport/futball/2026/10/28/ferencvaros-fradi-bicske-magyar-kupa-szabadrugas/", "cred": ""}, {"id": "liverpool-chelsea-ligakupa", "r": "Sport", "c": "Labdarúgás", "w": "", "st": "Megerősített", "time": "okt. 29.", "t": "Tizenegyesekkel ejtette ki a Chelsea-t a Liverpool az angol Ligakupában", "s": "A mérkőzés 1–1 után a párbajt 6–5-re nyerte a Liverpool; Szoboszlai sérülés miatt kimaradt.", "p": ["A Liverpool–Chelsea Ligakupa-nyolcaddöntő 1–1-es döntetlennel zárult a rendes játékidőben, a tizenegyespárbajt a Liverpool nyerte 6–5-re. A Chelsea a 40. percben Morgan Rogers büntetőjével szerzett vezetést, majd Cody Gakpo szintén tizenegyesből egyenlített. A Liverpoolnál Szoboszlai Dominik sérülés, Kerkez Milos rotáció miatt maradt ki.", "Az Index beszámolója szerint a Bournemouth 3–0-ra verte az Aston Villát, a Manchester City 2–2 után tizenegyesekkel jutott tovább a Brighton ellen, a negyedosztályú Fleetwood büntetőkkel kiejtette a címvédő Arsenalt. A negyeddöntőben a Liverpool a Bournemouth-tal találkozik."], "cav": "A cikk nem részletezi a tizenegyespárbaj teljes sorrendjét; a Szoboszlai-hiányt sérülésként említi.", "op": "A tizenegyespárbaj mindig kicsit szerencsejáték, és ezúttal a Liverpool húzta a jobbik végét. Magyar szemmel az a kérdés, felépül-e Szoboszlai a Bournemouth elleni negyeddöntőre.", "src": [["Index: Tizenegyesek után ejtette a Chelsea-t a Liverpool", "https://index.hu/sport/futball/2026/10/29/liverpool-chelsea-angol-ligakupa-nyolcaddonto-tizenegyesparbaj-bournemouth"]], "img": "https://kep.cdn.index.hu/1/0/7228/72282/722822/72282261_5327061_104e2ad7b5b5254d847d50f8fa563ab1_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/sport/futball/2026/10/29/liverpool-chelsea-angol-ligakupa-nyolcaddonto-tizenegyesparbaj-bournemouth", "cred": "Fotó: Ian Hodgson / Reuters"}, {"id": "nyary-arkotottseg-foliazas", "r": "Kultúra", "c": "Könyvpiac", "w": "", "st": "Jelentett", "time": "okt. 28.", "t": "Nyáry Krisztián: jobban jártunk volna, ha a kormány semmit sem csinál a könyvpiacon", "s": "A Líra kreatív igazgatója szerint az árkötöttség kivezetése nem hoz nagy árcsökkenést, a fóliázás öncenzúrát szült.", "p": ["Nyáry Krisztián, a Líra Könyv kreatív igazgatója az Indexnek azt mondta, a 2024. október 1-je óta hatályos árkötöttség miatt az új könyveket megjelenéstől számított 365 napig legfeljebb 10 százalékos kedvezménnyel lehet árulni. Tarr Zoltán miniszter június 11-én bejelentette a felfüggesztést, a törvény azonban még hatályban van. Az Index értesülése szerint 2027 elején kivezetik, Nyáry ezt megerősítette, a minisztérium nem.", "A fóliázást egy 2021-es kormányrendelet írja elő. Nyáry szerint nincsenek ellenőrzések, de öncenzúra alakult ki: a kiadók és terjesztők sokszor ki sem teszik a boltokba az érintett köteteket. Az Országgyűlés október 13-án kivette a gyermekvédelmi törvényből az LMBTQ-tartalmakra vonatkozó korlátozásokat, a rendelethez nem nyúltak. Magyar Péter szerint nem látott fóliázott könyveket, és a kormány nem tervezi a szabályozás módosítását.", "A könyvpiac stagnál, Nyáry szerint nem az árkötöttség, hanem a kisebb vásárlóerő miatt. Szerinte a piac helyett az olvasót kellene támogatni, például a pedagógusok és a közművelődésben dolgozók könyvvásárlását."], "cav": "A kivezetés időpontját a minisztérium nem erősítette meg; Nyáry érdekelt fél a könyvpiacon.", "op": "Az, hogy egy rendeletet senki sem ellenőriz, mégis az önkéntes öncenzúra hat, jól mutatja, mennyire elég egy rossz szabály puszta léte. Ha a kormány tényleg a könyvpiacot akarja segíteni, az olvasók támogatása többet ér, mint a polcok szabályozása.", "src": [["Index: Nyáry Krisztián: Jobban jártunk volna, ha a kormány semmit sem csinál", "https://index.hu/kultur/2026/10/28/nyary-krisztian-lira-kormany-folia-jogalkotas-konyv-piac-arkotottseg/"]], "img": "https://kep.cdn.index.hu/1/0/7226/72265/722653/72265375_5325897_56cc35d6fd1b768cf40651be258fa3fa_wm.jpg", "imgs": "Index", "imgl": "https://index.hu/kultur/2026/10/28/nyary-krisztian-lira-kormany-folia-jogalkotas-konyv-piac-arkotottseg/", "cred": "Nyáry Krisztián 2024. szeptember 12-én. Fotó: Tövissi Bence / Index"}, {"id": "matolcsy-szerzodes-felbontas", "r": "Belpolitika", "c": "Bűnügy", "w": "MNB-ügy", "st": "Jelentett", "time": "okt. 28.", "t": "Öt nappal a Matolcsy-szerződés után már vissza is akarták vonni: visszamenőleges felbontást kerestek", "s": "A 444 szerint 2025. március 5-én, öt nappal a megállapodás után bontották volna fel a PADME-vagyont érintő szerződést.", "p": ["A HVG a 444 beszámolójára hivatkozva azt írja, hogy 2025. március 5-én, mindössze öt nappal az eredeti megállapodás aláírása után visszamenőleges hatállyal próbálták felbontani azt a szerződést, amellyel az MNB-alapítvány vagyonkezelője az egyik leányvállalata teljes részvénycsomagját egy magántőkealapnak adta át. A felbontó dokumentumot Stofa György, az Optima Befektetési Zrt. akkori vezetője és Valkó Mihály, a Quartz Befektetési Alapkezelő Zrt. vezérigazgatója írta alá. Indoklásként az szerepel, hogy az eredeti szerződésben vállalt feladatok teljesítésére „a továbbiakban nem tartottak igényt”.", "Az eredeti szerződést 2025. február 28-án kötötték, Matolcsy György utolsó tényleges jegybankelnöki munkanapján. Eszerint az Optima Zrt. átadta az Optima Befektetési Alapkezelő Zrt. 100 százalékos részvénycsomagját a Közép-Európai III. Magántőkealapnak. Az ügylet különlegessége, hogy értékpapír-kölcsönszerződésként kötötték, miközben a részvények tulajdonjoga a kölcsönvevőhöz került volna. A szerződés öt évre szólt, és tulajdonosi jogokat biztosított volna a magántőkealapnak. A cikk szerint az alapot kezelő Quartz üzleti kapcsolatai révén Matolcsy Ádám köréhez kötődik. A szerződés nem írt elő vételárat, a felbontó irat szerint pedig a felek között nem keletkezett elszámolandó ellenérték.", "A szerződést végül akkor bontották fel, amikor már Varga Mihály vezette a jegybankot. Az új elnök érkezése után a PADME alapítvány kuratóriumának tagjai lemondtak, és személyi változások történtek az irányításban. A felbontó dokumentum szerint az alapítvány maga kívánja irányítani a szerződésben szereplő feladatok teljesítését. A nyomozó ügyészség a HVG szerint a múlt héten őrizetbe vette Matolcsy Györgyöt, akinek letartóztatását a bíróság elrendelte. A cikk szerint Sándor Tamás ügyvédet és Valkó Mihályt is meggyanúsították. Matolcsy Ádám és Stofa György ellen október 27-én európai és nemzetközi elfogatóparancsot adott ki a bíróság."], "cav": "A cikk másodkézből, a 444 beszámolója alapján számol be a szerződésekről, az eredeti iratokat nem láttuk. Nem derül ki belőle, hogy a gyanú pontosan milyen jogi lépésekre és bizonyítékokra épül, a bíróság döntésének indoklása sincs benne, az ügy egyes részeit a cikk szerint még vizsgálják.", "op": "Ha egy szerződést öt nappal az aláírás után már vissza akarnak vonni, az nem tűnik véletlennek: vagy a felek is érezték, hogy a konstrukció nem állja ki a nyilvánosságot, vagy a jegybanki vezetőváltás után egyszerűen menekülni akartak belőle. Hogy melyik, azt a bíróságnak kell majd megállapítania, nem nekünk.", "src": [["HVG: Megpróbálták visszamenőleg felbontani azt a szerződést, ami miatt Matolcsy Györgyöt letartóztatták", "https://hvg.hu/itthon/20261028_visszamenoleges-felbontas-szerzodes-matolcsy-gyorgy-letartoztatas"], ["Index: Nemzetközi elfogatóparancsot adtak ki Matolcsy Ádám ellen", "https://index.hu/belfold/2026/10/27/nemzetkozi-elfogatoparancs-matolcsy-adam-europai-unio/"]]}, {"id": "fidesz-otthon-start-reakcio", "r": "Belpolitika", "c": "Ellenzék", "w": "Wekerle+", "st": "Megerősített", "time": "okt. 28.", "t": "A Fidesz szerint a kormány „brüsszeli ajánlásra” szünteti meg az Otthon Startot, és 16 millióval drágább lesz a hitel", "s": "A párt 3 helyett 5 százalékos kamattal számol a használt lakásokra, a számítás az 50 milliós, 25 éves hitelre készült.", "p": ["A Fidesz közleményben reagált arra, hogy a Tisza-kormány megszünteti az Otthon Start Programot. A párt szerint ezt a kormány „brüsszeli ajánlásnak megfelelően” teszi. Az Index szerint a közlemény alapján a fiatal családok a jövőben használt lakás vásárlásához 3 helyett 5 százalékos hitelt vehetnek fel.", "A Fidesz számítása szerint egy 50 millió forintos, 25 éves futamidejű lakáshitel havi törlesztőrészlete 55 ezer forinttal emelkedne, ha a kamat 3-ról 5 százalékra nőne. A teljes futamidő alatt ez nagyjából 16 millió forintos többletet jelentene. A párt szerint az intézkedésnek nincs értelmes indoka, és a költségvetés eddig ismert adatai alapján sem a családoknak, sem a vállalkozóknak, sem a nyugdíjasoknak nincs okuk örülni.", "A cikk háttérként ismerteti, hogy Magyar Péter miniszterelnök, Kármán András és Kapitány István október 27-én mutatta be a Wekerle-program részleteit. A kormány szerint az új csomag célja, hogy a támogatások célzottabban jussanak el a lakhatási nehézségekkel küzdőkhöz, és ne csak a vásárlást, hanem az ingatlanállomány korszerűsítését és a megfizethető lakhatás bővítését is segítse."], "cav": "Az 5 százalékos kamatot a Fidesz közleménye említi, a kormányoldali ismertetésben (lásd a Wekerle+ cikkünket) a használt lakás hitelét csak „a piachoz közelebbinek” írták le. Az Index cikke nem részletezi, melyik brüsszeli ajánlásra hivatkoznak, és az Otthon Start megszűnésének időpontját sem közli. A havi 55 ezer forintos különbség egy annuitásos, 25 éves törlesztés mellett számtanilag kijön, de ez csak akkor érvényes, ha tényleg 5 százalék lesz a kamat.", "op": "A Fidesz érvelése abból a szempontból erős, hogy konkrét összeget mond, ami hatásosabb az elvont kritikánál. Az viszont, hogy a kormány „Brüsszel kedvéért” dönt, politikai jelző, a cikk nem hoz rá bizonyítékot. A vita valódi tárgya az, hogy az Otthon Start kamattámogatása (és az árfelhajtó hatása) hosszú távon fenntartható volt-e.", "src": [["Index: A Fidesz reagált az Otthon Start kivezetésére", "https://index.hu/belfold/2026/10/28/wekerle-plusz-program-tisza-kormany-fidesz-reakcio-otthonstart-program/"], ["Index: Wekerle Lakásprogram – percről percre", "https://index.hu/belfold/2026/10/27/magyar-peter-karman-andras-2027-koltsegvetes-ado-szja-kata-tisza-kormany-kapitany-istvan/"]]}, {"id": "felmeresek-publicus-iranytu", "r": "Belpolitika", "c": "Közvélemény", "w": "", "st": "Jelentett", "time": "okt. 26.", "t": "Két friss felmérés, két irány: a Publicus szerint fogy a Tisza előnye, az Iránytű szerint a nyugdíjasok is átállnak", "s": "A Publicus a biztos szavazók között 63–25 százalékot mért a Tisza javára, az Iránytű a 65 év felettieknél 42–30-at.", "p": ["Az Index október 22-én ismertette a Publicus Intézet október 8–16. között, 1001 ember telefonos megkérdezésével készült országos felmérését. A biztos szavazó pártválasztók körében a Tisza 63, a Fidesz 25, a Mi Hazánk 7 százalékon áll, a teljes mintában a Tisza 46, a Fidesz 19 százalékot kapott, a válaszadók 27 százaléka bizonytalan. A Demokratikus Koalíció és a Kétfarkú Kutya Párt 1–2 százalék körül van.", "A cikk szerint a Tisza támogatottsága a biztos szavazók között májusban 73 százalék volt (ez a csúcs), júliusban 68, augusztusban 65, októberben 63. A Fidesz májusi 20 százalékos mélypontjáról 25-re emelkedett, a két párt közti különbség 53 százalékpontról 38-ra szűkült. A tavaszi, választás előtti felméréshez képest a Tisza 52-ről 63 százalékra nőtt, a Fidesz 39-ről 25-re csökkent. Magyar Pétert 56 százalék tartja alkalmasnak miniszterelnöknek, Orbán Viktort 36 százalék. A válaszadók 58 százaléka elégedett az országban zajló folyamatokkal, augusztusban ez 61 százalék volt.", "A HVG az Iránytű Intézet felmérését ismertette október 26-án. Eszerint a Fidesz az április 12-i választás óta több mint tíz százalékpontnyi szavazót vesztett, a nyugdíjasok körében pedig megfordult a tavaszi állás, és a Tisza előnye mára két számjegyű. A kutatás az augusztusi, szeptemberi és októberi országos reprezentatív felmérések adatait vonta össze egy 3000 fős mintán. A 18–29 évesek között a Tisza 67, a Fidesz 12 százalékon áll, a 65 év felettieknél a Tisza 42, a Fidesz 30, ebben a korcsoportban a legmagasabb a bizonytalanok aránya (18 százalék). A Tisza minden csoportban vezet, kivéve a legföljebb nyolc általánost végzetteket, ahol a Fidesz 37, a Tisza 36 százalékon áll. Pék Szabolcs, az intézet vezető elemzője szerint a nyugdíjasok átállását az magyarázza, hogy „mindenki a győzteshez húz”, a fideszes propaganda szétesése is szerepet játszhat."], "cav": "A két kutatás módszere és bázisa eltér: a Publicus 1001 fős telefonos felmérés a biztos szavazókra és a teljes mintára is közöl adatot, az Iránytű három hónap felmérését vonta össze 3000 fős mintán, ezért a számok nem vethetők össze közvetlenül. A Publicus szerint a havi mérések közötti 1–5 százalékpontos változás a mintahiba közelében van, de a május óta látható tendencia egyértelmű. A HVG cikke az Iránytű esetében nem közöl hibahatárt és a kérdezés módját sem részletezi.", "op": "Ha két felmérés a Tisza előnyét eltérő irányba mozgatja, az nem feltétlenül ellentmondás: a Publicus a hónapokon át látható enyhe fogyást mutatja egy óriási előny mellett, az Iránytű pedig azt, hogy az idősebb választók egy része is átállt. A közvélemény-kutatások közös tanulsága: a Tisza előnye még nagy, de nem állandó, és a bizonytalanok nagy aránya miatt a következő hónapok többet mondanak majd.", "src": [["Index: Apránként fogy a Tisza előnye a Fidesszel szemben a Publicus friss felmérése szerint", "https://index.hu/belfold/2026/10/22/publicus-felmeres-tisza-part-fidesz-tamogatas-magyar-peter-orban-viktor/"], ["HVG: Iránytű Intézet: A Tisza már a nyugdíjasoknál is vezet a Fidesszel szemben", "https://hvg.hu/itthon/20261026_tisza-part-fidesz-nyugdijasok-kutatas-iranytu-intezet"]]}, {"id": "mohacsi-duna-hid", "r": "Közélet", "c": "Infrastruktúra", "w": "", "st": "Megerősített", "time": "okt. 26.", "t": "Vitézy: nem állítják le a mohácsi Duna-hidat, 75 milliárdot spóroltak az útépítéseken", "s": "A miniszter szerint a Fidesz helyi politikusai hazugságokat terjesztenek, a kivitelező pedig visszafizeti a teljesítéssel nem fedezett 59 milliárdos előleget.", "p": ["Vitézy Dávid közlekedési és beruházási miniszter a közösségi oldalán közölte, hogy a kormány befejezi a mohácsi Duna-híd építését, a pénz pedig a jövő évi költségvetésben is megvan. Szerinte a Fidesz helyi politikusai naponta hazugságokat terjesztenek arról, hogy a Tisza-kormány leállítja a beruházást.", "A kormányváltás után a beruházást felülvizsgálták. A kapcsolódó útépítések észszerűsítésével mintegy 75 milliárd forintot takarítanak meg, a kivitelezővel pedig megállapodtak abban is, hogy visszafizeti az 59 milliárd forintnyi, teljesítéssel nem fedezett előleget. Vitézy szerint a híd az előző kormány beruházáspolitikájának hibáit mutatja: a forgalmi adatokkal nem igazolható, túlméretezett fejlesztéseket terveztek, a költségek elszálltak, a kivitelező példátlanul magas előleget kapott.", "A munkákról a cikk szerint a három egymáshoz kapcsolódó acél ívhíd elemeit emelik a helyükre, a mederpillér utolsó két előregyártott kéregelemét is beemelték, a szokatlanul alacsony vízállás ellenére. Az ütemterv szerint a jobb parti acélívek beemelése várhatóan október végéig tart, utána januárig a bal parti munkák következnek. A 2027-es költségvetés biztosítja a pénzt, de a forrás nagyobb részét 2027-ben és 2028-ban kell előteremteni, ezért a híd finanszírozása Vitézy szerint „a Tisza-kormányra maradt”."], "cav": "A cikk Vitézy Dávid közösségi médiás közlésére épül, a Fidesz vagy a kivitelező válaszát nem tartalmazza. A 75 milliárdos megtakarítást és az előleg visszafizetésére vonatkozó megállapodást független forrás nem erősítette meg.", "op": "A kormány itt azt mutatja, amit az új vezetéstől várunk: nem állítja le azt, ami már épül, de számon kéri a túlméretezett és túlárazott részeket. A vitában az a legfontosabb, hogy a híd befejeződjön, és a 59 milliárdos előleg tényleg visszakerüljön az államkasszába.", "src": [["Index: Vitézy Dávid: Nem állítjuk le a mohácsi Duna-hidat, a fideszesek hazugságokat terjesztenek", "https://index.hu/belfold/2026/10/26/mohacs-hid-vitezy-david-fidesz-tisza-kormany-beruhazas"]]}, {"id": "parlamenti-beszolasok-jegyzokonyv", "r": "Belpolitika", "c": "Parlament", "w": "", "st": "Megerősített", "time": "okt. 26.", "t": "Bingó, Xanax és „paraszt”: ezt nem hallottad az Országgyűlés élő adásában", "s": "Az Index a parlamenti jegyzőkönyvekből szemezgetett az októberi ülések kevésbé hangos pillanataiból.", "p": ["Az Index sorozatot indított az Országgyűlés jegyzőkönyveiből: a szerkesztők több száz oldalnyi naplót néztek át, hogy megtalálják az élő közvetítésben nem hallható beszólásokat. A harmadik rész az októberi ülésekből válogat, mert a parlament ebben a hónapban már nem ülésezik.", "Október 12-én a Fidesz képviselői előre elkészített „Magyar Péter-bingóval” figyelték a miniszterelnököt, rajta a gyakori kifejezéseivel. Amikor Magyar Péter az Orbán-kormányról korrupciót és bűnözést említett, több ellenzéki képviselő bingót kiáltott. Október 13-án az Országgyűlés megszavazta a gyermekvédelmi törvény módosítását, ekkor Novák Előd (Mi Hazánk) beszólt, a házelnök Forsthoffer Ágnes pedig figyelmeztette. A Médiatanácsról szóló szavazás után, amelyen a tiszás többség nem támogatta a Fidesz jelöltjét, a Fidesz képviselői kivonultak.", "Október 13-án Bujdosó Andrea frakcióvezető indulatos felszólalása után az ellenzéki padsorokból orvost és nyugtatót ajánlottak neki, a jegyzőkönyv szerint Kovács Petra Judit pedig a „paraszt” szót használta, amely felzúdulást okozott. Ő még aznap bocsánatot kért. Október 19-én Szabó Bálint, a korábbi tüntetések trombitás szereplője a Fidesz mögötti páholyból vitába keveredett Magyar Péterrel, a házelnök többször kérte, hogy hagyja el a termet, végül Bóka János frakcióvezető intézte el, hogy távozzon."], "cav": "A cikk a jegyzőkönyvekből idéz, az eseményeket más forrás nem erősítette meg, és az egyes szereplők saját magyarázatát nem közli. A beszólások egy része rosszindulatú, ezért a cikk szövegét nem idézzük.", "op": "A parlamenti beszólások nem bűn, de a jegyzőkönyvek tükrében látszik, mennyi energia megy el a személyeskedésre a tényleges vita helyett. A közvetítésben nem hallható mondatok hiányoztak a közvélemény elől: nem lenne baj, ha a mikrofon mindig mindent rögzítene.", "src": [["Index: „Xanax! Paraszt!” – parlamenti jegyzőkönyv-válogatás", "https://index.hu/belfold/2026/10/26/orszaggyules-parlament-vita-jegyzokonyv-orszaggyulesi-naplo-magyar-peter-pocs-janos-bujdoso-andrea-szabo-balint/"]]}, {"id": "audi-doellner-trump", "r": "Külföld", "c": "Gazdaság", "w": "", "st": "Megerősített", "time": "okt. 26.", "t": "Az Audi vezérigazgatójának lemondását követelik, mert Trump kampányrendezvényén lépett fel", "s": "Gernot Döllner szombaton Georgiában állt színpadra, ahol Trump bejelentette az Audi 4,2 milliárd dolláros amerikai gyárát.", "p": ["Gernot Döllner, az Audi vezérigazgatója szombaton, október 24-én Georgia államban állt színpadra Donald Trump mellett egy kampányrendezvényen. A Telex szerint Trump ott jelentette be, hogy az Audi 4,2 milliárd dolláros beruházással megépíti első amerikai gyárát. A tervek szerint az üzemben évente mintegy 200 ezer autót gyártanának, és nagyjából 4500 munkahelyet teremtene. Az Audi később megerősítette a gyárépítés tervét.", "A körülmények megosztották a német közvéleményt: bírálói szerint a vezérigazgató a részvételével politikai célokra használta fel a vállalat beruházását. Christiane Benner, az IG Metall elnöke szerint a fellépés politikailag elfogadhatatlan volt, a Handelsblatt szerint Döllner átlépett egy vörös vonalat. Daniela Cavallo, a Volkswagen-csoport üzemi tanácsának elnöke szerint a szereplés ellentétes a vállalati szabályzattal: a Volkswagen politikai semlegességet vár el a vezetőitől, a választások előtti három hónapban pedig tiltja, hogy képviselői nyilvános rendezvényen jelöltekkel szerepeljenek. Cavallo elismerte, hogy az amerikai gyártás gazdaságilag előnyös lehet Trump magas vámjai miatt, és emlékeztetett, hogy a beruházáshoz a Volkswagen felügyelőbizottságának még jóvá kell hagynia.", "A Baloldal párt társelnöke, Luigi Pantisano lemondásra szólította fel az Audi vezérigazgatóját, szerinte Döllner egy autokrata mellett kampányolt, aki a gazdagok érdekeit képviseli. A cikk szerint a kritikusok között volt szakszervezet, kormánypárti politikus és a Volkswagen üzemi tanácsa is."], "cav": "A cikk nem közli, hogy Döllner vagy az Audi reagált-e a lemondási követelésekre, és hogy a felügyelőbizottság döntött-e már a beruházásról. Azt sem írja le részletesen, pontosan mit mondott Trump vagy Döllner a rendezvényen.", "op": "Egy nagyvállalat vezetője számára az amerikai gyár bejelentése gazdasági siker, de ha ezt egy kampányszínpadon teszi, az a politikai semlegesség szabályát sérti, ami a vállalat saját szabályzatában is szerepel. A német reakció jól mutatja, mekkora ára van annak, ha egy cég egyetlen politikus mellé áll.", "src": [["Telex: Az Audi vezérigazgatójának lemondását követelik, miután Trump kampányrendezvényén szerepelt", "https://telex.hu/kulfold/2026/10/26/az-audi-vezerigazgatojanak-lemondasat-kovetelik-miutan-donald-trump-kampanyrendezvenyen-szerepelt"]]}, {"id": "szerbia-pionir-park-visszafoglalas", "r": "Külföld", "c": "Szerbia", "w": "Szerb választás", "st": "Jelentett", "time": "okt. 26.", "img": "https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/75941d4e-6e17-409d-9036-e286ad9d1ae2.jpg", "imgs": "HVG", "imgl": "https://hvg.hu/vilag/20261026_orban-bukasa-adott-remenyt-videoriport-a-szerb-valasztasokrol", "cred": "A Diákok Listája támogatói a Nemzetgyűlés épülete előtt ünnepelnek Belgrádban, 2026. október 26-án kora hajnalban. Fotó: Miloš Milanović / AFP (HVG)", "t": "A választás után visszafoglalták a belgrádiak a Pionír parkot, ahonnan másfél évig kitiltották őket", "s": "A 444 szerint Vučić támogatóinak sátortábora a győzelmi ünneplés után szétesett, a HVG a Diákok Listájának ünneplését mutatja.", "p": ["A 444 beszámolója szerint a vasárnapi, október 25-i szerbiai választás után Vučić verőlegényei szétszóródtak. Elhagyott barakkjaikat és sátraikat a győzelmi ünneplők megrongálták, egyes építmények leégtek. A kordonokat a tömeg percek alatt lebontotta, és hétfő délelőtt sok belgrádi a Pionír parkba ment, hogy szimbolikusan birtokba vegye azt a területet, ahová másfél éve nem léphetett be átlagember.", "A park az elnöki palota és a belgrádi városháza előtt, a parlamenttel szemben fekszik. 2025 elején a rezsim fenntartásában szerepet játszó, bűnözői háttérrel is rendelkező emberek foglalták el. Rendőrök és verőemberek őrizték, és megverték azokat, akik be akartak jutni. A „Ćacilandként” emlegetett tábort a 444 a Vučić-rendszer maffiamódszereinek egyik legszemléletesebb szimbólumaként írja le. Đorđe Perović, aki a választás másnapján ment a parkba, azt mondta, hogy a tábor szégyen volt a fővárosra nézve.", "A HVG videóriportja szerint a választás tétje az volt, hogy le tudja-e győzni a diákok alulról szerveződő mozgalma Vučićot, aki 14 éve irányítja az országot. A HVG fotója szerint a „Diákok Listája” támogatói az Országgyűlés épülete előtt ünnepelték győzelmüket október 26-án kora hajnalban. A riport Belgrádból és a Vajdaságból készült."], "cav": "A 444 cikke részben előfizetők számára érhető el, így a további részletek nem ismertek. A két szöveg a választás számszerű eredményét nem közli. A 444 más címeiből úgy tűnik, hogy Vučić elismerte a vereséget, de ez a cikk szövegéből nem derül ki. A neveket a 444 Vučić, a HVG Vucsics formában írja.", "op": "Egy pillanatra érdemes megállni a képnél: egy főtér, amely másfél éven át nem volt a polgárok tere, egy éjszaka alatt visszakerült hozzájuk. A demokratikus átmenet nem a választás éjszakáján dől el, de a szimbólumok sokat számítanak, és ez a szimbólum a szerbeknek nagyon is beszédes.", "src": [["444: Vučić bukása után a szerbek máris visszafoglalták a teret a rezsim bűnözőitől", "https://444.hu/2026/10/26/vucic-bukasa-utan-a-szerbek-maris-visszafoglaltak-a-teret-a-rezsim-bunozoitol"], ["HVG: Orbán bukása adott reményt – videóriport a szerb választásról", "https://hvg.hu/vilag/20261026_orban-bukasa-adott-remenyt-videoriport-a-szerb-valasztasokrol"]]}, {"id": "oleski-tuzszunet", "r": "Külföld", "c": "Ukrajna", "w": "", "st": "Jelentett", "time": "okt. 27.", "img": "https://assets.4cdn.hu/kraken/8PO1w0oEjcuX1cJ14ss.jpeg", "imgs": "444", "imgl": "https://444.hu/2026/10/27/eletbe-lepett-a-tuzszunet-a-humanitarius-katasztrofa-sujtotta-oleskiben", "cred": "Oleski lakosainak megmentése érdekében szervezett tüntetés Brüsszelben, 2026. szeptember 28-án. Fotó: Daniel Gnap / NurPhoto via AFP (444)", "t": "Életbe lépett a helyi tűzszünet a humanitárius katasztrófa sújtotta Oleskiben", "s": "Az orosz és az ukrán fél is megerősítette: hajnali 3-tól nem lőnek a herszoni településre, hogy segélyt lehessen vinni a mintegy 6000 lakosnak.", "p": ["Kedden hajnalban helyi tűzszünet lépett életbe Oleski városában, Herszon megyében. Az ukrán fegyveres erők közlése szerint hajnali 3 órától nem támadják a települést, hogy el lehessen végezni a szükséges humanitárius műveleteket, az orosz erők pedig szintén jelentették, hogy beszüntették a tüzelést. A 444 szerint a tűzszünet alatt segélyeket lehet eljuttatni a lakosságnak, és az emberek szabadon elhagyhatják a várost; a hírek szerint saját döntésük szerint indulhatnak az ukrán vagy az orosz ellenőrzésű terület felé.", "Oleski 2022 óta orosz megszállás alatt áll. Az elmúlt hónapokban a folyamatos dróntámadások miatt a humanitárius katasztrófához közeli helyzet alakult ki: a városban rekedt mintegy 6000 ember élelmiszer, áram és megfelelő orvosi ellátás nélkül maradt, és gyakorlatilag lehetetlenné vált elhagyni a várost.", "A cikk szerint a megállapodást Melania Trump, az amerikai elnök felesége közvetítésével hozták létre; ezt egy október 24-i 444-cikkre hivatkozva állítja, amely szerint a városban rekedt idősek néhány napon belül biztonságosan elhagyhatják Oleskit. A tűzszünetre vonatkozó információ forrásaként a cikk a Meduzát jelöli meg."], "cav": "A cikk nem közli a tűzszünet pontos időtartamát, a kimenekítendők számát és azt, hogy mikortól kezdődhet a tényleges evakuálás. A közvetítésre vonatkozó állítás másodkézből, korábbi cikkre hivatkozva szerepel, a tűzszünetről szóló hír forrása a Meduza.", "op": "A hír egyszerre jó és fájdalmas: jó, mert hatezer ember végre kimenekülhet, fájdalmas, mert ehhez egy helyi tűzszünetre volt szükség, ami nem pótolja a háború végét. Ha a közvetítés valóban működik, arra érdemes építeni.", "src": [["444: Életbe lépett a tűzszünet a humanitárius katasztrófa sújtotta Oleskiben", "https://444.hu/2026/10/27/eletbe-lepett-a-tuzszunet-a-humanitarius-katasztrofa-sujtotta-oleskiben"]]}, {"id": "sport-vb-koltsegvetes-pososfai", "r": "Sport", "c": "Sportpolitika", "w": "", "st": "Jelentett", "time": "okt. 27.", "t": "Pósfai szerint több tízmilliárdot spóroltak a 2027-es vb-ken, az atlétikai vb 16 milliárdba került az adófizetőknek", "s": "A sportért is felelős belügyminiszter szerint a költségvetések úgy csökkentek, hogy a versenyek tartalma nem változott.", "p": ["A 444 Pósfai Gábor belügyminiszter Telex-interjújára épül, amelyben a sportért is felelős miniszter azt mondta, hogy a Tisza-kormány több tízmilliárd forinttal csökkentette a 2027-ben Magyarországon rendezendő négy világbajnokság költségvetését úgy, hogy a tartalmon nem változtattak. A vízilabda-világbajnokság eredetileg 80 milliárd forintnál többe került volna, ezt 39 milliárd alá sikerült szorítani, a 2019-ben kötött szerződést módosították, mert sok pontja előnytelen volt. A női kézilabda-világbajnokság költségvetése 28 milliárdról 14 milliárd alá csökkent, a kajak-kenu vb-re eredetileg 5 milliárdot terveztek, ezt „jóval kevesebből” valósítják meg. Az öttusánál nincs aláírt szerződés és végleges költségvetés.", "Az idei atlétikai világdöntőről a miniszter szerint sportszakmailag sikeres volt, gazdaságilag viszont hátrányos: Magyarország kivételesen a teljes pénzdíjat fizette, a jegybevételen kívül minden más bevétel, például a közvetítési jogdíj, a World Athleticshez került. A cikk szerint ez 16 milliárd forintba került az adófizetőknek. A MotoGP-ről a cikk azt írja, hogy jövőre nem lesz magyar futam, bár tízéves szerződés van; az idei 16 milliárd forint közpénzbe került. A budapesti Bajnokok Ligája-döntő Pósfai szerint nemzetgazdasági szempontból megérte, az UEFA mintegy 800 millió forintot utalt vissza.", "A sportvezetés új kritériumrendszert dolgozott ki a nagy tornák rendezéséről, amely a gazdasági hatást, a vendégéjszakákat, a társadalmi hatást és a nemzetközi presztízst is mérlegeli. A belügyminisztérium szeretné újraéleszteni a rendezvényszervezői piacot, amelyet a cikk szerint a fideszes közeli Lounge uralt, hogy csökkenjenek az árak. A sporttámogatási rendszer is változik: a tao-t kivezetik, a támogatások kezdetben nem változnak, és minden támogatást egy keretbe foglalnak, hogy átlátható legyen, mit, kinek és mire ad az állam."], "cav": "A cikk a miniszter nyilatkozatait ismerteti, független ellenőrzés nincs benne. Az atlétikai vb költségéről eltérő számok szerepelnek: a 444 16 milliárdot említ, Kálnoki-Kiss Attila sportállamtitkár a HVG-nek a szeptemberi atlétikai világdöntő körüli, továbbra is vitatott 3 milliárdos összegről beszélt, ez tehát más tételre is vonatkozhat.", "op": "Ha igaz, hogy a vizes vb költsége a felére csökkent a tartalom módosítása nélkül, az sokat elmond arról, mekkora volt a korábbi szerződések túlárazása. A sport nem luxus, de a közpénzzel való elszámolás ott sem lehet kivétel: a kérdés az lesz, hogy a számokat független szerv is megerősíti-e.", "src": [["444: A magyar szervezők állták az összes pénzdíjat, ezért került 16 milliárdba az atlétikai világdöntő az adófizetőknek", "https://444.hu/2026/10/27/a-magyar-szervezok-alltak-az-osszes-penzdijat-ezert-kerult-16-milliardba-az-atletikai-vilagdonto-az-adofizetoknek"], ["HVG: Sportállamtitkár: Bár Lex Kubatovnak is hívják, nem egyes emberekre szól az összeférhetetlenségi törvényjavaslat", "https://hvg.hu/sport/20261027_sport-osszeferhetetlenseg-torvenytervezet-kubatov-gabor-deutsch-tamas-politikus-sportvezeto-kalnoki-kiss-attila"]]}, {"id": "sport-osszeferhetetlenseg-kalnoki", "r": "Sport", "c": "Sportpolitika", "w": "", "st": "Megerősített", "time": "okt. 27.", "t": "Sportállamtitkár: nem Kubatov Gábor a célpontja az összeférhetetlenségi törvényjavaslatnak, januártól megszűnik a tao", "s": "A javaslat szerint 174 sportszervezet vezetéséből zárnának ki politikusokat, a társasági adós támogatást 150 milliárdos állami keret váltja.", "p": ["Kálnoki-Kiss Attila sportállamtitkár kedden reggel a Kossuth Rádióban azt mondta, hogy az Országgyűlés elé benyújtott összeférhetetlenségi törvényjavaslat nem konkrét személyekre irányul. Célja, hogy a sportszervezetek működését a fair play határozza meg, és ne a napi politikai kapcsolatok. Hozzátette, hogy a javaslat még változhat, elfogadása után pedig a jelenlegi és korábbi politikusoknak nyilatkozniuk kell arról, érintettek-e.", "A HVG szerint Magyar Péter miniszterelnök szeptember közepén bejelentette, hogy a hatálybalépés után miniszterek, államtitkárok, országgyűlési vagy európai parlamenti képviselők, pártelnökök és más állami vezetők nem tölthetnek be vezető tisztséget az ötszáznál több sportolót foglalkoztató szervezetekben. Kálnoki-Kiss szerint ez 174 sportszervezetet érint. Kubatov Gábor, a Ferencváros elnöke esetében egyelőre nem világos, hogy a szabályok érvényesek-e rá: a 24.hu két jogásza eltérően válaszolt, az egyik szerint a jelenlegi képviselőkre vonatkozik a tervezet, a másik szerint a négyéves kizárási idő a volt képviselőkre is érvényes lehet.", "Az államtitkár szerint a nagy nemzetközi versenyek rendezvényei jelentősen túlárazottak voltak, a vizsgálatok ezt fogják megmagyarázni, a 2027-es világversenyeket viszont megrendezik, racionálisabb költségvetéssel. A sportfinanszírozásról elmondta, hogy a társasági adóból származó sporttámogatás (a tao) január 1-jével megszűnik, helyette a kormány 150 milliárd forintot ad a sportnak. A tao-térképet hamarosan nyilvánosságra hozzák, június 30-ig a szövetségek kapják a támogatást, utána ők döntenek a tagszervezeteik támogatásáról."], "cav": "A cikk a törvényjavaslat szövegét nem közli, az államtitkár szóbeli nyilatkozataira és a 24.hu két jogászának eltérő véleményére épül. Az atlétikai vb költségéről a HVG-cikk 3 milliárdos, vitatott összeget említ, a 444 16 milliárd forintról ír; a két adat más tételre vonatkozhat.", "op": "A javaslat szándéka világos: a sportszövetségek élén ne ülhessenek aktív politikusok. A kérdés, amelyre a törvény szövegének választ kell adnia, az, hogy a Kubatov-ügy valóban érintett-e, és hogy a kormány a saját jelöltjeire is ugyanazt a mércét alkalmazza-e.", "src": [["HVG: Sportállamtitkár: Bár Lex Kubatovnak is hívják, nem egyes emberekre szól az összeférhetetlenségi törvényjavaslat", "https://hvg.hu/sport/20261027_sport-osszeferhetetlenseg-torvenytervezet-kubatov-gabor-deutsch-tamas-politikus-sportvezeto-kalnoki-kiss-attila"]]}, {"id": "sportfinanszirozas-mkt-javaslat", "r": "Sport", "c": "Sportpolitika", "w": "", "st": "Jelentett", "time": "okt. 26.", "t": "Közgazdászok: nem növelni, hanem átrendezni kell a sporttámogatást, kevesebb élsport, több szabadidősport", "s": "Az MKT sportgazdasági szakosztályának javaslatcsomagja a tao átalakítását és az élsport–szabadidősport arány 50–50 felé mozdítását kéri.", "p": ["Az Index az MKT Sportgazdasági Szakosztályának közgazdászai által összeállított javaslatcsomagot ismertette. A szerzők szerint a sport támogatásának további növelése helyett az elosztást kell rendezni: stadionok és kiválasztott műhelyek jelentős forrásokat kaptak, miközben a lakosság sportolási lehetőségei háttérbe szorultak. Az idézett becslések szerint a sport a GDP 2–3 százalékát állítja elő, a felnőttek 43–45 százaléka legalább hetente mozog, az ágazatban mintegy 18 ezer főállású dolgozik.", "A cikk szerint 2010 után az állami sportfinanszírozás jelentősen nőtt: a GDP-arányos kiadás 2009-ben 0,12, 2016-ban 1,05 százalék volt. Az Eurostat 2024-es adata szerint Magyarország és Finnország 0,6, Svédország 0,7, az uniós átlag 0,4 százalékot költött sport- és rekreációs célra. A tao mellett közvetett források is szerepelnek, például az MTVA futballközvetítési díja (2025-ben 10 milliárd forint, a következő idényre 6 milliárd). A tao-elosztásban a labdarúgás közel 40, a kézilabda 25, a kosárlabda 15 százalékot kapott.", "A javaslatok között szerepel a támogatások nyilvánossága, a koncentrációt korlátozó szabályok, a többségi állami tulajdonú cégek tao-támogatásának tiltása, valamint az, hogy egy cég felajánlása nem haladhatja meg a befizetett társasági adóját. Az élsport és a szabadidősport arányát a jelenlegi nagyjából 70–30 százalékról 50–50 felé mozdítanák el. A szövetségi működési támogatásra járó pénz helyett pályázati, feltételekhez kötött rendszert javasolnak, és a politikai vezetők nem vezethetnének sportköztestületet vagy országos sportági szövetséget."], "cav": "A cikk a javaslatcsomagot az eredeti dokumentumra hivatkozva ismerteti, a számítások módszertana nincs benne. A javaslatok megvalósításának ütemezése és a kormány álláspontja sem derül ki belőle. A kormány más forrásból, a sportállamtitkár nyilatkozata szerint viszont a tao-t 2027. január 1-jével kivezeti.", "op": "Nehéz vitatni, hogy a sportnak több szabadidő-sport kell, nem csak csillogó aréna. A javaslatcsomag legérdekesebb eleme nem az 50–50 arány, hanem az átláthatóság: ha a támogatást nyilvánosan és pályázat útján osztják, sok mai vita megszűnne.", "src": [["Index: Elég volt a kivételezésből: így alakítanák át a magyar sport pénzosztási rendszerét", "https://index.hu/gazdasag/2026/10/26/sport-sportfinanszirozas-mkt-versenysport-szabadidosport-tao-taopenzek-sporttamogatas-kozpenz/"]]}, {"id": "fradi-mtk-5-0", "r": "Sport", "c": "Labdarúgás", "w": "", "st": "Megerősített", "time": "okt. 25.", "t": "Hatvan év után ekkora kiütés az Üllői úton: a Ferencváros 5–0-ra nyert az MTK ellen", "s": "A zöld-fehérek három góllal már a 20. percben eldöntötték a mérkőzést, és megszakították a szeptember 3. óta tartó sikertelen sorozatukat.", "p": ["A Ferencváros vasárnap 5–0-ra legyőzte az MTK-t az OTP Bank Liga 11. fordulójában, a Groupama Arénában. A zöld-fehérek a 15. és a 20. perc között három gólt szereztek: Habib Maiga a 15. percben nyitott, Bamidele Yusuf a 17. percben lőtt a kapus mellett, Maiga a 20. percben fejesgóllal növelte az előnyt háromra. A második félidőben Kristoffer Zachariassen a hetedik percben tizenegyesből volt eredményes, a 68. percben pedig Mariusz Corbu egyéni akcióból szerzett ötödik gólt.", "Az Index szerint a hazai siker véget vetett a Ferencváros szeptember 3. óta tartó sikertelen szériájának, a csapat három helyet lépett előre, és a negyedik helyre került. Az MTK utoljára 2002-ben nyert az Üllői úton, és 11 meccses nyeretlenségi sorozatot szenvedett a fővárosi rivális ellen. A Ferencváros legutóbb 1967-ben győzött ilyen arányban az örökrangadón. Az MTK kapura lövés nélkül zárta a találkozót.", "A bajnokság többi eredménye: a Puskás Akadémia 1–2-re kikapott a Nyíregyházától, így a Győr és a felcsútiak az élen holtversenyben állnak, a Paks 2–0-ra nyert a Vasas otthonában. Szombaton a Kispest-Honvéd 0–2-re kikapott a DVSC-től, az ETO FC Győr 1–0-ra nyert az Újpest ellen, a Zalaegerszeg és a Kisvárda 1–1-et játszott."], "cav": "A cikkcím „59 éve nem látott kiütést” említ, a szövegben a Ferencváros utolsó hasonló arányú győzelme 1967 szerepel, ami nagyjából ugyanazt jelenti. A cikk a két edző nyilatkozatait is közli, ezeket itt nem idéztük.", "op": "Egy ötgólos győzelem az örökrangadón sokat javít egy rossz széria hangulatán, de a tabellán a negyedik hely nem a Ferencváros célja. Az MTK számára a „kapura lövés nélkül” statisztika a figyelmeztető jel.", "src": [["Index: 59 éve nem látott kiütés az Üllői úton", "https://index.hu/sport/futball/2026/10/25/ferencvaros-mtk-otp-bank-liga-nbi-osszefoglalo/"]]}, {"id": "sopron-kc-valsag", "r": "Sport", "c": "Kosárlabda", "w": "", "st": "Megerősített", "time": "okt. 24.", "t": "A túlélésért küzd a Sopron KC: százmillió forint hiányzik a kasszából", "s": "A klub közölte a szurkolókkal, hogy nagyjából 100 millióval kevesebb a pénze, mint tervezte, az önkormányzat közösségi finanszírozást tervez.", "p": ["A férfi kosárlabda NB I-ben szereplő Sopron KC (SKC) néhány nappal korábban közölte a szurkolókkal, hogy nagyjából 100 millió forint hiányzik az idei szezonra tervezett büdzséből, ezért túlélő üzemmódra váltott. Az Index szerint a klub korábbi eredményei között szerepel a 2013–2014-es Magyar Kupa-döntő, több Final Four-részvétel és nemzetközi kupaszereplés. A női szakágat a Sopron Basket képviseli, amely nem azonos az SKC-val.", "A klub ügyvezetője, Pojbics Szabolcs szerint a tulajdonosok a szezon előtt olyan pénzügyi tervet kértek, amellyel a csapat a rájátszásért harcolhat: ehhez 360–400 millió forintra volt szükség, ebből az önkormányzat 200 milliót vállalt. A tulajdonosok augusztus végén jelezték, hogy gond lehet a kifizetésekkel, október közepén pedig egyértelművé vált, hogy a helyzet tarthatatlan. Pojbics szerint a fizetések csúszhatnak, néhány légiós távozhat, a kulcsjátékosokat megtartanák. A jegy- és bérletárakat nem emelik. A klub célja most az, hogy befejezze a bajnokságot, különben az első osztályú licenc veszélybe kerülhet.", "A klub gyűjtést indított, amely a cikk írásakor csaknem 2 millió forintnál tartott, a legöregebb csapatbuszt is meghirdették eladásra. Kedd este szurkolói ankétot tartottak, ahol Farkas Ciprián polgármester közösségi finanszírozást tervez, és kezdeményezi, hogy a GySEV a vitatott megállapodáshoz kapcsolódó 200 millió forintot közvetlenül az SKC-nak fizesse ki, garanciát azonban nem vállalt. Csiszár Szabolcs alpolgármester szerint a GySEV-től várt 200 millió forint elmaradása és az azbesztmentesítés költségei miatt az önkormányzat is szűkös helyzetben van."], "cav": "A cikk nem közli a klub szezonbeli eredményeit és azt, hogy a GySEV kifizette-e az említett összeget. A Tisza Párt soproni országgyűlési képviselője bírálta a klub vezetését, Pojbics ehhez nem kívánt hozzászólni.", "op": "Egy kosárlabdaklub, amelynek a működése néhány tulajdonos és egy önkormányzat ígéretén múlik, mindig kiszolgáltatott. A soproni eset jó példa arra, miért lenne fontos az átlátható, hosszú távú sportfinanszírozás, amiről épp most folyik a vita.", "src": [["Index: A túlélésért küzd az NB I-es klub, hatalmas összeg hiányzik a kasszából", "https://index.hu/sport/kosarlabda/2026/10/24/sopron-kc-skc-sopron-kosarlabda-penz-krizis-pojbics-szabolcs/"]]}, {"id": "bagyogszovat-falusi-csapat", "r": "Sport", "c": "Labdarúgás", "w": "", "st": "Megerősített", "time": "okt. 27.", "t": "Megszűnés helyett magyar futballcsoda: volt válogatott focisták miatt verhetetlen egy falusi csapat", "s": "A bágyogszovátiak a Megye II-ben mind a tíz meccsüket megnyerték, a keretben hatszoros és tizenkétszeres válogatott védő is szerepel.", "p": ["Az Index riportja a Győr-Moson-Sopron megyei, nagyjából 1200 lakosú Bágyogszovát megye II-es csapatáról szól, amely másfél évvel korábban a megszűnés szélén állt. Egy telefonhívás és sok önkéntes munka után korábbi magyar válogatott játékosok és NB I-es labdarúgók erősítették az egyesületet. A csapat a Megye II Nyugati csoportjában mind a tíz meccsét megnyerte, 42 gólt lőtt és 17-et kapott.", "A klub újjáéledését Horváth Cs. Attila, a Gyirmót és Bágyogszovát sportigazgatója magyarázza: a 2024–2025-ös szezon első felében a csapat nulla ponttal állt a Megye III-ban, és 112 gólt kapott. A tulajdonos Horváth Ferenc a tavaszi szezonra összeszedte a régi játékosokat és edzőket, a csapat minden hátralévő meccsét megnyerte. A keretben van többek között Balog Zoltán, a hatszoros válogatott védő, Csizmadia Csaba, a 12-szeres válogatott védő és Lencse László utánpótlás-válogatott támadó. A játékosok jelképes összeget kapnak, ez főleg az utazási költséget fedezi.", "A riporter október 25-én a második helyen álló Hegykő vendégjátékát látta. A Hegykő a 12. percben vezetést szerzett, majd a hazai csapat fordított; a cikk nem írja ki egyértelműen a végeredményt, de a hazai szurkolók a meccs után ünnepeltek. A helyszínen 250–300 néző volt, a lelátó befogadóképessége 100 fő. A csapat hét pontos előnyben van a bajnokságban."], "cav": "A cikk nem mondja ki egyértelműen a Bágyogszovát–Hegykő mérkőzés végeredményét. A játékosok adatai az Index szövegére épülnek, azokat külön nem ellenőriztük.", "op": "Ez az a fajta sporthír, amely jobban megmelegíti a szívet, mint egy százmilliós igazolás. Egy falu, amely nem akar eltűnni, és néhány volt válogatott, aki szívesen jár vissza focizni: ennél szebb történetet nehéz találni.", "src": [["Index: Megszűnés helyett magyar futballcsoda: korábbi válogatott klasszisokkal lett verhetetlen a falusi csapat", "https://index.hu/sport/futball/2026/10/27/bagyogszovat-helyszini-riport-megye-ii-hegyko-balog-zoltan-horvath-cs.-attila/"]]}, {"id": "vers-hunor-aalborg", "r": "Sport", "c": "Kézilabda", "w": "", "st": "Megerősített", "time": "okt. 24.", "t": "A világ egyik legerősebb bajnokságába ment a 17 éves magyar kézilabda-tehetség, Aalborgban tanul és játszik", "s": "Vers Hunor két ország iskolarendszerében tanul, hosszabb távon villamosmérnöknek készül.", "p": ["Az Index interjút közölt a 17 éves Vers Hunorral, a balátlövővel, aki néhány hónap alatt a veszprémi akadémiáról a dániai Aalborgba került. A cikk szerint az aalborgi akadémiát ő maga kereste meg, tízperces videót küldött, augusztus elején próbajátékon vett részt, először az U17-es, majd az U19-es csapatban. Már részt vehetett a Bajnokok Ligájában szereplő felnőttcsapat több edzésén.", "A kézilabdához a Veszprém-meccsek iránti kötődése vezette, első klubja a keszthelyi Georgikon DSE volt, ahol a területi bajnokságban 19 meccsen 189 gólt szerzett. A veszprémi lehetőséget édesanyja találta meg egy Facebook-bejegyzésben, amely kiválasztót hirdetett. A gimnáziumi tanévet 4,85-ös átlaggal zárta, Veszprémben nemzetközi tornákon szerepelt, és az ifjúsági Bajnokok Ligája négyes döntőjében is játszott, Kölnben negyedik lett a csapat.", "Dániában IB-programos gimnáziumba jár, angol nyelven, emellett dán és német nyelvet tanul. Magyarországon magántanulóként folytatja az iskolát, félévkor és év végén osztályozó vizsgát tesz. Hosszabb távon villamosmérnöki pályát képzel el az Aalborgi Egyetemen, álma, hogy az aalborgi felnőttcsapat meghatározó játékosaként Bajnokok Ligájában szerepeljen. A magyar válogatottságot komoly célnak tekinti, a 2009-es születésűek B serdülőválogatottjában két nemzetközi meccsen szerepelt."], "cav": "A cikk interjú, az állításokat (pl. a gólszámokat és az iskolai átlagot)
